[project]
name = "atlas-scout"
version = "0.1.0"
description = "Nightly scout: proposes candidates for the two atlases (frankbueltge.de). Proposals only — never writes into an atlas."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
annotate = ["anthropic>=0.69"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["netz: braucht Netzzugriff (OpenAlex/Wikidata/HEAD-Prüfung)"]
