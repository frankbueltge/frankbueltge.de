name: Mirror watch

# Freshness for the engine room (commissioned 2026-07-25): checks hourly whether an engine's HEAD
# has moved since its last mirror commit, and then starts ONLY the integrate concerned. Integrates
# are idempotent (no change → no commit → no deploy) — a superfluous start is harmless, a missed
# one costs only the next hour.
#
# Since 2026-10-07 the practices are watched by practice-watch.yml — once a minute while the house
# is active, against the head each mirror records — because GitHub granted this hourly schedule
# three or four times a day, and a day of five sessions per practice outran it. What stays here
# is the one house that watch does not cover: the ecology's own repository.
#
# The plenum was watched here too until 2026-10-17, and is not any more. The check looks for the
# last "plenum: integrate" commit among the newest fifty commits of main; the last one was made
# on 2026-08-26 and is long out of that window, so it read "never mirrored" and started
# plenum-integrate.yml on every run — 95 dispatches between 2026-09-27 and 2026-10-17, each one a
# full check, test and build for a practice that has landed nothing. Every red one also pushed a
# "feedback: build … red" commit into the plenum's repository, which moved its head and gave the
# next run its reason. The Plenum is dormant: nothing is left to keep fresh, and plenum-integrate.yml
# keeps its own daily cron as the net.

on:
  schedule:
    - cron: '40 * * * *' # hourly, offset from the integrates' daily crons
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Engine HEADs against the last mirror commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Pairs: engine repo → (integrate workflow, mirror commit prefix on main)
          check () {
            engine="$1"; workflow="$2"; prefix="$3"
            head_date=$(gh api "repos/frankbueltge/$engine/commits/HEAD" --jq '.commit.committer.date')
            mirror_date=$(gh api "repos/${{ github.repository }}/commits?per_page=50" \
              --jq "[.[] | select(.commit.message | startswith(\"$prefix\"))][0].commit.committer.date // empty")
            echo "$engine: HEAD=$head_date, last mirror=${mirror_date:-never}"
            if [ -z "$mirror_date" ] || [ "$head_date" \> "$mirror_date" ]; then
              echo "→ starting $workflow"
              gh workflow run "$workflow" -R "${{ github.repository }}"
            fi
          }
          check research-ecology   ecology-integrate.yml  "ecology: "
