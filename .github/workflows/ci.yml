# CI: schützt die nächtliche Commit→Rebuild-Kette des Protokolls.
# Läuft auch für die Bot-Commits der "Protokollführung" — validiert,
# dass jede neue Tages-JSON gegen Schema und Renderer besteht.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/protokoll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  redaction:
    name: Redaction pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/redaction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  round-number:
    name: Round Number pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/round-number
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  ghost-fleet:
    name: Ghost Fleet pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/ghost-fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  invoked:
    name: Invoked Past pipeline (pytest)
    runs-on: ubuntu-latest
    # Single-file pipeline (no package): the tests load refresh.py through conftest.py.
    # What is tested is the METHOD — the cleaning rules and the standout measure — because
    # the page claims both are disclosed and stable; a silent change is a different finding.
    defaults:
      run:
        working-directory: pipelines/invoked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: pytest -q

  revision:
    name: Correction pipeline (pytest)
    runs-on: ubuntu-latest
    # Single-file pipeline like invoked/. The test rebuilds the workbook that broke four
    # Mondays in August 2026 (issue #723) and pins that the vintages still read through it.
    defaults:
      run:
        working-directory: pipelines/revision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest "pandas>=2,<3" openpyxl
      - run: pytest -q

  # Meridian/MRR: KEIN Nightly — refresh.py ist deterministisch ("no network, no clock,
  # no model") und leitet nur aus dem committeten Export ab; ein nächtlicher Lauf erzeugte
  # ewig byte-identischen Output. Der reale Fehlerfall ist ein anderer: ein neuer Export
  # wird committet, die abgeleiteten Dateien nicht nachgezogen — dann zeigt /on-record
  # Zahlen, die nicht mehr zu ihrem eigenen Archiv passen. Genau das prüft dieser Job.
  meridian:
    name: Meridian view model (derivation matches the committed export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipelines/meridian/requirements.txt
      - run: python pipelines/meridian/refresh.py
      - name: mrr-graph.ttl / parallax.json must be the export, re-derived
        run: |
          git diff --exit-code -- src/data/meridian/mrr-graph.ttl src/data/meridian/parallax.json \
            || { echo "::error::Abgeleitete Meridian-Dateien weichen vom committeten Export ab — 'npm run meridian:refresh' laufen lassen und das Ergebnis mitcommitten."; exit 1; }

  trending:
    name: Trending pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/trending
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  beifang-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/beifang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -q

  site:
    name: Site (vitest, check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Drift-Wächter, statischer Teil (Aktualitäts-Regel 2026-07-25): zurückgezogene
      # Wortlaute, Namens-Regel, Inline-Style-Verbot (CSP) — kein Commit bringt sie zurück.
      - run: node scripts/drift-check.mjs
      - run: npm run test
      - run: npm run check
      - run: npm run build
      # Gewichts-Gate der Sichtschicht (2026-09-02): gzip-Größe jedes Client-Chunks gegen
      # scripts/budgets.json — eine Insel zahlt ihre Bytes auf der Seite, die sie bedient, und
      # die React-Laufzeit bleibt EIN geteilter Chunk. Überschreitung = rot.
      - run: node scripts/bundle-budget.mjs

  # Team rule of 2026-07-12: no AI product credits in git — "niemals Co-Authored-By: Claude …,
  # 'Generated with Claude Code' o. Ä." CLAUDE.md adds that it overrides the harness default,
  # and that is precisely why it needed a lock: the harness writes those trailers unasked, the
  # rule lived only in prose, and on 2026-09-28 one reached main (d3e84d1d, "Work teasers —
  # 7 added") through teaser-automerge.yml with CI green. It sits inside CI, not in a workflow
  # of its own, because that auto-merge gates on CI alone — a check beside it would have gone
  # red and the merge would still have happened. No npm install: the guard has no dependencies.
  credits:
    name: No AI product credits (commit messages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: scan the commits this event introduces
        env:
          # Range ends at HEAD for a PR: the checkout is the merge ref, so base..HEAD is
          # exactly the branch's own commits, and base is an ancestor that fetch-depth 0 has.
          RANGE: >-
            ${{ github.event_name == 'pull_request'
                && format('{0}..HEAD', github.event.pull_request.base.sha)
                || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/guards/check-commit-credits.mjs "$RANGE"
