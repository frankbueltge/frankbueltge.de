name: Atlas-Scout nightly

# Sucht Kandidaten für beide Atlanten und nimmt sie im Werke-Atlas automatisch auf.
#
# Der Theorie-Atlas bekommt nur Vorschläge — er wird im Ulysses-Repo geführt und dort
# aufgenommen. Der Werke-Atlas wächst selbsttätig: geprüfte Kandidaten wandern in
# werke.json, markiert als `verify_status: "toVerify"`. Genau ein Modul darf das
# (`aufnahme.py`), erzwungen per AST-Prüfung im Test.
#
# Vier Läufe:
#   1. Nachbarschaft — Zitationsumfeld bestehender Theorie-Einträge (OpenAlex, schlüsselfrei)
#   2. Thematischer Sweep — eines der neuen Felder 8–13, rotierend (OpenAlex, schlüsselfrei)
#   3. Werke — Rhizome ArtBase (zwei Felder je Nacht), dataphys.org, S+T+ARTS Prize
#   3b. Der S+T+ARTS-Schritt braucht TAVILY_API_KEY (Rendern JS-gerenderter Seiten),
#      aber kein Modell — Tavily rendert, ein Parser liest.
#   4. Aufnahme — geprüfte Kandidaten wandern automatisch in werke.json, markiert
#      als `verify_status: "toVerify"`. Die Karte zeigt sie mit „?"; Git ist die
#      Rücknahme. Kein Schlüssel, kein Modell, keine Kosten.

on:
  schedule:
    - cron: '0 5 * * *' # täglich 05:00 UTC — nach den Integrate-Läufen, vor Gegenmessung
  workflow_dispatch:
    inputs:
      anzahl:
        description: 'Saatgut-Einträge in diesem Lauf'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: atlas-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle History → git pull --rebase im Commit-Schritt funktioniert
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: pip install --no-cache-dir -e "pipelines/atlas-scout[dev]"

      - name: Tests (Grenzprüfung inbegriffen)
        run: cd pipelines/atlas-scout && python -m pytest -q

      - name: Nachbarschaft (Theorie-Atlas)
        env:
          ATLAS_SCOUT_MAILTO: f.bueltge@gmail.com # OpenAlex „polite pool"
        run: |
          set -u
          # Deterministische Rotation: der Tag im Jahr verschiebt das Saatgut-Fenster,
          # damit der Atlas über die Nächte einmal umrundet wird — ohne Zufall.
          ANZAHL="${{ github.event.inputs.anzahl || '10' }}"
          VERSATZ=$(( $(date -u +%j) * ANZAHL ))
          echo "Saatgut-Fenster: Versatz $VERSATZ, Anzahl $ANZAHL"
          python -m atlas_scout.run --atlas theorie --anzahl "$ANZAHL" --versatz "$VERSATZ" \
            | tee -a lauf.log

      - name: Thematischer Sweep (neues Feld, rotierend)
        env:
          ATLAS_SCOUT_MAILTO: f.bueltge@gmail.com
        run: |
          set -u
          # Sechs neue Felder (8–13), eines pro Nacht — nach sechs Nächten von vorn.
          FELD=$(( 8 + $(date -u +%j) % 6 ))
          python -m atlas_scout.run --atlas theorie --thema "$FELD" | tee -a lauf.log

      - name: Werke suchen (ArtBase, zwei Felder je Nacht)
        run: |
          set -u
          # Zwei der sechs neuen Felder pro Nacht — nach drei Nächten sind alle durch.
          ERSTES=$(( 8 + (10#$(date -u +%j) * 2) % 6 ))
          ZWEITES=$(( 8 + (10#$(date -u +%j) * 2 + 1) % 6 ))
          for FELD in "$ERSTES" "$ZWEITES"; do
            python -m atlas_scout.run --atlas werke --thema "$FELD" | tee -a lauf.log
          done

      - name: Gegenwartswerke (S+T+ARTS Prize)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -u
          # Die Gewinnerseiten sind JS-gerendert; Tavilys Extract rendert sie, den Rest
          # liest ein Parser. Ohne Schlüssel vermerkt der Lauf einen Ausfall und macht
          # weiter — er findet dann nichts, behauptet aber auch nichts.
          python -m atlas_scout.run --atlas werke --quelle starts --anzahl 40 | tee -a lauf.log

      - name: Aufnehmen
        run: |
          set -u
          # Reihum über die Felder, gedeckelt. Aufgenommenes ist als „toVerify"
          # markiert — die Karte zeigt es mit „?", und Git nimmt es zurück.
          python -m atlas_scout.aufnahme --hoechstzahl 30 | tee -a lauf.log

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo '### Atlas-Scout'
            echo '```'
            cat lauf.log 2>/dev/null || echo 'kein Lauf-Protokoll'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Committen
        run: |
          git config user.name "Atlas-Scout"
          git config user.email "atlas-scout@frankbueltge.de"
          git add pipelines/atlas-scout/kandidaten src/data/atlas/werke.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine neuen Kandidaten."
            exit 0
          fi
          git commit -m "atlas-scout: Kandidaten und Aufnahme $(date -u +%F)"
          # Gegen Push-Races mit den übrigen nächtlichen Läufen: rebasen + mehrfach versuchen.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Gepusht."; exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen, neu …"; sleep 5
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen"; exit 1
