name: The Ill-Tempered Week

# The Ill-Tempered Week — a week of Common Ground, composed (docs/design/2026-11-08-common-time-method.md).
# Each ISO week is one album, Contrapunctus N. Every night presses Overlooked again from the week's days so far
# (edition k of 7, replacing the edition before); once the week's seventh day file has landed, Unison and Turn are
# pressed too and the album is complete. A complete album is never pressed again (the archive rule), and a night whose
# newest day already has its edition presses and commits nothing.
#
# WHEN IT RUNS. Right after the ledger: trending.yml starts this workflow once it has pushed a day file. That start
# comes from the built-in token, which GitHub gives no workflow_run event, so such a run starts the deploy itself
# (the last step), the pattern of the integrates (PR #1049). The cron is the fallback, and GitHub starts it hours
# late; a scheduled run, or one a person started, reaches deploy-cf.yml through workflow_run.
#
# WHAT IT KEEPS BETWEEN NIGHTS. The Kokoro voice model (the cache briefing-round.yml fills) and the part of the VSCO 2
# Community Edition the pieces play: scripts/ill-tempered-week/library.py fetches it from the pinned release archive,
# held to its sha256, about 1.2 GB of the library's 3 GB.

on:
  schedule:
    - cron: '50 9 * * *' # fallback; trending.yml starts the run as soon as a day file is pushed
  workflow_dispatch:
    inputs:
      week:
        description: "Press this ISO week (e.g. 2026-W46) as far as the ledger holds it. Empty: the newest week and the one before."
        required: false
        default: ""

permissions:
  contents: write
  # to start the deploy of a run that trending.yml started (the last step)
  actions: write

concurrency:
  group: ill-tempered-week
  cancel-in-progress: false

jobs:
  press:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so git pull --rebase works in the commit step

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ill-tempered-week/requirements.txt

      - name: Install the renderer
        run: python -m pip install --quiet -r scripts/ill-tempered-week/requirements.txt

      - name: What tonight presses
        id: plan
        env:
          WEEK: ${{ inputs.week }}
        run: |
          python scripts/ill-tempered-week/press.py --plan $WEEK > "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt"
          grep -m1 '^work=' "$RUNNER_TEMP/plan.txt" >> "$GITHUB_OUTPUT"

      - name: Install the encoder
        if: steps.plan.outputs.work == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: The voice model
        if: steps.plan.outputs.work == 'true'
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Download the voice model
        if: steps.plan.outputs.work == 'true' && steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/kokoro
          BASE=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSfL -o ~/.cache/kokoro/kokoro-v1.0.onnx "$BASE/kokoro-v1.0.onnx"
          curl -sSfL -o ~/.cache/kokoro/voices-v1.0.bin "$BASE/voices-v1.0.bin"

      - name: The instruments, as the last night kept them
        if: steps.plan.outputs.work == 'true'
        id: library
        uses: actions/cache/restore@v4
        with:
          path: ~/samples/VSCO-2-CE
          key: vsco-2-ce-1.1.0-${{ hashFiles('scripts/ill-tempered-week/library.py', 'scripts/ill-tempered-week/itw/*.py') }}
          restore-keys: vsco-2-ce-1.1.0-
      - name: Fetch what the pieces play and the cache lacks
        if: steps.plan.outputs.work == 'true'
        run: python scripts/ill-tempered-week/library.py ~/samples/VSCO-2-CE
      - name: Keep the instruments for the next night
        if: steps.plan.outputs.work == 'true' && steps.library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/samples/VSCO-2-CE
          key: vsco-2-ce-1.1.0-${{ hashFiles('scripts/ill-tempered-week/library.py', 'scripts/ill-tempered-week/itw/*.py') }}

      - name: Press
        if: steps.plan.outputs.work == 'true'
        env:
          WEEK: ${{ inputs.week }}
        run: |
          export KOKORO_MODEL=~/.cache/kokoro/kokoro-v1.0.onnx KOKORO_VOICES=~/.cache/kokoro/voices-v1.0.bin
          export VSCO_ROOT=~/samples/VSCO-2-CE/VSCO-2-CE-1.1.0 ITW_TTS_CACHE="$RUNNER_TEMP/tts"
          python scripts/ill-tempered-week/press.py $WEEK

      # deploy-cf.yml runs the whole suite before it deploys, so an album that turned a test red would hold back
      # every deploy of the site. What an album touches is tested here, before anything is committed.
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.work == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Hold the site to the album
        if: steps.plan.outputs.work == 'true'
        run: |
          npm ci --no-audit --no-fund
          if ! npx vitest run src/lib/ill-tempered-week src/lib/experiments src/data/werke.test.ts; then
            echo "::error::The new pressing turns a test red (named above). Nothing is committed; the site keeps the edition before."
            exit 1
          fi

      - name: Commit
        id: commit
        if: steps.plan.outputs.work == 'true'
        run: |
          git config user.name "Presswerk"
          git config user.email "presswerk@frankbueltge.de"
          git add public/ill-tempered-week src/data/ill-tempered-week
          if git diff --cached --quiet; then
            echo "Nothing pressed."; exit 0
          fi
          git commit -m "ill-tempered-week: the pressing of $(date -u +%F)"
          # Against push races with the nightly commits: rebase and retry.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Pushed."; exit 0
            fi
            echo "Push attempt $i failed, retrying …"; sleep 5
          done
          echo "::error::Push failed after 5 attempts"; exit 1

      - name: Deploy the album (when another workflow started this run)
        if: success() && steps.commit.outputs.pushed == 'true' && github.triggering_actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cf.yml --repo "$GITHUB_REPOSITORY" --ref main
