# .github/workflows/ecology-integrate.yml
# Das bislang fehlende Ökologie-Glied der Kette (Runbook research-ecology docs/runbooks/
# site-export.md; Arbeitsstrang site-v2-briefing §5.2; Freigabematrix site-v2-decisions §2 A4):
# importer → Gate → export-site → Commit in die Site. Läuft NACH jedem Engine-Lauf (dieselben
# repository_dispatch-Signale wie die Werk-Integrates — auch Franks manuelle Tages-Läufe) plus
# Sicherheitsnetz-Cron. Idempotent: gleicher Engine-Stand ⇒ byte-gleicher Export ⇒ kein Commit.
#
# Freigabematrix (A4) eingebaut: Regeneration der BEREITS freigegebenen Projektion committet
# automatisch auf main; eine NEUE Begegnung (neuer Slug / neue encounter_id) ist eine
# Bedeutungsänderung → kein Auto-Commit, sondern Branch + PR + Issue an Frank.
# Gate-Ehrlichkeit: geprüft wird der Export-Vertrag (Determinismus/Schema), NICHT die
# commit-gepinnten Adapter-Zählstände — die sind Review-Werkzeug für Menschen (siehe
# REPOSITORY-SEMANTIC-ALIGNMENT-Diskussion); ein roter Lauf erzeugt IMMER ein Issue.
name: Ecology integrate

on:
  repository_dispatch:
    types: [irrtum-landed, field-landed, studio-landed]
  schedule:
    - cron: '30 4 * * *'   # 06:30 Berlin — nach Engine-Nightlies (03:19–04:16 UTC) + Integrates
    # Alle 2h (17.07., Frank: 'ich will NICHTS manuell nachziehen müssen'): research-ecology-
    # Pushes (Middle Scribe, Akten, Profile) haben keinen eigenen Dispatch-Token — dieser Takt
    # garantiert, dass Register und Encounter-Flächen der Site nie länger als 2h hinter dem
    # Ledger liegen. Läufe ohne Änderungen enden im bestehenden No-op-Guard.
    - cron: '10 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ecology-integrate

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone research-ecology + engine repos
        run: |
          git clone https://github.com/frankbueltge/research-ecology /tmp/ecology
          git clone https://github.com/frankbueltge/field-research /tmp/engines/field-research
          git clone https://github.com/frankbueltge/ulysses /tmp/engines/ulysses
          git clone https://github.com/frankbueltge/studio /tmp/engines/studio
          # Outside /tmp/engines on purpose: the importer and export-site read that directory as
          # "the three ecology practices", and the plenum is not one of them. It is cloned only
          # for its post office packets.
          git clone --depth 1 https://github.com/frankbueltge/data-snack-plenum /tmp/plenum

      - name: Install research-ecology
        working-directory: /tmp/ecology
        run: npm ci

      - name: Import bundles (read-only, deterministic ids)
        working-directory: /tmp/ecology
        run: |
          npx tsx apps/importer/src/cli.ts --repo /tmp/engines/field-research --collective meridian
          npx tsx apps/importer/src/cli.ts --repo /tmp/engines/ulysses --collective ulysses
          npx tsx apps/importer/src/cli.ts --repo /tmp/engines/studio --collective ensemble

      - name: Gate — export contract (determinism + schema)
        working-directory: /tmp/ecology
        # `shell: bash` (statt der Voreinstellung `bash -e`) NUR wegen -o pipefail: ohne das ist
        # der Exit-Code dieser Zeile der von `tee`, also immer 0 — das Gate meldete seit seiner
        # Einführung grün, auch wenn Tests rot waren (nachgewiesen am 2026-08-02: drei rote
        # Contract-Tests, Schritt trotzdem "success"). Ein Tor, das nie zu ist, ist kein Tor;
        # der eigene Grundsatz dieses Workflows — "ein rotes Gate darf nie still sein" — war
        # genau hier nicht eingelöst.
        shell: bash
        run: npx vitest run tests/contract/export-site.test.ts 2>&1 | tee /tmp/gate.log

      - name: Export site artefacts
        working-directory: /tmp/ecology
        # --engines: the freshly cloned engine repos (above) are ground truth for the register's
        # OBSERVED receiver-work premiere status — export-site reads each engine's works/ so the
        # ecology map self-corrects the moment a work premieres (17.07., "Beobachten & anstoßen"),
        # instead of re-exporting a stale fixture forever. driftWarnings (receiver premiered, but
        # the record still reads "premiere pending") are surfaced here; the loud, self-clearing
        # prompt to the scribe lives in research-ecology's encounter-freshness.yml.
        run: |
          npx tsx apps/export-site/src/cli.ts --site "$GITHUB_WORKSPACE" --engines /tmp/engines | tee /tmp/export.json
          node -e '
            const w = (require("/tmp/export.json").driftWarnings) || [];
            if (w.length) {
              const md = "## Encounter drift (observed premiere, record not updated)\n\n" + w.map((x) => "- " + x).join("\n") + "\n";
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
              console.log("::warning::" + w.length + " encounter(s) drifting — see research-ecology encounter-freshness");
            }
          '

      - name: Sync joint-inquiry register (fixtures ji-* → src/data/begegnungen)
        # Same derivation discipline as the encounter register: read the contact zone's own
        # machine-readable fixture files, retype nothing. The commit step below already
        # watches src/data/begegnungen, so this snapshot rides the same regeneration path.
        run: node scripts/ecology/sync-joint-inquiries.mjs --ecology /tmp/ecology

      - name: Assemble post office ledger (packet.json in the engines → src/data/post)
        # Frank, 2026-08-07: ALL outward communication collects in the post office first, and he
        # decides what actually goes out. That rule is only as good as the ledger is complete, and
        # a hand-curated one is only as complete as the last session that remembered — the
        # plenum's CHT packet lay gate-passed for two days before anyone entered it. So the
        # practices' packets now enter themselves; the send stays a human act either way.
        run: |
          node scripts/post/sync-post-ledger.mjs \
            --repo /tmp/engines/field-research:field \
            --repo /tmp/engines/ulysses:atelier \
            --repo /tmp/engines/studio:studio \
            --repo /tmp/plenum:plenum

      - name: Commit (regeneration) or PR (new meaning)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Ecology-Integrate"
          git config user.email "ecology-integrate@frankbueltge.de"
          DATE=$(date -u +%F)
          SHA=$(git -C /tmp/ecology rev-parse --short HEAD)

          push_with_rebase() {
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && return 0
              [ "$attempt" = 5 ] && { echo "push failed after 5 rebase attempts (concurrent push race)" >&2; return 1; }
              echo "push race — rebasing and retrying ($attempt/5)"; sleep $((attempt * 5))
            done
          }

          # The post office lands on its own, always and automatically. It is deliberately NOT
          # routed through the new-meaning gate below: a packet appearing in the ledger is not a
          # publication and not a send — it is the ecology's outward mail becoming visible in the
          # one place Frank decides from. Holding that behind an approval would recreate exactly
          # the delay this step exists to remove.
          if git status --porcelain -- src/data/post/ledger.json | grep -q .; then
            git add -- src/data/post/ledger.json
            git commit -m "post office: ledger vom $DATE — Pakete der Praxen, wie sie in deren Repos liegen"
            push_with_rebase || exit 1
          else
            echo "post office ledger unchanged"
          fi

          if git status --porcelain src/data/begegnungen | grep -q .; then :; else
            echo "export byte-identical — nothing to do"; exit 0
          fi
          # Bedeutungsänderung? Neuer Begegnungs-Ordner ODER gewechselte encounter_id.
          NEW_DIRS=$(git status --porcelain src/data/begegnungen | grep -c '^??' || true)
          ID_CHANGE=$(git diff -- src/data/begegnungen/entrance.json | grep -c '^[+-].*"encounter_id"' || true)
          git add src/data/begegnungen
          if [ "$NEW_DIRS" -gt 0 ] || [ "$ID_CHANGE" -gt 0 ]; then
            BRANCH="ecology-export-$DATE"
            git checkout -b "$BRANCH"
            git commit -m "ecology: NEUE Begegnung im Export vom $DATE (research-ecology $SHA) — wartet auf Freigabe (Freigabematrix A4)"
            git push -u origin "$BRANCH"
            gh pr create --title "Neue Begegnung: Export vom $DATE" \
              --body "Der Ökologie-Export enthält eine neue Begegnung (neuer Slug oder gewechselte encounter_id) — Bedeutungsänderung, kein Auto-Commit (Freigabematrix A4, site-v2-decisions §2). Bitte prüfen und mergen; research-ecology-Stand: $SHA." || true
            gh issue create --title "Neue Begegnung wartet auf Freigabe ($DATE)" \
              --body "Ecology-Integrate hat eine neue Begegnung exportiert und als PR angelegt statt automatisch zu committen. Branch: $BRANCH." || true
          else
            git commit -m "ecology: Begegnungs-Export vom $DATE (research-ecology $SHA) — Regeneration der freigegebenen Projektion"
            push_with_rebase || exit 1
          fi

      # Ein Alarm, der nie ausgeht, ist keine Meldung mehr, sondern Möblierung: Drei der vier
      # roten Issues in Franks Inbox am 2026-07-30 meldeten Probleme, die längst behoben waren.
      # Läuft dieser Workflow wieder grün, schließt er seinen eigenen Alarm — mit Vermerk, wann.
      - name: Grüner Lauf schließt den eigenen roten Alarm
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="Ecology-Integrate rot"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OFFEN=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][].number' || true)
          for NR in $OFFEN; do
            gh issue close "$NR" --repo frankbueltge/frankbueltge.de \
              --comment "Wieder grün am $(date -u +%F' '%H:%MZ) — dieser Lauf ist durchgelaufen: ${RUN_URL}" || true
          done

      - name: On failure — issue to Frank (ein rotes Gate darf nie still sein)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # This report goes to Frank, not to a practice — so no letter and no attribution, only
          # the error itself. It used to quote `tail -40`, which for astro check is the warning
          # tally rather than the error: the very defect the practices reported four times
          # (field-research REQUESTS.md 2026-07-25/07-30/07-31), pointed at the operator instead.
          # Same extractor as the letters (src/lib/gate/brief.ts, under test there).
          LOG=$(npx tsx scripts/gate/brief.ts --lines-only --log /tmp/gate.log 2>/dev/null) || LOG=""
          if [ -z "${LOG//[[:space:]]/}" ]; then
            LOG=$(printf 'No error line could be extracted from the log (or the extractor itself was unavailable). The full log is in the run: %s' "$RUN_URL")
          fi
          BODY=$(printf 'Importer/Gate/Export fehlgeschlagen - kein Oekologie-Commit; der letzte gute Export bleibt live. Lauf: %s\n\nFehlerzeilen, woertlich aus dem Validierungslog:\n\n```\n%s\n```\n\nTypische Ursache laut Arbeitsstrang 5.3: Engines haben neues Vokabular erfunden (das SOLLEN sie) - dann Pins/Schema bewusst erweitern, siehe research-ecology tests/contract/.' "$RUN_URL" "$LOG")
          # Dedup (2026-07-25): ein anhaltendes Rot darf die Steuerzentrale-Inbox nicht fluten —
          # bestehendes offenes Issue kommentieren statt jedes Mal ein neues anlegen.
          PREFIX="Ecology-Integrate rot"
          # gh kennt kein --arg (das ist ein jq-Flag, kein gh-Flag) — daher echtes jq hinter der
          # Pipe. `|| true`: dieser Schritt IST der Melder; scheitert die Dedup-Abfrage, muss die
          # Meldung trotzdem rausgehen — ein Duplikat ist allemal besser als Stille.
          EXISTING=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo frankbueltge/frankbueltge.de --body "Weiter rot am $DATE ($(date -u +%H:%MZ), Lauf ${GITHUB_RUN_ID:-?}) — gleicher Fehler, kein Duplikat angelegt." || true
          else
            gh issue create --repo frankbueltge/frankbueltge.de --title "$PREFIX ($DATE)" --body "$BODY" || true
          fi
