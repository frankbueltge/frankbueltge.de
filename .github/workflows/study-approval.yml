# .github/workflows/study-approval.yml — a practice's study waits for the architect (2026-10-27).
#
# A practice's work may ask the people who see it (docs/design/2026-10-27-practice-studies.md). Its
# `study.json` arrives with the work through the practice's integrate; this workflow then opens one pull
# request per new or changed manifest, which adds the approval of exactly that file to
# src/data/studies/approved.json. MERGING IT IS THE APPROVAL, AND ONLY THE ARCHITECT MERGES IT (Frank's
# decision of 2026-10-27, wording private): the merge authority of 2026-08-14 does not reach these
# pull requests.
#
# One branch per study and exact file: study/approve-<id>-<full SHA-256>, so a request can never be
# moved to another file. On every run:
#   · a request the architect closed stays declined until the file changes (a new hash, a new branch);
#   · an open request whose file another approval has overtaken is rebuilt on the main this run read,
#     and its title and body are written afresh either way;
#   · only requests the house itself opened count: a fork's pull request from the same branch name is
#     never taken for one;
#   · a request the house closed as superseded, or one merged before a later file replaced it, asks
#     again if its file returns;
#   · every open request that no longer matches a waiting file is closed and labelled superseded.
# The pull requests come from GITHUB_TOKEN, so they start no other workflow; the merge, a human push,
# runs CI and the deploy as usual.
name: Study approval

on:
  workflow_run:
    workflows:
      - Atelier integrate
      - Field integrate
      - Studio integrate
    types: [completed]
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: study-approval

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Find the studies that wait for the architect
        run: npx tsx scripts/study/approvals.ts --out /tmp/study-approvals --commit "$(git rev-parse HEAD)"

      - name: Open, refresh or close the approval requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create study-approval --color 5b5b5b --description "A practice's study, approved only by the architect's merge" 2>/dev/null || true
          gh label create study-superseded --color 5b5b5b --description "Closed by the house: its file no longer waits for approval" 2>/dev/null || true
          git config user.name "Study-Approval"
          git config user.email "study-approval@frankbueltge.de"
          shopt -s nullglob
          # Every rebuild starts from the main this run read, so an approval merged while it runs is
          # never written over: the request then conflicts, or merges cleanly beside it.
          base=$(git rev-parse HEAD)
          for dir in /tmp/study-approvals/*/; do
            branch=$(cat "$dir/branch.txt")
            study=$(cat "$dir/study.txt")
            sha=$(cat "$dir/sha.txt")
            work=$(cat "$dir/work.txt")
            # the newest request from this branch that the house opened (a fork may use the same
            # branch name), with whether the house closed it as superseded
            latest=$(gh pr list --head "$branch" --state all --json number,state,labels,isCrossRepository,author \
              --jq '[.[] | select((.isCrossRepository | not) and .author.login == "app/github-actions")] | sort_by(.number) | last // empty | "\(.number) \(.state) \([.labels[].name] | index("study-superseded") != null)"')
            number=""; state=""; superseded="false"
            if [ -n "$latest" ]; then read -r number state superseded <<<"$latest"; fi
            if [ "$state" = "CLOSED" ] && [ "$superseded" != "true" ]; then
              echo "$branch: declined (#$number)"
              continue
            fi
            if [ "$state" = "MERGED" ]; then
              # merged while this run read main: approved already, for this very work, nothing to ask
              git fetch -q origin main
              if git show FETCH_HEAD:src/data/studies/approved.json | jq -e --arg id "$study" --arg work "$work" --arg sha "$sha" \
                '.approvals | any(.id == $id and .work == $work and .sha256 == $sha)' >/dev/null; then
                echo "$branch: approved (#$number)"
                continue
              fi
            fi
            if [ "$state" = "OPEN" ] && git show "origin/$branch:src/data/studies/approved.json" 2>/dev/null | cmp -s - "$dir/approved.json"; then
              gh pr edit "$number" --title "$(cat "$dir/title.txt")" --body-file "$dir/body.md" >/dev/null || echo "$branch: could not refresh #$number"
              echo "$branch: open and current (#$number)"
              continue
            fi
            git checkout -q -B "$branch" "$base"
            cp "$dir/approved.json" src/data/studies/approved.json
            git add src/data/studies/approved.json
            git commit -q -m "studies: approve $study" -m "Merging approves exactly the manifest named in the pull request; only the architect merges it."
            git push -q --force origin "$branch"
            if [ "$state" = "OPEN" ]; then
              gh pr edit "$number" --title "$(cat "$dir/title.txt")" --body-file "$dir/body.md" >/dev/null || echo "$branch: could not refresh #$number"
              echo "$branch: rebuilt on main (#$number)"
              continue
            fi
            # one study that cannot be asked about stops no other
            if ! url=$(gh pr create --base main --head "$branch" --title "$(cat "$dir/title.txt")" --body-file "$dir/body.md" --label study-approval --assignee frankbueltge); then
              echo "$branch: could not open the request"
              continue
            fi
            echo "$branch: $url"
          done
          # An open request whose file no longer waits (an older version of a study, or one approved,
          # withdrawn or fixed since) is closed, so a stale file can never be approved by mistake; the
          # label lets it ask again if the same file returns.
          touch /tmp/study-approvals/branches.txt
          for row in $(gh pr list --state open --label study-approval --limit 200 --json number,headRefName --jq '.[] | "\(.number):\(.headRefName)"'); do
            number=${row%%:*}
            head=${row#*:}
            if ! grep -qxF "$head" /tmp/study-approvals/branches.txt; then
              # labelled first: a request closed without the label would count as declined
              if gh pr edit "$number" --add-label study-superseded >/dev/null; then
                gh pr close "$number" --comment "Superseded: this file no longer waits for approval. The practice changed it, or the study was approved, withdrawn or fixed since. If the same file returns, the request asks again." >/dev/null \
                  && echo "$head: closed as superseded (#$number)" || echo "$head: could not close #$number"
              else
                echo "$head: could not label #$number; left open"
              fi
            fi
          done
