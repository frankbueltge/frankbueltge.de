# .github/workflows/plenum-integrate.yml
# Pulls the data-snack-plenum repo, integrates ONLY allowed paths (path boundary) into the
# `plenum` namespace, validates check/test/build, and lets deploy-cf rebuild only on green. On
# red: no deploy (last good state stays), a feedback file back into the engine's repo + an issue
# to Frank. Sibling of field-integrate.yml / atelier-integrate.yml; same integrator, ns='plenum'.
name: Plenum integrate

on:
  # Promptness: integrate immediately once the engine lands something on its main —
  # cross-repo via repository_dispatch from the engine's auto-land.yml (once it sends one;
  # SITE_DISPATCH_TOKEN-style PAT on their side, PAT-authenticated dispatch to this repo).
  # Until that's wired up, the daily cron below covers integration on its own.
  repository_dispatch:
    types: [plenum-landed]
  schedule:
    - cron: '0 4 * * *'   # offset from atelier's 03:00 and field's 03:30
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: plenum-integrate

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Not the SHA the event pinned. These runs are serialised by the concurrency
          # group above, so one queued behind a sibling starts only after that sibling
          # has pushed its own mirror commit — and then builds from a base that no
          # longer is main. On 2026-08-29 that produced an add/add conflict on the very
          # journal file both runs generate, and the push never landed (run 33236253015).
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Clone data-snack-plenum repo
        run: git clone --depth 1 https://github.com/frankbueltge/data-snack-plenum /tmp/plenum

      - name: Integrate works (html + astro + md) + sync journal/docs
        # Path boundary: only journal/, works/*.md, work directories (via the integrator) and the
        # five doc files below are ever copied. drafts/, memory/, queue/ and WORKBOARD.md are
        # intentionally excluded — unvetted collective work stays in the engine repo and never
        # reaches the site.
        run: |
          echo "guard: drafts/, memory/, queue/, WORKBOARD.md are intentionally excluded from this copy — unvetted work stays in the engine repo"
          # Full reset of the generated work outputs → the site mirrors the engine exactly
          # (removed/renamed works leave no orphans).
          rm -rf src/content/plenum/works src/components/plenum/werke src/pages/plenum/werke public/plenum/werke-html
          mkdir -p src/content/plenum/journal src/content/plenum/works src/components/plenum/werke
          touch src/components/plenum/werke/.gitkeep
          # Mirror the journal (removes deleted entries)
          rsync -a --delete /tmp/plenum/journal/ src/content/plenum/journal/
          # Markdown works (concept briefs)
          cp /tmp/plenum/works/*.md src/content/plenum/works/ 2>/dev/null || true
          # HTML/Astro work directories via the integrator (path boundary enforced), ns=plenum
          npx tsx scripts/atelier/integrate.ts /tmp/plenum . plenum > /tmp/report.json
          cat /tmp/report.json
          for f in PROTOCOL.md README.md REQUESTS.md SITE-API.md MENU.md; do [ -f "/tmp/plenum/$f" ] && cp "/tmp/plenum/$f" "src/content/plenum/$f" || true; done

      - name: Validate (check + test + build)
        id: validate
        run: |
          set -o pipefail
          { node scripts/drift-check.mjs && npm run check && npm test && npm run build; } 2>&1 | tee /tmp/validate.log

      - name: Commit + let deploy-cf rebuild (on success)
        if: success()
        run: |
          if [ -n "$(git status --porcelain src/content/plenum src/components/plenum src/pages/plenum public/plenum/werke-html)" ]; then
            git config user.name "Plenum-Integrate"
            git config user.email "plenum-integrate@frankbueltge.de"
            git add -A src/content/plenum src/components/plenum src/pages/plenum
            if [ -d public/plenum/werke-html ]; then git add -A public/plenum/werke-html; fi
            git commit -m "plenum: integrate $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              # A conflicted `pull --rebase` stops mid-rebase and leaves unmerged files
              # behind. Without clearing them every later attempt dies at once on
              # "Pulling is not possible because you have unmerged files", and the loop
              # retries nothing: run 33236253015 advertised five attempts and got one.
              git rebase --abort 2>/dev/null || true
              [ "$attempt" = 5 ] && { echo "push failed after 5 rebase attempts (concurrent push race)" >&2; exit 1; }
              echo "push race — rebasing and retrying ($attempt/5)"; sleep $((attempt * 5))
            done
          else
            echo "no changes"
          fi

      - name: Rejection feedback to the engine repo (green builds too)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.PLENUM_BOT_TOKEN }}
        run: |
          FEEDBACK=$(npx tsx scripts/atelier/rejection-feedback.ts /tmp/report.json plenum || true)
          if [ -n "$FEEDBACK" ] && [ -n "$BOT_TOKEN" ]; then
            DATE=$(date -u +%F)
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/data-snack-plenum" /tmp/fb-rej
              mkdir -p /tmp/fb-rej/plenum-feedback
              printf '%s\n' "$FEEDBACK" > "/tmp/fb-rej/plenum-feedback/${DATE}-rejections.md"
              cd /tmp/fb-rej && git config user.name "Plenum-Integrate" && git config user.email "plenum-integrate@frankbueltge.de"
              git add plenum-feedback && git commit -m "feedback: works rejected at the gate ${DATE}" && git push
            ) || echo "rejection feedback skipped (non-fatal)"
          else
            echo "no rejections (or no BOT_TOKEN) — nothing to feed back"
          fi

      # Ein Alarm, der nie ausgeht, ist keine Meldung mehr, sondern Möblierung: Drei der vier
      # roten Issues in Franks Inbox am 2026-07-30 meldeten Probleme, die längst behoben waren.
      # Läuft dieser Workflow wieder grün, schließt er seinen eigenen Alarm — mit Vermerk, wann.
      - name: Grüner Lauf schließt den eigenen roten Alarm
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="Plenum-Integrate red"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OFFEN=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][].number' || true)
          for NR in $OFFEN; do
            gh issue close "$NR" --repo frankbueltge/frankbueltge.de \
              --comment "Wieder grün am $(date -u +%F' '%H:%MZ) — dieser Lauf ist durchgelaufen: ${RUN_URL}" || true
          done

      - name: On failure — feedback to the engine's repo + issue to Frank
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.PLENUM_BOT_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The refusal letter (src/lib/gate/brief.ts) names the real error, whose files broke,
          # and the run. It replaces `tail -40`, which for astro check quoted the warning
          # trailer instead of the error — and quoted the literal "see workflow run" whenever
          # the run died before validation. Third defect of this channel on the record
          # (ulysses/REQUESTS.md 2026-07-14, 2026-07-16, 2026-07-30).
          # If the builder itself is unavailable (npm ci failed ⇒ no tsx), the fallback still
          # links the run and claims NOTHING about the practice's fault.
          BRIEF=$(npx tsx scripts/gate/brief.ts --ns plenum --log /tmp/validate.log --run-url "$RUN_URL" --date "$DATE" 2>/dev/null) || BRIEF=""
          if [ -z "$BRIEF" ]; then
            BRIEF=$(printf '# Build feedback %s\n\nThe run failed before your contribution could be validated, and the letter builder was itself unavailable (dependencies not installed). Your work was not judged — there is nothing on your side to correct.\n\nRun: %s\n' "$DATE" "$RUN_URL")
          fi
          # Issue to Frank FIRST — always runs, even if the BOT_TOKEN block below fails.
          # Dedup (2026-07-25): a persistent red must not flood the Steuerzentrale inbox —
          # comment on the existing open issue instead of opening a new one each run.
          PREFIX="Plenum-Integrate red"
          BODY="The nightly plenum build failed; no deploy. The letter with the actual error went to data-snack-plenum/plenum-feedback/${DATE}.md. Run: ${RUN_URL}"
          # gh has no --arg (that is a jq flag, not a gh flag) — hence real jq behind the pipe.
          # `|| true`: this step IS the notifier; if the dedup lookup fails, the report must
          # still go out — a duplicate issue beats silence.
          EXISTING=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo frankbueltge/frankbueltge.de --body "Still red on $DATE ($(date -u +%H:%MZ), run ${GITHUB_RUN_ID:-?}) — same failure, no duplicate opened." || true
          else
            gh issue create --repo frankbueltge/frankbueltge.de --title "$PREFIX ($DATE)" --body "$BODY" || true
          fi
          # Feedback into the engine's repo (it reads it next session) — defensive: errors here
          # must not block the issue creation above (hence || true).
          if [ -n "$BOT_TOKEN" ]; then
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/data-snack-plenum" /tmp/fb
              mkdir -p /tmp/fb/plenum-feedback
              printf '%s\n' "$BRIEF" > "/tmp/fb/plenum-feedback/${DATE}.md"
              cd /tmp/fb && git config user.name "Plenum-Integrate" && git config user.email "plenum-integrate@frankbueltge.de"
              git add plenum-feedback && git commit -m "feedback: build $DATE red" && git push
            ) || echo "feedback push skipped (non-fatal)"
          fi
