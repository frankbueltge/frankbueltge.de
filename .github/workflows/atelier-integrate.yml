# .github/workflows/atelier-integrate.yml
# Zieht Ulysses' Atelier-Repo, integriert NUR erlaubte Pfade (Pfad-Grenze), validiert
# check/test/build und deployt nur bei Grün. Bei Rot: kein Deploy (letzter Stand bleibt),
# Feedback-Datei zurück in ihr Repo + Issue an Frank. v1 ist all-or-nothing (ein rotes
# Astro-Werk hält auch den Journal-Commit der Nacht zurück; sie bekommt Feedback und behebt
# es). Refinement (Journal/HTML immer, nur Astro gated) ist als Folgeausbau notiert.
name: Atelier integrate

on:
  # Seit Protokoll v4 (2026-07-18) ist Landung↔Site-Rebuild entkoppelt: das Engine-Repo
  # dispatcht nicht mehr. Der Cron ist der Regel-Takt; repository_dispatch bleibt als
  # manueller Hebel erhalten. Der Import bleibt publikationsneutral: works/ (historisch)
  # + projects/ nur mit gültigem, menschlich freigegebenem PUBLICATION.json (integrate.ts).
  repository_dispatch:
    types: [irrtum-landed]
  schedule:
    # Aktualitäts-Regel (Frank, 2026-07-25): 4×/Tag statt 1×/Nacht — der Protokoll-v5-Fall
    # zeigte ein 24h-Driftfenster, weil Arbeits-Session-Commits im Engine-Repo keinen
    # Dispatch auslösen (das Repo hält kein SITE_DISPATCH_TOKEN mehr; volle Promptness
    # bräuchte ein neues Token dort + einen Push-Trigger-Workflow — bis dahin dieser Takt).
    - cron: '0 3,9,15,21 * * *'   # 05:00 / 11:00 / 17:00 / 23:00 Berlin (Sommerzeit)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: atelier-integrate

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Clone atelier repo
        # BOT_TOKEN, damit der Spiegel auch funktioniert, wenn das Engine-Repo privat ist
        # (auf privat gestellt 2026-07-23); ohne Token fällt er auf den anonymen Clone zurück.
        env:
          BOT_TOKEN: ${{ secrets.ATELIER_BOT_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/ulysses" /tmp/atelier
          else
            git clone --depth 1 https://github.com/frankbueltge/ulysses /tmp/atelier
          fi

      - name: Integrate works (html + astro + md) + sync journal/docs
        run: |
          # Voller Reset der generierten Werk-Ausgaben → die Seite spiegelt irrtum exakt
          # (entfernte/umbenannte Werke hinterlassen keine Orphans).
          rm -rf src/content/atelier/works src/components/atelier/werke src/pages/atelier/werke public/atelier/werke-html
          mkdir -p src/content/atelier/journal src/content/atelier/works src/components/atelier/werke
          touch src/components/atelier/werke/.gitkeep
          # Journal spiegeln (entfernt gelöschte Einträge)
          rsync -a --delete /tmp/atelier/journal/ src/content/atelier/journal/
          # v4-Projekt-Records spiegeln (Forschungslog, publikationsneutral): nur die
          # Markdown-Akten (SCORE/TRACE/DECISION/…), nie PUBLICATION.json, nie _template
          mkdir -p src/content/atelier/projects
          rsync -a --delete --exclude='_template' --include='*/' --include='*.md' --exclude='*' /tmp/atelier/projects/ src/content/atelier/projects/ 2>/dev/null || true
          # Markdown-Werke (fehlerkataster, genealogie, parry-problem …)
          cp /tmp/atelier/works/*.md src/content/atelier/works/ 2>/dev/null || true
          # HTML-/Astro-Werk-Verzeichnisse via Integrator (Pfad-Grenze erzwungen)
          npx tsx scripts/atelier/integrate.ts /tmp/atelier . > /tmp/report.json
          cat /tmp/report.json
          # REQUESTS-ARCHIVE.md joined the mirror on 2026-08-10: the channel was split so the
          # practice stops carrying 36 000 words of answered history into every session. The
          # archive must travel with it, or the public record would lose what the cut removed.
          for f in PROTOCOL.md README.md REQUESTS.md REQUESTS-ARCHIVE.md; do [ -f "/tmp/atelier/$f" ] && cp "/tmp/atelier/$f" "src/content/atelier/$f" || true; done
          # Foundation-Anker (v4): wird auf /atelier/foundation wörtlich gerendert
          [ -f /tmp/atelier/docs/RESEARCH-FOUNDATION-V1.md ] && cp /tmp/atelier/docs/RESEARCH-FOUNDATION-V1.md src/content/atelier/ || true
          # Daten-Spine fürs Cockpit (Atlas + Puls) — read-only-Spiegel committeter Engine-JSONs
          mkdir -p src/data/atelier
          cp /tmp/atelier/atlas/atlas.json /tmp/atelier/pulse/*.json src/data/atelier/ 2>/dev/null || true

      # The graph is derived from what this mirror just wrote (a work's meta.json, the
      # attention export, the encounters register). Deriving it HERE, before validation, is what
      # makes the honesty test guard the mirrored content instead of tripping over it: on
      # 2026-08-11 an ecology export landed at 06:33 and every validating workflow after it went
      # red until the nightly graph job at 04:25 the next morning. See .claude/rules/knowledge-graph.md.
      - name: Re-derive the knowledge graph from what was just mirrored
        run: npm run graph:build
      - name: Validate (check + test + build)
        id: validate
        run: |
          set -o pipefail
          { node scripts/drift-check.mjs && npm run check && npm test && npm run build; } 2>&1 | tee /tmp/validate.log

      - name: Commit + let deploy-cf rebuild (on success)
        if: success()
        run: |
          if [ -n "$(git status --porcelain src/content/atelier src/components/atelier src/pages/atelier src/data/atelier src/data/graph public/atelier/werke-html)" ]; then
            git config user.name "Atelier-Integrate"
            git config user.email "atelier-integrate@frankbueltge.de"
            git add -A src/content/atelier src/components/atelier src/pages/atelier src/data/atelier src/data/graph
            if [ -d public/atelier/werke-html ]; then git add -A public/atelier/werke-html; fi
            git commit -m "atelier: integrate $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              [ "$attempt" = 5 ] && { echo "push failed after 5 rebase attempts (concurrent push race)" >&2; exit 1; }
              echo "push race — rebasing and retrying ($attempt/5)"; sleep $((attempt * 5))
            done
          else
            echo "no changes"
          fi

      - name: Rejection feedback to the engine repo (green builds too)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.ATELIER_BOT_TOKEN }}
        run: |
          FEEDBACK=$(npx tsx scripts/atelier/rejection-feedback.ts /tmp/report.json atelier || true)
          if [ -n "$FEEDBACK" ] && [ -n "$BOT_TOKEN" ]; then
            DATE=$(date -u +%F)
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/ulysses" /tmp/fb-rej
              mkdir -p /tmp/fb-rej/atelier-feedback
              printf '%s\n' "$FEEDBACK" > "/tmp/fb-rej/atelier-feedback/${DATE}-rejections.md"
              cd /tmp/fb-rej && git config user.name "Atelier-Integrate" && git config user.email "atelier-integrate@frankbueltge.de"
              git add atelier-feedback && git commit -m "feedback: works rejected at the gate ${DATE}" && git push
            ) || echo "rejection feedback skipped (non-fatal)"
          else
            echo "no rejections (or no BOT_TOKEN) — nothing to feed back"
          fi

      # Ein Alarm, der nie ausgeht, ist keine Meldung mehr, sondern Möblierung: Drei der vier
      # roten Issues in Franks Inbox am 2026-07-30 meldeten Probleme, die längst behoben waren.
      # Läuft dieser Workflow wieder grün, schließt er seinen eigenen Alarm — mit Vermerk, wann.
      - name: Grüner Lauf schließt den eigenen roten Alarm
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="Atelier-Integrate rot"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OFFEN=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][].number' || true)
          for NR in $OFFEN; do
            gh issue close "$NR" --repo frankbueltge/frankbueltge.de \
              --comment "Wieder grün am $(date -u +%F' '%H:%MZ) — dieser Lauf ist durchgelaufen: ${RUN_URL}" || true
          done

      - name: On failure — feedback to her repo + issue to Frank
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.ATELIER_BOT_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The refusal letter (src/lib/gate/brief.ts) names the real error, whose files broke,
          # and the run. It replaces `tail -40`, which for astro check quoted the warning
          # trailer instead of the error — and quoted the literal "see workflow run" whenever
          # the run died before validation. Third defect of this channel on the record
          # (ulysses/REQUESTS.md 2026-07-14, 2026-07-16, 2026-07-30).
          # If the builder itself is unavailable (npm ci failed ⇒ no tsx), the fallback still
          # links the run and claims NOTHING about the practice's fault.
          BRIEF=$(npx tsx scripts/gate/brief.ts --ns atelier --log /tmp/validate.log --run-url "$RUN_URL" --date "$DATE" 2>/dev/null) || BRIEF=""
          if [ -z "$BRIEF" ]; then
            BRIEF=$(printf '# Build feedback %s\n\nThe run failed before your contribution could be validated, and the letter builder was itself unavailable (dependencies not installed). Your work was not judged — there is nothing on your side to correct.\n\nRun: %s\n' "$DATE" "$RUN_URL")
          fi
          # Issue an Frank ZUERST — läuft immer, auch wenn der BOT_TOKEN-Block unten fehlschlägt.
          # Dedup (2026-07-25): ein anhaltendes Rot darf die Steuerzentrale-Inbox nicht fluten —
          # bestehendes offenes Issue kommentieren statt jedes Mal ein neues anlegen.
          PREFIX="Atelier-Integrate rot"
          BODY="Der nächtliche Atelier-Build ist fehlgeschlagen; kein Deploy. Der Brief mit dem tatsächlichen Fehler ging nach ulysses/atelier-feedback/${DATE}.md. Lauf: ${RUN_URL}"
          # gh kennt kein --arg (das ist ein jq-Flag, kein gh-Flag) — daher echtes jq hinter der
          # Pipe. `|| true`: dieser Schritt IST der Melder; scheitert die Dedup-Abfrage, muss die
          # Meldung trotzdem rausgehen — ein Duplikat ist allemal besser als Stille.
          EXISTING=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo frankbueltge/frankbueltge.de --body "Weiter rot am $DATE ($(date -u +%H:%MZ), Lauf ${GITHUB_RUN_ID:-?}) — gleicher Fehler, kein Duplikat angelegt." || true
          else
            gh issue create --repo frankbueltge/frankbueltge.de --title "$PREFIX ($DATE)" --body "$BODY" || true
          fi
          # Feedback in IHR Repo (sie liest es nächste Sitzung) — defensiv: Fehler hier
          # dürfen das Issue-Erstellen oben nicht blockieren (daher nachgelagert + || true).
          if [ -n "$BOT_TOKEN" ]; then
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/ulysses" /tmp/fb
              mkdir -p /tmp/fb/atelier-feedback
              printf '%s\n' "$BRIEF" > "/tmp/fb/atelier-feedback/${DATE}.md"
              cd /tmp/fb && git config user.name "Atelier-Integrate" && git config user.email "atelier-integrate@frankbueltge.de"
              git add atelier-feedback && git commit -m "feedback: Build $DATE rot" && git push
            ) || echo "feedback push skipped (non-fatal)"
          fi
