# .github/workflows/requests-watchdog.yml
# Franks Posteingang für die REQUESTS-Kanäle (16.07. nachts, Frank: "ich muss die requests
# irgendwie bekommen"). Die Kollektive schreiben Anfragen an Frank in ihre REQUESTS.md —
# bisher las die niemand zuverlässig (Session 17 legte z. B. die Playthrough-Einladung dort
# ab). Dieser Wächter liest zweimal täglich die REQUESTS.md aller vier Praktiken und macht
# aus jedem NEUEN Abschnitt (##-Überschrift) ein Issue in diesem Repo — GitHub-Notifications
# sind der Sockel; die Steuerzentrale sitzt oben drauf. Dedupe über exakten Titelvergleich
# gegen die komplette Issue-Liste (offen ODER geschlossen — ein geschlossenes Issue alarmiert
# nie wieder; die frühere Such-Phrase brach an Anführungszeichen im Titel → Duplikate).
# Team-eigene Sections (Seeds/Team note/Team responses) sind Franks eigene Worte und werden
# übersprungen (Muster gespiegelt in src/lib/zentrale/requestsMd.ts TEAM_SECTION_RE).
# Abschnitte mit führendem Datum älter als 10 Tage gelten als Bestand und bleiben stumm.
#
# Zweiter Job (saat-sync, seit 2026-07-20): derselbe 2×-täglich-Rhythmus trägt auch den
# Status-Rückfluss der "Öffentlichen Saat" (Design-Spec 2026-07-20 §5) — scripts/saat/sync.ts
# liest dieselben drei Engine-REQUESTS.md roh von raw.githubusercontent.com (kein Token, wie
# oben) und synct Praxis-Antworten aus "Seeds from the public" ins Register
# (src/data/saat/register.json), das dieser Job dann committet. Eigener Job statt eines Steps
# im bestehenden `watch`-Job, damit dessen reine Python/gh-Logik unangetastet bleibt.
name: Requests watchdog

on:
  schedule:
    - cron: '15 6 * * *'    # 08:15 Berlin — nach den Nightly-Netzen
    - cron: '15 21 * * *'   # 23:15 Berlin — nach den Abend-Sessions
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Scan engine REQUESTS.md files for new sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, re, subprocess, sys, urllib.request
          from datetime import date, timedelta

          CUTOFF = date.today() - timedelta(days=10)
          # Claims only (Frank, 2026-08-12, second pass — the first fix kept a 3-day window
          # and at ~8 sections a day that alone held two dozen cards): a claim on Frank's
          # attention NAMES a future deadline or is a forwarding. Everything else runs
          # without him by his standing rule (2026-07-17, at the head of every REQUESTS.md:
          # "silence means: decide yourselves") — it gets NO issue, and existing issues for
          # it are closed. Mirrors the claims-only filter in src/lib/zentrale/status.ts
          # buildInbox — change both.
          # A forwarding request never expires: the post lies in the post office until Frank
          # sends or discards it (same exemption as the Zentrale's tray).
          FORWARD_LINE = re.compile(r"^(?:\s*>?\s*)\**(?:braucht|needs)\**\s*:\s*\**\s*(weiterleitung|forward)", re.I | re.M)
          # First ISO date on a frist/deadline head line, if the section names one.
          FRIST_LINE = re.compile(r"^(?:\s*>?\s*)\**(?:frist|deadline)\**\s*:\s*(.*)$", re.I | re.M)

          def section_claim(body):
              """A future frist date or a forwarding — the only two claims on Frank."""
              if FORWARD_LINE.search(body):
                  return "weiterleitung"
              fm = FRIST_LINE.search(body)
              if fm:
                  fd = re.search(r"\d{4}-\d{2}-\d{2}", fm.group(1))
                  if fd and date(*map(int, fd.group(0).split("-"))) >= date.today():
                      return f"frist {fd.group(0)}"
              return None
          REPOS = ["ulysses", "field-research", "studio", "data-snack-plenum"]
          # Spiegel von NON_REQUEST_SECTION_RE (src/lib/zentrale/requestsMd.ts): Sections, die
          # keine Anfrage an Frank sind — BEIDE Gesprächsrichtungen. Seeds/Team note/Team
          # responses sind Franks eigene Worte; Status (…)/Response (…) sind die Rückmeldung
          # der Praxis darauf (ergänzt 2026-07-30, weil Ulysses' Statusberichte als
          # unerledigte Anfragen in der Inbox standen). Beide Stellen zusammen ändern.
          TEAM_SECTION = re.compile(r"^(seeds\b|team note\b|team responses\b|(status|response)\s*[(—–-])", re.I)

          def sh(args, inp=None):
              return subprocess.run(args, input=inp, capture_output=True, text=True)

          # Erste "**Status:**"-Zeile einer Section — dieselbe Form wie STATUS_VALUE_RE in
          # src/lib/zentrale/requestsMd.ts (optional eingerückt / im Blockquote). Die eigene
          # Statuszeile der Anfrage steht VOR den verschachtelten Antwort-Blöcken, deshalb der
          # erste Treffer und nicht der letzte.
          STATUS_LINE = re.compile(r"^(?:\s*>?\s*)\*\*Status:\*\*\s*(.*)$", re.M)
          # Was als erledigt gilt. Bewusst eine kurze Positivliste: ein unbekannter Status lässt
          # das Issue OFFEN, weil ein irrtümlich geschlossenes Issue nie wieder alarmiert
          # ("es alarmiert nie erneut") — im Zweifel bleibt der Mensch in der Schleife.
          # `noted` gehört dazu: die Praxen schreiben "noted (no reply owed)", wenn eine Section
          # nur zur Kenntnis geht — die wartet auf nichts (studio, 2026-08-02, Body Clause).
          DONE = re.compile(r"^(answered|resolved|declined|withdrawn|noted|erledigt|beantwortet)\b", re.I)

          # Dedupe: ALLE Issue-Titel einmal holen und exakt vergleichen — die Such-API
          # zerbricht an Anführungszeichen/Sonderzeichen in der Phrase und ließ Duplikate durch.
          existing = sh(["gh", "issue", "list", "--repo", "frankbueltge/frankbueltge.de",
                         "--state", "all", "--limit", "1000", "--json", "title"])
          if existing.returncode != 0:
              sys.exit(f"Issue-Liste nicht lesbar: {existing.stderr.strip()[:200]}")
          known_titles = {i["title"] for i in json.loads(existing.stdout or "[]")}

          # Die offenen Issues MIT Nummer — für den Rückweg: eine Anfrage, deren Section in der
          # REQUESTS.md beantwortet ist, gehört nicht mehr in Franks Posteingang. Bis 2026-08-02
          # legte dieser Watchdog nur an und schloss nie; das Aufräumen war Handarbeit, und
          # beantwortete Anfragen standen tagelang als offen da (Frank: "ich muss auch nicht
          # jeden furz freigeben"). Der Bestand wird einmal geholt, nicht pro Section.
          open_issues = sh(["gh", "issue", "list", "--repo", "frankbueltge/frankbueltge.de",
                            "--state", "open", "--limit", "1000", "--json", "number,title"])
          if open_issues.returncode != 0:
              sys.exit(f"Offene Issues nicht lesbar: {open_issues.stderr.strip()[:200]}")
          open_by_title = {i["title"]: i["number"] for i in json.loads(open_issues.stdout or "[]")}
          closed = 0

          def close_issue(number, note, label):
              global closed
              sh(["gh", "issue", "comment", str(number),
                  "--repo", "frankbueltge/frankbueltge.de", "--body", note])
              done = sh(["gh", "issue", "close", str(number),
                         "--repo", "frankbueltge/frankbueltge.de", "--reason", "completed"])
              if done.returncode == 0:
                  closed += 1
                  print(f"GESCHLOSSEN #{number} — {label}")
              else:
                  print(f"FEHLER beim Schliessen #{number}: {done.stderr.strip()[:160]}")

          for repo in REPOS:
              url = f"https://raw.githubusercontent.com/frankbueltge/{repo}/main/REQUESTS.md"
              try:
                  text = urllib.request.urlopen(url, timeout=30).read().decode()
              except Exception as e:
                  print(f"{repo}: REQUESTS.md nicht lesbar ({e}) — übersprungen")
                  continue
              # Abschnitte: '## <heading>' bis zur nächsten ##-Überschrift
              parts = re.split(r"^## ", text, flags=re.M)[1:]
              seen_titles = set()
              for part in parts:
                  heading, _, body = part.partition("\n")
                  heading = heading.strip()
                  # Team-eigene Sections: Franks Seeds/Notes/Responses sind keine Anfragen an ihn
                  if TEAM_SECTION.match(heading):
                      continue
                  title = f"Request aus {repo}: {heading}"[:200]
                  seen_titles.add(title)

                  # Rückweg VOR dem Bestandsschutz: der CUTOFF soll verhindern, dass alte
                  # Anfragen neu alarmieren — nicht, dass ein längst beantwortetes Issue
                  # aufgeräumt wird. Stünde er davor, blieben genau die ältesten Erledigungen
                  # für immer offen, und das sind die, die am meisten im Weg stehen.
                  # Trägt die Section einen erledigten Status und liegt ihr Issue
                  # noch offen, wird es geschlossen — mit dem Status als Begründung, damit die
                  # Spur im Issue selbst steht und nicht nur in der REQUESTS.md.
                  status_match = STATUS_LINE.search(body)
                  status = status_match.group(1).strip() if status_match else ""
                  if DONE.match(status) and title in open_by_title:
                      number = open_by_title.pop(title)
                      note = (f"Erledigt laut `{repo}/REQUESTS.md`: **Status:** {status[:300]}\n\n"
                              f"Automatisch geschlossen vom Requests-Watchdog, weil die Section "
                              f"ihren eigenen Abschluss trägt. Quelle: "
                              f"https://github.com/frankbueltge/{repo}/blob/main/REQUESTS.md")
                      close_issue(number, note, f"{repo}: {heading[:60]} ({status[:40]})")
                      continue

                  # Anspruchs-Schluss (claims only, seit 2026-08-12): keine kommende Frist
                  # und keine Weiterleitung → die Section erhebt keinen Anspruch auf Frank.
                  # Sie läuft ohne ihn — per stehender Regel („Schweigen heißt: entscheidet
                  # selbst") — und ihr Issue wird geschlossen, egal wie frisch sie ist.
                  if title in open_by_title and section_claim(body) is None:
                      number = open_by_title.pop(title)
                      note = (f"Kein Anspruch an Frank: die Section nennt keine kommende Frist und ist "
                              f"keine Weiterleitung — sie läuft ohne ihn, so wie es die stehende Regel "
                              f"im Kopf jeder REQUESTS.md vorsieht („Schweigen heißt: entscheidet selbst“). "
                              f"Wer sein Wort wirklich braucht, nennt eine Frist. Die Section in "
                              f"`{repo}/REQUESTS.md` bleibt das Archiv.\n\n"
                              f"Automatisch geschlossen vom Requests-Watchdog (claims only, 2026-08-12).")
                      close_issue(number, note, f"{repo}: kein Anspruch — {heading[:60]}")
                      continue

                  # Bestandsschutz: führendes Datum älter als CUTOFF → nicht mehr NEU alarmieren
                  m = re.match(r"(\d{4})-(\d{2})-(\d{2})", heading)
                  if m and date(*map(int, m.groups())) < CUTOFF:
                      continue
                  if title in known_titles:
                      continue
                  # Claims only: eine Section ohne kommende Frist und ohne Weiterleitung
                  # erhebt keinen Anspruch auf Frank — für sie entsteht gar kein Issue.
                  # Die REQUESTS.md der Praxis ist die Akte; der Tagesüberblick liest sie.
                  if section_claim(body) is None:
                      continue
                  known_titles.add(title)
                  excerpt = "\n".join(body.strip().splitlines()[:40])
                  issue_body = (
                      f"Neuer Eintrag in `{repo}/REQUESTS.md`:\n\n## {heading}\n\n{excerpt}\n\n---\n"
                      f"Quelle: https://github.com/frankbueltge/{repo}/blob/main/REQUESTS.md\n"
                      f"(Requests-Watchdog — Issue schließen = gelesen/erledigt; es alarmiert nie erneut.)"
                  )
                  made = sh(["gh", "issue", "create", "--repo", "frankbueltge/frankbueltge.de",
                             "--title", title, "--body", issue_body])
                  print(f"{repo}: {'ISSUE ' + made.stdout.strip() if made.returncode == 0 else 'FEHLER ' + made.stderr.strip()} — {heading[:60]}")

              # Orphan close: an open issue whose section no longer exists in REQUESTS.md was
              # archived (or renamed) by the practice itself — settled at the source. Only runs
              # when this repo's REQUESTS.md was actually fetched (we are inside the success
              # path), so a network failure can never trigger a mass close.
              prefix = f"Request aus {repo}: "
              for title in [t for t in open_by_title if t.startswith(prefix) and t not in seen_titles]:
                  number = open_by_title.pop(title)
                  note = (f"Die Section zu dieser Anfrage steht nicht mehr in `{repo}/REQUESTS.md` — "
                          f"die Praxis hat sie selbst archiviert oder abgeschlossen. Erledigt an der "
                          f"Quelle; das Archiv der Praxis bleibt die Spur.\n\n"
                          f"Automatisch geschlossen vom Requests-Watchdog (Section archiviert).")
                  close_issue(number, note, f"{repo}: Section archiviert — {title[:80]}")

          print(f"\nRequests-Watchdog: {closed} Anfrage(n) geschlossen (Status/Fenster/Archiv).")
          PYEOF

  saat-sync:
    # Status-Rückfluss "Öffentliche Saat" (Spec 2026-07-20 §5): synct Praxis-Antworten aus
    # "Seeds from the public" ins Register. Braucht Checkout + Node, weil es (anders als
    # `watch` oben) Dateien im Site-Repo selbst liest und schreibt.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: saat-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # volle History → git pull --rebase im Commit-Schritt funktioniert
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register-Sync aus den Engine-REQUESTS.md (roh, kein Token — öffentliche Repos)
        run: npx tsx scripts/saat/sync.ts
      - name: Committen, wenn geändert
        run: |
          git config user.name "Öffentliche Saat"
          git config user.email "saat@frankbueltge.de"
          git add src/data/saat/register.json
          if git diff --cached --quiet; then
            echo "Keine Änderung."; exit 0
          fi
          git commit -m "saat: register-sync $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Gepusht."; exit 0
            fi
            echo "Push-Versuch $i fehlgeschlagen, neu …"; sleep 5
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen"; exit 1
