name: Gegenmessung nightly

# Replaced the GCP Cloud Run cron: runs the counter-measurement pipelines on GitHub's free
# runners and commits the data back (-> host rebuild). Free, no vendor lock-in, host-independent.
# Consensus, Balance and Invoked Past daily; Tell and Correction on Mondays. Pattern ran daily
# here until it was retired on 2026-10-17 (the register says why, under `retired`): its permutation test
# could not fail on the series it was given. Its pipeline stays in pipelines/pattern as the method
# that wrote the archive, and nothing schedules it.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC (after the other pipelines)
  workflow_dispatch: {} # can be run by hand

permissions:
  contents: write

concurrency:
  group: gegenmessung
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so git pull --rebase works in the commit step
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies (Correction)
        # numpy was listed for Pattern until 2026-10-17; pandas still brings it along.
        run: pip install --no-cache-dir "pandas>=2,<3" openpyxl
      - name: Run the pipelines
        # One failing instrument must not stop the others, so this step stays green and only
        # records what failed. Until 2026-10-10 a failure became a `::warning::` inside a
        # collapsed group and the run stayed green: The Correction missed four Mondays in a row
        # (2026-08-03 to 2026-08-24) and nothing said so (issue #723). Now a pipeline counts as
        # failed when it exits non-zero OR when it exits zero without stamping today's date into
        # its latest.json, and the last step turns the run red after the good data is committed.
        run: |
          set -u
          DOW=$(date -u +%u) # 1 = Monday … 7 = Sunday
          TODAY=$(date -u +%F)
          : > "$RUNNER_TEMP/failed.txt"
          run () {
            local name="$1" out="src/data/$1/latest.json"
            echo "::group::$name"
            if python "pipelines/$name/refresh.py"; then
              stamp=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["generated_at"][:10])' "$out" 2>/dev/null || echo none)
              if [ "$stamp" != "$TODAY" ]; then
                echo "::error::$name exited 0 but $out still carries $stamp, not $TODAY"
                echo "$name: wrote nothing new ($out says $stamp)" >> "$RUNNER_TEMP/failed.txt"
              fi
            else
              echo "::error::$name failed — its page keeps showing the last good reading"
              echo "$name: refresh.py exited non-zero" >> "$RUNNER_TEMP/failed.txt"
            fi
            echo "::endgroup::"
          }
          run consensus
          run balance
          run invoked
          if [ "$DOW" = "1" ]; then
            run tell
            run revision
          fi
      - name: Commit
        run: |
          git config user.name "Gegenmessung"
          git config user.email "gegenmessung@frankbueltge.de"
          git add src/data/consensus src/data/balance src/data/invoked src/data/tell src/data/revision 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "gegenmessung: nightly refresh ($(date -u +%F))"
          # Against push races (parallel cron and repository commits): rebase and retry.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed."; exit 0
            fi
            echo "Push attempt $i failed, retrying …"; sleep 5
          done
          echo "::error::Push failed after 5 attempts"; exit 1
      - name: Report failed pipelines
        # After the commit, so the instruments that did run still land; the red run is what
        # reaches a person. The pages say the same thing on their own (DataAge, issue #723).
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/failed.txt" ]; then
            { echo "### Gegenmessung: instruments that did not refresh"; echo; sed 's/^/- /' "$RUNNER_TEMP/failed.txt"; } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/failed.txt"
            exit 1
          fi
          echo "All scheduled instruments refreshed."
