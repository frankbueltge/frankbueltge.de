# .github/workflows/landing-watchdog.yml
# Apparatus-Befund 2026-07-16 (Fable-Testläufe): Cloud-Sessions können enden, ohne zu landen —
# einmal lag die Arbeit nur auf dem Cloud-Outcome-Branch (claude/*), einmal wurde der
# research/session-*-Push vom Auto-land nicht bemerkt. Eine Session, die endet, ohne zu landen,
# ist ein stilles Loch — dieser Wächter macht daraus ein Issue (Arbeitsstrang site-v2-briefing
# §5.1: Sichtbarkeit statt Stille). Er repariert nichts und landet nichts: Er RUFT nur.
name: Landing watchdog

on:
  schedule:
    - cron: '45 5 * * *'   # 07:45 Berlin — nach Nightlies (03:05/04:00) + Auto-lands + Integrates
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check every engine for stranded, un-landed session work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)

          # How far a branch is ahead of main — "gone" when the remote has no such branch, and
          # "unknown" when GitHub could not be asked. The exit status decides, never the text:
          # `gh api` writes the BODY of an error to stdout, so a deleted branch (compare answers 404)
          # came back as the JSON `{"message":"Not Found",…}` beside a non-zero exit, and
          # `$(gh api … || echo gone)` held that JSON followed by "gone" — equal to neither "gone"
          # nor "0". The cleanup below therefore never closed an issue for a deleted branch: #666,
          # #717, #999 and #1018 stood open for up to two months after their branches were gone.
          # `ls-remote --exit-code` answers 2 for "no such ref" and anything else for "could not
          # ask", and only the first may close an issue.
          ahead_of_main () {
            local repo="$1" br="$2" rc=0 enc ahead
            GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code --heads "https://github.com/frankbueltge/$repo" "refs/heads/$br" >/dev/null 2>&1 || rc=$?
            if [ "$rc" = 2 ]; then echo gone; return 0; fi
            if [ "$rc" != 0 ]; then echo unknown; return 0; fi
            enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$br")
            ahead=$(gh api "repos/frankbueltge/$repo/compare/main...$enc" --jq '.ahead_by' 2>/dev/null) || { echo unknown; return 0; }
            case "$ahead" in ''|*[!0-9]*) echo unknown ;; *) echo "$ahead" ;; esac
          }

          # arch, n-1, error-as-method and the plenum added 2026-09-18, to the same list the
          # morning digest was extended to on 2026-09-11 — that pass moved the "keine Session
          # gelandet" side and left this one on the three practices of 2026-07-16. The two
          # report opposite failures (nothing ran / something ran and stranded), so a practice
          # in one list and not the other is watched only half the way. n-1's night 29 paid for
          # it on 2026-09-18: the session ran, pushed `claude/fervent-hamilton-96wl27` three
          # commits ahead of main, opened a pull request saying its environment could not push
          # to main — and nothing called, because n-1 was not read here. Bound together under
          # test in src/lib/gate/landing-watchdog.test.ts so the lists cannot drift apart again.
          # `night/` is error-as-method's session branch; n-1 and the plenum push `claude/*`.
          # data-snack-plenum left the list on 2026-10-17: the Plenum is dormant (its last mirror was
          # 2026-08-26 and its only commits since are the integrate's own failure feedback), and a
          # dormant practice strands nothing. Put it back the day it works again.
          for REPO in ulysses field-research studio arch n-1 error-as-method research-ecology; do
            BRANCHES=$(git ls-remote "https://github.com/frankbueltge/$REPO" \
              | grep -E 'refs/heads/(research/session-|ulysses/|claude/|night/)' \
              | sed 's|.*refs/heads/||') || true
            for BR in $BRANCHES; do
              AHEAD=$(ahead_of_main "$REPO" "$BR")
              case "$AHEAD" in ''|gone|unknown|0) continue ;; esac
              # nur frische Stranden melden (jüngster Commit < 36h) — alte, bewusst stehende
              # Branches (z. B. dokumentierte Duplikate) sollen nicht täglich alarmieren
              LAST=$(gh api "repos/frankbueltge/$REPO/commits/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$BR")" --jq '.commit.committer.date' 2>/dev/null) || LAST=''
              [ -n "$LAST" ] || continue
              AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
              [ "$AGE_H" -lt 36 ] || continue
              TITLE="Gestrandete Session: $REPO $BR"
              if [ "$(gh issue list --repo frankbueltge/frankbueltge.de --state open --search "\"$TITLE\" in:title" --json number --jq 'length')" = "0" ]; then
                gh issue create --repo frankbueltge/frankbueltge.de \
                  --title "$TITLE" \
                  --body "Der Branch \`$BR\` in \`$REPO\` liegt $AHEAD Commit(s) vor main (jüngster Commit: $LAST) — eine Session hat gearbeitet, aber nichts ist gelandet. Prüfen: Auto-land nicht getriggert? Nur Cloud-Outcome-Branch gepusht? Veralteter Klon (Duplikat)? Apparatus-Befunde vom $DATE: research-ecology docs/design/site-v2-decisions-2026-07-16.md §4." || true
              fi
            done
          done

          # Aufräumen (P0.3-Anschluss, 16.07.): offene Gestrandet-Issues schließen, deren
          # Branch inzwischen gelandet (ahead=0) oder gelöscht ist — der Wächter ruft nicht
          # nur, er verstummt auch nachprüfbar, statt erledigte Fälle offen stehen zu lassen.
          gh issue list --repo frankbueltge/frankbueltge.de --state open \
            --search '"Gestrandete Session:" in:title' --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' \
          | while IFS=$'\t' read -r NUM TITLE; do
              REPO=$(echo "$TITLE" | awk '{print $3}')
              BR=$(echo "$TITLE" | awk '{print $4}')
              { [ -n "$REPO" ] && [ -n "$BR" ]; } || continue
              AHEAD=$(ahead_of_main "$REPO" "$BR")
              # "unknown" (GitHub could not be asked) leaves the issue open: closing on a failed
              # lookup would be the same mistake the other way round.
              case "$AHEAD" in
                gone) WHY="ist gelöscht" ;;
                0) WHY="ist gelandet (0 Commits vor main)" ;;
                *) continue ;;
              esac
              gh issue close "$NUM" --repo frankbueltge/frankbueltge.de \
                --comment "Der Branch \`$BR\` in \`$REPO\` $WHY — automatisch geschlossen vom Landing-Watchdog." || true
            done
          echo "watchdog done"
