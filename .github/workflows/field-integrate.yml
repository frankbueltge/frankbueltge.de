# .github/workflows/field-integrate.yml
# Pulls the field-research repo, integrates ONLY allowed paths (path boundary) into the `field`
# namespace, validates check/test/build, and lets deploy-cf rebuild only on green. On red: no
# deploy (last good state stays), a feedback file back into the engine's repo + an issue to Frank.
# Sibling of atelier-integrate.yml (Ulysses); same integrator, ns='field'.
name: Field integrate

on:
  # Promptness: integrate immediately once the engine lands something on its main —
  # cross-repo via repository_dispatch from the engine's auto-land.yml.
  repository_dispatch:
    types: [field-landed]
  schedule:
    - cron: '30 3 * * *'   # safety net if the dispatch fails (offset from atelier's 03:00)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: field-integrate

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Clone field-research repo
        run: git clone --depth 1 https://github.com/frankbueltge/field-research /tmp/field

      - name: Integrate works (html + astro + md) + sync journal/docs
        # Path boundary: only journal/, works/*.md, work directories (via the integrator) and the
        # five doc files below are ever copied. drafts/, memory/ and WORKBOARD.md are intentionally
        # excluded — unvetted collective work stays in the engine repo and never reaches the site.
        run: |
          echo "guard: drafts/, memory/, WORKBOARD.md are intentionally excluded from this copy — unvetted work stays in the engine repo"
          # Full reset of the generated work outputs → the site mirrors the engine exactly
          # (removed/renamed works leave no orphans).
          rm -rf src/content/field/works src/components/field/werke src/pages/field/werke public/field/werke-html
          mkdir -p src/content/field/journal src/content/field/works src/components/field/werke
          touch src/components/field/werke/.gitkeep
          # Mirror the journal (removes deleted entries)
          rsync -a --delete /tmp/field/journal/ src/content/field/journal/
          # Markdown works
          cp /tmp/field/works/*.md src/content/field/works/ 2>/dev/null || true
          # HTML/Astro work directories via the integrator (path boundary enforced), ns=field
          npx tsx scripts/atelier/integrate.ts /tmp/field . field > /tmp/report.json
          cat /tmp/report.json
          for f in PROTOCOL.md README.md REQUESTS.md FIELD.md SITE-API.md; do [ -f "/tmp/field/$f" ] && cp "/tmp/field/$f" "src/content/field/$f" || true; done
          # Optional chronicle self-report from the engine repo root (see the chronicle seed in
          # REQUESTS.md) — absence is not an error; malformed content fails the build gate below
          # via the zod validation in src/lib/field/chronicle.ts.
          if [ -f "/tmp/field/chronicle.json" ]; then
            cp "/tmp/field/chronicle.json" src/data/field/chronicle.upstream.json
          else
            echo '[]' > src/data/field/chronicle.upstream.json
          fi

      - name: Validate (check + test + build)
        id: validate
        run: |
          set -o pipefail
          { npm run check && npm test && npm run build; } 2>&1 | tee /tmp/validate.log

      - name: Commit + let deploy-cf rebuild (on success)
        if: success()
        run: |
          if [ -n "$(git status --porcelain src/content/field src/components/field src/pages/field src/data/field/chronicle.upstream.json public/field/werke-html)" ]; then
            git config user.name "Field-Integrate"
            git config user.email "field-integrate@frankbueltge.de"
            git add -A src/content/field src/components/field src/pages/field src/data/field/chronicle.upstream.json
            if [ -d public/field/werke-html ]; then git add -A public/field/werke-html; fi
            git commit -m "field: integrate $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && break
              [ "$attempt" = 5 ] && { echo "push failed after 5 rebase attempts (concurrent push race)" >&2; exit 1; }
              echo "push race — rebasing and retrying ($attempt/5)"; sleep $((attempt * 5))
            done
          else
            echo "no changes"
          fi

      - name: Rejection feedback to the engine repo (green builds too)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.FIELD_BOT_TOKEN }}
        run: |
          FEEDBACK=$(npx tsx scripts/atelier/rejection-feedback.ts /tmp/report.json field || true)
          if [ -n "$FEEDBACK" ] && [ -n "$BOT_TOKEN" ]; then
            DATE=$(date -u +%F)
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/field-research" /tmp/fb-rej
              mkdir -p /tmp/fb-rej/field-feedback
              printf '%s\n' "$FEEDBACK" > "/tmp/fb-rej/field-feedback/${DATE}-rejections.md"
              cd /tmp/fb-rej && git config user.name "Field-Integrate" && git config user.email "field-integrate@frankbueltge.de"
              git add field-feedback && git commit -m "feedback: works rejected at the gate ${DATE}" && git push
            ) || echo "rejection feedback skipped (non-fatal)"
          else
            echo "no rejections (or no BOT_TOKEN) — nothing to feed back"
          fi

      # Ein Alarm, der nie ausgeht, ist keine Meldung mehr, sondern Möblierung: Drei der vier
      # roten Issues in Franks Inbox am 2026-07-30 meldeten Probleme, die längst behoben waren.
      # Läuft dieser Workflow wieder grün, schließt er seinen eigenen Alarm — mit Vermerk, wann.
      - name: Grüner Lauf schließt den eigenen roten Alarm
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="Field-Integrate red"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          OFFEN=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][].number' || true)
          for NR in $OFFEN; do
            gh issue close "$NR" --repo frankbueltge/frankbueltge.de \
              --comment "Wieder grün am $(date -u +%F' '%H:%MZ) — dieser Lauf ist durchgelaufen: ${RUN_URL}" || true
          done

      - name: On failure — feedback to the engine's repo + issue to Frank
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ secrets.FIELD_BOT_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The refusal letter (src/lib/gate/brief.ts) names the real error, whose files broke,
          # and the run. It replaces `tail -40`, which for astro check quoted the warning
          # trailer instead of the error — and quoted the literal "see workflow run" whenever
          # the run died before validation. Third defect of this channel on the record
          # (ulysses/REQUESTS.md 2026-07-14, 2026-07-16, 2026-07-30).
          # If the builder itself is unavailable (npm ci failed ⇒ no tsx), the fallback still
          # links the run and claims NOTHING about the practice's fault.
          BRIEF=$(npx tsx scripts/gate/brief.ts --ns field --log /tmp/validate.log --run-url "$RUN_URL" --date "$DATE" 2>/dev/null) || BRIEF=""
          if [ -z "$BRIEF" ]; then
            BRIEF=$(printf '# Build feedback %s\n\nThe run failed before your contribution could be validated, and the letter builder was itself unavailable (dependencies not installed). Your work was not judged — there is nothing on your side to correct.\n\nRun: %s\n' "$DATE" "$RUN_URL")
          fi
          # Issue to Frank FIRST — always runs, even if the BOT_TOKEN block below fails.
          # Dedup (2026-07-25): a persistent red must not flood the Steuerzentrale inbox —
          # comment on the existing open issue instead of opening a new one each run.
          PREFIX="Field-Integrate red"
          BODY="The nightly field build failed; no deploy. The letter with the actual error went to field-research/field-feedback/${DATE}.md. Run: ${RUN_URL}"
          # gh has no --arg (that is a jq flag, not a gh flag) — hence real jq behind the pipe.
          # `|| true`: this step IS the notifier; if the dedup lookup fails, the report must
          # still go out — a duplicate issue beats silence.
          EXISTING=$(gh issue list --repo frankbueltge/frankbueltge.de --state open --limit 100 --json number,title \
            | jq -r --arg p "$PREFIX" '[.[]|select(.title|startswith($p))][0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo frankbueltge/frankbueltge.de --body "Still red on $DATE ($(date -u +%H:%MZ), run ${GITHUB_RUN_ID:-?}) — same failure, no duplicate opened." || true
          else
            gh issue create --repo frankbueltge/frankbueltge.de --title "$PREFIX ($DATE)" --body "$BODY" || true
          fi
          # Feedback into the engine's repo (it reads it next session) — defensive: errors here
          # must not block the issue creation above (hence || true).
          if [ -n "$BOT_TOKEN" ]; then
            (
              git clone --depth 1 "https://x-access-token:${BOT_TOKEN}@github.com/frankbueltge/field-research" /tmp/fb
              mkdir -p /tmp/fb/field-feedback
              printf '%s\n' "$BRIEF" > "/tmp/fb/field-feedback/${DATE}.md"
              cd /tmp/fb && git config user.name "Field-Integrate" && git config user.email "field-integrate@frankbueltge.de"
              git add field-feedback && git commit -m "feedback: build $DATE red" && git push
            ) || echo "feedback push skipped (non-fatal)"
          fi
