name: Deploy to Cloudflare Pages

# Baut auf GitHubs Runnern (gratis) und deployt das statische dist/ zu Cloudflare Pages.
# Läuft bei jedem Push auf main UND nach jedem nächtlichen Cron-Workflow (workflow_run).
# Letzteres ist nötig, weil Pushes mit dem eingebauten GITHUB_TOKEN (so committen die
# Cron-Jobs) per GitHubs Anti-Rekursions-Regel KEIN `on: push` auslösen — sonst ginge die
# nächtliche Kunst nicht live. CF Pages serviert nur Statik (keine harten Anbieter-Sperren).
#
# BENÖTIGT ein Repository-Secret (Settings → Secrets and variables → Actions):
#   CF — Cloudflare-API-Token mit „Cloudflare Pages: Edit"
# (Die Account-ID ist nicht geheim und steht direkt unten.)
#
# THIS workflow is the only deployer that works. Cloudflare additionally watches the
# repository through a dashboard-side git integration and fails on every commit — the
# permanently red `Workers Builds: frankbueltge-de` check. Do NOT try to make that build
# green by adding a wrangler config: two deployers on one production target, and the
# Cloudflare-side one would ship without PUBLIC_TURNSTILE_SITE_KEY (see the build step
# below), putting /seed into permanent standby. Diagnosis and the one-click fix:
# docs/design/2026-08-03-two-deployers-one-project.md

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Bis 2026-07-27 stieß der Dataset-Hub hier nach jedem nächtlichen Snapshot an
  # (repository_dispatch: dataset-snapshot), mit einem Cron um 03:50 UTC als Rückfallebene.
  # Beides ist mit dem Rückbau des Registers entfallen (docs/design/2026-07-27-register-
  # rueckbau-und-scouts.md): Die Site holt keine Registerdaten mehr beim Bauen — der
  # kuratierte Bestand liegt committet in src/data/register/. Ein Push genügt.
  workflow_run:
    workflows:
      - Protokoll nightly
      - Prämie nightly
      # The attention mirror commits with the built-in GITHUB_TOKEN, which
      # never fires `on: push` — without this trigger, a freshly mirrored
      # practice stage would sit undeployed until the next unrelated push
      # (found 2026-08-09, the currency rule's exact failure mode).
      - Attention integrate
      # Same mechanism for the n-1 record mirror (added 2026-08-15).
      - n-1 integrate
      # And for the Arch mirror (added 2026-08-23): during the practice's pre-registered
      # window this site is its works' only public address.
      - Arch integrate
      # Renamed 2026-08-02 when the cadence changed (parallaxe.yml declares `name: Parallaxe
      # weekly`). GitHub matches workflow_run by the declared name, so the stale entry silently
      # matched nothing and the Monday register commit never reached production.
      - Parallaxe weekly
      - Round Number nightly
      - Ghost Fleet nightly
      - Redaction nightly
      - Gegenmessung nightly
      - ueberflug-refresh
      - Atelier integrate
      # The forked nightly line's mirror, same reason as every entry above it: it commits with
      # the built-in token, so a night that landed would otherwise wait for an unrelated push.
      - Nightly line integrate
      - Field integrate
      - Studio integrate
      - Plenum integrate
      - Ecology integrate
      - Beifang weekly
      - Katalog-Scout nightly # committet src/data/register/papers.json mit GITHUB_TOKEN
      - Spielraum watch
      # The admissions watch commits when a keeper publishes a version it did not hold. Added
      # 2026-08-27 together with /admissions — until that page existed a commit here had nothing
      # to deploy, which is why the entry was deliberately absent before.
      - Admissions watch
      - Requests watchdog # saat-sync committet register.json mit GITHUB_TOKEN → kein on:push
      - Atlas-Scout nightly # commits src/data/atlas/werke.json with GITHUB_TOKEN → no on:push
      - Puls nightly refresh # commits src/data/pulse/pulse.json with GITHUB_TOKEN → no on:push
      - Attention integrate # mirrors public/attention/ with GITHUB_TOKEN → no on:push
      - Knowledge graph nightly # commits src/data/graph/graph.json with GITHUB_TOKEN → no on:push
      # The trending ledger (Common Ground, 2026-09-02) commits src/data/trending with the built-in
      # token every morning — the same reason as every entry above: without this line the day's
      # ledger would wait for an unrelated push.
      - Trending nightly
    types: [completed]

permissions:
  contents: read

concurrency:
  # The job-level `if:` below stops a deploy after a failed cron — but the run is
  # still CREATED, joins this group, and with cancel-in-progress kills a real
  # deploy before skipping itself. Observed 2026-08-15: "Atelier integrate" failed,
  # its workflow_run cancelled the push deploy of a just-merged PR (#650), and
  # shipped nothing. Runs destined to skip therefore get a group of their own and
  # can cancel nothing; real deploys still supersede one another.
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'cf-deploy' || format('cf-deploy-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  deploy:
    # push/workflow_dispatch: immer. workflow_run: nur wenn der Cron erfolgreich war
    # (sonst löste auch ein fehlgeschlagener Nightly einen Deploy aus).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Gate vor dem Deploy (P0.4, 16.07.): check + test laufen HIER, nicht nur im parallelen
      # CI — Bot-Pushes der Nightlies (GITHUB_TOKEN) lösen `on: push` nicht aus, dieser Job
      # ist auf dem workflow_run-Pfad also das einzige Netz. Rot statt blind live.
      # Der GITHUB_TOKEN, den diese drei Schritte bis zum 27.07. brauchten, hing allein am
      # Abruf der Registerdaten aus dem dataset-hub-Release. Mit dem Rückbau entfällt er:
      # der Bau greift auf kein fremdes Repo mehr zu.
      - run: npm run check
      - run: npm run test
      - run: npm run build
        env:
          # Public Turnstile SITE key (not a secret — it ships in the client widget). Astro inlines
          # PUBLIC_* vars at BUILD time; this build runs on GitHub's runner and does NOT see
          # Cloudflare's runtime env, so without this the /seed form would ship in permanent standby.
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAD543CSVCrF26LBW"
      # Gewichts-Gate der Sichtschicht (2026-09-02), dasselbe wie in ci.yml: kein Client-Chunk
      # geht live, der sein gzip-Budget in scripts/budgets.json überschreitet. Auf dem
      # workflow_run-Pfad der Nightlies ist dieser Job das einzige Netz — deshalb auch hier.
      - run: node scripts/bundle-budget.mjs
      # IndexNow (Bing, Yandex, Seznam, Naver …) verifies ownership through a key file at the
      # site root. The key is a repository secret, so the file is generated into dist/ at deploy
      # time and never committed. Without a key this step does nothing and the deploy proceeds —
      # the ping below is likewise guarded. Added 2026-09-02 for the trending ledger.
      - name: IndexNow key file (only when INDEXNOW_KEY is configured)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "No INDEXNOW_KEY configured — skipping."; exit 0; fi
          printf '%s' "$INDEXNOW_KEY" > "dist/$INDEXNOW_KEY.txt"
          echo "IndexNow key file written into dist/."
      - name: Deploy → Cloudflare Pages
        env:
          CF_TOKEN_RAW: ${{ secrets.CF }}
          CLOUDFLARE_ACCOUNT_ID: '991a2a1a4a288564f3bd05ff01476a30'
        run: |
          # Secret kann beim Einfügen ein \n/Leerzeichen enthalten → trimmen (sonst „invalid header value").
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages deploy dist --project-name=frankbueltge-de --branch=main --commit-dirty=true
      # After the deploy: tell the IndexNow engines (Bing, Yandex, Seznam, Naver, Yep — Google
      # does not take part) which pages changed. Only the trending surfaces change daily, and
      # only the nightly changes them, so the step runs on that trigger and on a manual deploy
      # rather than on all ten-odd deploys a day: submitting unchanged URLs over and over is
      # what the protocol asks callers not to do. Never fails the job — a missing key skips, a
      # failed ping is printed and ignored; the deploy above is the thing that matters.
      - name: IndexNow ping for the trending surfaces (never fails the deploy)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Trending nightly') }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then echo "No INDEXNOW_KEY configured — skipping."; exit 0; fi
          # Every page the build produced under /trending: today's ledger, the archived days,
          # the topics hub and one landing page per watched term.
          python3 - "$INDEXNOW_KEY" <<'PY' > /tmp/indexnow.json
          import json, sys, pathlib
          key = sys.argv[1]
          root = pathlib.Path("dist")
          urls = sorted(
              "https://frankbueltge.de/" + str(p.parent.relative_to(root)) + "/"
              for p in root.glob("trending/**/index.html")
          )
          json.dump({"host": "frankbueltge.de", "key": key,
                     "keyLocation": f"https://frankbueltge.de/{key}.txt",
                     "urlList": urls[:10000]}, sys.stdout)
          print(f"IndexNow: submitting {len(urls)} pages", file=sys.stderr)
          PY
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            -o /dev/null -w 'IndexNow HTTP %{http_code}\n' || echo "IndexNow ping failed — ignored."
