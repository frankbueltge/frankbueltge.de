name: Deploy to Cloudflare Pages

# Baut auf GitHubs Runnern (gratis) und deployt das statische dist/ zu Cloudflare Pages.
# Läuft bei jedem Push auf main UND nach jedem nächtlichen Cron-Workflow (workflow_run).
# Letzteres ist nötig, weil Pushes mit dem eingebauten GITHUB_TOKEN (so committen die
# Cron-Jobs) per GitHubs Anti-Rekursions-Regel KEIN `on: push` auslösen — sonst ginge die
# nächtliche Kunst nicht live. CF Pages serviert nur Statik (keine harten Anbieter-Sperren).
#
# BENÖTIGT ein Repository-Secret (Settings → Secrets and variables → Actions):
#   CF — Cloudflare-API-Token mit „Cloudflare Pages: Edit"
# (Die Account-ID ist nicht geheim und steht direkt unten.)
#
# THIS workflow is the only deployer that works. Cloudflare additionally watches the
# repository through a dashboard-side git integration and fails on every commit — the
# permanently red `Workers Builds: frankbueltge-de` check. Do NOT try to make that build
# green by adding a wrangler config: two deployers on one production target, and the
# Cloudflare-side one would ship without PUBLIC_TURNSTILE_SITE_KEY (see the build step
# below), putting /seed into permanent standby. Diagnosis and the one-click fix:
# docs/design/2026-08-03-two-deployers-one-project.md

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Bis 2026-07-27 stieß der Dataset-Hub hier nach jedem nächtlichen Snapshot an
  # (repository_dispatch: dataset-snapshot), mit einem Cron um 03:50 UTC als Rückfallebene.
  # Beides ist mit dem Rückbau des Registers entfallen (docs/design/2026-07-27-register-
  # rueckbau-und-scouts.md): Die Site holt keine Registerdaten mehr beim Bauen — der
  # kuratierte Bestand liegt committet in src/data/register/. Ein Push genügt.
  workflow_run:
    workflows:
      - Protokoll nightly
      - Prämie nightly
      # Renamed 2026-08-02 when the cadence changed (parallaxe.yml declares `name: Parallaxe
      # weekly`). GitHub matches workflow_run by the declared name, so the stale entry silently
      # matched nothing and the Monday register commit never reached production.
      - Parallaxe weekly
      - Round Number nightly
      - Ghost Fleet nightly
      - Redaction nightly
      - Gegenmessung nightly
      - ueberflug-refresh
      - Atelier integrate
      - Field integrate
      - Studio integrate
      - Plenum integrate
      - Ecology integrate
      - Beifang weekly
      - Katalog-Scout nightly # committet src/data/register/papers.json mit GITHUB_TOKEN
      - Spielraum watch
      - Requests watchdog # saat-sync committet register.json mit GITHUB_TOKEN → kein on:push
      - Atlas-Scout nightly # commits src/data/atlas/werke.json with GITHUB_TOKEN → no on:push
      - Puls nightly refresh # commits src/data/pulse/pulse.json with GITHUB_TOKEN → no on:push
      - Attention integrate # mirrors public/attention/ with GITHUB_TOKEN → no on:push
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cf-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # push/workflow_dispatch: immer. workflow_run: nur wenn der Cron erfolgreich war
    # (sonst löste auch ein fehlgeschlagener Nightly einen Deploy aus).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Gate vor dem Deploy (P0.4, 16.07.): check + test laufen HIER, nicht nur im parallelen
      # CI — Bot-Pushes der Nightlies (GITHUB_TOKEN) lösen `on: push` nicht aus, dieser Job
      # ist auf dem workflow_run-Pfad also das einzige Netz. Rot statt blind live.
      # Der GITHUB_TOKEN, den diese drei Schritte bis zum 27.07. brauchten, hing allein am
      # Abruf der Registerdaten aus dem dataset-hub-Release. Mit dem Rückbau entfällt er:
      # der Bau greift auf kein fremdes Repo mehr zu.
      - run: npm run check
      - run: npm run test
      - run: npm run build
        env:
          # Public Turnstile SITE key (not a secret — it ships in the client widget). Astro inlines
          # PUBLIC_* vars at BUILD time; this build runs on GitHub's runner and does NOT see
          # Cloudflare's runtime env, so without this the /seed form would ship in permanent standby.
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAD543CSVCrF26LBW"
      - name: Deploy → Cloudflare Pages
        env:
          CF_TOKEN_RAW: ${{ secrets.CF }}
          CLOUDFLARE_ACCOUNT_ID: '991a2a1a4a288564f3bd05ff01476a30'
        run: |
          # Secret kann beim Einfügen ein \n/Leerzeichen enthalten → trimmen (sonst „invalid header value").
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')"
          npx --yes wrangler@4 pages deploy dist --project-name=frankbueltge-de --branch=main --commit-dirty=true
