name: Common Time weekly

# Common Time — Common Ground, played back once a week (docs/design/2026-11-08-common-time.md).
# Presses every ISO week whose Monday and Sunday are both in the ledger (src/data/trending) and that has
# no pressing yet: public/common-time/<week>.m4a and src/data/common-time/<week>.json. A pressing that
# exists is never rewritten (the archive rule), so a run with nothing to press commits nothing.
#
# WHEN IT RUNS. Monday morning, after Sunday's day file has landed. GitHub starts this repository's
# schedules hours late, which costs nothing here: the week is complete either way, and a late run
# finds it. deploy-cf.yml listens for this workflow's completion and rebuilds the site.

on:
  schedule:
    - cron: '30 9 * * 1' # Mondays 09:30 UTC; GitHub starts it when it does
  workflow_dispatch:
    inputs:
      week:
        description: "Press only this ISO week (e.g. 2026-W45), if it is complete and not pressed yet. Empty: every such week."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: common-time
  cancel-in-progress: false

jobs:
  press:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/common-time/requirements.txt

      - name: Install the renderer
        run: |
          python -m pip install --quiet -r scripts/common-time/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Press
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            python scripts/common-time/press.py "$WEEK"
          else
            python scripts/common-time/press.py
          fi

      - name: Commit
        run: |
          git config user.name "Presswerk"
          git config user.email "presswerk@frankbueltge.de"
          git add public/common-time src/data/common-time
          if git diff --cached --quiet; then
            echo "Nothing pressed."; exit 0
          fi
          git commit -m "common-time: the pressings of $(date -u +%F)"
          # Against push races with the nightly commits: rebase and retry.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed."; exit 0
            fi
            echo "Push attempt $i failed, retrying …"; sleep 5
          done
          echo "::error::Push failed after 5 attempts"; exit 1
