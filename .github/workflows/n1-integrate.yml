# Mirrors the n-1 practice onto this site (Frank's calls, 2026-08-15: the
# practices publish here without a human in the path, and — same rule as
# machine-attention, 2026-08-08 — no GitHub Page as the public address:
# everything lives directly on frankbueltge.de). Two mirrors per run:
# src/data/n1/record.json (contract n1-record/1, feeds the /n-1 window) and
# public/n-1/map/ (the practice's self-built surface, copied byte for byte —
# served at /n-1/map/, its GitHub Page remains only the technical origin).
# Pull-based like the other integrates: the practice repo needs no write
# access and no secret here; this workflow copies bytes and never authors
# content. Hourly, so founder-rung daytime sessions reach the domain within
# the hour; unchanged records exit without a commit.
# src/data/n1 is not a declared knowledge-graph source, so no graph rebuild
# runs here — if it ever becomes one, this workflow must derive the graph in
# the same commit (see .claude/rules/knowledge-graph.md).
name: n-1 integrate

on:
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n1-integrate

jobs:
  pull-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the practice record and surface
        run: |
          git clone --depth 1 https://github.com/frankbueltge/n-1 /tmp/n-1
          node scripts/n1/mirror.mjs /tmp/n-1
          rm -rf public/n-1/map
          mkdir -p public/n-1/map
          cp -R /tmp/n-1/. public/n-1/map/
          rm -rf public/n-1/map/.git

      - name: Commit mirror
        run: |
          git config user.name "N1-Integrate"
          git config user.email "n1-integrate@frankbueltge.de"
          git add src/data/n1 public/n-1
          if git diff --cached --quiet; then
            echo "record unchanged"
            exit 0
          fi
          git commit -m "n-1: mirror the practice record of $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
