# Mirrors the n-1 practice onto this site (Frank's calls, 2026-08-15: the
# practices publish here without a human in the path, and — same rule as
# machine-attention, 2026-08-08 — no GitHub Page as the public address:
# everything lives directly on frankbueltge.de).
#
# Since 2026-08-15 (Frank's call, wording private) /n-1 is the practice's own
# surface, not a house window onto it: this workflow copies the practice's
# repository byte for byte to public/n-1/ and the site serves it there. The
# house no longer derives a view of the practice — the earlier src/data/n1
# record contract (n1-record/1) and the Astro page that rendered it are gone,
# so nothing on this domain restates the practice in the house's own words.
# What /n-1 shows is decided in the practice's repository alone.
#
# Pull-based like the other integrates: the practice repo needs no write
# access and no secret here; this workflow copies bytes and never authors
# content.
#
# Every five minutes since 2026-08-22, and cheap when there is nothing to do:
# the first step asks `git ls-remote` for the practice's HEAD and compares it
# with the sha this mirror last carried (.github/state/n1-mirror-head). Equal
# means exit in seconds — no node, no npm ci, no wipe. The cadence matters
# because the practice's own surface contract names this domain `canonical`
# and github.io merely `origin`, and on 2026-08-22 the founder retired that
# origin: the GitHub Page is switched off, so this mirror is now the practice's
# ONLY public address. A surface that is the only one may not lag an hour
# behind the record it serves. The commit is made
# with the built-in GITHUB_TOKEN, which never fires `on: push` — deploy-cf.yml
# carries this workflow in its `workflow_run` list, and must keep doing so.
# public/n-1 is not a declared knowledge-graph source, so no graph rebuild
# runs here — if it ever becomes one, this workflow must derive the graph in
# the same commit (see .claude/rules/knowledge-graph.md).
name: n-1 integrate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n1-integrate

jobs:
  pull-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Anything new upstream?
        id: check
        run: |
          remote=$(git ls-remote https://github.com/frankbueltge/n-1 HEAD | cut -f1)
          have=$(cat .github/state/n1-mirror-head 2>/dev/null || echo none)
          echo "remote=$remote" >> "$GITHUB_OUTPUT"
          if [ "$remote" = "$have" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "record unchanged at $remote — nothing to mirror"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "upstream $remote, mirror carries $have"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 22
      - run: npm ci
        if: steps.check.outputs.changed == 'true'

      - name: Pull the practice's surface and record
        if: steps.check.outputs.changed == 'true'
        run: |
          git clone --depth 1 https://github.com/frankbueltge/n-1 /tmp/n-1
          rm -rf /tmp/n-1/.git
          rm -rf public/n-1
          mkdir -p public/n-1
          cp -R /tmp/n-1/. public/n-1/
          mkdir -p .github/state
          printf '%s\n' "${{ steps.check.outputs.remote }}" > .github/state/n1-mirror-head

      - name: Frame the mirror — the way back
        if: steps.check.outputs.changed == 'true'
        # The mirror is copied byte for byte and then framed: the practice's own file is never
        # touched, only this copy, and the strip says so on the page ("added by the site").
        # Without this the record's pages carry no internal link at all — a visitor arriving
        # from a search result meets a practice with no exit (Frank, 2026-08-16). Runs after
        # every copy because the copy wipes the directory; scoped to n-1 so it never leaves
        # another house's mirror rewritten and unstaged.
        run: npx tsx scripts/engines/reframe-works.ts n-1

      - name: Commit mirror
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "N1-Integrate"
          git config user.email "n1-integrate@frankbueltge.de"
          git add public/n-1 .github/state/n1-mirror-head
          if git diff --cached --quiet; then
            echo "record unchanged"
            exit 0
          fi
          git commit -m "n-1: mirror the practice record of $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
