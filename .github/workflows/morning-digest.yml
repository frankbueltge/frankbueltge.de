# .github/workflows/morning-digest.yml
# Franks Morgenüberblick (17.07., Task 'Überblick + schnelle Antworten'): EIN Issue pro Tag
# statt zehn Einzel-Pings — was die Nacht getan hat, was rot ist, was auf Antwort wartet.
# Läuft nach den Nightlies und beiden Watchdogs. Das Vortages-Digest wird geschlossen
# (Posteingang bleibt leer); Antworten auf Requests gibt Frank direkt als Kommentar auf dem
# jeweiligen "Request aus …"-Issue — die Praktiken lesen diese Kommentare in ihrem
# Orientierungspass selbst (Routine-Prompts), kein Rückspiegel-Token nötig.
# Telegram-Push: aktiviert sich automatisch, sobald die Secrets TELEGRAM_BOT_TOKEN und
# TELEGRAM_CHAT_ID existieren; bis dahin sauberer Skip mit Warnung.
name: Morning digest

on:
  schedule:
    - cron: '30 6 * * *'   # 08:30 Berlin — nach Nightlies (05:35–06:35) und Watchdogs (07:45/08:15)
  workflow_dispatch:
    inputs:
      # A test window (2026-10-17). The digest reads "the last 24 hours", and until it can be run
      # over a day that has already happened, the only way to see whether it reports the red runs
      # of that day was to wait for the next one. Both inputs are for that: the window may start
      # earlier or later, and a dry run prints the digest instead of opening, closing or pushing.
      since:
        description: 'Window start, ISO UTC (e.g. 2026-10-16T06:30:00Z) — default: 24 hours ago'
        required: false
        default: ''
      dry_run:
        description: 'Print the digest to the job summary; open, close and push nothing'
        type: boolean
        default: false

permissions:
  issues: write
  actions: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      # Checkout and node added 2026-09-03 for the cycle line below. The job had neither and
      # ran entirely on `gh`; without them the cycle derivation would have failed behind its
      # own `|| true` and the section would simply never have appeared — a watchdog that is
      # quietly absent is worse than one that is missing.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compose and post the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          SINCE=${INPUT_SINCE:-$(date -u -d '24 hours ago' +%FT%TZ)}
          BODY="## Die Nacht in einem Blick — $DATE"$'\n\n'

          # 1) Engine-Sessions der letzten 24h (Commits auf main, ohne Merge-/Bot-Rauschen)
          BODY+="### Sessions"$'\n'
          # arch, n-1 and error-as-method added 2026-09-11. They have run a session every night
          # since 2026-09-03 and none of them appeared here, so the one mechanism that reports
          # "keine Session gelandet" never looked at them: arch missed the nights of 09-10 and
          # 09-11 and nothing said so. research-ecology added 2026-09-19 for the same reason —
          # the Middle Scribe runs its own nightly routine and landed nothing between 09-16 and
          # 09-19, unread by this list and by the landing watchdog both.
          # One marker list for both reads below. Two hand-written lists drift, and the half that
          # drifts goes silent instead of red — the same way the digest's and the landing
          # watchdog's repo lists drifted apart between 2026-09-11 and 2026-09-18.
          # `Night [0-9]` is n-1's own session marker ("Night 25: …"), written with the digit so
          # prose like "Two Nights Deep" is not counted as a landing; `^scribe: ` is the Middle
          # Scribe's, anchored so that "describe" cannot match it.
          # `^relay: [0-9]` is the Middle's own daily commit in research-ecology ("relay: 2026-10-17 —
          # 22 relations, 6 open handoffs", every morning around 07:15 UTC). Added 2026-10-17: the list
          # read only the Scribe's commits there, so a day on which the relay landed and the Scribe did
          # not was printed as "keine Session gelandet". The digit keeps a maintenance commit such as
          # "relay: README — …" out of the count.
          MARKER='session|Session|Research day|Plenum|Auto-land research|Project work|Night [0-9]|^scribe: |^relay: [0-9]'
          # arch and data-snack-plenum left this list on 2026-10-17. Arch is retired (its room stays as
          # a record; its head last moved on 2026-10-05) and the Plenum has been dormant since its last
          # mirror on 2026-08-26, its only commits being the integrate's own failure feedback. A line
          # "keine Session gelandet" every morning for a practice that owes none is noise, and it
          # teaches the reader to skip the section. The landing watchdog still reads arch; put both
          # back here the day either of them works again.
          for REPO in field-research ulysses studio n-1 error-as-method research-ecology; do
            LINES=$(gh api "repos/frankbueltge/$REPO/commits?since=$SINCE&per_page=15" \
              --jq "[.[] | select(.commit.message | test(\"$MARKER\")) | \"- **$REPO**: \" + (.commit.message | split(\"\n\")[0] | .[0:140])] | join(\"\n\")" 2>/dev/null || echo "")
            # The read above sees `main` and nothing else. A session whose environment cannot push
            # to main publishes to a branch and opens a pull request instead, and from main that
            # complete record is indistinguishable from a night that never ran. n-1 has worked this
            # way every night since night 22; on 2026-09-18 this section called it an empty night
            # while night 29's record sat finished in pull request #4. So the open pull requests
            # are read too, by the same markers, and reported beside the commits rather than
            # instead of them — on 2026-09-19 `main` carried the merge of night 29 while night 30
            # was the night that had just been worked.
            PRS=$(gh api "repos/frankbueltge/$REPO/pulls?state=open&sort=created&direction=desc&per_page=20" \
              --jq "[.[] | select(.created_at > \"$SINCE\") | select(.title | test(\"$MARKER\")) | \"- **$REPO**: \" + (.title | .[0:120]) + \" (offener PR #\" + (.number|tostring) + \" — nicht auf main)\"] | join(\"\n\")" 2>/dev/null || echo "")
            # Plain `if`, not `[ … ] && BODY+=…`: under `set -e` a false test ends the whole
            # digest, and a digest that dies mid-loop looks like a quiet night for every
            # practice after it.
            if [ -n "$LINES" ]; then BODY+="$LINES"$'\n'; fi
            if [ -n "$PRS" ]; then BODY+="$PRS"$'\n'; fi
            if [ -n "$LINES" ] || [ -n "$PRS" ]; then continue; fi
            # Atelier arbeitet seit Protokoll v4 projektbasiert (v5 seit 2026-07-24: Arbeitslinien) —
            # eine Nacht ohne Landung ist normal, kein Alarm. Sein Sitzungsmarker heißt "Project work",
            # deshalb steht der oben im Filter — sonst meldet der Digest Stille, wo gearbeitet wurde.
            if [ "$REPO" = "ulysses" ]; then BODY+="- **$REPO**: keine Landung (projektbasierte Praxis, v5 — kein nächtlicher Takt geschuldet)"$'\n'
            else BODY+="- **$REPO**: keine Session gelandet"$'\n'; fi
          done

          # 1b) Der Zyklus-Stand (2026-09-03). Der Digest zählte Sessions und meldete rote
          # Läufe, aber nichts las die Zyklus-Uhr: Cycle 001 stand vier Tage lang fertig
          # präsentiert offen, während zwei Praxen weiter Artefakte hineinlegten und die
          # dritte "nothing owed" schrieb. Die Ableitung liegt unter Test
          # (src/lib/ecology/cycle-watch.ts); der Digest rendert nur ihre Zeilen und
          # schweigt, solange der Zyklus normal läuft.
          if CYCLE_JSON=$(npx tsx scripts/ecology/cycle-watch.ts 2>/dev/null); then
            CYCLE=$(printf '%s' "$CYCLE_JSON" | jq -r '(.lines // []) | map("- " + .) | join("\n")')
            if [ -n "$CYCLE" ]; then
              BODY+=$'\n'"### Der Zyklus"$'\n'
              BODY+="$CYCLE"$'\n'
            fi
          else
            # Say it rather than swallow it: a silent failure here reads exactly like a
            # healthy cycle, which is the one thing this section exists to distinguish.
            BODY+=$'\n'"### Der Zyklus"$'\n'
            BODY+="- ⚠ Zyklus-Stand nicht lesbar — \`scripts/ecology/cycle-watch.ts\` ist gescheitert."$'\n'
          fi

          # 2) Rote Läufe der letzten 24h in diesem Repo
          # Asked by creation date, one conclusion at a time, so GitHub does the filtering. Until
          # 2026-10-17 this read `gh run list --limit 50` and cut the list afterwards. This repository
          # starts several hundred runs a day (deploys, mirrors, watches), so fifty runs reach back one
          # to seven hours, not twenty-four: from 2026-10-02 to 2026-10-15 the section reported 2 of
          # the 35 red runs there were, and printed "keine 🎉" on days that had them.
          if [ -n "${INPUT_SINCE:-}" ]; then BODY+=$'\n'"### Rote Läufe (seit $SINCE)"$'\n'
          else BODY+=$'\n'"### Rote Läufe (24h)"$'\n'; fi
          RUNS='[]'
          RUNS_OK=1
          for CONCLUSION in failure timed_out startup_failure; do
            if PART=$(gh run list --repo frankbueltge/frankbueltge.de --status "$CONCLUSION" \
                --created ">=$SINCE" --limit 300 --json name,workflowName,createdAt); then
              RUNS=$(jq -c --argjson more "$PART" '. + $more' <<<"$RUNS")
            else
              RUNS_OK=0
            fi
          done
          # One line per workflow: how often, and between which UTC minutes.
          RED=$(jq -r 'group_by(.workflowName // .name // "(unnamed)")[]
            | (map(.createdAt) | sort) as $t
            | "- \(.[0].workflowName // .[0].name // "(unnamed)")"
              + (if length > 1 then " ×\(length) (\($t[0][11:16])–\($t[-1][11:16]) UTC)" else " (\($t[0][11:16]) UTC)" end)' <<<"$RUNS")
          if [ -n "$RED" ]; then BODY+="$RED"$'\n'
          elif [ "$RUNS_OK" = 1 ]; then BODY+="- keine 🎉"$'\n'; fi
          # Say it rather than print "keine": a query that failed is not a day without red runs.
          if [ "$RUNS_OK" = 0 ]; then BODY+="- ⚠ Die Lauf-Liste war nicht (vollständig) lesbar — \`gh run list\` ist gescheitert."$'\n'; fi

          # 3) Offene Requests an Frank — mit der Selbstauskunft der Absender (Vier-Zeilen-
          # Kopf, Steuerzentrale v2 P1): tl;dr + braucht statt roher Überschrift, wo der
          # Kopf existiert; kopflose Alt-Anfragen erscheinen wie bisher, ehrlich markiert.
          # Fällt die Extraktion je auf die Nase, greift das alte einfache Format (|| unten).
          BODY+=$'\n'"### Wartet auf dich (unbeantwortet entscheidet die Praxis in ihrer nächsten Session selbst)"$'\n'
          REQ=$(gh issue list --repo frankbueltge/frankbueltge.de --state open \
            --search '"Request aus" in:title' --json number,title,body \
            --jq '[ .[] | . as $i
              | ((.body // "") | split("\n")) as $orig
              | ($orig | map(ascii_downcase)) as $low
              | ([range(0; $low|length) | select($low[.] | contains("tl;dr:"))] | .[0]) as $ti
              | ([range(0; $low|length) | select(($low[.] | contains("braucht:")) or ($low[.] | contains("needs:")))] | .[0]) as $bi
              | (if $ti != null then ($orig[$ti] | split(":")[1:] | join(":") | gsub("\\*"; "") | ltrimstr(" ")) else null end) as $tldr
              | (if $bi != null then ($low[$bi] | split(":")[1] // "" | gsub("\\*"; "") | ltrimstr(" ") | split(" ")[0]) else null end) as $braucht
              | if $tldr != null then "- #\($i.number) **[\($braucht // "?")]** \($tldr[0:140])"
                else "- #\($i.number) \($i.title[0:110]) *(unstrukturiert)*" end ] | join("\n")') \
          || REQ=$(gh issue list --repo frankbueltge/frankbueltge.de --state open \
            --search '"Request aus" in:title' --json number,title \
            --jq '[.[] | "- #\(.number) \(.title[0:110])"] | join("\n")')
          [ -n "$REQ" ] && BODY+="$REQ"$'\n' || BODY+="- nichts offen"$'\n'
          # v2 P3: kopflose Anfragen sichtbar zählen — die Konvention (Vier-Zeilen-Kopf,
          # 2026-08-01) steht in den Kanälen der Praxen; der Digest erinnert nur.
          HEADLESS=$(printf '%s' "$REQ" | grep -c 'unstrukturiert' || true)
          # || true: unter set -e darf "keine kopflosen Anfragen" den Digest nicht abbrechen.
          { [ "${HEADLESS:-0}" -gt 0 ] && BODY+="*($HEADLESS Anfrage(n) ohne Vier-Zeilen-Kopf — Konvention seit 2026-08-01 in Kraft.)*"$'\n'; } || true
          BODY+=$'\n'"*Antworten: einfach als Kommentar auf dem jeweiligen Issue — die Praxis liest ihn in ihrer nächsten Session. Issue schließen = gelesen/erledigt.*"$'\n'

          # A dry run stops here: the digest is shown, and nothing is opened, closed or pushed.
          if [ "${DRY_RUN:-false}" = "true" ]; then
            { echo "### Dry run — nothing was opened, closed or pushed (window start: $SINCE)"; echo; printf '%s\n' "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$BODY"
            exit 0
          fi

          # Vortages-Digests schließen, neues eröffnen
          gh issue list --repo frankbueltge/frankbueltge.de --state open \
            --search '"Tagesüberblick" in:title' --json number --jq '.[].number' \
          | while read -r N; do gh issue close "$N" --repo frankbueltge/frankbueltge.de --comment "Abgelöst vom heutigen Digest." || true; done
          URL=$(gh issue create --repo frankbueltge/frankbueltge.de \
            --title "Tagesüberblick $DATE" --body "$BODY")
          echo "Digest: $URL"

          # Telegram-Push (optional — aktiviert sich mit den Secrets)
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            SUMMARY="Tagesüberblick $DATE: $URL"
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" -d text="$SUMMARY" \
              && echo "Telegram gesendet" || echo "::warning::Telegram-Versand fehlgeschlagen"
          else
            echo "::notice::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID nicht gesetzt — Push übersprungen (Digest-Issue reicht als Kanal)"
          fi
