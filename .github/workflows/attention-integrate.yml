# Mirrors the machine-attention practice stage onto this site (Frank's call,
# 2026-08-09: "keine GitHub Page — auf frankbueltge.de veröffentlichen, wo es
# hingehört"). Pull-based like the other integrates, so the practice repo
# needs no write access and no secret here. The stage build is the practice's
# canonical, verify.py-gated artifact; this workflow copies bytes, it never
# authors content. Two crons: after the practice's sentinel (05:45 UTC) and
# after its discovery pass can have landed (06:30 UTC + CI + automerge).
name: Attention integrate

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: attention-integrate

jobs:
  pull-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the practice stage
        run: |
          git clone --depth 1 https://github.com/frankbueltge/machine-attention \
            /tmp/machine-attention
          rm -rf public/attention
          mkdir -p public/attention
          cp -R /tmp/machine-attention/public/. public/attention/

      - name: Commit mirror
        run: |
          git config user.name "Attention-Integrate"
          git config user.email "attention-integrate@frankbueltge.de"
          git add public/attention
          if git diff --cached --quiet; then
            echo "stage unchanged"
            exit 0
          fi
          git commit -m "attention: mirror the practice stage of $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1
