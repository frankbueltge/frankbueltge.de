# Mirrors the machine-attention practice stage onto this site (Frank's call,
# 2026-08-08, wording private: publish on frankbueltge.de, not on a GitHub
# Page). Pull-based like the other integrates, so the practice repo
# needs no write access and no secret here. The stage build is the practice's
# canonical, verify.py-gated artifact; this workflow copies bytes, it never
# authors content. Two crons: after the practice's sentinel (05:45 UTC) and
# after its discovery pass can have landed (06:30 UTC + CI + automerge).
name: Attention integrate

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # to start deploy-cf.yml when another workflow started this run (see the last steps)
  actions: write

concurrency:
  group: attention-integrate

jobs:
  pull-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as the other integrates: graph:build runs tsx, so the mirror needs
      # node_modules. Added 2026-08-12 — the graph step arrived 2026-08-11
      # without it, and every mirror since failed at "tsx: not found".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Pull the practice stage
        run: |
          git clone --depth 1 https://github.com/frankbueltge/machine-attention \
            /tmp/machine-attention
          rm -rf public/attention
          mkdir -p public/attention
          cp -R /tmp/machine-attention/public/. public/attention/
          # Frame the mirror — the way back. The practice's own files are never touched, only
          # this copy, and the strip says so on the page ("added by the site"). Without it the
          # 109 mirrored pages carry no internal link at all: a visitor arriving at a single
          # event page from a search result meets no house and no exit (Frank, 2026-08-16).
          # Runs after every copy because the copy wipes the directory; scoped to attention so
          # it never leaves another house's mirror rewritten and unstaged.
          npx tsx scripts/engines/reframe-works.ts attention
          # What the practice says about itself, beside what it renders
          # (attention-export/1, docs/design/2026-08-09-attention-export-contract.md).
          # Absent is a legal state: the graph and the practice page both read
          # it as "no attention lane" rather than failing.
          mkdir -p src/data/attention
          if [ -f /tmp/machine-attention/export.json ]; then
            cp /tmp/machine-attention/export.json src/data/attention/export.json
          fi
          # The moments the projects offer the shared stage at /machine-attention
          # (stage-moments/1, docs/design/2026-08-09-stage-moments-contract.md).
          # Absent is a legal state: the entrance shows its quiet state.
          if [ -f /tmp/machine-attention/moments.json ]; then
            cp /tmp/machine-attention/moments.json src/data/attention/moments.json
          fi
          # The practice's head this mirror now carries (2026-10-07). The practice does not
          # dispatch, so the practice watch (practice-watch.yml) compares its head with this file
          # once a minute while the house is active and starts this workflow when they differ; the
          # two crons above are the net under it. Committed even when nothing else changed, so the
          # watch never asks twice for one head.
          mkdir -p .github/state
          git -C /tmp/machine-attention rev-parse HEAD > .github/state/attention-mirror-head

      # src/data/attention/export.json is a declared graph source, so the derived artifact
      # travels in the same commit as the export it was derived from. Without this the graph
      # test goes red for everyone until the nightly graph job — the 2026-08-11 morning, when an
      # ecology export at 06:33 stopped four workflows that had nothing to do with it.
      - name: Re-derive the knowledge graph from what was just mirrored
        run: npm run graph:build

      - name: Commit mirror
        run: |
          git config user.name "Attention-Integrate"
          git config user.email "attention-integrate@frankbueltge.de"
          git add public/attention src/data/attention src/data/graph .github/state/attention-mirror-head
          if git diff --cached --quiet; then
            echo "stage unchanged"
            exit 0
          fi
          git commit -m "attention: mirror the practice stage and export of $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          echo "push failed after 5 attempts" >&2
          exit 1

      # A run started by another workflow with the built-in token (the practice watch, the mirror
      # watch, a sentinel retry) ends without a workflow_run event — GitHub creates none for a run
      # the built-in token started — so deploy-cf.yml never hears of what it committed. Seen on
      # 2026-10-07: four mirrors committed between 17:59 and 18:05 UTC and stood undeployed. Such
      # a run starts the deploy itself; a run started by a schedule, a practice's dispatch or a
      # person still reaches deploy-cf.yml through workflow_run and does not ask twice.
      - name: Deploy what this run committed (when another workflow started it)
        if: success() && github.triggering_actor == 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cf.yml --repo "$GITHUB_REPOSITORY" --ref main
