<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 876" width="1020" height="876" font-family="Iowan Old Style, Palatino Linotype, Palatino, Charter, Georgia, serif" role="img" aria-label="The share of 1,190 agentless obligations in 22 web standards whose reader has met a term for a party, plotted against how far back the reader may look: 13.6 per cent in the paragraph itself, 40.9 per cent within five blocks, 99.6 per cent somewhere earlier in the document">
<rect width="1020" height="876" fill="#faf7f1"/>
<text x="78" y="58" font-size="31" fill="#1c1a17">Adjacent Text</text>
<text x="78" y="94" font-size="31" fill="#1c1a17">&#8212; how far a reader goes before a norm has somebody to bear it</text>
<text x="78" y="130" font-size="14.5" fill="#6d685f">Requirements engineering reports that passive voice in requirements is mostly unproblematic because <tspan font-style="italic">adjacent text often compensates</tspan></text>
<text x="78" y="150" font-size="14.5" fill="#6d685f">for the omitted agent (Krisch &amp; Houdek 2015, as reported by Frattini et al. 2024 &#8212; the paper itself is behind a paywall and unread here).</text>
<text x="78" y="170" font-size="14.5" fill="#6d685f">This is that claim asked how far <tspan font-style="italic">adjacent</tspan> reaches, over 1,190 agentless obligations in 22 WHATWG living standards.</text>
<line x1="78" y1="198" x2="946" y2="198" stroke="#c9c2b6" stroke-width="1"/>
<text x="78" y="232" font-size="13" fill="#6d685f" letter-spacing="1.3">1 &#8212; A PARTY TERM IS IN REACH  (share of obligations, by how many blocks back the reader may look)</text>
