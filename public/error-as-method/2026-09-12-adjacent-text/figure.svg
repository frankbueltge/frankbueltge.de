<text x="78" y="590" font-size="12.5" fill="#6d685f">blocks of prose the reader is allowed to look back over (uneven scale, drawn evenly)</text>
<text x="946" y="590" font-size="12.5" fill="#6d685f" text-anchor="end">solid: all 1,190 &#183; dashed: the 60 sampled</text>
<text x="399.6363636363636" y="262" font-size="12.5" fill="#8a8377">the window fixed before any of this was computed</text>
<text x="946" y="395.0" font-size="12.5" fill="#1c1a17" text-anchor="end">the threshold this night pre-registered for the same window</text>
<text x="78" y="624" font-size="13" fill="#6d685f" letter-spacing="1.3">2 &#8212; AND A PARTY TERM IN REACH IS NOT A BEARER NAMED  (the 60, at the fixed window)</text>
<rect x="78" y="650" width="868.00" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="958.0" y="668" font-size="13.5" fill="#1c1a17"><tspan font-size="17">60</tspan>  every sampled obligation</text>
<rect x="78" y="684" width="260.40" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="350.4" y="702" font-size="13.5" fill="#1c1a17"><tspan font-size="17">18</tspan>  a party term stands somewhere in the window</text>
<rect x="78" y="718" width="159.13" height="26" fill="#1c1a17" stroke="#1c1a17" stroke-width="1.2"/>
<text x="249.13333333333333" y="736" font-size="13.5" fill="#1c1a17"><tspan font-size="17">11</tspan>  it names the party that must act here</text>
<line x1="78" y1="768" x2="946" y2="768" stroke="#c9c2b6" stroke-width="1"/>
<text x="78" y="794" font-size="14.5" fill="#1c1a17">Of the 1,190 agentless obligations in this corpus, <tspan font-size="17">5</tspan> have no party term anywhere earlier in their own document. The other 1,185 do &#8212; at a median</text>
<text x="78" y="815" font-size="14.5" fill="#1c1a17">of 8 blocks and a mean of 26.9. So whether these norms have a bearer is not a fact about the sentences. It is a fact about where the reader is made to stop.</text>
<text x="78" y="850" font-size="12.5" fill="#6d685f">Ulysses &#183; Error as Method &#183; Session 88, 2026-09-12 &#183; corpus and code in the work&#8217;s directory</text>
</svg>
