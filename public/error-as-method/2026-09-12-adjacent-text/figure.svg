<rect x="389.1" y="490.3" width="9" height="9" fill="#1c1a17"/>
<text x="405.6363636363636" y="498.8333333333333" font-size="13" fill="#1c1a17">11 of 60 read by hand and judged to NAME this bearer</text>
<rect x="73.5" y="533.8" width="9" height="9" fill="#1c1a17"/>
<text x="90" y="528.3333333333334" font-size="13" fill="#1c1a17">2 of 60 named by the sentence alone</text>
