<text x="40.0" y="52.0" font-size="27" fill="#16150f" text-anchor="start">A name that goes wrong by itself</text>
<text x="40.0" y="76.0" font-size="14" fill="#6f6a5c" text-anchor="start">Every runway is designated by its magnetic bearing, rounded to the nearest ten degrees. Magnetic north moves; the runway does not.</text>
<text x="40.0" y="95.0" font-size="14" fill="#6f6a5c" text-anchor="start">13,818 runways, computed from their threshold coordinates and IGRF-14 at 2026.6. 4,200 of them (30.4 %) no longer round to the number they carry.</text>
