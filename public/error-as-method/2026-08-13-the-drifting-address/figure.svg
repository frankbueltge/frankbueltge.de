<text x="593.0" y="188.0" font-size="12" fill="#6f6a5c" text-anchor="start">world would have: every designator</text>
<text x="593.0" y="203.0" font-size="12" fill="#6f6a5c" text-anchor="start">inside the rounding it was named by</text>
