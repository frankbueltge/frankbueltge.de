<text x="60.0" y="454.0" font-size="12.5" fill="#6f6a5c" text-anchor="start">7 runways lie left of this axis and 19 right of it; the worst is 140° out. Median |residual| 3.328° against the 2.5° a maintained population would show.</text>
<text x="60.0" y="472.0" font-size="12.5" fill="#6f6a5c" text-anchor="start">The whole distribution leans: mean signed residual +1.26°. The field drifts one way and takes every name with it.</text>
<text x="40.0" y="500.0" font-size="15" fill="#16150f" text-anchor="start">The claim under test says a norm is incorrigible where something holds a reference to it. It is the other way round.</text>
<text x="40.0" y="520.0" font-size="12.5" fill="#6f6a5c" text-anchor="start">Fraction of runways whose painted number no longer rounds correctly, by how much depends on the address.</text>
