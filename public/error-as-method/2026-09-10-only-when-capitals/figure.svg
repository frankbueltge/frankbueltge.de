<text x="66" y="262" font-size="15" fill="#1c1a17">MUST</text>
<text x="66" y="278" font-size="11" fill="#6d685f">normative, by the document's own key</text>
<text x="66" y="478" font-size="11.5" fill="#6d685f">width 48.0% · height 91.4%</text>
<text x="66" y="498" font-size="15" fill="#1c1a17">area 43.8%</text>
<rect x="304" y="288" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
