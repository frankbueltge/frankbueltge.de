<text x="780" y="278" font-size="11" fill="#6d685f">ordinary English</text>
<text x="780" y="478" font-size="11.5" fill="#6d685f">width 51.4% · height 86.2%</text>
<text x="780" y="498" font-size="15" fill="#1c1a17">area 44.3%</text>
<text x="66" y="582" font-size="13" fill="#6d685f" letter-spacing="1.4">2 &#8212; 63 EU LEGAL ACTS, 22,554 OCCURRENCES (SESSION 84). THE SAME MEASURE, THE PUBLISHED RESULT</text>
<rect x="66" y="640" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
<rect x="66" y="673.2" width="80.1" height="138.8" fill="#e4ded2"/>
<rect x="66" y="673.2" width="80.1" height="138.8" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="66" y1="672.8" x2="238" y2="672.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
<text x="66" y="614" font-size="15" fill="#1c1a17">recitals</text>
<text x="66" y="630" font-size="11" fill="#6d685f">the half that does not bind</text>
<text x="66" y="830" font-size="11.5" fill="#6d685f">width 46.6% · height 80.7%</text>
<text x="66" y="850" font-size="15" fill="#1c1a17">area 37.6%</text>
<rect x="304" y="640" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
<rect x="304" y="672.4" width="52.5" height="139.6" fill="#e4ded2"/>
<rect x="304" y="672.4" width="52.5" height="139.6" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="304" y1="672.8" x2="476" y2="672.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
<text x="304" y="614" font-size="15" fill="#1c1a17">articles</text>
<text x="304" y="630" font-size="11" fill="#6d685f">the half that does</text>
<text x="304" y="830" font-size="11.5" fill="#6d685f">width 30.5% · height 81.1%</text>
<text x="304" y="850" font-size="15" fill="#1c1a17">area 24.8%</text>
<rect x="542" y="640" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
<rect x="542" y="673.2" width="80.0" height="138.8" fill="#e4ded2"/>
<rect x="542" y="673.2" width="80.0" height="138.8" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
