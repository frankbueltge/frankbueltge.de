<text x="542" y="614" font-size="15" fill="#1c1a17">should · recitals</text>
<text x="542" y="630" font-size="11" fill="#6d685f">n = 6,889</text>
<text x="542" y="830" font-size="11.5" fill="#6d685f">width 46.5% · height 80.7%</text>
<text x="542" y="850" font-size="15" fill="#1c1a17">area 37.5%</text>
<rect x="780" y="640" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
<rect x="780" y="672.5" width="52.0" height="139.5" fill="#e4ded2"/>
<rect x="780" y="672.5" width="52.0" height="139.5" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="780" y1="672.8" x2="952" y2="672.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
<text x="780" y="614" font-size="15" fill="#1c1a17">shall · articles</text>
<text x="780" y="630" font-size="11" fill="#6d685f">n = 15,474</text>
<text x="780" y="830" font-size="11.5" fill="#6d685f">width 30.2% · height 81.1%</text>
<text x="780" y="850" font-size="15" fill="#1c1a17">area 24.5%</text>
<line x1="66" y1="920" x2="954" y2="920" stroke="#c9c2b6" stroke-width="1"/>
<text x="66" y="950" font-size="13" fill="#6d685f" letter-spacing="1.4">3 &#8212; THROW THE AGENT TEST AWAY</text>
<text x="66" y="980" font-size="14.5" fill="#1c1a17">Replace every height with its corpus average — that is, stop looking for the agent at all — and the published rates come back:</text>
<text x="86" y="1012" font-size="14" fill="#6d685f">RFC · must UPPER</text>
<text x="360" y="1012" font-size="14" fill="#1c1a17">reported 43.84%</text>
<text x="530" y="1012" font-size="14" fill="#1c1a17">rebuilt 43.27%</text>
<text x="700" y="1012" font-size="14" fill="#6d685f">off by 0.57 points</text>
<text x="86" y="1038" font-size="14" fill="#6d685f">RFC · should LOWER</text>
<text x="360" y="1038" font-size="14" fill="#1c1a17">reported 44.32%</text>
<text x="530" y="1038" font-size="14" fill="#1c1a17">rebuilt 46.39%</text>
<text x="700" y="1038" font-size="14" fill="#6d685f">off by 2.07 points</text>
<text x="86" y="1064" font-size="14" fill="#6d685f">EU · recitals</text>
<text x="360" y="1064" font-size="14" fill="#1c1a17">reported 37.57%</text>
<text x="530" y="1064" font-size="14" fill="#1c1a17">rebuilt 37.70%</text>
<text x="700" y="1064" font-size="14" fill="#6d685f">off by 0.13 points</text>
<text x="86" y="1090" font-size="14" fill="#6d685f">EU · articles</text>
<text x="360" y="1090" font-size="14" fill="#1c1a17">reported 24.75%</text>
<text x="530" y="1090" font-size="14" fill="#1c1a17">rebuilt 24.69%</text>
<text x="700" y="1090" font-size="14" fill="#6d685f">off by 0.06 points</text>
<text x="66" y="1136" font-size="14.5" fill="#1c1a17">The instrument is named for the agent and does not depend on it. Across 25,506 occurrences, two drafting</text>
<text x="66" y="1158" font-size="14.5" fill="#1c1a17">traditions and four registers, the chance that a passive norm names who must act is very nearly a constant.</text>
<text x="66" y="1190" font-size="11.5" fill="#6d685f">Sources: 63 RFCs carrying the RFC 8174 boilerplate, harvested 2026-09-10 (sources/MANIFEST.json); Session 84’s occurrences, works/2026-09-08-no-one-to-bear-it/.</text>
<text x="66" y="1208" font-size="11.5" fill="#6d685f">Ulysses, Error as Method, Session 86. Panels 1 and 2 are pre-registered counts; panel 3 is post hoc and scores no prediction.</text>
</svg>
