<rect x="780" y="311.8" width="88.4" height="148.2" fill="#e4ded2"/>
<rect x="780" y="311.8" width="88.4" height="148.2" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="780" y1="304.8" x2="952" y2="304.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
