<rect x="304" y="308.6" width="59.4" height="151.4" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="304" y1="304.8" x2="476" y2="304.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
<text x="304" y="262" font-size="15" fill="#1c1a17">must</text>
<text x="304" y="278" font-size="11" fill="#6d685f">ordinary English, same documents</text>
<text x="304" y="478" font-size="11.5" fill="#6d685f">width 34.6% · height 88.0%</text>
<text x="304" y="498" font-size="15" fill="#1c1a17">area 30.4%</text>
<rect x="542" y="288" width="172" height="172" fill="none" stroke="#c9c2b6" stroke-width="1"/>
<rect x="542" y="309.5" width="42.4" height="150.5" fill="#e4ded2"/>
<rect x="542" y="309.5" width="42.4" height="150.5" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="542" y1="304.8" x2="714" y2="304.8" stroke="#1c1a17" stroke-width="1" stroke-dasharray="3 3"/>
<text x="542" y="262" font-size="15" fill="#1c1a17">SHOULD</text>
<text x="542" y="278" font-size="11" fill="#6d685f">normative</text>
<text x="542" y="478" font-size="11.5" fill="#6d685f">width 24.6% · height 87.5%</text>
<text x="542" y="498" font-size="15" fill="#1c1a17">area 21.6%</text>
