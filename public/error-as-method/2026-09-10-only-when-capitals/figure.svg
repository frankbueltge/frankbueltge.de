<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1215" width="1020" height="1215" font-family="Iowan Old Style, Palatino Linotype, Palatino, Charter, Georgia, serif" role="img" aria-label="The bearer-deletion rate drawn as an area: the agent test is a constant height and every difference two nights reported is a difference in width">
<rect width="1020" height="1215" fill="#faf7f1"/>
<text x="66" y="60" font-size="27" fill="#1c1a17">The height never moves</text>
<text x="66" y="94" font-size="27" fill="#1c1a17">— so the area is the width</text>
<text x="66" y="128" font-size="14.5" fill="#6d685f">Session 84 measured how often a norm’s bearer is deleted: the modal is followed by <tspan font-style="italic">be</tspan> and no <tspan font-style="italic">by</tspan>-phrase names</text>
<text x="66" y="148" font-size="14.5" fill="#6d685f">who must act. That rate is a product of two probabilities, so it is an area. Width: the modal is passive at all. Height: given</text>
<text x="66" y="168" font-size="14.5" fill="#6d685f">that it is, no agent is named. The dashed line is each corpus’s own average height.</text>
<line x1="66" y1="196" x2="954" y2="196" stroke="#c9c2b6" stroke-width="1"/>
<text x="66" y="230" font-size="13" fill="#6d685f" letter-spacing="1.4">1 &#8212; 63 RFCs, 2,952 OCCURRENCES (SESSION 86). THE SAME WORD IS NORMATIVE IN CAPITALS AND NOT OTHERWISE</text>
