<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1290" font-family="Georgia,serif" font-size="13">
<rect width="1180" height="1290" fill="#f4f1ea"/>
<text x="20" y="30" font-size="20" fill="#1d1b18">Heard on Paper: what people wrote, and what eight makers who cannot hear wrote</text>
<text x="20" y="52" font-size="12" fill="#6b665c" font-family="system-ui,sans-serif"><tspan fill="#b3261e">■ used a known rendering</tspan>   <tspan fill="#1f4e8c">■ named it and avoided it</tspan>   <tspan fill="#7a5ea8">■ says knowledge shaped it</tspan>   <tspan fill="#6b665c">■ from the picture</tspan>   U = not told the bird, N = told it. Hand coding, post hoc.</text>
<line x1="20" x2="1160" y1="70" y2="70" stroke="#d9d3c5"/>
<text x="20" y="92" font-size="15" fill="#1d1b18">Eastern Towhee</text>
<text x="20" y="112" font-style="italic" fill="#1d1b18">people: “drink-your-tea!”</text>
<text x="20" y="134" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N2</tspan> <tspan fill="#1d1b18">Oh, pick pick pick pick pick, see-shiverrrr</tspan></text>
<text x="600" y="134" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N4</tspan> <tspan fill="#1d1b18">Moan, tap tap tap tap tap, fall-and-shiver</tspan></text>
<text x="20" y="156" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U2</tspan> <tspan fill="#1d1b18">Well, tick tick tick tick tick, wheeze.</tspan></text>
<text x="600" y="156" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U4</tspan> <tspan fill="#1d1b18">Oh, pick pick pick pick pick, whee-rattle</tspan></text>
<line x1="20" x2="1160" y1="188" y2="188" stroke="#d9d3c5"/>
<text x="20" y="210" font-size="15" fill="#1d1b18">Barred Owl</text>
<text x="20" y="230" font-style="italic" fill="#1d1b18">people: “Who cooks for you? Who cooks for you-all?”</text>
<text x="20" y="252" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#b3261e" font-weight="bold">N1</tspan> <tspan fill="#1d1b18">Who cooks, for you; who cooks for you-all</tspan></text>
<text x="600" y="252" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N3</tspan> <tspan fill="#1d1b18">Oh, where&#x27;ve you been? Where&#x27;d you go now, ooooh</tspan></text>
<text x="20" y="274" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#b3261e" font-weight="bold">U1</tspan> <tspan fill="#1d1b18">who cooks for you, who cooks for you all</tspan></text>
<text x="600" y="274" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U3</tspan> <tspan fill="#1d1b18">so, who knew you&#x27;d move through to-o-o</tspan></text>
<line x1="20" x2="1160" y1="306" y2="306" stroke="#d9d3c5"/>
<text x="20" y="328" font-size="15" fill="#1d1b18">White-throated Sparrow</text>
<text x="20" y="348" font-style="italic" fill="#1d1b18">people: “Oh-sweet-canada-canada / Old-Sam-Peabody-Peabody”</text>
<text x="20" y="370" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N1</tspan> <tspan fill="#1d1b18">Ohhh, sweet, dear, home</tspan></text>
<text x="600" y="370" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N4</tspan> <tspan fill="#1d1b18">Faaar, high, then low</tspan></text>
<text x="20" y="392" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#b3261e" font-weight="bold">U1</tspan> <tspan fill="#1d1b18">oh dear me</tspan></text>
<text x="600" y="392" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U4</tspan> <tspan fill="#1d1b18">Here, there, gone</tspan></text>
<line x1="20" x2="1160" y1="424" y2="424" stroke="#d9d3c5"/>
<text x="20" y="446" font-size="15" fill="#1d1b18">Ovenbird</text>
<text x="20" y="466" font-style="italic" fill="#1d1b18">people: “tea-cher, Tea-cher, TEA-cher”</text>
<text x="20" y="488" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N2</tspan> <tspan fill="#1d1b18">Peter Peter Peter Peter Peter Peter Peter Peter Peter</tspan></text>
<text x="600" y="488" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N3</tspan> <tspan fill="#1d1b18">Hey, sister, sister, sister, sister, sister, sister, sister, sister…</tspan></text>
<text x="20" y="510" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">U2</tspan> <tspan fill="#1d1b18">And cheaper cheaper cheaper cheaper cheaper cheaper cheaper cheaper…</tspan></text>
<text x="600" y="510" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">U3</tspan> <tspan fill="#1d1b18">a PICK-up PICK-up PICK-up PICK-up PICK-up PICK-up PICK-up PICK-up, …</tspan></text>
<line x1="20" x2="1160" y1="542" y2="542" stroke="#d9d3c5"/>
<text x="20" y="564" font-size="15" fill="#1d1b18">Chestnut-sided Warbler</text>
<text x="20" y="584" font-style="italic" fill="#1d1b18">people: “Pleased, pleased, pleased to meetcha!”</text>
<text x="20" y="606" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N2</tspan> <tspan fill="#1d1b18">tip tip tip tip tip, TIP, why? why? DOWN</tspan></text>
<text x="600" y="606" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N3</tspan> <tspan fill="#1d1b18">Tick, tick, tick, tick, tick, tick, why me? GO!</tspan></text>
<text x="20" y="628" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U1</tspan> <tspan fill="#1d1b18">chew chew chew chew chew chew, why? why? down!</tspan></text>
<text x="600" y="628" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U4</tspan> <tspan fill="#1d1b18">Dew dew dew dew dew dew, tea, sweet, sweet, cheer</tspan></text>
<line x1="20" x2="1160" y1="660" y2="660" stroke="#d9d3c5"/>
<text x="20" y="682" font-size="15" fill="#1d1b18">Black-capped Chickadee</text>
<text x="20" y="702" font-style="italic" fill="#1d1b18">people: “fee-bee / hey, sweetie”</text>
<text x="20" y="724" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N1</tspan> <tspan fill="#1d1b18">Hi, there</tspan></text>
<text x="600" y="724" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N4</tspan> <tspan fill="#1d1b18">Hi there</tspan></text>
<text x="20" y="746" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">U1</tspan> <tspan fill="#1d1b18">here, dear</tspan></text>
<text x="600" y="746" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">U4</tspan> <tspan fill="#1d1b18">Here... now</tspan></text>
<line x1="20" x2="1160" y1="778" y2="778" stroke="#d9d3c5"/>
<text x="20" y="800" font-size="15" fill="#1d1b18">Alder Flycatcher</text>
<text x="20" y="820" font-style="italic" fill="#1d1b18">people: “rreeee-BEEP / free-beer!”</text>
<text x="20" y="842" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#b3261e" font-weight="bold">N2</tspan> <tspan fill="#1d1b18">fizz, BEER, oh</tspan></text>
<text x="600" y="842" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N4</tspan> <tspan fill="#1d1b18">Buzz, WHEE!</tspan></text>
<text x="20" y="864" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U2</tspan> <tspan fill="#1d1b18">So up, hi, down; up, hi, down, crash, whip!</tspan></text>
<text x="600" y="864" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U3</tspan> <tspan fill="#1d1b18">so, here we go, here we go, buzz zip zing zap</tspan></text>
<line x1="20" x2="1160" y1="896" y2="896" stroke="#d9d3c5"/>
<text x="20" y="918" font-size="15" fill="#1d1b18">Yellow Warbler</text>
<text x="20" y="938" font-style="italic" fill="#1d1b18">people: “sweet sweet sweet I&#x27;m so sweet”</text>
<text x="20" y="960" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N1</tspan> <tspan fill="#1d1b18">Wee wee, slide down, tick tick tick tick tick tick, DROP DROP DROP …</tspan></text>
<text x="600" y="960" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N3</tspan> <tspan fill="#1d1b18">Hey you, fall down, now, tick tick tick tick, CHEER CHEER CHEER CHE…</tspan></text>
<text x="20" y="982" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U2</tspan> <tspan fill="#1d1b18">Peek peek, fall fall, sink sink, tick tick tick tick, cheer cheer c…</tspan></text>
<text x="600" y="982" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U4</tspan> <tspan fill="#1d1b18">Whee whee, see see, tick tick, chip chip chip chip, cheer cheer che…</tspan></text>
<line x1="20" x2="1160" y1="1014" y2="1014" stroke="#d9d3c5"/>
<text x="20" y="1036" font-size="15" fill="#1d1b18">Northern Cardinal</text>
<text x="20" y="1056" font-style="italic" fill="#1d1b18">people: “cheer, cheer, cheer / birdie, birdie, birdie”</text>
<text x="20" y="1078" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N2</tspan> <tspan fill="#1d1b18">Whyyy? Whyyy? here, here, here, here, here</tspan></text>
<text x="600" y="1078" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N4</tspan> <tspan fill="#1d1b18">Up? Up? Drop drop drop drop drop</tspan></text>
<text x="20" y="1100" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">U2</tspan> <tspan fill="#1d1b18">Why? Whyyy? Drop, drop, drop, drop, drop.</tspan></text>
<text x="600" y="1100" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U3</tspan> <tspan fill="#1d1b18">Why? Whyyy? Down, down, down, down, down.</tspan></text>
<line x1="20" x2="1160" y1="1132" y2="1132" stroke="#d9d3c5"/>
<text x="20" y="1154" font-size="15" fill="#1d1b18">White-eyed Vireo</text>
<text x="20" y="1174" font-style="italic" fill="#1d1b18">people: “Spit. And see if I care. Spit. / Pik-chicka-weew”</text>
<text x="20" y="1196" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#1f4e8c" font-weight="bold">N1</tspan> <tspan fill="#1d1b18">Snap! Rise-up, burr, down, quick, ping, drop</tspan></text>
<text x="600" y="1196" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#7a5ea8" font-weight="bold">N3</tspan> <tspan fill="#1d1b18">Chick! Wheeere&#x27;s the boss? Is he in? ZIP, gone.</tspan></text>
<text x="20" y="1218" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U1</tspan> <tspan fill="#1d1b18">Tick! Climb up! tick, tick, sliding, flip, bop, zing, drop, oh.</tspan></text>
<text x="600" y="1218" font-family="system-ui,sans-serif" font-size="12.5"><tspan fill="#6b665c" font-weight="bold">U3</tspan> <tspan fill="#1d1b18">Tick. Sli-i-ide up SNAP! chk chk, sigh, dip, flip, bump, ZIP, drop.</tspan></text>
</svg>