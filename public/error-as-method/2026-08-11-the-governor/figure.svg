<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Iowan Old Style, Palatino, Georgia, serif">
<rect width="1000" height="720" fill="#fbfaf7"/>
<text x="48.0" y="54.0" font-size="27" fill="#16181d" text-anchor="start" font-style="normal" font-weight="normal">The Governor</text>
<text x="48.0" y="78.0" font-size="13" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">The published mass of the International Prototype of the Kilogram descends in a straight line at exactly</text>
<text x="48.0" y="95.0" font-size="13" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">the maximum speed its own rule permits — while every measurement that goes into it is rising.</text>
<text x="48.0" y="116.0" font-size="11" fill="#8e887a" text-anchor="start" font-style="italic" font-weight="normal">Micrograms relative to 1 kg. Every point is transcribed from a BIPM document; every line is computed by governor.py.</text>
<polygon points="451.3,168.0 543.8,212.5 677.2,257.1 677.2,560.0 543.8,560.0 451.3,524.4" fill="#ece7da" opacity="0.55"/>
<text x="848.0" y="184.0" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">the shaded band is ± 20 µg, the assigned uncertainty:</text>
<text x="848.0" y="197.0" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">unchanged since 2021, and wider than everything that happens inside it</text>
<line x1="92" y1="328.3636363636364" x2="848" y2="328.3636363636364" stroke="#8e887a" stroke-width="1" stroke-dasharray="1 3"/>
<text x="82.0" y="332.4" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">1 kg</text>
<line x1="92" y1="239.27272727272728" x2="848" y2="239.27272727272728" stroke="#ece7da" stroke-width="1"/>
<text x="82.0" y="243.3" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">+10</text>
<line x1="92" y1="417.45454545454544" x2="848" y2="417.45454545454544" stroke="#ece7da" stroke-width="1"/>
<text x="82.0" y="421.5" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">-10</text>
<line x1="92" y1="506.54545454545456" x2="848" y2="506.54545454545456" stroke="#ece7da" stroke-width="1"/>
<text x="82.0" y="510.5" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">-20</text>
<text x="82.0" y="154.0" font-size="10" fill="#8e887a" text-anchor="end" font-style="normal" font-weight="normal">µg</text>
<line x1="92" y1="560" x2="848" y2="560" stroke="#8e887a" stroke-width="1"/>
<line x1="136.5" y1="560" x2="136.5" y2="565" stroke="#8e887a"/>
<text x="136.5" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2014</text>
<line x1="225.4" y1="560" x2="225.4" y2="565" stroke="#8e887a"/>
<text x="225.4" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2016</text>
<line x1="358.8" y1="560" x2="358.8" y2="565" stroke="#8e887a"/>
<text x="358.8" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2019</text>
<line x1="447.8" y1="560" x2="447.8" y2="565" stroke="#8e887a"/>
<text x="447.8" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2021</text>
<line x1="581.2" y1="560" x2="581.2" y2="565" stroke="#8e887a"/>
<text x="581.2" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2024</text>
<line x1="670.1" y1="560" x2="670.1" y2="565" stroke="#8e887a"/>
<text x="670.1" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2026</text>
<line x1="803.5" y1="560" x2="803.5" y2="565" stroke="#8e887a"/>
<text x="803.5" y="580.0" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">2029</text>
<polyline points="358.8,495.9 447.8,463.8 581.2,423.7" fill="none" stroke="#8a5a2b" stroke-width="2.2"/>
<circle cx="136.5" cy="328.4" r="4.5" fill="#fbfaf7" stroke="#8e887a" stroke-width="1.6" stroke-dasharray="2 2"/>
<text x="136.5" y="316.4" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">IPK, 2014</text>
<circle cx="225.4" cy="217.9" r="4.5" fill="#fbfaf7" stroke="#8e887a" stroke-width="1.6" stroke-dasharray="2 2"/>
<text x="225.4" y="205.9" font-size="10" fill="#8e887a" text-anchor="middle" font-style="normal" font-weight="normal">Pilot study, 2016</text>
<circle cx="358.8" cy="495.9" r="4.5" fill="#8a5a2b"/>
<text x="358.8" y="515.9" font-size="10" fill="#8a5a2b" text-anchor="middle" font-style="normal" font-weight="normal">K8.2019</text>
<circle cx="447.8" cy="463.8" r="4.5" fill="#8a5a2b"/>
<text x="447.8" y="483.8" font-size="10" fill="#8a5a2b" text-anchor="middle" font-style="normal" font-weight="normal">K8.2021</text>
<circle cx="581.2" cy="423.7" r="4.5" fill="#8a5a2b"/>
<text x="581.2" y="443.7" font-size="10" fill="#8a5a2b" text-anchor="middle" font-style="normal" font-weight="normal">K8.2024</text>
<text x="287.7" y="476.3" font-size="11" fill="#8a5a2b" text-anchor="start" font-style="normal" font-weight="bold">the measurements — rising</text>
<polyline points="451.3,347.4 543.8,392.5 677.2,461.1" fill="none" stroke="#a8a08e" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="451.3" cy="347.4" r="3.2" fill="#a8a08e"/>
<circle cx="543.8" cy="392.5" r="3.2" fill="#a8a08e"/>
<circle cx="677.2" cy="461.1" r="3.2" fill="#a8a08e"/>
<text x="686.2" y="465.1" font-size="11" fill="#6f6858" text-anchor="start" font-style="normal" font-weight="normal">−14.9  what the rule computed</text>
<polyline points="451.3,346.2 543.8,390.7 677.2,435.3" fill="none" stroke="#1c1f26" stroke-width="3"/>
<circle cx="451.3" cy="346.2" r="5" fill="#1c1f26"/>
<text x="451.3" y="332.2" font-size="12" fill="#1c1f26" text-anchor="middle" font-style="normal" font-weight="bold">-2</text>
<circle cx="543.8" cy="390.7" r="5" fill="#1c1f26"/>
<text x="543.8" y="376.7" font-size="12" fill="#1c1f26" text-anchor="middle" font-style="normal" font-weight="bold">-7</text>
<circle cx="677.2" cy="435.3" r="5" fill="#1c1f26"/>
<text x="677.2" y="421.3" font-size="12" fill="#1c1f26" text-anchor="middle" font-style="normal" font-weight="bold">-12</text>
<text x="686.2" y="439.3" font-size="11" fill="#1c1f26" text-anchor="start" font-style="normal" font-weight="bold">−12  what was published</text>
<text x="493.6" y="360.5" font-size="10" fill="#1c1f26" text-anchor="middle" font-style="italic" font-weight="normal">−5 µg</text>
<text x="606.5" y="405.0" font-size="10" fill="#1c1f26" text-anchor="middle" font-style="italic" font-weight="normal">−5 µg</text>
<line x1="677.2" y1="435.3" x2="677.2" y2="461.1" stroke="#1c1f26" stroke-width="1.4" stroke-dasharray="2 2"/>
<rect x="674.2" y="435.3" width="6" height="25.8" fill="#1c1f26" opacity="0.14"/>
<text x="667.2" y="452.2" font-size="10" fill="#1c1f26" text-anchor="end" font-style="italic" font-weight="normal">2.9 µg withheld</text>
<line x1="677.2" y1="554.0" x2="812.4" y2="554.0" stroke="#8e887a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="696.8" y="518.1" font-size="10" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">next: the window holds only measurements. The value</text>
<text x="696.8" y="533.3" font-size="10" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">leaving is −18.8, the lowest ever. The line turns up.</text>
<line x1="48" y1="576" x2="952" y2="576" stroke="#ece7da" stroke-width="1"/>
<text x="48.0" y="600.0" font-size="12" fill="#16181d" text-anchor="start" font-style="italic" font-weight="normal">“…changes in the Consensus Value between consecutive Key Comparisons will be reviewed and, if necessary, limited to ± 5 parts in 10⁹.”</text>
<text x="48.0" y="618.0" font-size="10" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">CCM detailed note on the dissemination process after the redefinition of the kilogram, approved 17 May 2019 — three days before the definition it governs took effect.</text>
<text x="48.0" y="640.0" font-size="11" fill="#8e887a" text-anchor="start" font-style="italic" font-weight="normal">“A Governor is a part of a machine by means of which the velocity of the machine is kept nearly uniform, notwithstanding variations in the driving-power or the resistance.”</text>
<text x="48.0" y="656.0" font-size="10" fill="#8e887a" text-anchor="start" font-style="normal" font-weight="normal">J. C. Maxwell, “On Governors”, Proceedings of the Royal Society 16 (1868), p. 270.</text>
</svg>
