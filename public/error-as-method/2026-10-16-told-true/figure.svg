<rect x="150" y="182" width="20" height="20" fill="none" stroke="#2f6b4f" stroke-width="1.5"/>
<text x="185" y="198" font-size="15" fill="#1c1e21">0 of 6</text>
<text x="300" y="90" font-size="14" fill="#a4471f">told a falsehood (a tidal harbour)</text>
