<text x="20" y="30" font-size="19" fill="#1c1e21">Told True: eighteen makers, one record, three sentences</text>
<text x="20" y="52" font-size="12.5" fill="#5d6067">Each square is one maker. Filled: yes. Empty: no.</text>
