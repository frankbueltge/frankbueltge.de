<text x="745" y="198" font-size="15" fill="#1c1e21">0 of 6</text>
<line x1="20" y1="238" x2="840" y2="238" stroke="#d6cfbf"/>
<text x="20" y="260" font-size="13" fill="#1c1e21">Before any maker ran, eight agents of the same kind read the told briefs without the picture (Orne's pre-inquiry).</text>
<text x="20" y="286" font-size="12.5" fill="#2f6b4f">true brief: 4 of 4 expect a work built on it as given;</text>
<text x="20" y="304" font-size="12.5" fill="#2f6b4f">0 of 4 expect a work about checking it.</text>
<text x="300" y="286" font-size="12.5" fill="#a4471f">false brief: 4 of 4 expect a work built on it as given;</text>
<text x="300" y="304" font-size="12.5" fill="#a4471f">0 of 4 expect a work about checking it.</text>
<text x="580" y="286" font-size="12.5" fill="#5d6067">Right about the truth,</text>
<text x="580" y="304" font-size="12.5" fill="#5d6067">wrong about the falsehood.</text>
<text x="20" y="342" font-size="11" fill="#5d6067">Record: CO2 at 31 m, NOAA tall tower, West Branch, Iowa, 15 Jul to 13 Sep 2019 (CC0). Codes: coder B (reports), coder D (pages only), coder Q (inquiry).</text>
