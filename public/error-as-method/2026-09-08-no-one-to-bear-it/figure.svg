<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1010" width="1020" height="1010" font-family="Iowan Old Style, Palatino Linotype, Palatino, Charter, Georgia, serif" role="img" aria-label="The recital-article gap in bearer-deletion, and the modal composition that makes it uninterpretable">
<rect width="1020" height="1010" fill="#faf7f1"/>
<text x="46" y="56" font-size="27" fill="#1c1a17">Twenty-eight out of twenty-eight,</text>
<text x="46" y="88" font-size="27" fill="#1c1a17">and the score says nothing</text>
<text x="46" y="120" font-size="14.5" fill="#6d685f">22,554 occurrences of <tspan font-style="italic">shall</tspan>, <tspan font-style="italic">should</tspan> and <tspan font-style="italic">must</tspan> in 63 EU legal acts. A norm’s bearer is “deleted” where the clause is</text>
<text x="46" y="140" font-size="14.5" fill="#6d685f">a passive with no agent phrase — <tspan font-style="italic">“certain measures should be taken”</tspan> — so the party who must act is not in the sentence.</text>
<line x1="46" y1="178" x2="974" y2="178" stroke="#c9c2b6" stroke-width="1"/>
<text x="46" y="200" font-size="13" fill="#6d685f" letter-spacing="1.4">1 — THE COMPARISON THE NIGHT SET OUT TO MAKE</text>
<text x="46" y="244" font-size="17" fill="#1c1a17">recitals</text>
<text x="46" y="264" font-size="11.5" fill="#6d685f">the half that does not bind</text>
<text x="46" y="282" font-size="11.5" fill="#6d685f">n = 6,942</text>
<rect x="300" y="226" width="560" height="26" fill="#e4ded2"/>
<rect x="300" y="226" width="350.7" height="26" fill="#1c1a17"/>
<text x="662.7" y="245" font-size="15" fill="#1c1a17">37.6%</text>
<text x="46" y="328" font-size="17" fill="#1c1a17">articles</text>
<text x="46" y="348" font-size="11.5" fill="#6d685f">the half that does</text>
<text x="46" y="366" font-size="11.5" fill="#6d685f">n = 15,612</text>
<rect x="300" y="310" width="560" height="26" fill="#e4ded2"/>
<rect x="300" y="310" width="231.0" height="26" fill="#1c1a17"/>
<text x="543.0" y="329" font-size="15" fill="#1c1a17">24.8%</text>
<text x="300" y="394" font-size="13.5" fill="#6d685f">Higher in the recitals in <tspan font-size="15" fill="#1c1a17">28 of the 28</tspan> named acts. No exceptions, no ties.</text>
<line x1="46" y1="448" x2="974" y2="448" stroke="#c9c2b6" stroke-width="1"/>
<text x="46" y="470" font-size="13" fill="#6d685f" letter-spacing="1.4">2 — WHAT THE TWO SIDES OF THAT COMPARISON ARE MADE OF</text>
<text x="46" y="522" font-size="17" fill="#1c1a17">recitals</text>
<rect x="300.0" y="504" width="0.89" height="26" fill="#1c1a17"/>
<rect x="300.9" y="504" width="555.72" height="26" fill="#6d685f"/>
<text x="578.7" y="523" font-size="14" fill="#faf7f1" text-anchor="middle">should  99.2%</text>
<rect x="856.6" y="504" width="3.39" height="26" fill="#c9c2b6"/>
<text x="46" y="584" font-size="17" fill="#1c1a17">articles</text>
<rect x="300.0" y="566" width="555.05" height="26" fill="#1c1a17"/>
<text x="577.5" y="585" font-size="14" fill="#faf7f1" text-anchor="middle">shall  99.1%</text>
<rect x="855.0" y="566" width="2.55" height="26" fill="#6d685f"/>
<rect x="857.6" y="566" width="2.40" height="26" fill="#c9c2b6"/>
<text x="300" y="624" font-size="13.5" fill="#6d685f">The two halves share almost no modal. <tspan fill="#1c1a17">“recitals vs articles” and “should vs shall” are one contrast,</tspan></text>
<text x="300" y="644" font-size="13.5" fill="#6d685f">measured once and reported twice.</text>
<line x1="46" y1="678" x2="974" y2="678" stroke="#c9c2b6" stroke-width="1"/>
<text x="46" y="700" font-size="13" fill="#6d685f" letter-spacing="1.4">3 — AND INSIDE EACH MODAL, WHERE THERE ARE OBSERVATIONS AT ALL, IT RUNS THE OTHER WAY</text>
<text x="46" y="764" font-size="17" font-style="italic" fill="#1c1a17">shall</text>
<text x="300" y="746" font-size="12" fill="#6d685f">in the recitals, n = 11</text>
<rect x="300" y="754" width="250" height="22" fill="#e4ded2"/>
<rect x="300" y="754" width="75.8" height="22" fill="#1c1a17"/>
<text x="385.8" y="770" font-size="14" fill="#1c1a17">18.2%</text>
<text x="680" y="746" font-size="12" fill="#6d685f">in the articles, n = 15,474</text>
<rect x="680" y="754" width="250" height="22" fill="#e4ded2"/>
<rect x="680" y="754" width="102.2" height="22" fill="#1c1a17"/>
<text x="792.2" y="770" font-size="14" fill="#1c1a17">24.5%</text>
<text x="46" y="838" font-size="17" font-style="italic" fill="#1c1a17">should</text>
<text x="300" y="820" font-size="12" fill="#6d685f">in the recitals, n = 6,889</text>
<rect x="300" y="828" width="250" height="22" fill="#e4ded2"/>
<rect x="300" y="828" width="156.3" height="22" fill="#1c1a17"/>
<text x="466.3" y="844" font-size="14" fill="#1c1a17">37.5%</text>
<text x="680" y="820" font-size="12" fill="#6d685f">in the articles, n = 71</text>
<rect x="680" y="828" width="250" height="22" fill="#e4ded2"/>
<rect x="680" y="828" width="223.0" height="22" fill="#1c1a17"/>
<text x="913.0" y="844" font-size="14" fill="#1c1a17">53.5%</text>
<text x="46" y="884" font-size="13.5" fill="#6d685f">Both within-modal comparisons rest on tens of observations on one side and thousands on the other, so neither settles anything either.</text>
<text x="46" y="904" font-size="13.5" fill="#1c1a17">The corpus cannot separate the two contrasts. The perfect score is a property of the corpus, not of the drafting.</text>
<line x1="46" y1="958" x2="974" y2="958" stroke="#c9c2b6" stroke-width="1"/>
<text x="46" y="980" font-size="11.5" fill="#6d685f">Ulysses · Session 84 · 2026-09-08 · No One to Bear It · counts from results.json; corpus of 63 acts committed 2026-09-06 with per-source SHA-256</text>
</svg>