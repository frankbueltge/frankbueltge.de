<text x="436" y="82" font-size="10" fill="#9a9488" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">4</text>
<line x1="504" y1="88" x2="504" y2="334" stroke="#e3ddd1" stroke-width="1"/>
<text x="504" y="82" font-size="10" fill="#9a9488" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">6</text>
<line x1="572" y1="88" x2="572" y2="334" stroke="#e3ddd1" stroke-width="1"/>
<text x="572" y="82" font-size="10" fill="#9a9488" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">8</text>
<line x1="640" y1="88" x2="640" y2="334" stroke="#e3ddd1" stroke-width="1"/>
<text x="640" y="82" font-size="10" fill="#9a9488" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">10</text>
<text x="286" y="117" font-size="12.5" fill="#2b2b2b" text-anchor="end">C · model collapse, the prohibited exit</text>
<rect x="300" y="96" width="340" height="34" fill="#5b6b78"/>
<text x="470.0" y="118" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">10</text>
<text x="652" y="117" font-size="11.5" fill="#5b6b78" font-style="italic">no wrong-result in it</text>
<text x="286" y="167" font-size="12.5" fill="#2b2b2b" text-anchor="end">B · glitch, error as medium</text>
<rect x="300" y="146" width="102" height="34" fill="#b5533a"/>
<text x="351.0" y="168" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">3</text>
<rect x="402" y="146" width="68" height="34" fill="#5b6b78"/>
<text x="436.0" y="168" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">2</text>
<text x="286" y="217" font-size="12.5" fill="#2b2b2b" text-anchor="end">A · what error is</text>
<rect x="300" y="196" width="136" height="34" fill="#b5533a"/>
<text x="368.0" y="218" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">4</text>
<rect x="436" y="196" width="34" height="34" fill="#5b6b78"/>
<text x="453.0" y="218" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">1</text>
<text x="286" y="267" font-size="12.5" fill="#2b2b2b" text-anchor="end">I · institutional norms</text>
<rect x="300" y="246" width="102" height="34" fill="#b5533a"/>
<text x="351.0" y="268" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">3</text>
<rect x="402" y="246" width="34" height="34" fill="#5b6b78"/>
<text x="419.0" y="268" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">1</text>
<text x="286" y="317" font-size="12.5" fill="#2b2b2b" text-anchor="end">S · self-audit</text>
<rect x="300" y="296" width="68" height="34" fill="#b5533a"/>
<text x="334.0" y="318" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">2</text>
<rect x="368" y="296" width="34" height="34" fill="#5b6b78"/>
<text x="385.0" y="318" font-size="13" fill="#f7f4ee" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Courier New', monospace">1</text>
<rect x="300" y="356" width="16" height="16" fill="#b5533a"/>
<text x="322" y="369" font-size="12" fill="#2b2b2b">wrong-result (error: a present, wrong value) — 12</text>
<rect x="300" y="380" width="16" height="16" fill="#5b6b78"/>
<text x="322" y="393" font-size="12" fill="#2b2b2b">non-arrival (failure: an expected value, absent) — 15</text>
<text x="40" y="440" font-size="10.5" fill="#9a9488">22 further works are meta — the object is a norm, a self-audit, or the epistemic thing itself, so they are not drawn.</text>
<text x="40" y="454" font-size="10.5" fill="#9a9488">The sign is observer-relative: 7 rows are boundary cases (Ariane 501 is a wrong value that became a halt); flip all 7 and Track C stays 1 : 9.</text>
</svg>
