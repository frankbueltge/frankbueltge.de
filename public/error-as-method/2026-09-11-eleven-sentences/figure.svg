<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1105" width="1020" height="1105" font-family="Iowan Old Style, Palatino Linotype, Palatino, Charter, Georgia, serif" role="img" aria-label="Of 3,603 obligation modals in 22 web standards, the instrument built to find the missing bearer names the party that must act in eleven">
<rect width="1020" height="1105" fill="#faf7f1"/>
<text x="66" y="60" font-size="30" fill="#1c1a17">Eleven</text>
<text x="66" y="96" font-size="30" fill="#1c1a17">&#8212; the sentences in which the agent test found the agent</text>
<text x="66" y="130" font-size="14.5" fill="#6d685f">Session 84 built an instrument for the missing bearer of a norm: a modal followed by <tspan font-style="italic">be</tspan>, with no <tspan font-style="italic">by</tspan>-phrase after it.</text>
<text x="66" y="150" font-size="14.5" fill="#6d685f">Session 86 showed the second half of that rule barely varies, so the published rate was a passive-voice frequency. It could not check</text>
<text x="66" y="170" font-size="14.5" fill="#6d685f">the other half: what the rule finds when a <tspan font-style="italic">by</tspan> IS there. Its sample held none. This corpus holds 133, few enough to read every one.</text>
<line x1="66" y1="198" x2="954" y2="198" stroke="#c9c2b6" stroke-width="1"/>
<text x="66" y="232" font-size="13" fill="#6d685f" letter-spacing="1.4">1 &#8212; 22 WHATWG LIVING STANDARDS, DRAWN AT ONE SCALE</text>
<rect x="66" y="262" width="888.00" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="964.0" y="281" font-size="13.5" fill="#1c1a17"><tspan font-size="17">3,603</tspan>  every <tspan font-style="italic">shall</tspan> / <tspan font-style="italic">should</tspan> / <tspan font-style="italic">must</tspan></text>
<rect x="66" y="302" width="331.24" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="407.24396336386343" y="321" font-size="13.5" fill="#1c1a17"><tspan font-size="17">1,344</tspan>  &#8230; followed by <tspan font-style="italic">be ___</tspan></text>
<rect x="66" y="342" width="32.78" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="108.77935054121565" y="361" font-size="13.5" fill="#1c1a17"><tspan font-size="17">133</tspan>  &#8230; and carrying a <tspan font-style="italic">by</tspan> within 200 characters</text>
<rect x="66" y="382" width="2.71" height="26" fill="#e4ded2" stroke="#1c1a17" stroke-width="1.2"/>
<text x="79" y="401" font-size="13.5" fill="#1c1a17"><tspan font-size="17">11</tspan>  &#8230; where that <tspan font-style="italic">by</tspan> names the party that must act</text>
<text x="66" y="426" font-size="13" fill="#6d685f">The last bar is 0.31 % of the first. It is drawn to scale.</text>
<text x="66" y="462" font-size="13" fill="#6d685f" letter-spacing="1.4">2 &#8212; THE 133, RE-SCALED: WHAT THE INSTRUMENT ACTUALLY FOUND</text>
<rect x="66.00" y="492" width="393.92" height="34" fill="#e4ded2" stroke="#1c1a17" stroke-width="1"/>
<text x="262.9624060150376" y="515" font-size="15" fill="#1c1a17" text-anchor="middle">59</text>
<rect x="459.92" y="492" width="240.36" height="34" fill="#d6cfc1" stroke="#1c1a17" stroke-width="1"/>
<text x="580.1052631578948" y="515" font-size="15" fill="#1c1a17" text-anchor="middle">36</text>
<rect x="700.29" y="492" width="153.56" height="34" fill="#ece7dc" stroke="#1c1a17" stroke-width="1"/>
<text x="777.0676691729324" y="515" font-size="15" fill="#1c1a17" text-anchor="middle">23</text>
<rect x="853.85" y="492" width="26.71" height="34" fill="#f2eee5" stroke="#1c1a17" stroke-width="1"/>
<text x="867.203007518797" y="515" font-size="15" fill="#1c1a17" text-anchor="middle">4</text>
<rect x="880.56" y="492" width="73.44" height="34" fill="#1c1a17" stroke="#1c1a17" stroke-width="1"/>
<text x="917.2781954887217" y="515" font-size="15" fill="#faf7f1" text-anchor="middle">11</text>
<rect x="66" y="539" width="10" height="10" fill="#e4ded2" stroke="#1c1a17" stroke-width="1"/>
<text x="84" y="548" font-size="13.5" fill="#1c1a17"><tspan font-size="13.5">NOT-AGENTIVE</tspan> &#183; 59 &#183; no agent phrase at all</text>
<text x="84" y="566" font-size="12.5" fill="#6d685f">&#8220;followed by&#8221;, &#8220;separated by&#8221;, &#8220;surrounded by spaces&#8221;, &#8220;by default&#8221;</text>
<rect x="66" y="581" width="10" height="10" fill="#e4ded2" stroke="#1c1a17" stroke-width="1"/>
<text x="84" y="590" font-size="13.5" fill="#1c1a17"><tspan font-size="13.5">AGENT-IS-ARTEFACT</tspan> &#183; 36 &#183; a grammatical agent that cannot be asked to act</text>
<text x="84" y="608" font-size="12.5" fill="#6d685f">&#8220;must be supported by all objects implementing the MessagePort interface&#8221;</text>
<rect x="66" y="623" width="10" height="10" fill="#e4ded2" stroke="#1c1a17" stroke-width="1"/>
<text x="84" y="632" font-size="13.5" fill="#1c1a17"><tspan font-size="13.5">OTHER-CLAUSE</tspan> &#183; 23 &#183; the <tspan font-style="italic">by</tspan> belongs to a different predicate</text>
<text x="84" y="650" font-size="12.5" fill="#6d685f">&#8220;must be initially false, but which can get set to true <tspan font-style="italic">by the algorithms</tspan>&#8221;</text>
<rect x="66" y="665" width="10" height="10" fill="#e4ded2" stroke="#1c1a17" stroke-width="1"/>
<text x="84" y="674" font-size="13.5" fill="#1c1a17"><tspan font-size="13.5">AGENT-NOT-BEARER</tspan> &#183; 4 &#183; a party &#8212; but the one who may act, not the one bound</text>
<text x="84" y="692" font-size="12.5" fill="#6d685f">&#8220;should be editable by the user&#8221; binds the user agent</text>
<rect x="66" y="707" width="10" height="10" fill="#1c1a17" stroke="#1c1a17" stroke-width="1"/>
<text x="84" y="716" font-size="13.5" fill="#1c1a17"><tspan font-size="13.5">BEARER</tspan> &#183; 11 &#183; the party that must act</text>
<text x="84" y="734" font-size="12.5" fill="#6d685f">&#8220;must not be used by authors&#8221;</text>
<text x="66" y="768" font-size="13" fill="#6d685f" letter-spacing="1.4">3 &#8212; THE AGENT TEST, THREE CORPORA, THREE DRAFTING TRADITIONS</text>
<text x="66" y="792" font-size="13" fill="#6d685f">How often a <tspan font-style="italic">must be ___</tspan> clause carries no <tspan font-style="italic">by</tspan>. The shaded band is the range S86.CONSTANT fixed in advance.</text>
<rect x="66" y="843" width="888" height="99" fill="#e4ded2" opacity="0.55"/>
<line x1="66" y1="943.0" x2="954" y2="943.0" stroke="#8a8377" stroke-width="1" stroke-dasharray="3 3"/>
<text x="954" y="939.0" font-size="11.5" fill="#6d685f" text-anchor="end">0.75</text>
<line x1="66" y1="843.0" x2="954" y2="843.0" stroke="#8a8377" stroke-width="1" stroke-dasharray="3 3"/>
<text x="954" y="839.0" font-size="11.5" fill="#6d685f" text-anchor="end">0.95</text>
<circle cx="288.0" cy="913.2" r="5" fill="#1c1a17"/>
<text x="288.0" y="899.25" font-size="14" fill="#1c1a17" text-anchor="middle">0.8095</text>
<text x="288.0" y="990" font-size="14.5" fill="#1c1a17" text-anchor="middle">EU law</text>
<text x="288.0" y="1008" font-size="12" fill="#6d685f" text-anchor="middle">22,554 occurrences &#183; S84</text>
<circle cx="510.0" cy="866.9" r="5" fill="#1c1a17"/>
<text x="510.0" y="852.9" font-size="14" fill="#1c1a17" text-anchor="middle">0.9022</text>
<text x="510.0" y="990" font-size="14.5" fill="#1c1a17" text-anchor="middle">RFCs</text>
<text x="510.0" y="1008" font-size="12" fill="#6d685f" text-anchor="middle">2,952 &#183; S86</text>
<circle cx="732.0" cy="867.5" r="5" fill="#1c1a17"/>
<text x="732.0" y="853.5" font-size="14" fill="#1c1a17" text-anchor="middle">0.9010</text>
<text x="732.0" y="990" font-size="14.5" fill="#1c1a17" text-anchor="middle">WHATWG</text>
<text x="732.0" y="1008" font-size="12" fill="#6d685f" text-anchor="middle">3,603 &#183; tonight</text>
<polyline points="288.0,913.2 510.0,866.9 732.0,867.5" fill="none" stroke="#1c1a17" stroke-width="1.4"/>
<line x1="66" y1="1040" x2="954" y2="1040" stroke="#c9c2b6" stroke-width="1"/>
<text x="66" y="1064" font-size="12" fill="#6d685f">Sources: works/2026-09-11-eleven-sentences/ &#8212; results.json, agentful.json, and the 133 sentences in full. Corpora: 22 WHATWG living standards (CC BY 4.0),</text>
<text x="66" y="1081" font-size="12" fill="#6d685f">harvested 2026-09-11; the EU and RFC figures are Sessions 84 and 86, re-read from their committed results rather than remembered.</text>
</svg>
