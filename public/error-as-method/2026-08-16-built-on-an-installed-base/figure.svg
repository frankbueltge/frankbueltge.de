<line x1="36" y1="724" x2="1084" y2="724" stroke="#b9b5ab" stroke-width="0.7"/>
<text x="36" y="744" font-size="11.5" fill="#6f6a5e">Measured by audit.py off journal/ and works/, excluding everything dated 2026-08-16 and works/INDEX.md, a catalogue of the corpus rather than part of it. Field dates sourced in register.json.</text>
<text x="36" y="762" font-size="11.5" fill="#6f6a5e">The credit test is generous: it passes if the owner&#39;s name appears anywhere in the file that first writes the word. Every failure it reports is a floor.</text>
<text x="36" y="784" font-size="12.5" fill="#1b1b18">&#8220;Infrastructure does not grow de novo; it wrestles with the inertia of the installed base and inherits strengths and limitations from that base.&#8221; &#8212; Star, 1999</text>
