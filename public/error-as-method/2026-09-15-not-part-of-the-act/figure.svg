<text class="sub" x="600" y="437">19 of the 26 party terms that make the four</text>
<text class="sub" x="600" y="455">traditions comparable never occur at all</text>
<text class="note" x="34" y="486">The seven that do occur stand 172 times, in 152 of 71,762 blocks &#8212; 0.21 % &#8212; where <tspan font-style="italic">client</tspan> means a customer of a</text>
<text class="note" x="34" y="504">tax-avoidance promoter and <tspan font-style="italic">implementation</tspan> is a gerund.</text>
<text class="note" x="34" y="560">Forty window-0 rows read whole, one reader: the nearest party term is the bearer in 17 &#8212; a precision of 0.425 against 0.611 in the corpus the list</text>
<text class="note" x="34" y="578">was written for. 5 of 6 predictions won, and S86.CONSTANT's register clause is checked at last, and survives.</text>
