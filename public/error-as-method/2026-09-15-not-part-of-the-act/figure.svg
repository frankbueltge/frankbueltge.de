<text class="num" x="915.3" y="272.0" fill="#22201c" text-anchor="middle">50.91</text>
<text class="ax" x="210.6" y="320.0" text-anchor="start">base 26</text>
<text class="ax" x="683.7" y="320.0" text-anchor="middle">+ 15 UK terms &#8212; the row's list</text>
<text class="ax" x="923.3" y="320.0" text-anchor="end">+ person</text>
<text class="ax" x="210.6" y="337.0" text-anchor="start">median 5,821 words &#8212; outside 60&#8211;500, which is how this list falsifies the row</text>
<text class="note" x="34" y="404">The interval is 50.15 points. The whole falsification band is 20 points wide. Two of these three lists falsify the row; one saves it.</text>
<line class="grid" x1="34" y1="386" x2="986" y2="386"/>
<text class="hd" x="34" y="412">Why: the shared vocabulary does not reach this tradition</text>
