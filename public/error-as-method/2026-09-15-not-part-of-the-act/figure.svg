<rect class="bg" x="0" y="0" width="1020" height="600"/>
<text class="hd" x="34" y="40">The fourth corpus is not a point</text>
<text class="sub" x="34" y="62">Reach at word window 36: the share of binding agentless obligations with a term for a party within 36 words behind them.</text>
<text class="sub" x="34" y="80">Shaded: where S89.WORDUNIT's <tspan font-style="italic">first</tspan> criterion accepts &#8212; within 20 points of a prior value. Its second is the median, which is what the base list fails.</text>
<rect class="band" x="208.0" y="88" width="601.4" height="248"/>
