<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="100%" role="img" aria-label="Three drafting traditions enter a falsifier as single values at word window 36. The fourth enters as an interval from 0.76 to 50.91 per cent, wider than the falsifier's whole acceptance region, because three party-term lists declared in advance disagree by 50 points.">
