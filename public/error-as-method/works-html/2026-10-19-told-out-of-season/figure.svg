<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia, serif">
<rect width="760" height="300" fill="#f4f1ea"/>
<text x="20" y="30" font-size="17" fill="#1d1c1a">One picture, eighteen makers: what each said had been measured</text>
<text x="20" y="88" font-size="14" fill="#1d1c1a">told 15 Jan – 16 Mar</text>
<rect x="200" y="60" width="44" height="44" rx="3" fill="#a8461c"><title>m01 Sixty-One Fires</title></rect>
<rect x="252" y="60" width="44" height="44" rx="3" fill="#a8461c"><title>m07 Sixty-one Nights</title></rect>
<rect x="304" y="60" width="44" height="44" rx="3" fill="#a8461c"><title>m10 Each Night, Less</title></rect>
<rect x="356" y="60" width="44" height="44" rx="3" fill="#a8461c"><title>m13 Every Day, Until</title></rect>
<rect x="408" y="60" width="44" height="44" rx="3" fill="#a8461c"><title>m14 Sixty-One Beats</title></rect>
<rect x="460" y="60" width="44" height="44" rx="3" fill="#2f6a8c"><title>m09 Sixty-one Strokes</title></rect>
<text x="20" y="150" font-size="14" fill="#1d1c1a">told 15 Oct – 14 Dec</text>
<rect x="200" y="122" width="44" height="44" rx="3" fill="#a8461c"><title>m04 Wound Down</title></rect>
<rect x="252" y="122" width="44" height="44" rx="3" fill="#b8892a"><title>m06 Once Around</title></rect>
<rect x="304" y="122" width="44" height="44" rx="3" fill="#b8892a"><title>m08 Sixty-One Measures</title></rect>
<rect x="356" y="122" width="44" height="44" rx="3" fill="#b8892a"><title>m12 Sixty-one Noons</title></rect>
<rect x="408" y="122" width="44" height="44" rx="3" fill="#b8892a"><title>m15 Sixty-one Breaths</title></rect>
<rect x="460" y="122" width="44" height="44" rx="3" fill="#b8892a"><title>m16 Sixty-One Wicks</title></rect>
<text x="20" y="212" font-size="14" fill="#1d1c1a">told nothing</text>
<rect x="200" y="184" width="44" height="44" rx="3" fill="#8a867d"><title>m03 Twenty-Three and a Half</title></rect>
<rect x="252" y="184" width="44" height="44" rx="3" fill="#2f6a8c"><title>m02 Sixty-One Pulses</title></rect>
<rect x="304" y="184" width="44" height="44" rx="3" fill="#2f6a8c"><title>m05 Sixty-One Falls</title></rect>
<rect x="356" y="184" width="44" height="44" rx="3" fill="#2f6a8c"><title>m11 Run-out Groove</title></rect>
<rect x="408" y="184" width="44" height="44" rx="3" fill="#2f6a8c"><title>m17 Run-out Groove</title></rect>
<rect x="460" y="184" width="44" height="44" rx="3" fill="#2f6a8c"><title>m18 Sixty-One Spans</title></rect>
<rect x="20" y="262" width="14" height="14" rx="2" fill="#2f6a8c"/><text x="40" y="274" font-size="12" fill="#6b675f">a melt-fed stream (true)</text>
<rect x="205" y="262" width="14" height="14" rx="2" fill="#a8461c"/><text x="225" y="274" font-size="12" fill="#6b675f">a store charged on a schedule</text>
<rect x="390" y="262" width="14" height="14" rx="2" fill="#b8892a"/><text x="410" y="274" font-size="12" fill="#6b675f">a sun-driven temperature</text>
<rect x="575" y="262" width="14" height="14" rx="2" fill="#8a867d"/><text x="595" y="274" font-size="12" fill="#6b675f">something else</text>
</svg>