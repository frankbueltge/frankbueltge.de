const L = 80, R = 1020, TOP = 90, BOT = 640;      // drawing field
const YMIN = 4, YMAX = 86;                         // source pixel rows (top = highest value)
const sy = y => TOP + (y - YMIN) / (YMAX - YMIN) * (BOT - TOP);
const pitch = (R - L) / 61, bw = 9;
const $ = id => document.getElementById(id);
const FLOOR = sy(YMAX);

// ground line
el("line", {x1: L - 10, x2: R + 10, y1: FLOOR + 6, y2: FLOOR + 6, stroke: "#2a2d3a", "stroke-width": 1}, $("floor"));

DAYS.forEach((d, i) => {
  const cx = L + pitch * (i + 0.5), x = cx - bw / 2;
  const top = sy(d.lo), bot = sy(d.hi);
  // what stayed: hairline from the day's lowest point to the floor
  el("line", {x1: cx, x2: cx, y1: bot + 2, y2: FLOOR + 6, stroke: "#2f3242", "stroke-width": 1}, $("floor"));
  // the day's span, refilled at top and drawn down
  const h = Math.max(2, bot - top);
  el("rect", {x, y: top, width: bw, height: h, rx: 1.5, fill: "url(#g)"}, $("bars"));
  el("rect", {x: x - 1, y: top, width: bw + 2, height: Math.min(h, 60), fill: "#f6a35a"}, $("glowL"));
  // the measured hours, as they lie within the day
  d.p.forEach(([f, y]) => {
    el("circle", {cx: (x + 0.5 + f * (bw - 1)).toFixed(2), cy: sy(y).toFixed(2), r: 1.0, fill: "#fff4dc", opacity: 0.7}, $("dots"));
  });
});

// sparse calendar
const lab = $("lab");
const mark = (i, s) => {
  const cx = L + pitch * (i + 0.5);
  el("line", {x1: cx, x2: cx, y1: FLOOR + 12, y2: FLOOR + 20, stroke: "#6b6a72", "stroke-width": 1}, lab);
  const t = el("text", {x: cx, y: FLOOR + 38, "text-anchor": "middle", "font-size": 12, "letter-spacing": "0.08em", fill: "#8a8790"}, lab);
  t.textContent = s;
};
mark(0, "15 January"); mark(17, "1 February"); mark(45, "1 March"); mark(60, "16 March");

const title = el("text", {x: L, y: 728, "font-size": 22, "letter-spacing": "0.02em"}, lab);
title.textContent = "Each Night, Less";
const sub = el("text", {x: L, y: 752, "font-size": 12.5, fill: "#8a8790", "letter-spacing": "0.04em"}, lab);
sub.textContent = "one bar per day, from its highest hour to its lowest · 1,464 hourly readings, 15 January – 16 March 2025";
</script>
</body>
</html>
