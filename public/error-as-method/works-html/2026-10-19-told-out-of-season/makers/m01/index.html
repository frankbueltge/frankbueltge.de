const cv=document.getElementById('c'),g=cv.getContext('2d');
const S=2;g.scale(S,S);
const W=1100,H=800,cx=600,cy=392;
g.fillStyle='#0d0b0a';g.fillRect(0,0,W,H);
// ember colour ramp: ash -> deep red -> orange -> pale gold
const stops=[[0,[38,30,27]],[0.12,[70,34,26]],[0.3,[128,38,22]],[0.5,[196,72,24]],[0.7,[234,136,44]],[0.88,[248,200,120]],[1,[255,240,205]]];
function col(t){t=Math.max(0,Math.min(1,t));for(let i=1;i<stops.length;i++){if(t<=stops[i][0]){const[a,ca]=stops[i-1],[b,cb]=stops[i];const f=(t-a)/(b-a);return`rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*f)).join(',')})`;}}return'rgb(255,240,205)';}
const N=V.length,DAYS=N/24,R0=372,R1=34;
const pitch=(R0-R1)/DAYS, band=pitch*0.82;
// the daily rise falls near hour 22 of the record: put it at twelve o'clock
const PH=22;
const ang=h=>-Math.PI/2+((h-PH)/24)*2*Math.PI;
// soft glow pass, then crisp pass
for(const pass of [0,1]){
  for(let h=0;h<N;h++){
    const a0=ang(h),a1=ang(h+1)+0.004;
    const r=R0-(h/24)*pitch, r2=R0-((h+1)/24)*pitch;
    const t=V[h]/100;
    g.beginPath();
    const steps=4;
    for(let k=0;k<=steps;k++){const f=k/steps,a=a0+(a1-a0)*f,rr=r+(r2-r)*f;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}
    for(let k=steps;k>=0;k--){const f=k/steps,a=a0+(a1-a0)*f,rr=r+(r2-r)*f-band;g.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}
    g.closePath();
    if(pass===0){
      if(t<0.45)continue;
      g.save();g.shadowColor=col(t);g.shadowBlur=14*t;g.fillStyle=col(t);g.globalAlpha=0.35;g.fill();g.restore();
    } else {g.fillStyle=col(Math.pow(t,0.9));g.fill();}
  }
}
