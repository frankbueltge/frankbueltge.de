<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wound Down</title>
<style>
  :root { --paper: #f3efe6; --ink: #1d1b18; --faint: #8a8378; }
  html, body { margin: 0; padding: 0; background: #f3efe6; }
  body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  canvas { display: block; width: 1100px; height: 800px; max-width: 100vw; height: auto; aspect-ratio: 1100 / 800; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="800" aria-label="Sixty-one days of an hourly record laid out as a calendar, one day per cell. For six weeks each day shows a steep rise and a slow fall. From 27 November the swings stop and only small ripples remain."></canvas>
<script>
// Ink from the source image: one string per pixel column (x = 2..297), 90 rows, darkness 0-9.
const RAW = "__DATA__";
const COLS = RAW.split("|").map(s => Array.from(s, ch => +ch));
const NC = COLS.length;             // 296 source columns carry the record
const DAYS = 61;
const K = NC / DAYS;                // ~4.85 source columns per day (about 4.9 hours each)
const YTOP = 4, YBOT = 86;          // vertical band that holds ink

const W = 1100, H = 800;
const cv = document.getElementById("c");
const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
cv.width = W * dpr; cv.height = H * dpr;
const g = cv.getContext("2d");
g.scale(dpr, dpr);

const PAPER = "#f3efe6", INK = "29,27,24", FAINT = "#8a8378", CELL = "#ebe6da", RULE = "#d9d2c3";
g.fillStyle = PAPER; g.fillRect(0, 0, W, H);

// --- title
g.fillStyle = "#1d1b18";
g.font = "600 26px Georgia, 'Times New Roman', serif";
g.textBaseline = "alphabetic";
g.fillText("Wound Down", 60, 52);
g.font = "italic 14px Georgia, 'Times New Roman', serif";
g.fillStyle = FAINT;
g.fillText("15 October – 14 December 2025 · one cell per day, drawn from the record's own ink", 214, 52);

// --- calendar grid: weeks start Monday; 15 Oct 2025 is a Wednesday
const GX = 60, GY = 92, GW = 980, GAPX = 8, GAPY = 7;
const CW = (GW - GAPX * 6) / 7;
const CH = 62;
const OFFSET = 2;

g.font = "11px Georgia, serif";
g.fillStyle = FAINT;
["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach((d, i) => g.fillText(d, GX + i * (CW + GAPX), GY - 8));

const start = new Date(Date.UTC(2025, 9, 15));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function drawSlice(a, b, x0, y0, w, h, alphaScale, dashFrac) {
  // draw source columns overlapping [a,b) into rect (x0,y0,w,h)
  const sy = h / (YBOT - YTOP);
  for (let c = Math.floor(a); c < Math.ceil(b); c++) {
    if (c < 0 || c >= NC) continue;
    const lo = Math.max(a, c), hi = Math.min(b, c + 1);
    if (hi <= lo) continue;
    const px0 = x0 + (lo - a) / (b - a) * w, px1 = x0 + (hi - a) / (b - a) * w;
    const pw = (px1 - px0);
    const inset = pw * (1 - dashFrac) / 2;
    const col = COLS[c];
    for (let y = YTOP; y < YBOT; y++) {
      const q = col[y];
      if (!q) continue;
      g.fillStyle = `rgba(${INK},${(q / 9) * alphaScale})`;
      g.fillRect(px0 + inset, y0 + (y - YTOP) * sy, Math.max(0.6, pw - 2 * inset), Math.max(0.9, sy * 1.05));
    }
  }
}

for (let d = 0; d < DAYS; d++) {
  const idx = d + OFFSET;
  const r = Math.floor(idx / 7), cI = idx % 7;
  const x = GX + cI * (CW + GAPX), y = GY + r * (CH + GAPY);
  g.fillStyle = CELL; g.fillRect(x, y, CW, CH);
  // midnight rules at cell edges are implicit; a faint hairline marks noon
  g.fillStyle = RULE; g.fillRect(x + CW / 2, y + 4, 0.6, CH - 8);
  drawSlice(d * K, (d + 1) * K, x + 3, y + 2, CW - 6, CH - 4, 0.95, 0.78);
  const dt = new Date(start.getTime() + d * 86400000);
  const dn = dt.getUTCDate();
  g.font = "10px Georgia, serif";
  g.fillStyle = FAINT;
  const label = (dn === 1 || d === 0) ? `${dn} ${MONTHS[dt.getUTCMonth()]}` : `${dn}`;
  g.textAlign = "right";
  g.fillText(label, x + CW - 4, y + CH - 4);
  g.textAlign = "left";
}

// --- the whole record, undivided, along the foot
const SX = 60, SY = 724, SW = 980, SH = 46;
g.fillStyle = "#e9e4d8"; g.fillRect(SX, SY - 4, SW, SH + 8);
// week ticks (Mondays) on the strip
for (let d = 0; d <= DAYS; d++) {
  const dow = (d + OFFSET) % 7;
  if (dow === 0) { g.fillStyle = RULE; g.fillRect(SX + d / DAYS * SW, SY - 4, 0.8, SH + 8); }
}
drawSlice(0, NC, SX, SY, SW, SH, 1.0, 0.85);
g.font = "italic 11px Georgia, serif";
g.fillStyle = FAINT;
g.fillText("the same sixty-one days, unbroken", SX, SY + SH + 22);
g.textAlign = "right";
g.fillText("each stripe in a cell is one pixel column of the source: about five hours", SX + SW, SY + SH + 22);
g.textAlign = "left";
</script>
</body>
</html>
