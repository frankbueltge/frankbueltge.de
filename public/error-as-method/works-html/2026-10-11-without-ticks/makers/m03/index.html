<html lang="en">
<head>

<title>The Week Remains</title>
<style>
  html,body{margin:0;height:100%;background:#efebe2;}
  body{display:grid;place-items:center;min-height:100vh;}
  canvas{display:block;width:1100px;height:800px;}
</style>

<body>
<canvas id="c" width="1100" height="800" aria-label="Fifteen years of daily US births, 2000 to 2014, with time removed: every day slid left along its own row of birth count, coloured by year. Two masses remain, weekdays and weekends, with a near-empty gap between them."></canvas>
<script>
// Rows of the source picture, top (16,079 births) to bottom (5,729). One row = one pixel row of
// the original plot = about 28 births. Each entry: days per year 2000..2014 in base 36, recovered
// from the dots of births.png.
var LO=53;
var ROWS="0000000001,,,,,,,,,,,,,,,000000001,,00000001,,00000001,,,00000011,,0000001,000000001,,,,,,00000012,,00000001,,0000001,,0000001,00000021,000000111,00000013,00000001,0000001101,0000001,0000001,00000005,000000221,000001,000000102,00010022,0000010110001,00000101,00000002,0000014201,0000011211,000010131,00002112,000000422,000000121,00020023,000111321001,000001101,0000002331,0000002212,0000002111,00101122401,011000322111,002100313201,000115251,01000134211,0001005113001,0001104111,0200122202,0011013524,1012034353001,00102233202,001001154411,1112213634,1000245222101,210510353100001,1003044602001,10201532401,1102152461101,2101132401001,0112131550111,2011121562001,111004142210221,213230234423102,11411223631,122261443302012,212223353601011,22062317652021,232302384102002,220552276101001,00456444422322,02237565b444024,1032343545025,431244344222011,14144520b501241,11524358382162,211068326442001,211456554713142,444383433415033,150326268042424,452442336443111,324144723643023,532258522541442,551484504722013,323624316231342,942227415573212,45146252246511,342575321460421,64057630282111,426333212434322,332241408482442,255455302273312,812225322465224,245162441521285,814451211576322,236337021563324,342244121446213,745854100644735,489414210443135,652772102273312,646474004452432,56a334033214546,745713213593542,673420010253656,328427110355358,4b8132242247231,462462000141335,744122110354452,284462114246643,267133222131434,452452115144544,154442121356224,258230010245627,226420212452335,314111001116144,444212010347554,321122200133365,403110110345584,011312200122335,212401200133675,320210001325825,131333100146467,202400100124956,202201100136256,201100000136375,201110100035328,200101101143544,302011000034554,310041010314535,102123110003147,012021010103441,021110111421323,111111000012212,161111000012243,232300100111222,131010001111242,321000001003152,121010000022201,127010000000122,012001000021121,210210100004231,20120010000033,02200000001103,124100000000231,211100000000312,31100000010011,21100000000013,11000000000011,10001000000211,001000000010411,0111000000101,000000000000001,100011000012001,100100000002001,000001110001,000001,0101100000001,000100001000201,00000000010002,0000000000011,011,0110000010001,01000000000002,001000000000101,1,,00000000000101,001,0001000000001,,000001,0100000001001,10001,,,01,00000001,00000000000001,0001,1,000000000000001,,,,011,,000001,,,00001,,,,000000000001,,00000001,,,1,000000000001,10000011,1,00000011001,00000001,,0001,1100002,121,01000002,110101001,0100001,0001002,10100011,200001002,0000002,21121,10001001,21210011,200100210000001,131100100000101,1211100111,020100113,100002030000011,1101000030001,3120101,211001021001,30300111100011,110031000000001,1010010101001,0110012031001,20021102201,201231010200201,221001001,102331210100113,22022211300001,230111111101011,342012131100023,04012032202112,240000250200021,100423333,114222202011111,3314020311011,011122101100203,2222623234012,112141101101011,012212111413,40512210300201,0124250200432,100321002110012,223111112221002,104200204220021,100010333321111,310101110421101,01114220130113,211112321010233,102312010311003,141024321010212,013000301100021,100402110321113,301100111300123,110120200220313,640011121032003,002000200113031,120101001212122,111101010033204,220000023140311,103001220131001,512411242112212,203100022122321,231111212055341,21024101023144,122113222123411,331230222023031,011032011002133,43022320011021,040330142101032,0143200022014,122202130103122,123131137103434,12222314320223,013221443210102,021381130111312,14104230122131,034533102115022,114301111410012,02223510221112,004121412012202,010405122131313,002013111332122,00111220130103,001121203201123,001113302330224,010002010424112,020103012551112,000002001000314,000101001531012,000000302143222,001000000312022,00101000000011,000001000113021,00000010021332,00000000004111,100010000033111,000000000012,000001010041521,000000000036131,00000100020322,0000000000212,000000000020011,0010000000001,000100000000121,10000010001031,0000000000011,,00000001000011,01000000000002,000000000001,0000000000021,,0000000000001,000000001,,0000001,,,0000000000001,,00001,,000001,,00000000011,,,,,,,,,,,,,,,000000000001".split(",");
var W=1100,H=800,dpr=Math.max(1,window.devicePixelRatio||1);
var cv=document.getElementById("c");cv.width=W*dpr;cv.height=H*dpr;
var g=cv.getContext("2d");g.scale(dpr,dpr);
var PAPER="#efebe2",INK="#2b2925",MUTED="#8a857a";
g.fillStyle=PAPER;g.fillRect(0,0,W,H);

var stops=[[0,[31,42,85]],[4,[42,111,151]],[7,[86,160,132]],[10,[214,162,58]],[14,[168,50,45]]];
function col(y){for(var i=0;i<stops.length-1;i++){var a=stops[i],b=stops[i+1];if(y<=b[0]){var t=(y-a[0])/(b[0]-a[0]);
  return "rgb("+a[1].map(function(v,k){return Math.round(v+(b[1][k]-v)*t)}).join(",")+")";}}}
var C=[];for(var y=0;y<15;y++)C.push(col(y));

var X0=66,PITCH=13,BRICK=12,RH=2,Y0=28;
function rowY(r){return Y0+(r-LO)*RH;}
function birthsY(b){ // source calibration: 17,000 at px 20.0, 35.83 px per 1,000
  var py=20.0+(17000-b)*0.035830;return rowY(py);}

// rows
for(var i=0;i<ROWS.length;i++){
  var s=ROWS[i],x=X0,y=Y0+i*RH;
  for(var yr=0;yr<s.length;yr++){var n=parseInt(s[yr],36);
    g.fillStyle=C[yr];
    for(var k=0;k<n;k++){g.fillRect(x,y,BRICK,RH);x+=PITCH;}}
}

// axis: births per day
g.font="11px Helvetica, Arial, sans-serif";g.textAlign="right";g.textBaseline="middle";
for(var b=6000;b<=16000;b+=1000){var yy=birthsY(b);
  g.fillStyle=MUTED;g.fillText(b.toLocaleString("en-US"),X0-12,yy);
  g.fillRect(X0-8,Math.round(yy),4,1);}
g.save();g.translate(18,birthsY(11000));g.rotate(-Math.PI/2);g.textAlign="center";
g.fillStyle=MUTED;g.fillText("births registered in one day",0,0);g.restore();

// title
g.textAlign="left";g.textBaseline="alphabetic";g.fillStyle=INK;
g.font="italic 40px Georgia, 'Times New Roman', serif";g.fillText("The Week Remains",640,78);
g.font="14px Georgia, 'Times New Roman', serif";g.fillStyle="#4a463f";
var sub=["Every day from 1 January 2000 to 31 December 2014,","5,479 of them, slid left along its own row until it","met the others. Only its count of births decides","where it lies; the calendar has been taken out."];
for(var j=0;j<sub.length;j++)g.fillText(sub[j],642,108+j*20);

// the gap
var gy=birthsY(10450);
g.strokeStyle=MUTED;g.lineWidth=1;g.beginPath();g.moveTo(170,gy+0.5);g.lineTo(232,gy+0.5);g.stroke();
g.font="italic 14px Georgia, 'Times New Roman', serif";g.fillStyle=INK;
g.fillText("Between the two, about fifty days that are neither:",242,gy-12);
g.font="14px Georgia, 'Times New Roman', serif";g.fillStyle="#4a463f";
g.fillText("weekdays near Christmas and New Year, in mid-January and mid-February,",242,gy+8);
g.fillText("around the Fourth of July and the end of October, when births thinned to a weekend's.",242,gy+28);

// masses
g.font="13px Georgia, 'Times New Roman', serif";g.fillStyle="#4a463f";
var uy=birthsY(12600),ly=birthsY(8650);
g.fillText("3,780 days",X0+66*PITCH+14,uy-8);
g.fillStyle=MUTED;g.font="12px Helvetica, Arial, sans-serif";g.fillText("Monday to Friday",X0+66*PITCH+14,uy+10);
g.font="13px Georgia, 'Times New Roman', serif";g.fillStyle="#4a463f";
g.fillText("1,699 days",X0+33*PITCH+14,ly-8);
g.fillStyle=MUTED;g.font="12px Helvetica, Arial, sans-serif";g.fillText("Saturday and Sunday",X0+33*PITCH+14,ly+10);

// legend
var lx=640,ly2=650;
g.font="12px Helvetica, Arial, sans-serif";g.fillStyle="#4a463f";
g.fillText("Within each row the days keep their order, earliest at the left;",lx,ly2);
g.fillText("each mark is one day, its colour the year:",lx,ly2+17);
for(var y=0;y<15;y++){g.fillStyle=C[y];g.fillRect(lx+y*26,ly2+32,24,8);}
g.fillStyle=MUTED;g.font="11px Helvetica, Arial, sans-serif";
g.fillText("2000",lx,ly2+56);g.textAlign="center";g.fillText("2007",lx+7*26+12,ly2+56);
g.textAlign="right";g.fillText("2014",lx+15*26-2,ly2+56);g.textAlign="left";
g.fillStyle=MUTED;g.font="11px Helvetica, Arial, sans-serif";
g.fillText("Each row is one pixel row of the plot this was read from, about 28 births tall.",lx,ly2+90);
g.fillText("Days registered in the United States. Social Security Administration data,",lx,ly2+107);
g.fillText("via FiveThirtyEight, CC BY 4.0.",lx,ly2+124);
</script>
</body>
</html>
