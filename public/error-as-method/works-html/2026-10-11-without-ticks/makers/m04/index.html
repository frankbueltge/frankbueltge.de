    var x=xv(v);
    out.lines.push({x1:x,y1:lastBase+5,x2:x,y2:lastBase+10,c:SOFT,w:1});
    out.texts.push({t:(v/1000)+",000",x:x,y:ay+4,a:"center",f:"11px Georgia, serif",c:SOFT});
  }

  out.texts.push({t:"births registered in a day →",x:X1,y:ay+20,a:"right",f:"italic 11px Georgia, serif",c:SOFT});
  // title block
  out.texts.push({t:"Five and Two",x:X0-48,y:52,a:"left",f:"400 34px Georgia, 'Times New Roman', serif",c:INK});
  out.texts.push({t:"Every day from 1 January 2000 to 31 December 2014, one dot each, piled over the number of births registered in the United States that day.",x:X0-47,y:80,a:"left",f:"italic 13.5px Georgia, serif",c:"#4a443c"});
  out.texts.push({t:"One shelf per year. Each year the days fall into two heaps, and almost none into the space between them.",x:X0-47,y:99,a:"left",f:"italic 13.5px Georgia, serif",c:"#4a443c"});

  // the valley label
  var gx=(xv(GAP0)+xv(GAP1))/2;
  out.texts.push({t:"the valley",x:gx,y:TOP-24,a:"center",f:"italic 12px Georgia, serif",c:ACC});

  // footer
  out.texts.push({t:"Days in red fall in the valley (9,700–10,900 births) or below 6,400. Low/high: days under/over 10,300 births. Counts were recovered from a scatter-plot picture by fitting one dot per day:",x:X0-48,y:H-24,a:"left",f:"10.5px Georgia, serif",c:SOFT});
  out.texts.push({t:"5,501 dots found for 5,479 days, so any single year may be off by a few days. Source: Social Security Administration, via FiveThirtyEight, CC BY 4.0.",x:X0-48,y:H-10,a:"left",f:"10.5px Georgia, serif",c:SOFT});
  return out;
}

function render(){
  var cv=document.getElementById('c');
  var dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=1100*dpr;cv.height=800*dpr;cv.style.width='1100px';cv.style.height='800px';
  var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.fillStyle="#f3efe6";ctx.fillRect(0,0,1100,800);
  var L=layout();
  L.rects.forEach(function(r){ctx.fillStyle=r.c;ctx.fillRect(r.x,r.y,r.w,r.h);});
  L.lines.forEach(function(l){ctx.strokeStyle=l.c;ctx.lineWidth=l.w;ctx.beginPath();ctx.moveTo(l.x1,l.y1);ctx.lineTo(l.x2,l.y2);ctx.stroke();});
  L.dots.forEach(function(d){ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();});
  L.texts.forEach(function(t){ctx.font=t.f;ctx.fillStyle=t.c;ctx.textAlign=t.a;ctx.textBaseline="alphabetic";ctx.fillText(t.t,t.x+(t.dx||0),t.y);});
}
if(typeof document!=="undefined")render();
if(typeof module!=="undefined")module.exports={layout:layout};
</script>
