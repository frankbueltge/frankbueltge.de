var WR=new Float32Array(BW*BH),WG=new Float32Array(BW*BH),WB=new Float32Array(BW*BH),WW=new Float32Array(BW*BH);
function splat(px,py,w,c){
  var x0=Math.floor(px),y0=Math.floor(py),fx=px-x0,fy=py-y0;
  for(var dy=0;dy<2;dy++)for(var dx=0;dx<2;dx++){
    var xx=x0+dx,yy=y0+dy;if(xx<0||yy<0||xx>=BW||yy>=BH)continue;
    var k=w*(dx?fx:1-fx)*(dy?fy:1-fy),j=yy*BW+xx;
    WW[j]+=k;WR[j]+=k*c[0];WG[j]+=k*c[1];WB[j]+=k*c[2];}
}
var ROW=(RTOP-RIN)/(YB-YT);
for(var i=0;i<P.length;i++){
  var p=P[i],t0=Math.max(0,dayOf(p[0]-0.5)),t1=Math.min(N-0.001,dayOf(p[0]+0.5));
  if(t1<=t0)continue;
  var s=yf(t0),e=yf(t1),fs=s[1],fe=e[1]+(e[0]-s[0]);
  var c=col(s[0]+(s[1]+fe)/2),w=Math.pow(p[2]/15,1.4);
  var r=rad(p[1]),a0=A0+TAU*fs,a1=A0+TAU*fe;
  var steps=Math.max(2,Math.ceil((a1-a0)*r*S*1.6)),ws=w/steps/2;
  for(var sub=0;sub<2;sub++){var rr=(r+(sub-0.5)*ROW*0.55)*S;
    for(var k=0;k<steps;k++){var a=a0+(a1-a0)*(k+0.5)/steps;
      splat(HC+Math.cos(a)*rr,HC+Math.sin(a)*rr,ws,c);}}
}
var img=g.createImageData(BW,BH),Dd=img.data,BGc=[0,0,0];
for(var j=0;j<BW*BH;j++){var w=WW[j];var o=j*4;
  var v=w>0?1-Math.exp(-GAIN*Math.pow(w,GAM)):0;
  var cr=w>0?WR[j]/w:0,cg=w>0?WG[j]/w:0,cb=w>0?WB[j]/w:0;
  Dd[o]=BGc[0]+(cr-BGc[0])*v;Dd[o+1]=BGc[1]+(cg-BGc[1])*v;Dd[o+2]=BGc[2]+(cb-BGc[2])*v;Dd[o+3]=255;}
var oc=document.createElement('canvas');oc.width=BW;oc.height=BH;oc.getContext('2d').putImageData(img,0,0);
g.save();g.setTransform(1,0,0,1,0,0);g.globalCompositeOperation='lighter';
g.drawImage(oc,Math.round((CX-RTOP-4)*S),Math.round((CY-RTOP-4)*S));g.restore();


// holiday marks: a hairline from the gap out to the rim
g.save();g.translate(CX,CY);
var HOL=[[0,'1 JAN','left'],[185,'4 JUL','center'],[247,'LABOR DAY','right'],[329,'THANKSGIVING','right'],[358,'25 DEC','right']];
var rA=rad(128),rB=RTOP+6;
for(var h=0;h<HOL.length;h++){var a=A0+TAU*(HOL[h][0]+0.5)/365.25,ca=Math.cos(a),sa=Math.sin(a);
  g.strokeStyle='rgba(255,245,230,0.22)';g.lineWidth=0.75;g.beginPath();
  g.moveTo(ca*rA,sa*rA);g.lineTo(ca*rB,sa*rB);g.stroke();
  g.strokeStyle='rgba(255,245,230,0.7)';g.lineWidth=1;g.beginPath();
  g.moveTo(ca*rA,sa*rA);g.lineTo(ca*(rA+7),sa*(rA+7));g.stroke();
  var rl=rB+5;g.fillStyle='rgba(255,236,200,0.78)';
  g.font='600 9px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
  g.textAlign=HOL[h][2];g.textBaseline=sa<-0.5?'bottom':(sa>0.5?'top':'middle');
  var ox=HOL[h][2]=='left'?2:(HOL[h][2]=='right'?-2:0);
  g.fillText(HOL[h][1],ca*rl+ox,sa*rl);}
g.restore();

// right column: text + the source strip as key
var TX=820;
g.fillStyle='#f3ece0';g.font='600 26px ui-serif,Georgia,"Times New Roman",serif';
g.fillText('The Year Turns',TX,96);g.fillText('Fifteen Times',TX,128);
g.fillStyle='rgba(243,236,224,0.66)';g.font='400 13px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
var L=['Births registered in the United States,','every day from 1 January 2000 to','31 December 2014, wound onto one year.','',
'Outward is more births. The outer ring','is the working week; the inner ring is','Saturday and Sunday. On a holiday the','count falls out of the outer ring and','down toward the weekend, as if the','hospital calendar were written in it.'];
for(var i=0;i<L.length;i++)g.fillText(L[i],TX,170+i*19);

// key: redraw the received strip
var KX=TX,KY=380,KW=240,KH=110,sx=KW/(X1-X0+1),sy=KH/(YB-YT+1);
g.save();g.globalCompositeOperation='lighter';
for(var i=0;i<P.length;i++){var p=P[i];if(p[0]<X0||p[0]>X1)continue;
  var c=col(2000+(p[0]-X0)/(X1-X0+1)*15),al=Math.pow(p[2]/15,1.3)*0.55;
  g.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')';
  g.fillRect(KX+(p[0]-X0)*sx,KY+(p[1]-YT)*sy,Math.max(sx,0.7),Math.max(sy,0.7));}
g.restore();
g.fillStyle='rgba(243,236,224,0.42)';g.font='400 11px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
g.fillText('2000',KX,KY+KH+18);g.textAlign='right';g.fillText('2014',KX+KW,KY+KH+18);g.textAlign='left';
var K2=['The same dots as received: one per day,','left to right. Each pixel of the source holds','about twelve days, so each one is drawn','here as an arc twelve days long.','Colour marks the year.'];
g.fillStyle='rgba(243,236,224,0.55)';g.font='400 12px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
for(var i=0;i<K2.length;i++)g.fillText(K2[i],TX,KY+KH+46+i*17);
g.fillStyle='rgba(243,236,224,0.32)';g.font='400 10px ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif';
g.fillText('Data: Social Security Administration,',TX,750);g.fillText('via FiveThirtyEight (CC BY 4.0).',TX,764);
g.fillText('Read from an unlabelled picture 480 × 220 pixels;',TX,778);g.fillText('no count survives, only relative height.',TX,792);
})();
