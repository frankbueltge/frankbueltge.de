const DAYS=5479;

const yStart=[]; {let d=0; for(let y=2000;y<=2015;y++){yStart.push(d); d+=((y%4===0&&y%100!==0)||y%400===0)?366:365;}}

const per=(DAYS-1)/(CW-1);            // ~11.68 days per pixel column
