const data=RAW.split(';').map(p=>p.split(',').map(Number));
const W=1100,H=800,dpr=Math.max(1,window.devicePixelRatio||1);
const cv=document.getElementById('c');
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
const g=cv.getContext('2d');g.scale(dpr,dpr);

const Y0=812,Y1=2026, D0=78,D1=132;
const L=74,R=1052,T=150,B=690;
const kx=(R-L)/(Y1-Y0+1);
const X=y=>L+(y-Y0)*kx, Yd=d=>T+(d-D0)/(D1-D0)*(B-T);
const dayPx=(B-T)/(D1-D0);

// ground
g.fillStyle='#141118';g.fillRect(0,0,W,H);

// faint day grid
g.strokeStyle='rgba(255,235,240,0.06)';g.lineWidth=1;
for(let d=80;d<=130;d+=10){const y=Math.round(Yd(d))+.5;g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();}

// each recorded year: a column of blossom that begins on its bloom day and thins out below
const FADE=26; // days over which the blossom thins
for(const [yr,d] of data){
  const x=X(yr), y=Yd(d), w=kx+0.35;
  const gr=g.createLinearGradient(0,y,0,y+FADE*dayPx);
  gr.addColorStop(0,'rgba(255,238,243,1)');
  gr.addColorStop(0.06,'rgba(247,190,208,0.95)');
  gr.addColorStop(0.35,'rgba(214,120,152,0.55)');
  gr.addColorStop(1,'rgba(120,60,90,0)');
  g.fillStyle=gr;g.fillRect(x,y,w,Math.min(FADE*dayPx,B-y));
  g.fillStyle='rgba(255,246,248,1)';g.fillRect(x,y-0.6,w,1.6);
}

// 51-year centred mean, only where the record is dense enough to speak
const byY=new Map(data);
g.beginPath();let on=false;
for(let yr=Y0;yr<=Y1;yr++){
  let s=0,n=0;for(let k=yr-25;k<=yr+25;k++){if(byY.has(k)){s+=byY.get(k);n++;}}
  if(n>=8){const px=X(yr)+kx/2,py=Yd(s/n);on?g.lineTo(px,py):g.moveTo(px,py);on=true;}else on=false;
}
g.strokeStyle='rgba(20,17,24,0.9)';g.lineWidth=3.2;g.lineJoin='round';g.stroke();
g.strokeStyle='rgba(255,250,240,0.85)';g.lineWidth=1.1;g.stroke();

const sans='"Helvetica Neue",Helvetica,Arial,sans-serif';

g.fillStyle='rgba(246,233,238,0.62)';g.font='15px '+serif;
g.fillText('Kyoto, 812 – 2026. One column for every year. The blossom begins on the day the cherry trees came into full bloom;',L,102);
g.fillText('where the dark goes unbroken, no one wrote the day down.',L,122);

// day axis (left)
g.font='11px '+sans;g.textAlign='right';
for(const d of [80,90,100,110,120,130]){

}
g.save();g.translate(24,(T+B)/2);g.rotate(-Math.PI/2);g.textAlign='center';
g.fillStyle='rgba(246,233,238,0.45)';g.fillText('day of the year  (90 ≈ 31 March, 120 ≈ 30 April)',0,0);g.restore();

// year axis (bottom)

for(let yr=900;yr<=1900;yr+=100){
  const x=Math.round(X(yr))+.5;
  g.strokeStyle='rgba(246,233,238,0.25)';g.beginPath();g.moveTo(x,B+8);g.lineTo(x,B+14);g.stroke();
  g.fillText(String(yr),x,B+30);
}
g.textAlign='left';g.fillText('812',L,B+30);g.textAlign='right';g.fillText('2026',R,B+30);

// record strip: which years have a date
g.fillStyle='rgba(246,233,238,0.55)';
for(const [yr] of data) g.fillRect(X(yr),B+1,Math.max(kx,0.8),4);

// two notes
g.font='12px '+sans;
function note(yr,d,txt,dx,dy,align){
  const x=X(yr)+kx/2,y=Yd(d);
  g.strokeStyle='rgba(246,233,238,0.45)';g.lineWidth=1;
  g.beginPath();g.moveTo(x,y);g.lineTo(x+dx,y+dy);g.stroke();
  g.fillStyle='rgba(246,233,238,0.8)';g.textAlign=align;
  g.fillText(txt,x+dx+(align==='right'?-4:4),y+dy+4);
}
note(2023,84,'2023 · day 84 · the earliest in the record',-40,-16,'right');
note(1323,124,'1323 · day 124 · the latest',30,22,'left');

g.textAlign='left';g.fillStyle='rgba(246,233,238,0.4)';g.font='11px '+sans;
g.fillText('Pale line: 51-year average. Strip below the field: years with a recorded date (838 of 1,215).',L,B+58);
g.textAlign="left";
g.fillText('Data: Yasuyuki Aono & Genki Katata, via Our World in Data (CC BY 4.0)',L,B+76);
