6 1.106 1.108 1.111 1.102 1.110 1.111 1.109 1.110 1.105 1.111 1.104 1.106 1.115 1.111 1.105 1.107 1.103 1.109 1.109 1.104 1.113 1.105 1.106 1.107 1.107 1.103 1.108 1.111 1.108 1.95 1.108 1.108 1.112 1.120 1.122 1.109 1.102 1.119 1.107 1.97 1.112 1.104 1.118 1.117 1.111 1.109 1.104 1.119 2.101 1.120 1.93 1.111 1.96 1.100 1.102 1.99 1.99 1.109 1.114 1.97 1.108 1.106 2.112 1.108 1.107 2.98 2.109 1.100 2.102 1.97 1.105 2.108 1.106 1.105 1.105 1.106 1.106 1.105 1.102 1.94 1.98 1.113 1.93 1.111 1.104 1.114 1.110 1.103 1.101 1.93 1.107 1.99 1.95 1.105 1.106 1.110 2.108 1.110 2.87 1.106 1.103 1.110 1.122 1.107 1.102 1.93 2.109 1.106 1.113 1.112 1.95 1.100 2.104 1.112 3.104 1.98 1.96 1.97 2.105 1.105 1.108 1.103 1.117 1.114 1.114 1.105 1.99 1.87 1.112 2.104 1.102 1.107 1.107 1.112 1.104 1.104 1.103 2.108 2.111 1.93 1.110 1.105 1.105 1.112 1.108 1.112 1.110 1.104 1.102 1.116 1.112 1.105 1.115 1.111 1.103 1.96 1.109 1.114 1.109 1.110 1.104 1.108 1.118 1.106 1.104 1.104 1.114 1.97 1.93 1.103 1.109 1.107 1.109 1.120 1.114 1.111 1.101 1.97 1.116 1.112 1.116 1.103 1.113 1.109 1.115 1.111 1.103 1.106 4.104 1.108 1.107 1.110 1.98 1.102 1.102 1.114 1.95 1.100 1.104 1.99 1.106 1.116 1.112 1.104 1.105 2.104 1.108 1.107 1.102 1.101 1.106 1.93 1.101 1.110 1.115 1.109 1.109 1.108 1.98 1.105 1.110 1.101 1.96 1.100 1.110 1.103 1.110 1.96 1.115 1.120 1.109 1.112 1.101 1.109 1.103 1.89 1.106 1.112 1.98 1.106 1.113 1.101 1.117 1.105 1.105 1.104 1.106 1.100 1.110 1.99 1.108 1.104 1.111 1.96 1.109 1.91 1.109 1.103 1.105 1.108 1.106 1.105 1.109 1.106 1.119 1.99 1.101 1.106 1.104 1.113 1.103 1.97 1.110 1.103 1.103 1.105 1.96 1.110 1.104 1.93 1.114 1.116 1.98 1.107 1.100 1.110 1.120 1.107 1.113 1.111 1.103 1.110 1.106 1.106 1.95 1.109 1.102 1.106 1.108 1.114 1.109 1.100 1.113 1.112 1.105 1.114 1.113 1.107 1.111 1.112 1.112 1.111 1.109 1.120 1.105 1.107 1.96 1.106 1.106 1.102 1.98 1.107 1.102 1.100 1.109 1.102 1.113 2.102 1.101 1.111 1.108 1.104 1.110 1.113 1.100 1.117 1.118 1.105 1.97 1.102 1.101 1.104 1.105 1.99 2.104 1.104 1.107 1.103 1.111 1.104 1.101 1.102 1.110 1.112 1.97 1.107 1.109 1.113 1.108 1.109 1.107 1.109 1.98 1.99 1.115 1.109 1.98 2.106 1.106 1.108 1.99 1.102 1.102 1.98 1.99 1.108 1.105 1.105 1.103 1.102 1.108 1.104 1.98 1.105 1.103 1.102 1.102 1.112 1.103 1.104 2.104 2.101 1.97 1.111 1.108 1.108 1.107 1.107 1.103 1.95 1.105 1.105 1.106 1.104 1.102 1.111 1.100 1.98 1.104 1.110 1.100 1.96 1.101 1.100 2.97 1.107 1.102 1.107 1.99 1.98 1.105 1.101 1.98 1.97 1.99 1.103 1.99 1.92 1.95 1.99 1.102 1.101 1.99 1.110 1.97 1.97 1.99 1.101 1.107 1.98 1.99 1.97 1.99 1.100 1.99 1.93 1.104 1.97 1.102 1.99 1.93 1.99 1.109 1.99 1.102 1.95 1.106 1.93 1.88 1.97 1.94 1.97 1.99 1.99 1.103 1.97 1.91 1.94 1.100 1.96 1.91 1.98 1.92 1.99 1.98 1.97 1.95 1.95 1.95 1.99 1.101 1.93 1.94 1.93 1.95 1.99 1.89 1.95 1.92 1.85 1.91 1.84 1.95 1.94 1.88";
const data = []; let yr = 800;
for (const t of RAW.split(" ")) { const [g, d] = t.split(".").map(Number); yr += g; data.push([yr, d]); }

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("w");
const el = (n, a, parent = svg) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
const txt = (s, a, parent) => { const e = el("text", a, parent); e.textContent = s; return e; };

const X0 = 96, X1 = 1066, COLW = (X1 - X0) / 100;   // 100 years across
const TOP = 96, BAND = 51;                            // 13 centuries
const BASE = 128, K = 1.0;                            // stem height = (BASE - day) * K
const ground = r => TOP + BAND * (r + 1) - 6;
const xOf = y => X0 + (y % 100 + 0.5) * COLW;

// title & caption
txt("Thirteen Rows of Spring", {x: X0, y: 46, "font-size": 24, "letter-spacing": ".01em"});
txt("Kyoto’s cherry trees in full bloom, 812–2026. One row for each century; one stem for each year a date was written down.", {x: X0, y: 70, class: "small", "font-size": 12.5});

const byCent = {};
for (const [y, d] of data) (byCent[Math.floor(y / 100)] ??= []).push([y, d]);

for (let r = 0; r < 13; r++) {
  const c = 8 + r, gy = ground(r), g = el("g", {});
  const rows = byCent[c] || [];
  // ground: drawn only across the years this row actually spans in time
  const first = Math.max(c * 100, 812), last = Math.min(c * 100 + 99, 2026);
  el("line", {x1: xOf(first) - COLW / 2, x2: xOf(last) + COLW / 2, y1: gy + .5, y2: gy + .5, stroke: "#b9aa9a", "stroke-width": 1}, g);
  if (c === 20) // the unwritten rest of the century
    el("line", {x1: xOf(last) + COLW / 2 + 3, x2: X1, y1: gy + .5, y2: gy + .5, stroke: "#cfc4b6", "stroke-width": 1, "stroke-dasharray": "1 4"}, g);
  txt(c * 100 + "s", {x: X0 - 12, y: gy + 1, "text-anchor": "end", class: "cent"}, g);
  // century mean, as a faint level
  if (rows.length) {
    const m = rows.reduce((s, [, d]) => s + d, 0) / rows.length, my = gy - (BASE - m) * K;
    el("line", {x1: xOf(first) - COLW / 2, x2: xOf(last) + COLW / 2, y1: my, y2: my, stroke: "#d98aa0", "stroke-opacity": .38, "stroke-width": 1}, g);
  }
  for (const [y, d] of rows) {
    const x = xOf(y), top = gy - (BASE - d) * K;
    el("line", {x1: x, x2: x, y1: gy, y2: top, stroke: "#6b5a50", "stroke-opacity": .55, "stroke-width": 1}, g);
    // earlier bloom: deeper blossom
    const t = Math.max(0, Math.min(1, (118 - d) / 32));
    const col = `rgb(${Math.round(240 - 26 * t)},${Math.round(196 - 104 * t)},${Math.round(204 - 76 * t)})`;
    el("circle", {cx: x, cy: top, r: 2.6, fill: col}, g);
  }
}

// key, at the same scale as the rows
const kg = el("g", {}), kGround = 80;
const keyDays = [[85, "26 March"], [100, "10 April"], [115, "25 April"]];
keyDays.forEach(([d, lab], i) => {
  const x = 868 + i * 70, top = kGround - (BASE - d) * K;
  el("line", {x1: x - 4, x2: x + 4, y1: kGround + .5, y2: kGround + .5, stroke: "#b9aa9a"}, kg);
  el("line", {x1: x, x2: x, y1: kGround, y2: top, stroke: "#6b5a50", "stroke-opacity": .55}, kg);
  const tt = Math.max(0, Math.min(1, (118 - d) / 32));
  el("circle", {cx: x, cy: top, r: 2.6, fill: `rgb(${Math.round(240 - 26 * tt)},${Math.round(196 - 104 * tt)},${Math.round(204 - 76 * tt)})`}, kg);
  txt(lab, {x: x + 6, y: top + 4, class: "small", "font-size": 10.5}, kg);
});
txt("full bloom on", {x: 856, y: kGround + .5 + 3.5, class: "small", "font-size": 10.5, "text-anchor": "end"}, kg);
// mean-level legend
el("line", {x1: 640, x2: 656, y1: 41, y2: 41, stroke: "#d98aa0", "stroke-opacity": .6}, kg);
txt("each century’s average", {x: 661, y: 44.5, class: "small", "font-size": 10.5}, kg);

// source
txt("Data: Yasuyuki Aono & Genki Katata, via Our World in Data (CC BY 4.0). Day of year of full flowering in 838 recorded years; bare ground means no record survives.",
  {x: X0, y: 778, class: "small", "font-size": 10}, kg);
txt("Values were read back from a scatter plot; inside dense clusters a few stems may stand a column or two from their true year.",
