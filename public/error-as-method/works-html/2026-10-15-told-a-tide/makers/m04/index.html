  for (let i = 0; i + 4 <= s.length; i += 4) { const y = +s.slice(i, i + 2), d = +s.slice(i + 2, i + 4) / 99; S.push([x, y, d]); col.push([y, d]); }
  C[x] = col;
});
const X0 = 2.6, X1 = 296.4, HOURS = 1464;
const hourOf = x => (x - X0) / (X1 - X0) * (HOURS - 1);
const HPX = (HOURS - 1) / (X1 - X0);          // ~5 hours per source pixel

// per column: ink-weighted 15th and 92nd percentile of height
function pct(col, q) {
  const a = col.filter(p => p[1] > 0.2).sort((u, v) => u[0] - v[0]);
  if (!a.length) return null;
  const tot = a.reduce((s, p) => s + p[1], 0); let acc = 0;
  for (const [y, d] of a) { acc += d; if (acc >= q * tot) return y; }
  return a[a.length - 1][0];
}
const hi = [], lo = [];
for (let x = 0; x < 300; x++) { hi[x] = pct(C[x] || [], 0.15); lo[x] = pct(C[x] || [], 0.92); }
// the usual high level near each column: median of the column highs over about two days
const ref = [];
for (let x = 0; x < 300; x++) {
  const w = []; for (let k = x - 10; k <= x + 10; k++) if (hi[k] != null) w.push(hi[k]);
  w.sort((a, b) => a - b); ref[x] = w.length ? w[w.length >> 1] : 30;
}
// depth of the low water in each column, below the usual high, in source pixels
const depth = [];
for (let x = 0; x < 300; x++) depth[x] = lo[x] == null ? null : Math.max(0, lo[x] - ref[x] - 12);

function rust(k, a) {               // k 0..1: paper -> rust -> dark rust
  k = Math.max(0, Math.min(1, k));
  const stops = [[243,239,230],[214,150,112],[178,62,30],[92,34,22]];
  const f = k * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f)), u = f - i;
  const c = stops[i].map((v, j) => Math.round(v + (stops[i + 1][j] - v) * u));
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
const DMAX = 30;

g.fillStyle = '#f3efe6'; g.fillRect(0, 0, W, H);

// ---- 1. the record as received
const RX = 50, RW = 1000, RY = 104, RH = 104;
for (const [x, y, d] of S) {
  if (d < 0.12) continue;
  const px = RX + (x - X0) / (X1 - X0) * RW, py = RY + (y - 4) / 82 * RH;
  const k = Math.max(0, y - ref[x] - 12) / DMAX;
  g.fillStyle = k > 0.05 ? rust(0.35 + k * 0.65, Math.min(1, d)) : `rgba(32,38,46,${Math.min(1, d * 0.85)})`;
  g.fillRect(px - 1.4, py - 1.1, 2.8, 2.2);
}

// ---- 2. the same record cut into rows of a given length; colour = how far the low water falls
function panel(ox, oy, pw, period, rowH) {
  const rows = Math.ceil((HOURS + OFF) / period), NB = 120;
  const acc = Array.from({ length: rows }, () => new Float64Array(NB)), wt = Array.from({ length: rows }, () => new Float64Array(NB));
  for (let x = 0; x < 300; x++) {
    if (depth[x] == null) continue;
    const ink = (C[x] || []).reduce((s, p) => s + p[1], 0); if (ink < 1) continue;
    const t0 = hourOf(x);
    for (let u = -HPX; u <= HPX; u += 0.1) {
      const t = t0 + u + OFF; if (t < 0 || t >= HOURS + OFF) continue;
      const w = 1 - Math.abs(u) / HPX;
      const r = Math.floor(t / period), b = Math.min(NB - 1, Math.floor((t - r * period) / period * NB));
      acc[r][b] += w * depth[x]; wt[r][b] += w;
    }
  }
  const bw = pw / NB;
  for (let r = 0; r < rows; r++) for (let b = 0; b < NB; b++) {
    if (!wt[r][b]) continue;
    const v = acc[r][b] / wt[r][b];
    g.fillStyle = rust(Math.pow(v / DMAX, 0.9), 1);
    g.fillRect(ox + b * bw, oy + r * rowH, bw + 0.35, rowH - 1.2);
  }
  g.fillStyle = 'rgba(32,38,46,0.45)';
  for (let r = 0; r < rows; r += 7) g.fillRect(ox - 12, oy + r * rowH + rowH / 2 - 0.5, 6, 1);
  return rows;
}
const OFF = 19.5;   // the clock time of the record is not given; the first cut is placed 19.5 h before its first value, so the first row starts part-way
const PY = 318, ROWH = 7.2, PW = 460;
panel(50, PY, PW, 24 + 50 / 60, ROWH);
panel(590, PY, PW, 24, ROWH);

// ---- words, kept few
const serif = 'Georgia, "Times New Roman", serif';
g.fillStyle = '#20262e'; g.font = `27px ${serif}`; g.fillText('Two Clocks', 50, 54);
g.fillStyle = '#6b6a64'; g.font = `italic 14px ${serif}`;
g.fillText('a record of the water in a tidal harbour: 61 days, one value an hour', 50, 78);
g.font = `italic 12.5px ${serif}`;
g.fillText('as received, left to right; the falls below the usual level in rust', 50, RY + RH + 24);

g.fillStyle = '#20262e'; g.font = `15px ${serif}`;
g.fillText('cut every 24 h 50 min', 50, PY - 30);
g.fillText('cut every 24 h', 590, PY - 30);
g.fillStyle = '#6b6a64'; g.font = `italic 12.5px ${serif}`;
g.fillText('the day of the moon, by which tides keep time', 50, PY - 13);
g.fillText('the day of the sun', 590, PY - 13);
g.fillText('one row per cut, the first at the top; the darker, the further the water fell', 50, 784);
g.fillText('a tide would line up on the left. this water lines up on the right.', 590, 784);
</script>
