<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>A Shorter Day</title>
<style>
  html,body{margin:0;background:#f3f0e8;}
  body{width:1100px;height:800px;overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:#1c1b19;}
  svg{display:block}
</style>
</head>
<body>
<svg id="w" width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// 1,464 hourly values, recovered from the dots of the source picture
// (units: pixel rows above the picture's bottom edge, 0-90).
const V=[__DATA__];
const N=V.length;
const svg=document.getElementById('w');
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
const INK='#1c1b19', PAPER='#f3f0e8', FAINT='#8d877b';

// slow reference: the usual "high" level around each hour (median over +-30 h)
const REF=V.map((_,i)=>{const s=V.slice(Math.max(0,i-30),Math.min(N,i+31)).sort((a,b)=>a-b);return s[Math.floor(s.length*0.5)];});

// value at fractional hour t (linear)
function at(arr,t){if(t<0||t>N-1)return null;const i=Math.floor(t),f=t-i;return i+1<N?arr[i]*(1-f)+arr[i+1]*f:arr[i];}

// one folded panel, double-plotted: row r shows cycles r and r+1
function panel(x0,y0,w,h,P){
  const g=el('g',{});
  const rows=Math.ceil(N/P);
  const rh=h/rows, sx=w/(2*P), s=0.62;
  for(let r=0;r<rows;r++){
    const base=y0+r*rh+rh*0.5;
    const t0=r*P, t1=Math.min(N-1,(r+2)*P);
    if(t0>N-1)break;
    let pts=[];
    for(let t=t0;t<=t1+1e-9;t+=0.25){
      const v=at(V,t),ref=at(REF,t); if(v==null)continue;
      pts.push([x0+(t-t0)*sx, base-(v-ref)*s]);
    }
    if(pts.length<2)continue;
    // ink: the part of the curve that falls below the usual level
    let d='M'+pts[0][0].toFixed(1)+','+base.toFixed(1);
    for(const [x,y] of pts)d+='L'+x.toFixed(1)+','+Math.max(base,y).toFixed(1);
    d+='L'+pts[pts.length-1][0].toFixed(1)+','+base.toFixed(1)+'Z';
    el('path',{d,fill:INK,'fill-opacity':0.78},g);
    // hairline for the whole trace
    let l='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
    el('path',{d:l,fill:'none',stroke:INK,'stroke-width':0.45,'stroke-opacity':0.55},g);
  }
  // fold seam between first and second cycle of each row
  el('line',{x1:x0+w/2,x2:x0+w/2,y1:y0-6,y2:y0+h+6,stroke:FAINT,'stroke-width':0.5,'stroke-dasharray':'1 3'});
}

const TOP=92, H=592, PW=468;
panel(56,TOP,PW,H,24);
panel(1100-56-PW,TOP,PW,H,23.55);

// title and captions
el('text',{x:56,y:50,'font-size':22,'letter-spacing':'0.5',fill:INK}).textContent='A Shorter Day';
const sub=el('text',{x:1044,y:50,'font-size':12.5,fill:FAINT,'text-anchor':'end','font-style':'italic'});
sub.textContent='one record, 1,464 hours, laid in rows two ways';
function cap(x,txt,anchor){el('text',{x,y:TOP+H+30,'font-size':13,fill:INK,'text-anchor':anchor||'start'}).textContent=txt;}
cap(56,'cut every 24 hours');
cap(1044,'cut every 23 hours 33 minutes','end');
function cap2(x,txt,anchor){el('text',{x,y:TOP+H+48,'font-size':11.5,fill:FAINT,'font-style':'italic','text-anchor':anchor||'start'}).textContent=txt;}
cap2(56,'the low hours arrive about half an hour earlier each day');
cap2(1044,'and stand still','end');

// the record as it came: one dot per hour
const sy=TOP+H+70, sh=30;
for(let i=0;i<N;i++){
  el('circle',{cx:(56+(i+0.5)*(988/N)).toFixed(2),cy:(sy+sh-(V[i]/90)*sh).toFixed(2),r:0.85,fill:INK,'fill-opacity':0.7});
}
</script>
</body>
</html>
