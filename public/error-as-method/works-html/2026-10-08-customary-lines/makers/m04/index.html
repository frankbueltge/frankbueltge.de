<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lunations, 2025</title>
<style>
  html,body{margin:0;background:#0b0c10;}
  body{width:1100px;height:800px;overflow:hidden;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="1100" height="800"></canvas>
<script src="data.js"></script>
<script>
(function(){
  var cv=document.getElementById('c'), dpr=window.devicePixelRatio||1;
  cv.width=1100*dpr; cv.height=800*dpr; cv.style.width='1100px'; cv.style.height='800px';
  var g=cv.getContext('2d'); g.scale(dpr,dpr);
  var W=1100,H=800, days=window.VIEWS.days;

  g.fillStyle='#0b0c10'; g.fillRect(0,0,W,H);

  // synodic month, reference new moon 2000-01-06 18:14 UTC
  var S=29.530588853, REF=Date.UTC(2000,0,6,18,14)/864e5;
  function lun(t){return (t-REF)/S;}
  var t0=Date.UTC(2025,0,1,12)/864e5;
  var firstL=Math.floor(lun(t0));

  var items=[], maxRow=0;
  days.forEach(function(v,i){
    var L=lun(t0+i), row=Math.floor(L)-firstL, p=L-Math.floor(L);
    if(row>maxRow)maxRow=row;
    items.push({v:v,i:i,row:row,p:p});
  });
  var rows=maxRow+1;

  var left=120,right=40,top=96,bottom=70;
  var colW=(W-left-right), rowH=(H-top-bottom)/(rows-1);
  var mean=days.reduce(function(a,b){return a+b;},0)/days.length;
  var R0=9.2;
  function rad(v){return R0*Math.sqrt(v/mean);}

  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dateOf(i){var d=new Date(Date.UTC(2025,0,1+i));return months[d.getUTCMonth()]+' '+d.getUTCDate();}

  // full-moon meridian
  var fx=left+0.5*colW;
  g.strokeStyle='rgba(230,220,190,0.07)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(fx,top-26); g.lineTo(fx,H-bottom+26); g.stroke();
  g.strokeStyle='rgba(230,220,190,0.04)';
  [0.25,0.75].forEach(function(q){var x=left+q*colW;g.beginPath();g.moveTo(x,top-26);g.lineTo(x,H-bottom+26);g.stroke();});

  // row guides + labels (new moon date of each lunation)
  g.font='11px Georgia, "Times New Roman", serif'; g.textBaseline='middle';
  for(var r=0;r<rows;r++){
    var y=top+r*rowH;
    var nm=(firstL+r)*S+REF; // days since epoch
    var d=new Date(nm*864e5);
    g.fillStyle='rgba(200,195,180,0.45)'; g.textAlign='right';
    g.fillText(months[d.getUTCMonth()]+' '+d.getUTCDate()+(d.getUTCFullYear()!==2025?' '+d.getUTCFullYear():''), left-28, y);
    g.strokeStyle='rgba(230,220,190,0.05)';
    g.beginPath(); g.moveTo(left-14,y); g.lineTo(W-right+10,y); g.stroke();
  }

  function moon(x,y,R,p,v,eclipse){
    // dark body
    g.beginPath(); g.arc(x,y,R,0,Math.PI*2);
    g.fillStyle='#1b1d24'; g.fill();
    // brightness of the lit face follows views
    var k=Math.min(1,Math.max(0,(v-3700)/(9000-3700)));
    var lr=Math.round(150+105*k), lg=Math.round(146+95*k), lb=Math.round(132+70*k);
    var lit=eclipse?'rgb(196,92,58)':'rgb('+lr+','+lg+','+lb+')';
    var waxing=p<0.5, c=Math.cos(2*Math.PI*p); // 1 new, -1 full
    var ex=Math.abs(c)*R;
    g.save();
    g.beginPath(); g.arc(x,y,R,0,Math.PI*2); g.clip();
    // lit half
    g.beginPath();
    if(waxing){g.arc(x,y,R,-Math.PI/2,Math.PI/2,false);}else{g.arc(x,y,R,Math.PI/2,-Math.PI/2+Math.PI*2,false);}
    g.closePath(); g.fillStyle=lit; g.fill();
    // terminator ellipse
    g.beginPath(); g.ellipse(x,y,Math.max(ex,0.01),R,0,0,Math.PI*2);
    g.fillStyle = c>0 ? '#1b1d24' : lit; g.fill();
    g.restore();
    g.beginPath(); g.arc(x,y,R,0,Math.PI*2);
    g.strokeStyle='rgba(230,220,190,0.10)'; g.lineWidth=0.6; g.stroke();
  }

  // glow for the brightest days, drawn first
  items.forEach(function(it){
    if(it.v<7500)return;
    var x=left+it.p*colW, y=top+it.row*rowH, R=rad(it.v);
    var gr=g.createRadialGradient(x,y,R*0.6,x,y,R*2.6);
    var ecl=(it.i===72||it.i===249);
    gr.addColorStop(0,ecl?'rgba(200,90,50,0.22)':'rgba(240,230,200,0.16)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,R*2.6,0,Math.PI*2); g.fill();
  });

  items.forEach(function(it){
    var x=left+it.p*colW, y=top+it.row*rowH;
    moon(x,y,rad(it.v),it.p,it.v,(it.i===72||it.i===249));
  });

  // annotations for the five largest days
  var notes={249:'Sep 7 — total lunar eclipse',200:'Jul 20 — Apollo 11 anniversary',72:'Mar 14 — total lunar eclipse',279:'Oct 7',308:'Nov 5'};
  g.font='italic 11px Georgia, "Times New Roman", serif'; g.textAlign='center'; g.textBaseline='alphabetic';
  items.forEach(function(it){
    if(!notes[it.i])return;
    var x=left+it.p*colW, y=top+it.row*rowH, R=rad(it.v);
    var t=notes[it.i]+'  ·  '+it.v.toLocaleString('en-US');
    g.fillStyle=(it.i===72||it.i===249)?'rgba(220,130,100,0.85)':'rgba(225,218,195,0.75)';
    g.fillText(t, x, y-R-7);
  });

  // header
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillStyle='rgba(235,228,210,0.92)'; g.font='24px Georgia, "Times New Roman", serif';
  g.fillText('Lunations', left, 46);
  g.fillStyle='rgba(200,195,180,0.55)'; g.font='12px Georgia, "Times New Roman", serif';
  g.fillText('Every day of 2025 as the Moon looked that day, sized by how many people read the English Wikipedia article “Moon”.', left+122, 46);
  g.fillText('Each row is one synodic month, new moon to new moon. Full moons stand in the middle column.', left+122, 63);

  // footer axis
  g.textAlign='center'; g.fillStyle='rgba(200,195,180,0.45)'; g.font='11px Georgia, "Times New Roman", serif';
  [['new',0],['first quarter',0.25],['full',0.5],['last quarter',0.75],['new',1]].forEach(function(a){
    g.fillText(a[0], left+a[1]*colW, H-bottom+44);
  });
  g.textAlign='right';
  g.fillText('daily human page views, en.wikipedia.org · Wikimedia pageviews (CC0) · mean '+Math.round(mean).toLocaleString('en-US')+' / day', W-right, H-14);
  g.textAlign='left';
  g.fillText('row label: date of the new moon', 20, H-14);
})();
</script>
</body>
</html>
