<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>Core Sample, 2025</title>
<style>
  html, body { margin: 0; padding: 0; background: #d9d3c7; }
  body { width: 1100px; height: 800px; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="data.js"></script>
<script>
(function () {
  var W = 1100, H = 800;
  var dpr = Math.max(1, window.devicePixelRatio || 1);
  var cv = document.getElementById('c');
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  var g = cv.getContext('2d');
  g.scale(dpr, dpr);

  var days = window.VIEWS.days;
  var N = days.length;
  var total = 0; for (var i = 0; i < N; i++) total += days[i];

  // deterministic noise
  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function vnoise(t, seed) {
    var i0 = Math.floor(t), f = t - i0, u = f * f * (3 - 2 * f);
    return hash(i0 + seed * 101.3) * (1 - u) + hash(i0 + 1 + seed * 101.3) * u;
  }

  // local median (31-day) to find "ash" days: readers far above the usual
  function med(i) {
    var w = days.slice(Math.max(0, i - 15), i + 16).sort(function (a, b) { return a - b; });
    return w[w.length >> 1];
  }
  var ash = days.map(function (v, i) {
    var r = v / med(i);
    return Math.max(0, Math.min(1, (r - 1.18) / 1.0));
  });

  // ---- paper / table ----
  g.fillStyle = '#d9d3c7'; g.fillRect(0, 0, W, H);
  for (var k = 0; k < 9000; k++) {
    var px = hash(k * 3.1) * W, py = hash(k * 7.7 + 2) * H;
    g.fillStyle = 'rgba(70,60,45,' + (0.02 + hash(k) * 0.04) + ')';
    g.fillRect(px, py, 1, 1);
  }

  // ---- title ----
  g.fillStyle = '#2b261f';
  g.font = '600 26px Georgia, "Times New Roman", serif';
  g.textBaseline = 'alphabetic';
  g.fillText('Core Sample, 2025', 60, 62);
  g.font = 'italic 14px Georgia, "Times New Roman", serif';
  g.fillStyle = '#5a5244';
  g.fillText('Everyone who read the English Wikipedia article “Moon” in 2025, laid down one day at a time.', 60, 86);
  g.fillText('Each layer is a day; its thickness is that day’s readers. Pale bands are days far above the weeks around them.', 60, 104);

  g.font = '11px "Helvetica Neue", Arial, sans-serif';
  g.fillStyle = '#5a5244';
  g.textAlign = 'right';
  g.fillText('Box 1 of 1 · en.wikipedia / Moon · human readers', W - 60, 62);
  g.fillText(total.toLocaleString('en-US') + ' readers · 365 layers · four sections', W - 60, 78);
  g.textAlign = 'left';

  // ---- tray ----
  var ROWS = 4;
  var X0 = 70, LEN = 960;
  var perRow = total / ROWS;
  var scale = LEN / perRow; // px per reader
  var rowY = [158, 296, 434, 572];
  var R = 30; // core radius (half height)

  // tray box
  g.fillStyle = '#b9ae9b';
  roundRect(X0 - 30, 128, LEN + 60, 584, 6); g.fill();
  g.fillStyle = '#c8bfae';
  roundRect(X0 - 24, 134, LEN + 48, 572, 4); g.fill();
  // channels
  for (var r = 0; r < ROWS; r++) {
    var cy = rowY[r] + R;
    var gr = g.createLinearGradient(0, cy - R - 8, 0, cy + R + 8);
    gr.addColorStop(0, '#8f8471'); gr.addColorStop(0.15, '#a99e8a');
    gr.addColorStop(0.85, '#b3a894'); gr.addColorStop(1, '#d2c9b8');
    g.fillStyle = gr;
    roundRect(X0 - 12, cy - R - 7, LEN + 24, 2 * R + 14, 3); g.fill();
  }

  // cumulative position of each day boundary
  var cum = [0];
  for (i = 0; i < N; i++) cum.push(cum[i] + days[i]);

  // colour of a day: clay that drifts slowly through the year, ash blended in
  function clay(i) {
    var s = vnoise(i / 9, 3), t = vnoise(i / 2.3, 7), q = hash(i * 1.7);
    var L = 0.42 + 0.16 * s + 0.08 * t + 0.05 * (q - 0.5);
    var base = [118 + 60 * L, 92 + 58 * L, 66 + 46 * L];
    // seasonal warmth: greyer in winter, warmer in summer
    var season = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / 365);
    base[0] += 14 * season; base[2] -= 8 * season;
    var a = ash[i];
    var ashc = [236, 231, 216];
    return [
      Math.round(base[0] * (1 - a) + ashc[0] * a),
      Math.round(base[1] * (1 - a) + ashc[1] * a),
      Math.round(base[2] * (1 - a) + ashc[2] * a)
    ];
  }

  // boundary curve: x offset at relative height h (-1..1) for boundary b
  function wob(b, h) {
    return 1.6 * (vnoise(h * 2.2 + b * 0.37, b) - 0.5) * 2 + 0.9 * h * Math.sin(b * 0.21);
  }

  // draw every day into the rows it occupies
  for (r = 0; r < ROWS; r++) {
    var cy = rowY[r] + R;
    var a0 = r * perRow, a1 = (r + 1) * perRow;
    g.save();
    coreShape(X0, cy, LEN, R, r);
    g.clip();
    for (i = 0; i < N; i++) {
      var s0 = cum[i], s1 = cum[i + 1];
      if (s1 <= a0 || s0 >= a1) continue;
      var x0 = X0 + (s0 - a0) * scale, x1 = X0 + (s1 - a0) * scale;
      var c = clay(i);
      g.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
      g.beginPath();
      var STEPS = 16, j, h;
      for (j = 0; j <= STEPS; j++) {
        h = -1 + 2 * j / STEPS;
        var xx = x0 + wob(i, h);
        if (j === 0) g.moveTo(xx, cy + h * (R + 2)); else g.lineTo(xx, cy + h * (R + 2));
      }
      for (j = STEPS; j >= 0; j--) {
        h = -1 + 2 * j / STEPS;
        g.lineTo(x1 + wob(i + 1, h), cy + h * (R + 2));
      }
      g.closePath(); g.fill();
      // fine lamination inside thick layers
      var wpx = x1 - x0;
      if (wpx > 9) {
        var nl = Math.floor(wpx / 5);
        for (var l = 1; l < nl; l++) {
          var lx = x0 + wpx * l / nl;
          g.strokeStyle = 'rgba(60,45,30,' + (0.05 + 0.05 * hash(i * 13 + l)) + ')';
          g.lineWidth = 0.6;
          g.beginPath();
          for (j = 0; j <= STEPS; j++) {
            h = -1 + 2 * j / STEPS;
            var ox = lx + (wob(i, h) * (1 - l / nl) + wob(i + 1, h) * (l / nl));
            if (j === 0) g.moveTo(ox, cy + h * R); else g.lineTo(ox, cy + h * R);
          }
          g.stroke();
        }
      }
      // parting line (the day's boundary)
      g.strokeStyle = 'rgba(40,28,18,0.38)';
      g.lineWidth = 0.7;
      g.beginPath();
      for (j = 0; j <= STEPS; j++) {
        h = -1 + 2 * j / STEPS;
        var bx = x0 + wob(i, h);
        if (j === 0) g.moveTo(bx, cy + h * (R + 2)); else g.lineTo(bx, cy + h * (R + 2));
      }
      g.stroke();
    }
    // grain speckle
    for (k = 0; k < 2600; k++) {
      var sx = X0 + hash(k * 1.3 + r * 977) * LEN;
      var sy = cy - R + hash(k * 2.9 + r * 31) * 2 * R;
      g.fillStyle = hash(k + r) > 0.5 ? 'rgba(255,250,235,0.10)' : 'rgba(30,20,10,0.10)';
      g.fillRect(sx, sy, 1, 1);
    }
    // cylinder shading
    var sh = g.createLinearGradient(0, cy - R, 0, cy + R);
    sh.addColorStop(0, 'rgba(20,12,4,0.38)');
    sh.addColorStop(0.18, 'rgba(255,250,240,0.06)');
    sh.addColorStop(0.34, 'rgba(255,252,244,0.20)');
    sh.addColorStop(0.55, 'rgba(255,250,240,0.02)');
    sh.addColorStop(0.85, 'rgba(20,12,4,0.22)');
    sh.addColorStop(1, 'rgba(20,12,4,0.45)');
    g.fillStyle = sh;
    g.fillRect(X0 - 10, cy - R - 4, LEN + 20, 2 * R + 8);
    g.restore();

    // outline
    g.save();
    coreShape(X0, cy, LEN, R, r);
    g.strokeStyle = 'rgba(50,38,26,0.45)'; g.lineWidth = 0.8; g.stroke();
    g.restore();

    // ---- ruler: depth in readers ----
    var ry = cy + R + 16;
    g.strokeStyle = '#5a5244'; g.fillStyle = '#4a4338';
    g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(X0, ry); g.lineTo(X0 + LEN, ry); g.stroke();
    g.font = '10px "Helvetica Neue", Arial, sans-serif';
    g.textAlign = 'center';
    var first = Math.ceil(a0 / 10000) * 10000;
    for (var v = first; v <= a1 + 1; v += 10000) {
      var tx = X0 + (v - a0) * scale;
      var big = v % 100000 === 0;
      g.beginPath(); g.moveTo(tx, ry); g.lineTo(tx, ry + (big ? 7 : 3.5)); g.stroke();
      if (big) g.fillText(v === 0 ? '0' : (v / 1000).toLocaleString('en-US') + 'k', tx, ry + 18);
    }
    g.textAlign = 'left';

    // section tag
    g.save();
    g.translate(X0 - 38, cy);
    g.rotate(-Math.PI / 2);
    g.textAlign = 'center';
    g.font = '600 10px "Helvetica Neue", Arial, sans-serif';
    g.fillStyle = '#4a4338';
    g.fillText(['I', 'II', 'III', 'IV'][r], 0, 0);
    g.restore();
  }

  // ---- month marks on the top edge of the cores ----
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var mStart = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  g.font = '10px "Helvetica Neue", Arial, sans-serif';
  for (var m = 0; m < 12; m++) {
    var p = locate(cum[mStart[m]]);
    var cyy = rowY[p.row];
    g.strokeStyle = '#3a332a'; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(p.x, cyy - 9); g.lineTo(p.x, cyy - 1); g.stroke();
    g.fillStyle = '#3a332a';
    g.fillText(MON[m], p.x + 3, cyy - 3);
  }

  // ---- labels for the palest bands ----
  var notes = [
    { d: '2025-03-14', t: 'total lunar eclipse' },
    { d: '2025-07-20', t: 'Apollo 11 anniversary' },
    { d: '2025-09-07', t: 'total lunar eclipse' },
    { d: '2025-10-07', t: 'full moon' }
  ];
  notes.forEach(function (n) {
    var idx = Math.round((Date.parse(n.d) - Date.parse('2025-01-01')) / 864e5);
    var p = locate((cum[idx] + cum[idx + 1]) / 2);
    var cy = rowY[p.row] + R;
    var by = cy + R + 52;
    g.strokeStyle = '#3a332a'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(p.x, cy + R + 2); g.lineTo(p.x, cy + R + 10); g.stroke();
    g.beginPath(); g.moveTo(p.x, cy + R + 24); g.lineTo(p.x, by - 9); g.stroke();
    var dt = new Date(n.d + 'T00:00:00Z');
    var label = dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()] + ' · ' + days[idx].toLocaleString('en-US') + ' readers';
    g.font = 'italic 11px Georgia, serif'; g.fillStyle = '#2b261f';
    g.textAlign = p.x > X0 + LEN - 160 ? 'right' : 'left';
    var off = g.textAlign === 'right' ? -4 : 4;
    g.fillText(label, p.x + off, by - 1);
    g.font = '10px "Helvetica Neue", Arial, sans-serif'; g.fillStyle = '#5a5244';
    g.fillText(n.t, p.x + off, by + 11);
    g.textAlign = 'left';
  });

  // ---- foot ----
  g.font = '10.5px "Helvetica Neue", Arial, sans-serif';
  g.fillStyle = '#5a5244';
  g.fillText('Scale along each core: readers, not days. A quiet day (3,777) is about ' + (3777 * scale).toFixed(0) +
    ' px; the busiest (17,284, 7 Sep) about ' + (17284 * scale).toFixed(0) + ' px. Read left to right, section I to IV.', 60, 748);
  g.fillText('Data: Wikimedia pageviews, en.wikipedia “Moon”, agent = user, 1 Jan – 31 Dec 2025 (CC0).', 60, 765);

  // ---------- helpers ----------
  function locate(s) {
    var row = Math.min(ROWS - 1, Math.floor(s / perRow));
    return { row: row, x: X0 + (s - row * perRow) * scale };
  }
  function roundRect(x, y, w, h, rr) {
    g.beginPath();
    g.moveTo(x + rr, y); g.lineTo(x + w - rr, y); g.quadraticCurveTo(x + w, y, x + w, y + rr);
    g.lineTo(x + w, y + h - rr); g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    g.lineTo(x + rr, y + h); g.quadraticCurveTo(x, y + h, x, y + h - rr);
    g.lineTo(x, y + rr); g.quadraticCurveTo(x, y, x + rr, y); g.closePath();
  }
  // a core segment with slightly broken (jagged) ends where sections were cut
  function coreShape(x, cy, len, rad, seed) {
    g.beginPath();
    var j, h, S = 14;
    g.moveTo(x, cy - rad);
    g.lineTo(x + len, cy - rad);
    for (j = 0; j <= S; j++) {
      h = -1 + 2 * j / S;
      var e = (seed === ROWS - 1) ? 0 : (hash(j * 3.3 + seed * 17) - 0.5) * 5;
      g.lineTo(x + len + e + 2 * Math.sqrt(Math.max(0, 1 - h * h)), cy + h * rad);
    }
    g.lineTo(x, cy + rad);
    for (j = S; j >= 0; j--) {
      h = -1 + 2 * j / S;
      var e2 = (seed === 0) ? 0 : (hash(j * 5.1 + seed * 29) - 0.5) * 5;
      g.lineTo(x + e2 - 2 * Math.sqrt(Math.max(0, 1 - h * h)), cy + h * rad);
    }
    g.closePath();
  }
})();
</script>
</body>
</html>
