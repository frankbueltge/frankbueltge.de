<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Limb</title>
<style>
  html, body { margin: 0; background: #07080b; }
  body { width: 1100px; height: 800px; overflow: hidden; }
  svg { display: block; }
  text { font-family: Georgia, "Times New Roman", serif; }
</style>
</head>
<body>
<svg id="s" width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="data.js"></script>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("s");
  var days = window.VIEWS.days;
  var N = days.length;

  // Geometry: a large Moon whose centre sits below the frame.
  var cx = 550, cy = 1190, R0 = 720;        // R0 = radius of zero views
  var k = 255 / 17284;                       // px per view (height from zero)
  var A0 = -40 * Math.PI / 180, A1 = 40 * Math.PI / 180;

  function ang(i) { return A0 + (A1 - A0) * (i + 0.5) / N; }
  function pt(a, r) { return [cx + r * Math.sin(a), cy - r * Math.cos(a)]; }
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var key in attrs) e.setAttribute(key, attrs[key]);
    (parent || svg).appendChild(e);
    return e;
  }
  function txt(s, attrs, parent) { var t = el("text", attrs, parent); t.textContent = s; return t; }
  function f(n) { return n.toFixed(1); }
  function fmt(n) { return n.toLocaleString("en-US"); }
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function dayIndex(m, d) { return Math.round((Date.UTC(2025, m, d) - Date.UTC(2025, 0, 1)) / 864e5); }

  // ---- defs
  var defs = el("defs", {});
  var g1 = el("radialGradient", { id: "body", cx: "0.38", cy: "0.12", r: "0.9", gradientUnits: "objectBoundingBox" }, defs);
  el("stop", { offset: "0", "stop-color": "#d9d4c7" }, g1);
  el("stop", { offset: "0.45", "stop-color": "#a9a497" }, g1);
  el("stop", { offset: "1", "stop-color": "#4a4741" }, g1);
  var g2 = el("radialGradient", { id: "glow", cx: "0.5", cy: "0.5", r: "0.5" }, defs);
  el("stop", { offset: "0.80", "stop-color": "#c9c3b2", "stop-opacity": "0.10" }, g2);
  el("stop", { offset: "1", "stop-color": "#c9c3b2", "stop-opacity": "0" }, g2);

  // ---- faint halo around the limb
  el("circle", { cx: cx, cy: cy, r: R0 + 330, fill: "url(#glow)" });

  // ---- the Moon: base disc out to zero, plus the year's relief
  var d = "M" + pt(A0 - 1, R0).map(f).join(",");
  // outline: base circle from far left, then relief, then base circle to far right, closing below
  var path = [];
  var aStart = -Math.PI * 0.75, aEnd = Math.PI * 0.75;
  for (var a = aStart; a < A0; a += 0.01) path.push(pt(a, R0));
  path.push(pt(A0, R0));
  for (var i = 0; i < N; i++) {
    var r = R0 + k * days[i];
    var aa = A0 + (A1 - A0) * i / N, ab = A0 + (A1 - A0) * (i + 1) / N;
    path.push(pt(aa, r));
    path.push(pt(ab, r));
  }
  path.push(pt(A1, R0));
  for (a = A1; a < aEnd; a += 0.01) path.push(pt(a, R0));
  path.push([cx + 2000, cy + 2000]); path.push([cx - 2000, cy + 2000]);
  el("path", { d: "M" + path.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join("L") + "Z",
               fill: "url(#body)" });

  // the zero line, cut into the body: below it is the Moon, above it is attention
  var zp = [];
  for (a = A0; a <= A1 + 1e-9; a += (A1 - A0) / 200) zp.push(pt(a, R0));
  el("path", { d: "M" + zp.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join("L"),
               fill: "none", stroke: "#3b3933", "stroke-width": 1, "stroke-opacity": 0.55 });

  // month ticks and names inside the body, below the zero line
  for (var m = 0; m < 12; m++) {
    var i0 = dayIndex(m, 1);
    var at = A0 + (A1 - A0) * i0 / N;
    var p1 = pt(at, R0), p2 = pt(at, R0 - 9);
    el("line", { x1: f(p1[0]), y1: f(p1[1]), x2: f(p2[0]), y2: f(p2[1]), stroke: "#3b3933", "stroke-opacity": 0.7 });
    var mid = ang(dayIndex(m, 15));
    var pl = pt(mid, R0 - 24);
    txt(MON[m], { x: f(pl[0]), y: f(pl[1]), "text-anchor": "middle", "dominant-baseline": "middle",
      transform: "rotate(" + f(mid * 180 / Math.PI) + " " + f(pl[0]) + " " + f(pl[1]) + ")",
      fill: "#3b3933", "font-size": 13, "font-style": "italic" });
  }
  var pyr = pt(0, R0 - 52);
  txt("2025", { x: f(pyr[0]), y: f(pyr[1]), "text-anchor": "middle", fill: "#4d4a43", "font-size": 12, "letter-spacing": "3" });

  // ---- scale arcs in the sky (views above zero)
  [10000, 15000].forEach(function (v) {
    var rr = R0 + k * v, sp = [];
    for (var a2 = A0; a2 <= A1 + 1e-9; a2 += (A1 - A0) / 240) sp.push(pt(a2, rr));
    el("path", { d: "M" + sp.map(function (p) { return f(p[0]) + "," + f(p[1]); }).join("L"),
                 fill: "none", stroke: "#8f8a7c", "stroke-opacity": 0.45, "stroke-width": 0.9, "stroke-dasharray": "1 4" });
    var la = -0.22, pl = pt(la, rr);
    txt(fmt(v) + " views", { x: f(pl[0]), y: f(pl[1]), "text-anchor": "middle", "dominant-baseline": "middle",
      fill: "#8f8a7c", "font-size": 11, "font-style": "italic", stroke: "#111215", "stroke-width": 5, "paint-order": "stroke",
      transform: "rotate(" + f(la * 180 / Math.PI) + " " + f(pl[0]) + " " + f(pl[1]) + ")" });
  });

  // ---- full moons of 2025 (UTC dates): small discs on an outer track
  var full = [[0,13],[1,12],[2,14],[3,13],[4,12],[5,11],[6,10],[7,9],[8,7],[9,7],[10,5],[11,4]];
  full.forEach(function (fd) {
    var i = dayIndex(fd[0], fd[1]);
    var pT = pt(ang(i), R0 + k * days[i] + 9);
    el("circle", { cx: f(pT[0]), cy: f(pT[1]), r: 3, fill: "#f3eedf" });
  });
  // key for the dots
  el("circle", { cx: 54, cy: 141, r: 3, fill: "#f3eedf" });
  txt("marks each of the year\u2019s twelve full moons, set on that day\u2019s height", { x: 64, y: 145, fill: "#a8a293", "font-size": 12, "font-style": "italic" });

  // ---- named peaks
  var notes = [
    [8, 7,  "7 Sep", "total lunar eclipse", -1, 38],
    [6, 20, "20 Jul", "Apollo 11 anniversary", -1, 40],
    [2, 14, "14 Mar", "total lunar eclipse", -1, 52],
    [9, 7,  "7 Oct", "supermoon", 1, 40],
    [1, 28, "28 Feb", "planets aligned", -1, 46],
    [10, 5, "5 Nov", "largest supermoon", 1, 46]
  ];
  notes.forEach(function (n) {
    var i = dayIndex(n[0], n[1]);
    var v = days[i];
    var a4 = ang(i);
    var top = pt(a4, R0 + k * v + 3);
    var lx = top[0] + n[4] * n[5], ly = top[1] - n[5] * 0.55;
    el("polyline", { points: f(top[0]) + "," + f(top[1]) + " " + f(lx) + "," + f(ly) + " " + f(lx + n[4] * 6) + "," + f(ly),
      fill: "none", stroke: "#a8a293", "stroke-width": 0.8 });
    var anchor = n[4] < 0 ? "end" : "start";
    var tx = lx + n[4] * 10;
    txt(n[2] + "  " + fmt(v), { x: f(tx), y: f(ly - 2), "text-anchor": anchor, fill: "#e8e3d4", "font-size": 13 });
    txt(n[3], { x: f(tx), y: f(ly + 13), "text-anchor": anchor, fill: "#a8a293", "font-size": 11.5, "font-style": "italic" });
  });

  // ---- title
  txt("The Limb", { x: 48, y: 64, fill: "#ece7d8", "font-size": 34, "font-style": "italic" });
  txt("2025, one day per step along the Moon's edge. The height of the edge is how many people", { x: 48, y: 92, fill: "#a8a293", "font-size": 13.5 });
  txt("read the English Wikipedia article “Moon” that day: 1,937,249 visits in all.", { x: 48, y: 110, fill: "#a8a293", "font-size": 13.5 });

  // ---- footnote inside the body
  var lo = Math.min.apply(null, days), hi = Math.max.apply(null, days);
  txt("Daily human page views, " + fmt(lo) + " to " + fmt(hi) + ", measured from the inner line.  Data: Wikimedia pageviews, CC0.",
    { x: 550, y: 776, "text-anchor": "middle", fill: "#3e3b35", "font-size": 11.5 });
})();
</script>
</body>
</html>
