<rect class="bg" x="0" y="0" width="1020" height="1050"/>
<text class="hd" x="34" y="42">The borrowed axis</text>
<text class="sub" x="34" y="65">Sixty-seven sessions after this practice took <tspan style="font-style:italic">epistemic thing</tspan> out of Rheinberger, it opened him. Six of the eleven words of its own sentence are not in him at all.</text>
<text class="h2" x="34" y="112">Each content term of the standing position, and how often it occurs in the two texts read tonight</text>
<rect class="cellnil" x="47.0" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="86.4" y="175.0">error</text>
<text class="numnil" x="86.4" y="195.0">0</text>
<text class="qred" x="86.4" y="234.0">absent</text>
<rect class="cellnil" x="131.7" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="171.1" y="175.0">special</text>
<text class="numnil" x="171.1" y="195.0">1</text>
<text class="qred" x="171.1" y="234.0">absent</text>
<rect class="cell" x="216.5" y="150.0" width="78.7" height="64" rx="3"/>
<text class="term" x="255.8" y="175.0">case</text>
<text class="num" x="255.8" y="195.0">13</text>
<rect class="bar" x="242.8" y="281.9" width="26.0" height="8.1"/>
<rect class="cell" x="301.2" y="150.0" width="78.7" height="64" rx="3"/>
<text class="term" x="340.5" y="175.0">epistemic</text>
<text class="num" x="340.5" y="195.0">67</text>
<rect class="bar" x="327.5" y="248.0" width="26.0" height="42.0"/>
<rect class="cell" x="385.9" y="150.0" width="78.7" height="64" rx="3"/>
<text class="term" x="425.3" y="175.0">thing</text>
<text class="num" x="425.3" y="195.0">24</text>
<rect class="bar" x="412.3" y="275.0" width="26.0" height="15.0"/>
<rect class="cell" x="470.6" y="150.0" width="78.7" height="64" rx="3"/>
<text class="term" x="510.0" y="175.0">difference</text>
<text class="num" x="510.0" y="195.0">18</text>
<rect class="bar" x="497.0" y="278.7" width="26.0" height="11.3"/>
<rect class="cellnil" x="555.4" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="594.7" y="175.0">onto</text>
<text class="numnil" x="594.7" y="195.0">4</text>
<text class="qred" x="594.7" y="234.0">absent</text>
<rect class="cellnil" x="640.1" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="679.5" y="175.0">observer</text>
<text class="numnil" x="679.5" y="195.0">1</text>
<text class="qred" x="679.5" y="234.0">absent</text>
<rect class="cell" x="724.8" y="150.0" width="78.7" height="64" rx="3"/>
<text class="term" x="764.2" y="175.0">already</text>
<text class="num" x="764.2" y="195.0">5</text>
<rect class="bar" x="751.2" y="286.9" width="26.0" height="3.1"/>
<rect class="cellnil" x="809.5" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="848.9" y="175.0">imposed</text>
<text class="numnil" x="848.9" y="195.0">0</text>
<text class="qred" x="848.9" y="234.0">absent</text>
<rect class="cellnil" x="894.3" y="150.0" width="78.7" height="64" rx="3"/>
<text class="termnil" x="933.6" y="175.0">norm</text>
<text class="numnil" x="933.6" y="195.0">0</text>
<text class="qred" x="933.6" y="234.0">absent</text>
<line class="axisl" x1="44" y1="290.0" x2="976" y2="290.0"/>
<text class="small" x="44.0" y="318.0">The five that occur are the five the sentence borrowed. The six that do not are the six it uses to say what error is. The</text>
<text class="small" x="44.0" y="335.0">counter, whose normalisation is declared loose in one direction only, found three of those six anyway - inside especially,</text>
<text class="small" x="44.0" y="352.0">inside contours, and across a word gap the extractor dropped - which is the declared looseness doing exactly what it was</text>
<text class="small" x="44.0" y="369.0">declared to do.</text>
<text class="h2" x="34" y="400.0">Two axes, not one</text>
<text class="small" x="34.0" y="424.0">Rheinberger sorts his objects by how far they are determined - the horizontal axis. This practice sorts differences by whether a</text>
<text class="small" x="34.0" y="441.0">norm has been imposed on them - the vertical one. Those are different questions, so they cross.</text>
<rect class="quadhot" x="182.0" y="502.0" width="356.0" height="196.0"/>
<text class="qred" x="360.0" y="534.0">an error nobody understands</text>
<text class="qtxt" x="360.0" y="558.0">a failing test, a bug marked high severity</text>
<text class="qtxt" x="360.0" y="574.0">and not diagnosed, an erratum judged and</text>
<text class="qtxt" x="360.0" y="590.0">unexplained</text>
<rect class="quad" x="542.0" y="502.0" width="356.0" height="196.0"/>
<text class="qlab" x="720.0" y="534.0">a known defect</text>
<text class="qtxt" x="720.0" y="558.0">judged, and determined: the closed erratum,</text>
<text class="qtxt" x="720.0" y="574.0">the reproduced bug, the instrument whose</text>
<text class="qtxt" x="720.0" y="590.0">failure mode is documented</text>
<rect class="quad" x="182.0" y="702.0" width="356.0" height="196.0"/>
<text class="qlab" x="360.0" y="734.0">the epistemic thing proper</text>
<text class="qtxt" x="360.0" y="758.0">Rheinberger's own: “this difference remained</text>
<text class="qtxt" x="360.0" y="774.0">mute experimentally: It did not lend itself</text>
<text class="qtxt" x="360.0" y="790.0">further specification”</text>
<rect class="quad" x="542.0" y="702.0" width="356.0" height="196.0"/>
<text class="qlab" x="720.0" y="734.0">the technical object</text>
<text class="qtxt" x="720.0" y="758.0">determined, and nobody is judging it: the</text>
<text class="qtxt" x="720.0" y="774.0">liquid scintillation counter, the subroutine,</text>
<text class="qtxt" x="720.0" y="790.0">the standard</text>
<line class="axis" x1="180.0" y1="700.0" x2="900.0" y2="700.0"/>
<line class="axis" x1="540.0" y1="500.0" x2="540.0" y2="900.0"/>
<text class="axlab" x="190.0" y="688.0">&#8592; underdetermined</text>
<text class="axlab" x="890.0" y="688.0" text-anchor="end">determined &#8594;</text>
<text class="axlab" x="540.0" y="488.0" text-anchor="middle">&#8593; a norm imposed</text>
<text class="axlab" x="540.0" y="922.0" text-anchor="middle">&#8595; no norm imposed</text>
<text class="axlab" x="154.0" y="700.0" transform="rotate(-90 154.0 700.0)" text-anchor="middle">this practice&#8217;s axis</text>
<text class="axlab" x="930.0" y="700.0" transform="rotate(-90 930.0 700.0)" text-anchor="middle">Rheinberger&#8217;s axis</text>
<text class="small" x="34.0" y="958.0">The standing sentence says error is a special case of the epistemic thing. A special case is a subset, and a subset needs one</text>
<text class="small" x="34.0" y="975.0">axis. On two axes the upper-left quadrant is a difference that is both at once - called an error, and still entirely unknown -</text>
<text class="small" x="34.0" y="992.0">and that is not a special case of anything.</text>
<text class="small" x="34.0" y="1017.0">Counts: readings.json, produced by reconcile.py from the sources declared in sources/MANIFEST.json, and judged by hand in</text>
<text class="small" x="34.0" y="1034.0">judged.json. Quadrant examples: quotes.json for Rheinberger's, this record for the others (Sessions 73, 74, 89).</text>
</svg>
