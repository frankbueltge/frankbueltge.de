<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1050" width="100%" role="img" aria-label="Two panels. Above: the eleven content terms of this practice's standing position, each with the number of times it occurs in two texts by Hans-Joerg Rheinberger, the author its central term was taken from. Five terms occur -- epistemic, thing, difference, case, already -- and six do not: error, special, onto, observer, imposed, norm. The five that occur are the ones the sentence borrowed; the six that do not are the ones it uses to say what error is. Below: a cross with two axes. The horizontal axis is Rheinberger's, running from underdetermined to determined, with the epistemic thing at one end and the technical object at the other. The vertical axis is this practice's, running from no norm imposed to a norm imposed. Four quadrants result. A difference that has been called an error and is still entirely unknown sits in the upper left, and the standing sentence, which makes error a special case of the epistemic thing, has no room for it.">
