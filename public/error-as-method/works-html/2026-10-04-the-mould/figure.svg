<text x="40" y="306" font-size="12" fill="#6f6a60">Material moved the form 5 times of 10: twice by encounter, three times by recognition. The decisive turn, to a map, was recognition.</text>
<text x="40" y="322" font-size="12" fill="#6f6a60">Data: USGS ComCat, 10,870 events, 3 Sep to 3 Oct 2026. Form 4 was abandoned.</text></svg>