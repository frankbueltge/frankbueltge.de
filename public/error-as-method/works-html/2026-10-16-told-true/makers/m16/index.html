  // crest at hour t=k*M2 + phase; in row r, local hour = t - 24r ; draw as line through all rows
  const t0=k*M2+5;
  // continuous line: local hour at row r = t0 + r*(Math.round(24/M2*... )) -> simpler: per row increment 24 - 2*M2 hours earlier
  const drift=2*M2-24;                       // +0.84 h per day
  el("line",{x1:X0+t0*CW,y1:Y0,x2:X0+(t0+drift*DAYS)*CW,y2:Y0+DAYS*RH,stroke:MOON,"stroke-width":1.3,"stroke-opacity":.9},gm);
}

// actogram, double-plotted: row r shows hours 24r .. 24r+47, each hour a tile shaded by its value

const LO=77, HI=46;                          // source rows mapped to palest / darkest
function shade(y){
  let f=(LO-y)/(LO-HI); f=Math.max(0,Math.min(1,f)); f=Math.pow(f,1.15);
  const a=[236,229,214], b=[24,31,44];
  return `rgb(${a.map((c,i)=>Math.round(c+(b[i]-c)*f)).join(",")})`;
}
