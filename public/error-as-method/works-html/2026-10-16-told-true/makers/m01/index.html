<text x="150" y="86" class="s">1,464 hours of one measured quantity, cut into days at the hour it is usually lowest and laid one beneath the next.</text>
<text x="150" y="104" class="s">Each row climbs once and falls once. Red marks the hours that broke well above the usual swell.</text>
