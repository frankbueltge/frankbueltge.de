  // Reading of the image: 1,464 hourly values drawn from dot centre x=3.0 to x=295.3.
  var X0 = 3.0, X1 = 295.3, N = 1464;
  var HPP = (N - 1) / (X1 - X0);          // hours per image column (~5.0)
  var DAYS = 61;

  var W = 1100, H = 800;
  var cv = document.getElementById('c');
  var dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  var g = cv.getContext('2d');
  g.scale(dpr, dpr);

  var PAPER = '#f2eee5', INK = [28, 34, 48], RUST = '#b4512b', GREY = '#8a8478';

  // Layout
  var PX0 = 92, PX1 = 1052;               // 48 hours across
  var PW = PX1 - PX0, HOUR = PW / 48;
  var BASE0 = 176, BASE1 = 742;           // baseline of day 1 ... day 61
  var PITCH = (BASE1 - BASE0) / (DAYS - 1);
  var S = 0.40;                           // vertical scale: image px -> page px
  var YFLOOR = 88;                        // image row taken as the baseline

  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);

  function text(s, x, y, font, color, align){
    g.font = font; g.fillStyle = color; g.textAlign = align || 'left'; g.fillText(s, x, y);
  }

  var img = new Image();
  img.onload = function(){
    var oc = document.createElement('canvas'); oc.width = 300; oc.height = 90;
    var og = oc.getContext('2d'); og.fillStyle = '#fff'; og.fillRect(0,0,300,90); og.drawImage(img, 0, 0);
    var px = og.getImageData(0, 0, 300, 90).data;
    // ink[x][y] in 0..1
    var ink = [];
    for (var x = 0; x < 300; x++){
      var col = new Float32Array(90);
      for (var y = 0; y < 90; y++){
        var i = (y * 300 + x) * 4;
        var L = 0.299*px[i] + 0.587*px[i+1] + 0.114*px[i+2];
        col[y] = Math.max(0, Math.min(1, (255 - L - 14) / 190));
      }
      ink.push(col);
    }
    function inkAt(t, y){                 // t in hours from the first reading
      if (t < -0.5 || t > N - 0.5) return 0;
      var fx = X0 + t / HPP, a = Math.floor(fx), f = fx - a;
      var u = (a >= 0 && a < 300) ? ink[a][y] : 0, v = (a+1 >= 0 && a+1 < 300) ? ink[a+1][y] : 0;
      return u * (1 - f) + v * f;
    }

    // faint hour grid
    g.lineWidth = 1;
    for (var h = 0; h <= 48; h += 6){
      var xx = Math.round(PX0 + h * HOUR) + 0.5;
      g.strokeStyle = (h % 24 === 0) ? 'rgba(28,34,48,0.16)' : 'rgba(28,34,48,0.06)';
      g.beginPath(); g.moveTo(xx, BASE0 - 40); g.lineTo(xx, BASE1 + 8); g.stroke();
    }

    // one number per image column: the ink-weighted height of its dots
    // (each column holds about five hourly readings)
    var lev = new Float32Array(300), has = new Uint8Array(300);
    for (var x2 = 0; x2 < 300; x2++){
      var sw = 0, sy = 0;
      for (var y2 = 0; y2 < 90; y2++){ sw += ink[x2][y2]; sy += ink[x2][y2] * y2; }
      if (sw > 0.8){ lev[x2] = YFLOOR - sy / sw; has[x2] = 1; }
    }
    // take away each moment's own day-long mean, so what is left is the shape of the day
    var raw = Float32Array.from(lev), HALF = 12 / HPP;   // +-12 h in columns
    for (var x3 = 0; x3 < 300; x3++){
      if (!has[x3]) continue;
      var sum = 0, wsum = 0;
      for (var x4 = Math.floor(x3 - HALF - 1); x4 <= Math.ceil(x3 + HALF + 1); x4++){
        if (x4 < 0 || x4 >= 300 || !has[x4]) continue;
        var w = Math.max(0, Math.min(1, HALF + 0.5 - Math.abs(x4 - x3)));
        sum += w * raw[x4]; wsum += w;
      }
      lev[x3] = raw[x3] - sum / wsum;
    }
    var vals = []; for (var q = 0; q < 300; q++) if (has[q]) vals.push(lev[q]);
    vals.sort(function(a,b){return a-b;});
    var LO = vals[Math.floor(vals.length*0.04)], HI = vals[Math.floor(vals.length*0.97)];
    function levAt(t){
      if (t < -0.5 || t > N - 0.5) return null;
      var fx = X0 + t / HPP, a = Math.floor(fx), f = fx - a;
      if (!has[a]) return has[a+1] ? lev[a+1] : null;
      if (!has[a+1]) return lev[a];
      return lev[a] * (1 - f) + lev[a+1] * f;
    }
    // paper -> ink, eased so the middle of the range stays readable
    var P = [242,238,229], D = [20,26,40];
    function tone(v){
      var u = Math.max(0, Math.min(1, (v - LO) / (HI - LO)));
      u = Math.pow(u, 1.15);
      return 'rgb(' + Math.round(P[0]+(D[0]-P[0])*u) + ',' + Math.round(P[1]+(D[1]-P[1])*u) + ',' + Math.round(P[2]+(D[2]-P[2])*u) + ')';
    }
    var R = 4, CELL = HOUR / R, ROWH = PITCH - 1.6;
    for (var k = 0; k < DAYS; k++){
      var top = BASE0 + k * PITCH - ROWH;
      for (var s = 0; s < 48 * R; s++){
        var v = levAt(24 * k + (s + 0.5) / R);
        if (v === null) continue;
        g.fillStyle = tone(v);
        g.fillRect(PX0 + s * CELL, top, CELL + 0.6, ROWH);
      }
    }

    // where a lunar high water would walk: 24 h 50.5 min between crests,
    // started at the crest of the record's first ten days (hour 7.2)
    var H0 = 7.2, LAG = 24 * (1/0.9661368 - 1);   // 0.84 h a day later
    g.strokeStyle = RUST; g.lineWidth = 1.3; g.globalAlpha = 0.85; g.lineCap = 'round';
    for (var off = -48; off <= 48; off += 24){
      g.beginPath(); var pen = false;
      for (var k2 = 0; k2 < DAYS; k2++){
        var hh = H0 + off + LAG * k2;
        var yb = BASE0 + k2 * PITCH - PITCH/2;
        if (hh < 0 || hh > 48){ pen = false; continue; }
        var xh = PX0 + hh * HOUR;
        if (!pen){ g.moveTo(xh, yb); pen = true; } else g.lineTo(xh, yb);
      }
      g.stroke();
    }
    g.globalAlpha = 1;

    // labels
    var SANS = '11px "Helvetica Neue", Helvetica, Arial, sans-serif';
    for (var h2 = 0; h2 <= 48; h2 += 6){
      text(String(h2 % 24 === 0 && h2 > 0 ? (h2 === 24 ? '24' : '48') : h2), PX0 + h2 * HOUR, BASE1 + 22, SANS, GREY, 'center');
    }
    text('hours from the start of each day of the record', PX0 + PW/2, BASE1 + 40, SANS, GREY, 'center');
    [1, 10, 20, 30, 40, 50, 61].forEach(function(dn){
      text('day ' + dn, PX0 - 14, BASE0 + (dn - 1) * PITCH - 1, SANS, GREY, 'right');
    });

    text('Fifty Minutes Late', 92, 60, 'italic 34px Georgia, "Times New Roman", serif', '#1c2230');
    text('Sixty-one days of an hourly harbour record, cut into days and laid one under the next (each row shows its day, then the following one).',
         93, 92, '13px Georgia, "Times New Roman", serif', '#3b3f48');
    text('Darker means higher than the surrounding day. High water driven by the moon would arrive fifty minutes later each day, along the red line.',
         93, 111, '13px Georgia, "Times New Roman", serif', '#3b3f48');
    g.fillStyle = RUST; g.fillRect(PX1 - 160, 104, 18, 1.6);
    text('lunar day, 24 h 50 min', PX1 - 136, 108, SANS, RUST);
  };
  img.src = SRC;
})();
</script>
