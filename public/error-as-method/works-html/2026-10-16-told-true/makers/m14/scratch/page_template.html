<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wound on a Day</title>
<style>
:root{--bg:#0a1116;--ink:#d9d4c7;--dim:#7d8a8f;--rule:#24323a}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{width:1100px;height:800px;overflow:hidden;font-family:Georgia,"Times New Roman",serif}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1100" height="800"></canvas>
<script>
const D=__DATA__;
const cv=document.getElementById('c'),dpr=Math.max(1,window.devicePixelRatio||1);
cv.width=1100*dpr;cv.height=800*dpr;cv.style.width='1100px';cv.style.height='800px';
const g=cv.getContext('2d');g.scale(dpr,dpr);
const BG='#0a1116',INK='#d9d4c7',DIM='#7d8a8f';
g.fillStyle=BG;g.fillRect(0,0,1100,800);

const raw=D.v,N=raw.length;
// each hour measured against the 24 hours centred on it, so the daily rise and fall shows, not the slower drift
const v=raw.map((x,i)=>{let s=0,n=0;for(let j=Math.max(0,i-12);j<=Math.min(N-1,i+12);j++){s+=raw[j];n++}return x-s/n});
const sorted=[...v].sort((a,b)=>a-b),lo=sorted[Math.floor(N*.02)],hi=sorted[Math.floor(N*.98)];
const stops=[[0,[18,44,62]],[.3,[28,86,104]],[.55,[96,150,146]],[.8,[226,206,158]],[1,[255,246,226]]];
function col(x){x=Math.max(0,Math.min(1,x));for(let k=1;k<stops.length;k++){if(x<=stops[k][0]){const[a,ca]=stops[k-1],[b,cb]=stops[k],f=(x-a)/(b-a);return'rgb('+ca.map((c,j)=>Math.round(c+(cb[j]-c)*f)).join(',')+')'}}}
const CX=410,CY=406,R0=38,DR=5.48;
const ang=t=>-Math.PI/2+2*Math.PI*t/24, rad=t=>R0+DR*t/24;
const P=t=>[CX+rad(t)*Math.cos(ang(t)),CY+rad(t)*Math.sin(ang(t))];

// faint hour spokes
g.strokeStyle='rgba(217,212,199,0.07)';g.lineWidth=1;
for(let h=0;h<24;h++){const a=ang(h);g.beginPath();g.moveTo(CX+(R0-6)*Math.cos(a),CY+(R0-6)*Math.sin(a));g.lineTo(CX+(R0+DR*61+6)*Math.cos(a),CY+(R0+DR*61+6)*Math.sin(a));g.stroke();}

// the record wound on a 24-hour clock
g.lineWidth=DR*0.94;g.lineCap='butt';
const S=6;
for(let i=0;i<N-1;i++){for(let k=0;k<S;k++){
  const t0=i+k/S,t1=i+(k+1)/S+0.02,val=v[i]+(v[i+1]-v[i])*(k+.5)/S;
  const[a0,b0]=P(t0),[a1,b1]=P(t1);
  g.strokeStyle=col((val-lo)/(hi-lo));g.beginPath();g.moveTo(a0,b0);g.lineTo(a1,b1);g.stroke();}}

// the lunar reference: where a semidiurnal high water would travel (50.5 min later per day)
let h0=0,best=-1e9;for(let h=0;h<24;h++){let s=0,n=0;for(let d=0;d<3;d++){s+=v[d*24+h];n++}if(s/n>best){best=s/n;h0=h}}
g.save();g.setLineDash([5,4]);g.strokeStyle='rgba(255,255,255,0.85)';g.lineWidth=1.5;g.beginPath();
let lx,ly;for(let d=0;d<=60.6;d+=0.02){const h=h0+d*50.5/60,a=ang(h),r=rad(d*24+h);lx=CX+r*Math.cos(a);ly=CY+r*Math.sin(a);d?g.lineTo(lx,ly):g.moveTo(lx,ly);}g.stroke();g.restore();

// isolated high readings, lifted clear of the band in the original
for(const[i,h]of D.out){const[x,y]=P(i);const r=1.4+Math.max(0,h-50)/14;
  const gr=g.createRadialGradient(x,y,0,x,y,r*4);gr.addColorStop(0,'rgba(255,250,235,0.55)');gr.addColorStop(1,'rgba(255,250,235,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r*4,0,7);g.fill();g.fillStyle='#fffaf0';g.beginPath();g.arc(x,y,r,0,7);g.fill();}

// clock marks
g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';g.textAlign='center';g.textBaseline='middle';
const RE=R0+DR*61+16;
[[0,'h 0'],[6,'6'],[12,'12'],[18,'18']].forEach(([h,s])=>{const a=ang(h);g.fillText(s,CX+RE*Math.cos(a),CY+RE*Math.sin(a));});
g.fillText('day 1',CX,CY);

// right panel
const X=812;let y=64;
g.textAlign='left';g.textBaseline='alphabetic';
g.fillStyle=INK;g.font='italic 34px Georgia,serif';g.fillText('Wound on a Day',X,y);y+=26;
g.fillStyle=DIM;g.font='13px Georgia,serif';g.fillText('61 days of hourly readings from a harbour,',X,y);y+=18;g.fillText('one turn of the spiral per 24 hours',X,y);y+=40;

// the record as received
const sw=260,sh=78,sx=X,sy=y;
g.fillStyle='rgba(217,212,199,0.05)';g.fillRect(sx-4,sy-4,sw+8,sh+8);
for(const[bx,by,dk]of D.blobs){g.fillStyle='rgba(217,212,199,'+Math.min(1,dk/200).toFixed(2)+')';g.beginPath();g.arc(sx+bx*sw/300,sy+by*sh/90,0.9,0,7);g.fill();}
y+=sh+22;g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';g.fillText('the record as received, left to right',X,y);y+=42;

function para(lines){g.fillStyle=INK;g.font='14px Georgia,serif';for(const l of lines){g.fillText(l,X,y);y+=20}y+=14}
para(['Day 1 sits at the centre, day 61 at the rim.','Pale: above the day around it.','Dark: below it.']);
// colour key
for(let k=0;k<200;k++){g.fillStyle=col(k/199);g.fillRect(X+k,y-10,1.2,10);}
g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';g.fillText('below',X,y+14);g.textAlign='right';g.fillText('above',X+200,y+14);g.textAlign='left';y+=50;
para(['A tide follows the moon and comes back','about fifty minutes later each day. Its','high water would ride the dashed line,','twice round the clock in sixty-one days.']);
para(['The pale ridge does not lean. It stands','at the same hour, turn after turn: what','these readings rise and fall with is','the sun.']);
// spike key
g.fillStyle='#fffaf0';g.beginPath();g.arc(X+5,y-5,2.4,0,7);g.fill();
g.fillStyle=INK;g.font='14px Georgia,serif';g.fillText('readings that leapt far above the rest',X+18,y);y+=40;
g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';
['Read back from a 300-pixel picture: each','pixel holds about five hours, so each turn','is softened to that width. Hour 0 is the','first reading, not a known clock time.'].forEach(l=>{g.fillText(l,X,y);y+=15});
</script></body></html>
