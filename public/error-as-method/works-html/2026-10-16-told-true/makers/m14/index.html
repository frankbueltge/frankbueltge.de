[[0,'h 0'],[6,'6'],[12,'12'],[18,'18']].forEach(([h,s])=>{const a=ang(h);g.fillText(s,CX+RE*Math.cos(a),CY+RE*Math.sin(a));});
g.fillText('day 1',CX,CY);

// right panel
const X=812;let y=64;
g.textAlign='left';g.textBaseline='alphabetic';
g.fillStyle=INK;g.font='italic 34px Georgia,serif';g.fillText('Wound on a Day',X,y);y+=26;
g.fillStyle=DIM;g.font='13px Georgia,serif';g.fillText('61 days of hourly readings from a harbour,',X,y);y+=18;g.fillText('one turn of the spiral per 24 hours',X,y);y+=40;

// the record as received
const sw=260,sh=78,sx=X,sy=y;
g.fillStyle='rgba(217,212,199,0.05)';g.fillRect(sx-4,sy-4,sw+8,sh+8);
for(const[bx,by,dk]of D.blobs){g.fillStyle='rgba(217,212,199,'+Math.min(1,dk/200).toFixed(2)+')';g.beginPath();g.arc(sx+bx*sw/300,sy+by*sh/90,0.9,0,7);g.fill();}
y+=sh+22;g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';g.fillText('the record as received, left to right',X,y);y+=42;

function para(lines){g.fillStyle=INK;g.font='14px Georgia,serif';for(const l of lines){g.fillText(l,X,y);y+=20}y+=14}
para(['Day 1 sits at the centre, day 61 at the rim.','Pale: above the day around it.','Dark: below it.']);
// colour key
for(let k=0;k<200;k++){g.fillStyle=col(k/199);g.fillRect(X+k,y-10,1.2,10);}
g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';g.fillText('below',X,y+14);g.textAlign='right';g.fillText('above',X+200,y+14);g.textAlign='left';y+=50;
para(['A tide follows the moon and comes back','about fifty minutes later each day. Its','high water would ride the dashed line,','twice round the clock in sixty-one days.']);
para(['The pale ridge does not lean. It stands','at the same hour, turn after turn: what','these readings rise and fall with is','the sun.']);
// spike key
g.fillStyle='#fffaf0';g.beginPath();g.arc(X+5,y-5,2.4,0,7);g.fill();
g.fillStyle=INK;g.font='14px Georgia,serif';g.fillText('readings that leapt far above the rest',X+18,y);y+=40;
g.fillStyle=DIM;g.font='11px ui-monospace,Menlo,monospace';
['Read back from a 300-pixel picture: each','pixel holds about five hours, so each turn','is softened to that width. Hour 0 is the','first reading, not a known clock time.'].forEach(l=>{g.fillText(l,X,y);y+=15});
</script></body></html>
