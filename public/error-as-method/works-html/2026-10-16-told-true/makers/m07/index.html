<text x="60" y="610" font-size="22" font-style="italic">Sixty-One Breaths</text>
<text x="60" y="640" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">One line, 1,464 hours of carbon</text>
<text x="60" y="657" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">dioxide in the air.</text>
<text x="60" y="691" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">Each turn is one day; the record</text>
<text x="60" y="708" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">winds outward from the centre.</text>
<text x="60" y="742" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">The line swells and darkens where</text>
<text x="60" y="759" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">the air held more, and draws in</text>
<text x="60" y="776" font-size="12.5" letter-spacing="0.3" fill-opacity="0.72">where it held less.</text>
