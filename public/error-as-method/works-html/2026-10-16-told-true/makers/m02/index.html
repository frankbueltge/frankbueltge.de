<title>Sixty-One Lines</title>
<style>
  :root { --paper:#f3efe6; --ink:#1d2430; }
  html,body { margin:0; height:100%; background:var(--paper); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }

<body>
<canvas id="c"></canvas>
<script>
// Material: for each of the 296 inked pixel columns of the original 300x90 picture
// (x = 2..297), the ink-weighted centre, the topmost and the lowest inked row.
// Each column holds about five consecutive hourly dots; one day is 296/61 = 4.85 columns.
const COLS = [[70.2,69,71],[61.4,49,71],[49.4,45,57],[54.9,45,64],[62.2,57,65],[62.7,60,65],[55.8,45,63],[46.3,43,50],[53.0,48,59],[60.7,55,67],[63.3,54,68],[50.1,36,67],[41.2,35,61],[56.0,35,69],[60.9,56,69],[55.8,51,59],[51.7,50,54],[49.8,47,54],[56.5,47,65],[64.6,59,68],[62.7,54,68],[54.9,51,61],[51.3,47,60],[60.7,48,67],[67.9,66,70],[62.3,52,69],[47.7,42,54],[50.2,42,62],[65.3,61,69],[64.3,51,69],[57.3,50,68],[50.9,46,59],[54.4,46,63],[66.8,62,73],[69.2,57,73],[64.3,55,72],[54.4,48,62],[56.9,48,67],[67.5,61,71],[69.0,64,72],[63.5,59,69],[55.2,48,63],[64.9,50,73],[72.1,70,74],[73.2,71,75],[64.8,56,73],[56.9,51,70],[69.0,54,74],[73.3,72,75],[75.7,73,78],[72.2,66,79],[52.7,27,72],[67.9,27,79],[77.6,75,80],[70.3,61,79],[59.0,54,65],[61.6,55,77],[73.6,65,77],[73.5,71,75],[66.1,59,74],[58.0,53,64],[62.2,53,69],[74.5,66,82],[76.0,69,81],[63.1,56,75],[55.5,48,65],[66.8,48,74],[72.7,69,75],[69.9,64,74],[63.3,60,68],[57.7,53,63],[60.6,54,69],[69.8,63,73],[67.1,58,73],[58.7,53,66],[54.3,49,62],[66.5,50,73],[72.6,69,76],[70.9,61,76],[59.2,48,70],[50.2,40,70],[68.2,52,72],[72.2,71,74],[67.9,59,74],[56.9,47,67],[58.5,47,73],[72.1,64,76],[75.2,73,77],[72.3,62,77],[60.5,45,71],[52.4,34,71],[70.6,66,73],[72.8,71,75],[70.5,62,75],[48.6,37,66],[60.8,38,77],[75.8,74,77],[76.9,75,79],[68.9,59,77],[59.7,29,77],[66.9,29,79],[77.6,76,79],[76.2,74,78],[72.9,70,77],[68.7,58,74],[73.6,67,77],[78.4,74,82],[72.3,60,82],[56.8,50,69],[54.6,49,63],[65.5,57,71],[71.1,69,73],[70.5,62,73],[60.2,47,73],[60.2,47,73],[74.9,70,78],[73.1,66,77],[63.0,53,75],[48.6,37,58],[55.2,37,65],[68.5,62,73],[73.1,69,76],[67.4,60,73],[55.7,37,65],[61.7,37,71],[72.1,69,76],[75.3,72,78],[65.1,47,77],[46.9,41,54],[64.3,41,79],[79.4,77,83],[75.9,63,84],[65.2,58,73],[62.4,57,68],[69.7,62,74],[68.1,65,74],[55.7,34,67],[39.8,31,60],[37.0,30,43],[46.1,31,61],[55.1,47,62],[50.2,46,58],[46.6,41,54],[50.3,41,58],[64.2,57,73],[70.9,68,74],[58.3,49,72],[46.8,41,53],[52.7,42,65],[64.5,61,66],[59.4,51,66],[52.9,51,55],[47.6,43,52],[62.7,43,74],[73.2,70,76],[65.0,50,75],[53.2,46,60],[46.9,42,56],[62.9,55,67],[67.8,66,70],[68.0,66,70],[57.9,31,70],[36.7,22,60],[60.1,31,69],[63.4,62,65],[55.2,48,64],[50.9,45,60],[58.6,47,63],[69.3,60,74],[70.3,65,74],[58.6,46,70],[36.4,5,51],[53.2,5,75],[74.1,67,77],[74.4,71,77],[66.1,41,75],[47.8,39,64],[58.5,39,68],[68.6,64,72],[69.2,64,72],[65.1,59,71],[64.4,47,69],[47.1,25,66],[58.3,38,69],[67.3,63,70],[58.4,51,64],[56.8,48,71],[66.7,51,74],[72.0,69,74],[68.7,57,74],[48.0,39,69],[52.8,41,66],[67.6,60,72],[70.6,66,73],[64.6,56,73],[53.5,47,62],[55.4,46,70],[69.3,64,73],[71.3,65,74],[62.6,56,74],[54.1,48,61],[58.4,48,70],[70.4,61,75],[68.8,64,75],[64.8,62,68],[60.6,56,66],[59.2,54,66],[63.9,61,66],[62.3,57,66],[54.7,41,63],[47.9,41,61],[61.9,51,69],[68.0,66,70],[65.6,61,70],[57.4,52,64],[55.4,51,63],[65.1,57,70],[68.6,66,71],[66.3,59,70],[50.0,24,64],[35.6,20,59],[60.2,38,66],[66.1,63,69],[64.0,61,67],[59.1,55,63],[59.8,51,72],[70.1,59,74],[73.5,72,75],[65.3,47,74],[41.8,33,55],[56.2,35,69],[68.3,59,72],[68.4,64,72],[61.1,57,65],[57.0,53,61],[63.3,53,72],[70.1,66,73],[70.6,67,73],[52.8,40,70],[44.2,28,68],[63.4,28,72],[70.8,66,73],[65.3,59,72],[57.9,54,62],[54.3,51,61],[59.1,52,64],[64.3,61,67],[61.7,57,67],[55.4,51,60],[55.6,51,64],[65.2,59,70],[67.2,62,70],[62.0,53,70],[52.5,42,60],[55.7,42,71],[70.8,65,74],[71.0,65,74],[58.7,48,68],[51.1,42,61],[61.1,56,67],[68.1,64,71],[65.6,59,70],[60.3,58,63],[57.6,43,62],[60.9,43,70],[69.4,66,72],[60.8,54,72],[49.7,44,55],[50.9,45,57],[58.8,50,65],[64.2,62,66],[61.6,56,65],[55.1,49,61],[50.7,48,54],[61.0,51,72],[68.7,60,74],[60.7,53,69],[51.6,45,60],[50.7,44,66],[64.4,54,70],[65.7,54,70],[50.7,39,66],[40.1,37,45],[49.9,37,61],[61.9,58,65],[59.2,48,65],[45.0,31,56],[47.6,38,54],[50.0,40,63],[60.3,51,64],[58.3,51,64],[51.3,48,53],[53.1,48,58],[59.7,53,65],[64.9,64,66],[64.5,64,65]];
// first hourly dot centred at x~3.2, last at ~296.8: one hour = 0.2007 px, one day = 4.816 px
const C0 = 2, A0 = 3.1, HOUR = (296.8-3.2)/1463, P = 24*HOUR, YREF = 62;

const W = 1100, H = 800;
const cv = document.getElementById('c');
const dpr = Math.max(1, window.devicePixelRatio || 1);
cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
const g = cv.getContext('2d'); g.scale(dpr, dpr);

const PAPER = '#f3efe6', INK = '29,36,48', RED = '178,58,38';
g.fillStyle = PAPER; g.fillRect(0,0,W,H);

const L = 150, R = 1010, TOP = 112, ROW = 10.4, S = 1.15;
const span = R - L;

// Catmull-Rom through points [[x,y],...], evaluated densely
function curve(pts){
  const o=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<12;k++){
      const t=k/12,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      o.push([f(p0[0],p1[0],p2[0],p3[0]), f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
  o.push(pts[pts.length-1]);
  return o;
}

// faint hour guides: the record's own clock, counted from its first value
g.strokeStyle = 'rgba('+INK+',0.07)'; g.lineWidth = 1;
for(let h=0;h<=24;h+=6){
  const x = L + span*h/24 + 0.5;
  g.beginPath(); g.moveTo(x, TOP-22); g.lineTo(x, TOP + 60*ROW + 30); g.stroke();
}

for(let d=0; d<61; d++){
  const a = A0 + d*P, b = a + P;
  const base = TOP + d*ROW;
  const pts = [];
  for(let i=0;i<COLS.length;i++){
    const xc = C0 + i + 0.5;
    if (xc < a - 2.2 || xc > b + 2.2) continue;
    const [c,t,bt] = COLS[i];
    const X = L + span*(xc - a)/P;
    pts.push({X, c: base + (c-YREF)*S, t: base + (t-0.5-YREF)*S, b: base + (bt+0.5-YREF)*S, raw:[c,t,bt]});
  }
  const ct = curve(pts.map(p=>[p.X,p.c]));
  const tp = curve(pts.map(p=>[p.X,p.t]));
  const bt = curve(pts.map(p=>[p.X,p.b]));

  g.save();
  g.beginPath(); g.rect(L, 0, span, H); g.clip();

  // the spread of the hours inside each column, as a pale wash
  g.beginPath();
  tp.forEach(([x,y],k)=> k?g.lineTo(x,y):g.moveTo(x,y));
  for(let k=bt.length-1;k>=0;k--) g.lineTo(bt[k][0],bt[k][1]);
  g.closePath();
  g.fillStyle = 'rgba('+INK+',0.06)'; g.fill();

  // the day's line
  g.beginPath();
  ct.forEach(([x,y],k)=> k?g.lineTo(x,y):g.moveTo(x,y));
  g.strokeStyle = 'rgba('+INK+',0.82)'; g.lineWidth = 1.05; g.lineJoin='round'; g.stroke();

  // the columns actually present in the picture: the only true samples
  for(const p of pts){
    g.beginPath(); g.arc(p.X, p.c, 1.25, 0, Math.PI*2);
    g.fillStyle = 'rgba('+INK+',0.9)'; g.fill();
    // a brief rise far above the rest of its column: drawn as a red stroke
    if (p.raw[1] < p.raw[0] - 15){
      g.beginPath(); g.moveTo(p.X, p.c); g.lineTo(p.X, p.t);
      g.strokeStyle = 'rgba('+RED+',0.85)'; g.lineWidth = 1.1; g.stroke();
      g.beginPath(); g.arc(p.X, p.t, 1.6, 0, Math.PI*2);
      g.fillStyle = 'rgba('+RED+',0.95)'; g.fill();
    }
  }
  g.restore();

  // day numbers, sparsely
  if (d===0 || (d+1)%10===0){
    g.fillStyle = 'rgba('+INK+',0.5)';
    g.font = '10px Georgia, "Times New Roman", serif';
    g.textAlign = 'right'; g.textBaseline = 'middle';
    g.fillText(String(d+1), L-16, base);
  }
}

// text
g.fillStyle = 'rgba('+INK+',0.88)';
g.font = 'italic 22px Georgia, "Times New Roman", serif';
g.textAlign = 'left'; g.textBaseline = 'alphabetic';
g.fillText('Sixty-One Lines', L, 42);
g.font = '11px Georgia, "Times New Roman", serif';
g.fillStyle = 'rgba('+INK+',0.55)';
g.fillText('one record, cut every twenty-four hours and laid down like a drum chart; higher is more', L, 60);
g.textAlign = 'center';
const lab = ['hour 0','6','12','18','24'];
for(let h=0;h<=24;h+=6){ g.fillText(lab[h/6], L + span*h/24, TOP-30); }
g.textAlign = 'right';
g.fillText('day', L-16, TOP-30);
g.textAlign = 'left';
g.fillText('dots: the 4–5 positions per day the source picture can resolve — the line between them is drawn, not measured', L, TOP + 60*ROW + 44);
g.fillStyle = 'rgba('+RED+',0.85)';
g.fillText('red: an hour or two that leapt far above its neighbours', L, TOP + 60*ROW + 60);
</script>
