<!doctype html>
<html><head><meta charset="utf-8"><title>The Long Wait</title>
<style>html,body{margin:0;background:#efe9dc;}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="data.js"></script>
<script>
const R = window.PRIZES.rows;
const W=1100,H=800, cv=document.getElementById('c'), dpr=window.devicePixelRatio||1;
cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
const g=cv.getContext('2d'); g.scale(dpr,dpr);
const PAPER='#efe9dc', INK='#1f1c18', RED='#c2391b', BLUE='#2a5d8a';
g.fillStyle=PAPER; g.fillRect(0,0,W,H);

const Y0=1815, Y1=2030, L=40, RR=1060, base=430;
const X=y=>L+(y-Y0)/(Y1-Y0)*(RR-L);
const SCI=new Set(['Physics','Chemistry','Physiology or Medicine']);
const up=r=>SCI.has(r[1]);

function arc(r, col, a, w){
  const x0=X(r[4]), x1=X(r[0]), rad=(x1-x0)/2, cx=(x0+x1)/2, u=up(r);
  g.save(); g.beginPath();
  if(u) g.rect(0,150,W,base-150); else g.rect(0,base,W,H-base-60);
  g.clip();
  g.strokeStyle=col; g.globalAlpha=a; g.lineWidth=w;
  g.beginPath(); g.arc(cx,base,rad, u?Math.PI:0, u?2*Math.PI:Math.PI); g.stroke();
  g.restore();
}
// men first, then women and organisations on top
const rows=R.filter(r=>r[4]!=null);
// stroke weight: the laureate's own purse, share x prize amount in today's kronor
const MAXP=Math.max(...R.map(r=>r[6]*r[8]));
const purse=r=>r[6]*r[8]/MAXP;
rows.filter(r=>r[3]==='man').forEach(r=>arc(r,INK,0.08+0.30*purse(r),0.3+2.2*purse(r)));
rows.filter(r=>r[3]==='organisation').forEach(r=>arc(r,BLUE,0.8,0.6+2.2*purse(r)));
rows.filter(r=>r[3]==='woman').forEach(r=>arc(r,RED,0.75,0.6+2.2*purse(r)));

function halo(txt,x,y,align,col,font){
  g.font=font||'italic 11px Georgia, serif'; g.textAlign=align||'left';
  g.lineJoin='round'; g.lineWidth=4; g.strokeStyle='rgba(239,233,220,0.92)'; g.strokeText(txt,x,y);
  g.fillStyle=col||'rgba(31,28,24,0.85)'; g.fillText(txt,x,y);
}
// axis
g.globalAlpha=1; g.strokeStyle=INK; g.lineWidth=1;
g.beginPath(); g.moveTo(L,base+.5); g.lineTo(RR,base+.5); g.stroke();
// the spine: in each prize year, one small block per laureate, sciences up, the rest down
{ const by={}; R.forEach(r=>{(by[r[0]]=by[r[0]]||[]).push(r);});
  const w=X(1)-X(0);
  for(const y in by){
    const list=by[y].sort((a,b)=>(a[3]==='man'?0:1)-(b[3]==='man'?0:1));
    let nu=0, nd=0;
    list.forEach(r=>{
      g.fillStyle=r[3]==='woman'?RED:r[3]==='organisation'?BLUE:INK;
      const yy = up(r) ? base-3-(nu++)*2.6 : base+2+(nd++)*2.6;
      const c=g.fillStyle; g.fillStyle=PAPER; g.fillRect(X(+y)-w*0.5, yy-0.5, w, 2.9); g.fillStyle=c;
      g.fillRect(X(+y)-w*0.36, yy, w*0.72, 1.9);
    });
  }
  g.strokeStyle=INK; g.lineWidth=1; g.beginPath(); g.moveTo(L,base+.5); g.lineTo(RR,base+.5); g.stroke();
  g.fillStyle=PAPER; g.fillRect(X(1939.5),base-17,X(1942.5)-X(1939.5),35);
  halo('1940–42', X(1941), base+28, 'center', 'rgba(31,28,24,0.75)', 'italic 10px Georgia, serif');
}
{ const ry=H-52; g.strokeStyle='rgba(31,28,24,0.45)'; g.lineWidth=1; g.beginPath(); g.moveTo(L,ry+.5); g.lineTo(RR,ry+.5); g.stroke();
for(let y=1820;y<=2030;y+=10){ const big=y%50===0; g.strokeStyle='rgba(31,28,24,0.45)'; g.lineWidth=1; g.beginPath(); g.moveTo(X(y)+.5,ry); g.lineTo(X(y)+.5,ry+(big?7:3)); g.stroke();
  if(big) halo(String(y), X(y), ry+19, 'center', 'rgba(31,28,24,0.7)', '10px Georgia, serif'); } }

// side labels
halo('↑  PHYSICS · CHEMISTRY · MEDICINE', L, 196, 'left', 'rgba(31,28,24,0.7)', '10px Georgia, serif');
halo('↓  LITERATURE · PEACE · ECONOMICS', L, 700, 'left', 'rgba(31,28,24,0.7)', '10px Georgia, serif');

// annotations
const find=n=>R.find(r=>r[2]===n);
const span=(r)=>(X(r[0])-X(r[4]))/2;
const gd=find('John B. Goodenough');
arc(gd,INK,0.85,1.3);
halo('John B. Goodenough, 97 — the widest span of a life', (X(gd[4])+X(gd[0]))/2, base-span(gd)-8, 'center');
const ml=find('Malala Yousafzai'); { const mx=(X(1997)+X(2014))/2, mb=base+span(ml);
  g.strokeStyle=RED; g.lineWidth=.7; g.beginPath(); g.moveTo(mx,mb+2); g.lineTo(mx,base+266); g.stroke();
  halo('Malala Yousafzai, 17 — the narrowest', mx, base+278, 'center', RED); }
halo('Red Cross, founded 1863: three arcs, to 1917, 1944 and 1963', X(1863)+40, base+256, 'left', BLUE);
halo('Friends Service Council, founded 1647: an arc too wide for the page', X(1947)+10, H-62, 'left', BLUE);

// title block
g.textAlign='left'; g.fillStyle=INK; g.font='30px Georgia, serif'; g.fillText('The Long Wait', L, 62);
g.font='13px Georgia, serif'; g.fillStyle='rgba(31,28,24,0.78)';
g.fillText('Every Nobel laureate, 1901–2026, as one arc from the year of birth (or founding) to the year of the prize.', L, 88);
g.fillText('The sciences rise above the line, the other prizes hang below it. The wider the arc, the longer the wait:', L, 106);
{ const med=(a,b)=>{const v=R.filter(r=>r[3]!=='organisation'&&r[4]!=null&&r[0]>=a&&r[0]<=b).map(r=>r[0]-r[4]).sort((x,y)=>x-y);return v[v.length>>1];};
g.fillText('the median laureate of 1901–25 was '+med(1901,1925)+' years old; of 2002–26, '+med(2002,2026)+'.', L, 124); }
let lx=L; g.font='12px Georgia, serif';
[[INK,'men · '+R.filter(r=>r[3]==='man').length],[RED,'women · '+R.filter(r=>r[3]==='woman').length],[BLUE,'organisations · '+R.filter(r=>r[3]==='organisation').length]]
.forEach(([c,t])=>{ g.strokeStyle=c; g.lineWidth=1.6; g.beginPath(); g.arc(lx+8,152,7,Math.PI,2*Math.PI); g.stroke();
  g.fillStyle=INK; g.fillText(t,lx+22,152); lx+=g.measureText(t).width+50; });
g.font='italic 11px Georgia, serif'; g.fillStyle='rgba(31,28,24,0.6)'; g.textAlign='left';
g.fillText('Stroke weight is each laureate’s own share of the prize money, in today’s kronor: a whole prize is heavy, a third is light.', lx+10, 152);
g.fillStyle='rgba(31,28,24,0.55)'; g.textAlign='right';
g.fillText('Source: Nobel Prize API, '+R.length+' awards', RR, 62);
</script></body></html>
