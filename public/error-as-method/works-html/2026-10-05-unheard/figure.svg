<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Georgia,serif" font-size="13">
<rect width="760" height="300" fill="#f4efe6"/>
<text x="20" y="28" font-size="17">Reading the tower</text>
<text x="420" y="28" font-size="17">Making its own bells: what decided each change</text>
<text x="185" y="58" fill="#a3361f" font-weight="bold">S</text>
<text x="245" y="58" fill="#6b6257" font-weight="bold">N</text>
<text x="305" y="58" fill="#2b4c9b" font-weight="bold">B</text>
<text x="20" y="85">bells</text>
<rect x="178" y="70" width="28" height="20" fill="none" stroke="#a3361f" stroke-width="2"/>
<rect x="238" y="70" width="28" height="20" fill="#6b6257" />
<rect x="298" y="70" width="28" height="20" fill="#e6dfd2" />
<text x="20" y="125">change ringing?</text>
<rect x="178" y="110" width="28" height="20" fill="none" stroke="#a3361f" stroke-width="2"/>
<rect x="238" y="110" width="28" height="20" fill="#e6dfd2" />
<rect x="298" y="110" width="28" height="20" fill="#fff" stroke="#2b4c9b" stroke-width="2"/>
<line x1="298" y1="110" x2="326" y2="130" stroke="#2b4c9b" stroke-width="2"/>
<text x="20" y="165">rhythm</text>
<rect x="178" y="150" width="28" height="20" fill="none" stroke="#a3361f" stroke-width="2"/>
<rect x="238" y="150" width="28" height="20" fill="#e6dfd2" />
<rect x="298" y="150" width="28" height="20" fill="#e6dfd2" />
<text x="20" y="205">minor third</text>
<rect x="178" y="190" width="28" height="20" fill="#e6dfd2" />
<rect x="238" y="190" width="28" height="20" fill="#6b6257" />
<rect x="298" y="190" width="28" height="20" fill="#e6dfd2" />
<text x="20" y="252" font-size="11" fill="#6b6257">filled: settled · outline: leaned · grey: could not say · struck: refused the data</text>
<text x="20" y="270" font-size="11" fill="#6b6257">kept: six bells (N), minor third (N); change ringing and rhythm undecided</text>
<rect x="420" y="60" width="52" height="52" fill="#a3361f"/><text x="446" y="92" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="482" y="60" width="52" height="52" fill="#a3361f"/><text x="508" y="92" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="544" y="60" width="52" height="52" fill="#a3361f"/><text x="570" y="92" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="606" y="60" width="52" height="52" fill="#a3361f"/><text x="632" y="92" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="668" y="60" width="52" height="52" fill="#b08a2e"/><text x="694" y="92" text-anchor="middle" fill="#fff" font-size="16">K</text>
<rect x="420" y="122" width="52" height="52" fill="#a3361f"/><text x="446" y="154" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="482" y="122" width="52" height="52" fill="#a3361f"/><text x="508" y="154" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="544" y="122" width="52" height="52" fill="#b08a2e"/><text x="570" y="154" text-anchor="middle" fill="#fff" font-size="16">K</text>
<rect x="606" y="122" width="52" height="52" fill="#a3361f"/><text x="632" y="154" text-anchor="middle" fill="#fff" font-size="16">S</text>
<rect x="668" y="122" width="52" height="52" fill="#b08a2e"/><text x="694" y="154" text-anchor="middle" fill="#fff" font-size="16">K</text>
<text x="420" y="210">S pictures 7 · N numbers 0 · B ringers' picture 0 · K belief 3</text>
<text x="420" y="232" font-size="12" fill="#6b6257">The last verdict (does it sound like bells?) was not made:</text>
<text x="420" y="250" font-size="12" fill="#6b6257">it is handed to the listener on the face.</text>
</svg>