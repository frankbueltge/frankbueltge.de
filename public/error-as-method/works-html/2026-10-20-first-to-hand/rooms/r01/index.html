<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every Breath Wider</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0d0c; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="800"></canvas>
<script src="data/co2.js"></script>
<script>
(function () {
  const W = 1100, H = 800;
  const cv = document.getElementById('c');
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d');
  g.scale(dpr, dpr);

  // parse
  const rows = window.CO2_CSV.trim().split('\n').slice(1).map(l => {
    const p = l.split(',');
    return { y: +p[0], m: +p[1], t: +p[2], v: +p[3], d: +p[4], n: +p[5] };
  }).filter(r => r.v > 0);

  const cx = 420, cy = 400;
  const P0 = 312, K = 2.78, R0 = 24;
  const rad = v => R0 + (v - P0) * K;
  // Jan at top, clockwise; angle from the decimal date's fractional part
  const ang = t => (t - Math.floor(t)) * Math.PI * 2 - Math.PI / 2;
  const pt = (t, v) => [cx + Math.cos(ang(t)) * rad(v), cy + Math.sin(ang(t)) * rad(v)];

  g.fillStyle = '#0e0d0c'; g.fillRect(0, 0, W, H);

  // reference rings
  g.font = '11px Georgia, "Times New Roman", serif';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  [320, 350, 380, 400, 420].forEach(v => {
    g.beginPath(); g.arc(cx, cy, rad(v), 0, Math.PI * 2);
    g.strokeStyle = 'rgba(230,220,200,0.07)'; g.lineWidth = 1;
    g.setLineDash([1, 4]); g.stroke(); g.setLineDash([]);
    const tw = g.measureText(v + '').width;
    g.fillStyle = '#0e0d0c'; g.fillRect(cx - tw / 2 - 3, cy - rad(v) - 7, tw + 6, 14);
    g.fillStyle = 'rgba(230,220,200,0.5)'; g.textAlign = 'center';
    g.fillText(v + '', cx, cy - rad(v));
  });

  // month spokes and letters
  const ML = ['J','F','M','A','M','J','J','A','S','O','N','D'];
  for (let i = 0; i < 12; i++) {
    const a = (i + 0.5) / 12 * Math.PI * 2 - Math.PI / 2;
    const rr = rad(437);
    g.fillStyle = 'rgba(230,220,200,0.38)';
    g.textAlign = 'center';
    g.fillText(ML[i], cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }

  // colour by year
  const y0 = rows[0].t, y1 = rows[rows.length - 1].t;
  function col(t, alpha) {
    const u = (t - y0) / (y1 - y0);
    // ash -> ochre -> ember
    const stops = [[120,128,132],[196,170,112],[236,120,52],[255,72,40]];
    const s = Math.min(stops.length - 1.0001, u * (stops.length - 1));
    const i = Math.floor(s), f = s - i;
    const c = stops[i].map((x, k) => Math.round(x + (stops[i + 1][k] - x) * f));
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  }

  const maunakea = r => (r.y === 2022 && r.m === 12) || (r.y === 2023 && r.m <= 6);

  // the breathing line, drawn in short sub-steps so it curves
  function seg(a, b, style, w) {
    const N = 6;
    g.beginPath();
    for (let k = 0; k <= N; k++) {
      const f = k / N;
      let t = a.t + (b.t - a.t) * f;
      const v = a.v + (b.v - a.v) * f;
      const [x, y] = pt(t, v);
      k ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = style; g.lineWidth = w; g.stroke();
  }
  g.lineCap = 'round';
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i];
    if (maunakea(b) || (maunakea(a) && b.y === 2023 && b.m === 7)) continue;
    seg(a, b, col(b.t, 0.85), 0.8);
  }
  // the months taken from the next mountain
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i];
    if (maunakea(b) || (maunakea(a) && b.y === 2023 && b.m === 7)) {
      seg(a, b, 'rgba(140,190,235,0.25)', 4);
      seg(a, b, 'rgba(170,215,250,0.95)', 1.3);
    }
  }

  // first and last points
  const first = rows[0], last = rows[rows.length - 1];
  [[first, '#9aa2a6'], [last, '#ff5a32']].forEach(([r, c]) => {
    const [x, y] = pt(r.t, r.v);
    g.beginPath(); g.arc(x, y, 3.2, 0, Math.PI * 2); g.fillStyle = c; g.fill();
  });
  {
    const [x, y] = pt(first.t, first.v);
    g.fillStyle = 'rgba(200,205,208,0.75)'; g.textAlign = 'left';
    g.font = 'italic 11px Georgia, serif';
    g.fillText('March 1958 · ' + first.v.toFixed(2), x + 8, y + 2);
  }
  {
    const [x, y] = pt(last.t, last.v);
    g.font = 'italic 11px Georgia, serif';
    const mn = ['January','February','March','April','May','June','July','August','September','October','November','December'][last.m - 1];
    const s = mn + ' ' + last.y + ' · ' + last.v.toFixed(2);
    const tw = g.measureText(s).width;
    g.fillStyle = 'rgba(14,13,12,0.9)'; g.fillRect(x + 7, y - 8, tw + 8, 16);
    g.fillStyle = 'rgba(255,140,100,0.95)'; g.textAlign = 'left';
    g.fillText(s, x + 11, y + 1);
  }

  // right column
  const X = 840;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = '#ece4d6';
  g.font = '30px Georgia, "Times New Roman", serif';
  g.fillText('Every Breath', X, 120);
  g.fillText('Wider', X, 156);

  g.font = '13px Georgia, serif';
  g.fillStyle = 'rgba(236,228,214,0.72)';
  const lines = [
    'Carbon dioxide in the air above',
    'Mauna Loa, Hawai‘i, one monthly',
    'mean at a time, ' + rows.length + ' of them.',
    '',
    'One turn of the spiral is one year,',
    'January at the top, going clockwise.',
    'Distance from the centre is parts',
    'per million. Each spring the line',
    'leans in as northern leaves take',
    'the carbon; each autumn it leans out.',
    'It never closes.',
  ];
  lines.forEach((s, i) => g.fillText(s, X, 200 + i * 19));

  // Maunakea key
  let ky = 440;
  g.beginPath(); g.moveTo(X, ky - 4); g.lineTo(X + 26, ky - 4);
  g.strokeStyle = 'rgba(170,215,250,0.95)'; g.lineWidth = 1.6; g.stroke();
  g.fillStyle = 'rgba(190,220,245,0.85)';
  ['Dec 2022 – Jun 2023: lava cut the', 'road and power to the observatory;', 'these months were read on Maunakea,', '21 miles north.']
    .forEach((s, i) => g.fillText(s, X + (i ? 0 : 34), ky + i * 19));

  // tally
  g.fillStyle = 'rgba(255,120,80,0.9)';
  g.font = '44px Georgia, serif';
  const rise = (last.d - first.d);
  g.fillText('+' + rise.toFixed(1), X, 600);
  g.font = '13px Georgia, serif';
  g.fillStyle = 'rgba(236,228,214,0.6)';
  g.fillText('ppm, ' + first.y + ' to ' + last.y + ', seasons removed', X, 624);

  g.font = '10.5px Georgia, serif';
  g.fillStyle = 'rgba(236,228,214,0.38)';
  g.fillText('Data: NOAA Global Monitoring Laboratory /', X, 748);
  g.fillText('Scripps Institution of Oceanography, co2_mm_mlo', X, 763);
})();
</script>
</body>
</html>
