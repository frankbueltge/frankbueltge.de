<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="600" fill="#1d3f73"/>
  <path d="M290,0 C340,100 250,200 290,300 C340,400 250,500 290,600 L630,600 C580,500 670,400 630,300 C580,200 670,100 630,0 Z" fill="#e4b74a"/>
  <g transform="translate(460 300)" fill="#c8302c">
    <g stroke="#c8302c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- three walking legs each side -->
      <path d="M-62,14 L-112,26 L-142,66"/>
      <path d="M-52,26 L-98,52 L-118,96"/>
      <path d="M-38,34 L-72,70 L-84,112"/>
      <path d="M62,14 L112,26 L142,66"/>
      <path d="M52,26 L98,52 L118,96"/>
      <path d="M38,34 L72,70 L84,112"/>
      <!-- rear swimming legs -->
      <path d="M-20,38 L-36,78"/>
      <path d="M20,38 L36,78"/>
      <!-- arms -->
      <path d="M-50,-25 L-95,-55 L-105,-95"/>
      <path d="M50,-25 L95,-55 L105,-95"/>
