    <ellipse cx="44" cy="92" rx="22" ry="13" transform="rotate(30 44 92)"/>
    <!-- carapace with lateral spines -->
    <path d="M-150,-8 L-80,-30 C-40,-48 40,-48 80,-30 L150,-8 L80,8 C60,40 -60,40 -80,8 Z"/>
    <!-- claws -->
    <path d="M-105,-95 C-140,-110 -140,-155 -112,-172 L-108,-135 L-84,-160 C-74,-130 -82,-105 -105,-95 Z"/>
    <path d="M105,-95 C140,-110 140,-155 112,-172 L108,-135 L84,-160 C74,-130 82,-105 105,-95 Z"/>
