<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Balance</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: default; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="800" aria-label="A balance scale weighing the Arctic sea ice of each day against the same day in 1979 to 1988"></canvas>
<script src="../../../data/extent.js"></script>
<script>
(function () {
  var W = 1100, H = 800;
  var cv = document.getElementById('c');
  var dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  var g = cv.getContext('2d');
  g.scale(dpr, dpr);

  var C = {
    bg: '#0b0e12', ice: '#e9f0f4', iceDim: 'rgba(233,240,244,0.35)',
    past: '#8fa6b8', metal: '#5b6670', text: '#c9d2d9', faint: '#5f6a74',
    loss: '#c7745a', gain: '#8fb3c9'
  };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var SERIF = 'Georgia, "Iowan Old Style", "Times New Roman", serif';

  // ---- data ----------------------------------------------------------------
  var raw = window.EXTENT || [];
  var DAY = 86400000;
  function dn(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY); }
  var obs = raw.map(function (r) { return [dn(r[0], r[1], r[2]), r[3]]; })
               .filter(function (o) { return isFinite(o[1]) && o[1] > 0; })
               .sort(function (a, b) { return a[0] - b[0]; });
  if (!obs.length) return;
  var d0 = obs[0][0], d1 = obs[obs.length - 1][0], N = d1 - d0 + 1;
  var val = new Float32Array(N), gap = new Uint8Array(N);
  var j = 0;
  for (var i = 0; i < N; i++) {
    var d = d0 + i;
    while (j < obs.length - 1 && obs[j + 1][0] <= d) j++;
    var a = obs[j], b = obs[Math.min(j + 1, obs.length - 1)];
    if (a[0] === d || b[0] === a[0]) { val[i] = a[1]; }
    else { var t = (d - a[0]) / (b[0] - a[0]); val[i] = a[1] + (b[1] - a[1]) * t; }
    var dist = Math.min(Math.abs(d - a[0]), Math.abs(b[0] - d));
    gap[i] = dist > 3 ? 1 : 0;
  }
  function dateOf(i) { var dt = new Date((d0 + i) * DAY); return [dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()]; }
  function doyOf(i) {
    var dt = dateOf(i);
    var k = (d0 + i) - dn(dt[0], 1, 1);
    var leap = (dt[0] % 4 === 0 && dt[0] % 100 !== 0) || dt[0] % 400 === 0;
    if (leap && k >= 59) k = k === 59 ? 58 : k - 1; // fold Feb 29 into Feb 28
    return k; // 0..364
  }

  // baseline: mean of 1979-1988 for each day of the year, lightly smoothed
  var sum = new Float64Array(365), cnt = new Float64Array(365);
  var DOY = new Uint16Array(N);
  for (i = 0; i < N; i++) {
    DOY[i] = doyOf(i);
    var y = dateOf(i)[0];
    if (y >= 1979 && y <= 1988 && !gap[i]) { sum[DOY[i]] += val[i]; cnt[DOY[i]]++; }
  }
  var base0 = new Float64Array(365), base = new Float64Array(365);
  for (i = 0; i < 365; i++) base0[i] = cnt[i] ? sum[i] / cnt[i] : NaN;
  for (i = 0; i < 365; i++) {
    var s = 0, c = 0;
    for (var k = -5; k <= 5; k++) { var v = base0[(i + k + 365) % 365]; if (!isNaN(v)) { s += v; c++; } }
    base[i] = c ? s / c : 10;
  }
  var anom = new Float32Array(N);
  for (i = 0; i < N; i++) anom[i] = val[i] - base[DOY[i]];

  // ---- geometry -------------------------------------------------------------
  var PIV = { x: 550, y: 250 }, ARM = 300, STRING = 150;
  var KMAX = 16.5, RMAX = 118;
  function radius(e) { return RMAX * Math.sqrt(Math.max(e, 0) / KMAX); } // area ∝ extent
  var DEG_PER = 3.4; // degrees of tilt per million km² of difference
  var STRIP = { x0: 70, x1: 1030, y: 712, s: 9 };

  // anomaly strip, precomputed per pixel column
  var cols = [];
  (function () {
    var w = STRIP.x1 - STRIP.x0;
    for (var px = 0; px < w; px++) {
      var a = Math.floor(px / w * N), b = Math.max(a + 1, Math.floor((px + 1) / w * N));
      var s = 0, c = 0;
      for (var q = a; q < b && q < N; q++) if (!gap[q]) { s += anom[q]; c++; }
      cols.push(c ? s / c : null);
    }
  })();

  // ---- state ------------------------------------------------------------------
  var DAYS_PER_SEC = 365 / 4;
  var pos = 0, playing = true, last = null, endHold = 0;
  var angle = 0, angVel = 0;
  var hoverStrip = false;

  function fmt(x) { return x.toFixed(2); }

  function drawMound(cx, cy, e, fill, stroke, alpha) {
    var r = radius(e);
    g.save();
    g.globalAlpha = alpha;
    g.beginPath();
    g.ellipse(cx, cy, r, r, 0, Math.PI, 2 * Math.PI);
    g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.2; g.stroke(); }
    g.restore();
  }

  function drawPan(cx, cy, w) {
    g.strokeStyle = C.metal; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx - w, cy); g.lineTo(cx + w, cy); g.stroke();
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(cx - w * 0.92, cy + 5); g.quadraticCurveTo(cx, cy + 22, cx + w * 0.92, cy + 5); g.stroke();
  }

  function draw() {
    var i = Math.min(N - 1, Math.floor(pos));
    var f = pos - i;
    var i2 = Math.min(N - 1, i + 1);
    var now = val[i] + (val[i2] - val[i]) * f;
    var bl = base[DOY[i]] + (base[DOY[i2]] - base[DOY[i]]) * f;
    var isGap = gap[i];

    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);

    // title & date
    var dt = dateOf(i);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = C.ice; g.font = '400 44px ' + SERIF;
    g.fillText(dt[2] + ' ' + MONTHS[dt[1]] + ' ' + dt[0], W / 2, 92);
    g.fillStyle = C.faint; g.font = 'italic 15px ' + SERIF;
    g.fillText('Arctic sea ice, weighed against the same day in 1979–1988', W / 2, 124);

    // beam
    var th = angle * Math.PI / 180;
    var cs = Math.cos(th), sn = Math.sin(th);
    var L = { x: PIV.x - ARM * cs, y: PIV.y - ARM * sn };
    var R = { x: PIV.x + ARM * cs, y: PIV.y + ARM * sn };

    // stand
    g.strokeStyle = C.metal; g.lineWidth = 3;
    g.beginPath(); g.moveTo(PIV.x, PIV.y); g.lineTo(PIV.x, 600); g.stroke();
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(PIV.x - 70, 600); g.lineTo(PIV.x + 70, 600); g.stroke();
    // pointer / needle
    g.save(); g.translate(PIV.x, PIV.y); g.rotate(th);
    g.strokeStyle = C.ice; g.globalAlpha = 0.6; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -62); g.stroke();
    g.restore();
    // scale arc behind needle
    g.strokeStyle = C.faint; g.lineWidth = 1;
    g.beginPath(); g.arc(PIV.x, PIV.y, 70, -Math.PI / 2 - 0.3, -Math.PI / 2 + 0.3); g.stroke();
    for (var t = -15; t <= 15; t += 5) {
      var ta = -Math.PI / 2 + t * Math.PI / 180;
      g.beginPath();
      g.moveTo(PIV.x + Math.cos(ta) * 70, PIV.y + Math.sin(ta) * 70);
      g.lineTo(PIV.x + Math.cos(ta) * (t === 0 ? 80 : 75), PIV.y + Math.sin(ta) * (t === 0 ? 80 : 75));
      g.stroke();
    }
    // beam bar
    g.strokeStyle = C.metal; g.lineWidth = 4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(L.x, L.y); g.lineTo(R.x, R.y); g.stroke();
    g.fillStyle = C.metal; g.beginPath(); g.arc(PIV.x, PIV.y, 7, 0, 2 * Math.PI); g.fill();
    g.lineCap = 'butt';

    // strings + pans
    var panW = 132;
    var pl = { x: L.x, y: L.y + STRING }, pr = { x: R.x, y: R.y + STRING };
    g.strokeStyle = C.metal; g.lineWidth = 1;
    [[L, pl], [R, pr]].forEach(function (p) {
      g.beginPath();
      g.moveTo(p[0].x, p[0].y); g.lineTo(p[1].x - panW, p[1].y);
      g.moveTo(p[0].x, p[0].y); g.lineTo(p[1].x + panW, p[1].y);
      g.stroke();
    });

    // mounds of ice (area proportional to extent)
    drawMound(pl.x, pl.y - 1, bl, C.past, null, 0.55);
    drawMound(pr.x, pr.y - 1, bl, null, C.past, 0.45); // the missing, as an outline
    drawMound(pr.x, pr.y - 1, now, C.ice, null, isGap ? 0.35 : 0.95);
    drawPan(pl.x, pl.y, panW);
    drawPan(pr.x, pr.y, panW);

    // readings
    g.textAlign = 'center';
    g.font = '400 30px ' + SERIF; g.fillStyle = C.past;
    g.fillText(fmt(bl), pl.x, pl.y + 62);
    g.fillStyle = isGap ? C.iceDim : C.ice;
    g.fillText(fmt(now), pr.x, pr.y + 62);
    g.font = '13px ' + SERIF; g.fillStyle = C.faint;
    g.fillText('million km², average of 1979–1988', pl.x, pl.y + 84);
    g.fillText(isGap ? 'no observation — the record is silent here' : 'million km², this day', pr.x, pr.y + 84);

    // the difference
    var diff = now - bl;
    g.font = 'italic 19px ' + SERIF;
    g.fillStyle = diff < 0 ? C.loss : C.gain;
    var word = diff < 0 ? 'missing' : 'more than then';
    g.fillText((diff < 0 ? '−' : '+') + fmt(Math.abs(diff)) + ' million km² ' + word, W / 2, 648);

    // strip: the whole record of differences
    var sy = STRIP.y, s = STRIP.s;
    g.strokeStyle = C.faint; g.lineWidth = 1;
    g.beginPath(); g.moveTo(STRIP.x0, sy + 0.5); g.lineTo(STRIP.x1, sy + 0.5); g.stroke();
    var head = STRIP.x0 + (pos / (N - 1)) * (STRIP.x1 - STRIP.x0);
    for (var px = 0; px < cols.length; px++) {
      var v = cols[px]; if (v === null) continue;
      var x = STRIP.x0 + px;
      var played = x <= head;
      g.fillStyle = v < 0 ? C.loss : C.gain;
      g.globalAlpha = played ? 0.9 : 0.16;
      var hgt = Math.abs(v) * s;
      g.fillRect(x, v < 0 ? sy + 1 : sy - hgt, 1, hgt);
    }
    g.globalAlpha = 1;
    g.fillStyle = C.ice; g.fillRect(Math.round(head) - 0.5, sy - 22, 1.5, 70);
    g.font = '11px ' + SERIF; g.fillStyle = C.faint; g.textAlign = 'center';
    for (var yr = 1980; yr <= 2025; yr += 5) {
      var di = dn(yr, 1, 1) - d0; if (di < 0 || di >= N) continue;
      var xx = STRIP.x0 + di / (N - 1) * (STRIP.x1 - STRIP.x0);
      g.fillText(String(yr), xx, sy + 66);
      g.fillRect(xx - 0.5, sy + 52, 1, 4);
    }
    g.textAlign = 'left';
    g.fillText(playing ? 'space to pause · click the line to move through time · ← → to step' : 'paused · space to continue', STRIP.x0, 786);
    g.textAlign = 'right';
    g.fillText('NSIDC Sea Ice Index v4, Northern Hemisphere · one year every four seconds', STRIP.x1, 786);
  }

  function frame(ts) {
    var dtm = last === null ? 0 : Math.min(0.1, (ts - last) / 1000);
    last = ts;
    if (playing) {
      if (pos >= N - 1) {
        endHold += dtm;
        if (endHold > 10) { pos = 0; endHold = 0; }
      } else {
        pos = Math.min(N - 1, pos + DAYS_PER_SEC * dtm);
      }
    }
    var i = Math.min(N - 1, Math.floor(pos));
    // the heavier pan sinks: positive angle lowers the right side
    var target = Math.max(-16, Math.min(16, (val[i] - base[DOY[i]]) * DEG_PER));
    var acc = (target - angle) * 40 - angVel * 9;
    angVel += acc * dtm; angle += angVel * dtm;
    draw();
    requestAnimationFrame(frame);
  }

  function seekFromX(x) {
    var t = (x - STRIP.x0) / (STRIP.x1 - STRIP.x0);
    pos = Math.max(0, Math.min(1, t)) * (N - 1); endHold = 0;
  }
  var dragging = false;
  function localX(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
  function inStrip(p) { return p[1] > STRIP.y - 40 && p[1] < STRIP.y + 60 && p[0] > STRIP.x0 - 10 && p[0] < STRIP.x1 + 10; }
  cv.addEventListener('pointerdown', function (e) { var p = localX(e); if (inStrip(p)) { dragging = true; seekFromX(p[0]); cv.setPointerCapture(e.pointerId); } });
  cv.addEventListener('pointermove', function (e) { var p = localX(e); if (dragging) seekFromX(p[0]); cv.style.cursor = inStrip(p) ? 'pointer' : 'default'; });
  cv.addEventListener('pointerup', function () { dragging = false; });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { playing = !playing; e.preventDefault(); }
    else if (e.key === 'ArrowRight') { pos = Math.min(N - 1, Math.floor(pos) + (e.shiftKey ? 365 : 1)); }
    else if (e.key === 'ArrowLeft') { pos = Math.max(0, Math.floor(pos) - (e.shiftKey ? 365 : 1)); }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
