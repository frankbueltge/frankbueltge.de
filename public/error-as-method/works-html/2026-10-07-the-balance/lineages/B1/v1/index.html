<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Balance</title>
<style>
  html,body{margin:0;height:100%;background:#0b1017;color:#c9d3dc;overflow:hidden;
    font-family:ui-serif,Georgia,"Times New Roman",serif;}
  canvas{display:block;touch-action:none}
  #hint{position:fixed;left:62px;bottom:26px;font:12px/1.5 ui-sans-serif,system-ui,sans-serif;
    color:#4e5c69;letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag around the dial to wind time back or forward · click or space — pause<br>← → step a day · 1 2 3 — speed</div>
<script src="../../../data/extent.js"></script>
<script>
(function(){
const DAY=86400000, TAU=Math.PI*2;
const rows=window.EXTENT||[];
const t0=Date.UTC(rows[0][0],rows[0][1]-1,rows[0][2]);
const last=rows[rows.length-1];
const t1=Date.UTC(last[0],last[1]-1,last[2]);
const N=Math.round((t1-t0)/DAY)+1;
// daily series, linear interpolation across gaps; remember long gaps
const val=new Float32Array(N), obs=new Uint8Array(N);
let prevI=-1,prevV=0;
for(const r of rows){
  const i=Math.round((Date.UTC(r[0],r[1]-1,r[2])-t0)/DAY), v=r[3];
  if(!(v>0)) continue;
  if(prevI>=0) for(let k=prevI+1;k<i;k++){val[k]=prevV+(v-prevV)*(k-prevI)/(i-prevI); obs[k]=(i-prevI)>3?0:1;}
  val[i]=v; obs[i]=1; prevI=i; prevV=v;
}
const yearOf=new Int16Array(N), doy=new Int16Array(N);
for(let i=0;i<N;i++){const d=new Date(t0+i*DAY);const y=d.getUTCFullYear();yearOf[i]=y;
  doy[i]=Math.min(364,Math.floor((d-Date.UTC(y,0,1))/DAY));}
// baseline: mean of 1979–1990 for each day of year, lightly smoothed
const bs=new Float64Array(365), bn=new Float64Array(365);
for(let i=0;i<N;i++) if(yearOf[i]>=1979&&yearOf[i]<=1990&&obs[i]){bs[doy[i]]+=val[i];bn[doy[i]]++;}
const base=new Float64Array(365);
for(let d=0;d<365;d++) base[d]=bn[d]?bs[d]/bn[d]:NaN;
for(let d=0;d<365;d++) if(isNaN(base[d])){let a=d,b=d;while(isNaN(base[(a+364)%365]))a--;while(isNaN(base[(b+1)%365]))b++;
  base[d]=(base[(a+364)%365]+base[(b+1)%365])/2;}
const bsm=new Float64Array(365);
for(let d=0;d<365;d++){let s=0;for(let k=-3;k<=3;k++)s+=base[(d+k+365)%365];bsm[d]=s/7;}
// first index of each year
const yStart={}; for(let i=0;i<N;i++) if(!(yearOf[i] in yStart)) yStart[yearOf[i]]=i;

const cv=document.getElementById('c'), cx=cv.getContext('2d');
let W,H,dpr;
const past=document.createElement('canvas'), pcx=past.getContext('2d'); let pastKey='';
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(dpr,0,0,dpr,0,0);
  past.width=W*dpr;past.height=H*dpr;pastKey='';}
addEventListener('resize',resize);resize();

let pos=0, speed=1.5, playing=true;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MSTART=[0,31,59,90,120,151,181,212,243,273,304,334];

function layout(){
  const narrow=W<760;
  const R=narrow?Math.min(W*0.44,H*0.30):Math.min(W*0.34,H*0.42); // radius for 17 Mkm²
  const cxp=narrow?W/2:W*0.62, cyp=narrow?H-R*1.1-70:H/2+8;
  return {R,cxp,cyp,narrow};
}
function ang(d){return d/365*TAU-Math.PI/2;}          // 1 January at the top, clockwise
function rad(ext,L){return L.R*Math.sqrt(Math.max(0,ext)/17);}
function pt(d,r,L){const a=ang(d);return [L.cxp+Math.cos(a)*r,L.cyp+Math.sin(a)*r];}

// every finished year: a closed thin loop, kept on an offscreen layer
function drawPast(L,year){
  const key=year+'|'+W+'|'+H; if(key===pastKey) return; pastKey=key;
  pcx.setTransform(dpr,0,0,dpr,0,0); pcx.clearRect(0,0,W,H);
  const y0=yearOf[0];
  for(let y=y0;y<year;y++){
    const s=yStart[y], e=(yStart[y+1]||N)-1; if(s===undefined) continue;
    const age=(year-1-y);
    pcx.beginPath();
    for(let k=s;k<=e;k++){const [x,yy]=pt(doy[k],rad(val[k],L),L);k===s?pcx.moveTo(x,yy):pcx.lineTo(x,yy);}
    if(e-s>360) pcx.closePath();
    pcx.strokeStyle=age===0?'rgba(220,232,240,0.45)':'rgba(200,215,228,'+(0.05+0.10*Math.exp(-age/12))+')';
    pcx.lineWidth=age===0?1:0.8; pcx.stroke();
  }
}

function draw(){
  const L=layout(); const i=Math.max(0,Math.min(N-1,Math.floor(pos)));
  const year=yearOf[i], s=yStart[year], d=doy[i];
  const v=val[i], b=bsm[d], a=v-b;
  cx.fillStyle='#0b1017';cx.fillRect(0,0,W,H);

  // month ticks
  cx.font='11px ui-sans-serif,system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
  for(let m=0;m<12;m++){const [x1,y1]=pt(MSTART[m],L.R*1.0,L),[x2,y2]=pt(MSTART[m],L.R*1.03,L);
    cx.strokeStyle='#1d2833';cx.lineWidth=1;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();
    const [tx,ty]=pt(MSTART[m]+15,L.R*1.07,L);cx.fillStyle=(d>=MSTART[m]&&(m===11||d<MSTART[m+1]))?'#8696a3':'#3d4a56';
    cx.fillText(MSHORT[m],tx,ty);}

  // the record: every year before
  drawPast(L,year);
  cx.drawImage(past,0,0,W,H);

  // this year: the ice swept so far, area to scale
  cx.beginPath();cx.moveTo(L.cxp,L.cyp);
  for(let k=s;k<=i;k++){const [x,y]=pt(doy[k],rad(val[k],L),L);cx.lineTo(x,y);}
  cx.closePath();
  const g=cx.createRadialGradient(L.cxp,L.cyp,0,L.cxp,L.cyp,L.R);
  g.addColorStop(0,'#f4f7fa');g.addColorStop(0.75,'#e2ebf1');g.addColorStop(1,'#b9cbd8');
  cx.fillStyle=g;cx.fill();

  // the balance: between this year's edge and the old year's edge
  let def=0,sur=0,n=0;
  cx.beginPath();
  for(let k=s;k<=i;k++){const [x,y]=pt(doy[k],rad(bsm[doy[k]],L),L);k===s?cx.moveTo(x,y):cx.lineTo(x,y);}
  for(let k=i;k>=s;k--){const [x,y]=pt(doy[k],rad(Math.min(val[k],bsm[doy[k]]),L),L);cx.lineTo(x,y);}
  cx.closePath();cx.fillStyle='rgba(214,120,92,0.55)';cx.fill();
  cx.beginPath();
  for(let k=s;k<=i;k++){const [x,y]=pt(doy[k],rad(Math.max(val[k],bsm[doy[k]]),L),L);k===s?cx.moveTo(x,y):cx.lineTo(x,y);}
  for(let k=i;k>=s;k--){const [x,y]=pt(doy[k],rad(bsm[doy[k]],L),L);cx.lineTo(x,y);}
  cx.closePath();cx.fillStyle='rgba(140,175,205,0.55)';cx.fill();
  for(let k=s;k<=i;k++){const q=val[k]-bsm[doy[k]];if(q<0)def-=q;else sur+=q;n++;}

  // the old year, 1979–1990, all the way round
  cx.beginPath();
  for(let k=0;k<=365;k++){const dd=k%365;const [x,y]=pt(dd,rad(bsm[dd],L),L);k?cx.lineTo(x,y):cx.moveTo(x,y);}
  cx.setLineDash([2,5]);cx.strokeStyle='rgba(214,180,160,0.7)';cx.lineWidth=1.2;cx.stroke();cx.setLineDash([]);

  // the hand: today
  const frac=pos-Math.floor(pos);
  const [hx,hy]=pt(d+frac,rad(v,L),L),[ex,ey]=pt(d+frac,L.R,L);
  cx.strokeStyle='rgba(231,237,242,0.18)';cx.lineWidth=1;cx.beginPath();cx.moveTo(hx,hy);cx.lineTo(ex,ey);cx.stroke();
  cx.fillStyle='#e7edf2';cx.beginPath();cx.arc(hx,hy,2.5,0,TAU);cx.fill();
  cx.fillStyle='rgba(11,16,23,0.4)';cx.beginPath();cx.arc(L.cxp,L.cyp,2,0,TAU);cx.fill();

  // text
  const sc=L.narrow?0.62:1, X=L.narrow?20:60;
  const dt=new Date(t0+i*DAY);
  cx.textAlign='left';cx.textBaseline='alphabetic';
  cx.fillStyle='#e7edf2';cx.font='300 '+(64*sc)+'px ui-serif,Georgia,serif';
  cx.fillText(year,X,40+68*sc);
  cx.fillStyle='#8696a3';cx.font='italic '+(20*sc)+'px ui-serif,Georgia,serif';
  cx.fillText(dt.getUTCDate()+' '+MONTHS[dt.getUTCMonth()]+(obs[i]?'':'  — not observed'),X+2,40+100*sc);
  if(L.narrow){
    cx.font='16px ui-serif,Georgia,serif';cx.fillStyle='#e7edf2';
    cx.fillText(v.toFixed(2)+' million km²',X,150);
    cx.fillStyle=a<0?'#d6785c':'#9fbad0';
    cx.fillText((a<0?'−':'+')+Math.abs(a).toFixed(2)+' today, against 1979–1990',X,174);
    const m=(sur-def)/Math.max(1,n);cx.fillStyle=m<0?'#d6785c':'#9fbad0';
    cx.fillText((m<0?'−':'+')+Math.abs(m).toFixed(2)+' on average, '+year+' so far',X,198);
  } else {
    cx.fillStyle='#e7edf2';cx.font='34px ui-serif,Georgia,serif';
    cx.fillText(v.toFixed(2),X,214);
    cx.fillStyle='#8696a3';cx.font='14px ui-sans-serif,system-ui,sans-serif';
    cx.fillText('million km² of sea ice today, Northern Hemisphere',X+2,238);
    cx.fillStyle=a<0?'#d6785c':'#9fbad0';cx.font='34px ui-serif,Georgia,serif';
    cx.fillText((a<0?'−':'+')+Math.abs(a).toFixed(2),X,304);
    cx.fillStyle='#8696a3';cx.font='14px ui-sans-serif,system-ui,sans-serif';
    cx.fillText(a<0?'missing today, against the same day in 1979–1990':'above the same day in 1979–1990',X+2,328);
    const m=(sur-def)/Math.max(1,n);
    cx.fillStyle=m<0?'#d6785c':'#9fbad0';cx.font='34px ui-serif,Georgia,serif';
    cx.fillText((m<0?'−':'+')+Math.abs(m).toFixed(2),X,394);
    cx.fillStyle='#8696a3';cx.font='14px ui-sans-serif,system-ui,sans-serif';
    cx.fillText('the balance of '+year+' so far: the coloured area,',X+2,418);
    cx.fillText('as a daily average',X+2,436);
    cx.fillStyle='#4e5c69';cx.font='12px ui-sans-serif,system-ui,sans-serif';
    cx.fillText('around the dial: the days of the year; white: this year’s ice, area to scale',X+2,486);
    cx.fillText('dotted: the same year as it was, on average, 1979–1990',X+2,504);
    cx.fillText('rust: ice missing against it · blue: ice in surplus',X+2,522);
    cx.fillText('thin lines: every year before, each closed on itself',X+2,540);
  }
}

let lastT=performance.now();
function tick(t){const dt=Math.min(50,t-lastT);lastT=t;
  if(playing&&!drag){pos+=speed*dt/16.67; if(pos>=N-1){pos=N-1;playing=false;}}
  draw();requestAnimationFrame(tick);}

// wind the dial: angular drag moves time, a full turn is a year
let drag=null;
function angleAt(e){const L=layout();return Math.atan2(e.clientY-L.cyp,e.clientX-L.cxp);}
cv.addEventListener('pointerdown',e=>{drag={a:angleAt(e),x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<4) return;
  drag.moved=true;const a=angleAt(e);let da=a-drag.a;if(da>Math.PI)da-=TAU;if(da<-Math.PI)da+=TAU;drag.a=a;
  pos=Math.max(0,Math.min(N-1,pos+da/TAU*365.25));});
cv.addEventListener('pointerup',()=>{if(drag&&!drag.moved){if(pos>=N-1)pos=0;playing=!playing;}drag=null;});
cv.addEventListener('pointercancel',()=>{drag=null;});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(pos>=N-1)pos=0;playing=!playing;}
  else if(e.key==='ArrowRight'){pos=Math.min(N-1,Math.floor(pos)+1);playing=false;}
  else if(e.key==='ArrowLeft'){pos=Math.max(0,Math.floor(pos)-1);playing=false;}
  else if(e.key==='1')speed=0.5;else if(e.key==='2')speed=1.5;else if(e.key==='3')speed=6;
});
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
