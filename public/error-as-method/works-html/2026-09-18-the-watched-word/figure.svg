<text class="small" x="92" y="762.0">Rate ratio, six nights after against six before: <tspan style="font-weight:600">2.104</tspan> — the highest of the eleven terms.</text>
<text class="small" x="92" y="780.0">The second axis row counts that night's paragraphs naming the row: two on every night after it was fixed, none before.</text>
