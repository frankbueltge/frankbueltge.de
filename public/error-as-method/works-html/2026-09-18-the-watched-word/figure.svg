<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 830" width="100%" role="img" aria-label="Two panels. Above: the eleven content terms of the standing sentence, each with the number of fixed readings this record has given it — four terms carry readings, seven carry none — and the five shapes Sessions 88 to 91 named, drawn onto the term each one actually loads. Three land on observer, which already has three readings; two land on difference and norm, which have none. Below: the word observer per 1,000 words in each of the twelve journal entries either side of the night the falsifier naming that word was fixed, and the number of paragraphs per night that name the falsifier beside it — exactly two on every night after it was fixed, and none before.">
