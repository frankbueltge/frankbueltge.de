<rect class="bg" x="0" y="0" width="1020" height="830"/>
<text class="hd" x="34" y="40">The word the row named</text>
<text class="sub" x="34" y="62">Session 85 fixed a falsifier on <tspan style="font-style:italic">observer</tspan>. Four nights then reported that the pressure kept arriving at <tspan style="font-style:italic">observer</tspan>. Two of the five things they found are not about that word.</text>
