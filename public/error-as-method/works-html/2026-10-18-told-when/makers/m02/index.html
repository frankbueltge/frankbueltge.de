<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty-One Rows</title>
<style>
  :root { --ground: #ebe5da; --ink: #3b342c; --faint: #8a7f70; }
  html, body { margin: 0; height: 100%; background: var(--ground); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" aria-label="A knitted piece of 61 rows of 24 stitches, one stitch per hour, worked in 18 yarn colours from deep blue to dark red; the warm colours fade from left to right."></canvas>
<script>
(() => {
  const DATA = "mmllllmllmnonppopopononnmmllmlllmnpooqrrppqpnoonmmnmmmmnnnoopqpppqoonnnmnmlmmllmnmononnnnnnmmmlmlllllllmllmnonnomnnnmmlmllklkklklmnponpopppomonnlmllmlllmnoqopqpqppnoonmmmllnmlmmnoppqopqpoppomnnmmlmlonmonpoppppooonnnmnmmlllmnlompnpopopnonmmmlmmlllmlomnpopooononnmmmllmlllllmnnpoppnoonmmmllkllklmkknlopmnppoponnlmmmlllllmlmmoonppopoonnnmmmmllllmmnpoopppnpppomonnonmnlmmnpmoqppqqqpppoonnomnmnmnnmnpoponnonmlnmmmlmlllllmlnponmmnmlllllkkkkklkkkkklmmlmmmkmllkkkjjiiiijjkilkmmjmmlmlkkkkjjjijiiijiijjkjkjjjjjjiiiiiiiiiikijjjjjkkkkijjhiihghhhgghijklklmlmllkkjijiihihihjkilmnmlnmmlkllkjkijijiijjlkkmmmlmlkkjkjiijhjiiihikjlklllkkkkjijihiihhhhiijklklllljkjkijjiihihhhijklklmmmlllkkkjjjjkiiijjklnlmlmmnmkllkkkkjjlkjkjknmllmkllllkkjkkjjjjjkjkllmnoonjkkjjjjjjjjjjiikjklnmmoonnlmmnllkkkljjmkkknlmoponnnomlnmklmlkklknlmnoponponmnmlmkllklkkklmmnlonnonnmmnmllklkkkmklklnoomnooonnnmmmlllllllmmmljjijjiiiiiiiiiiihhhiijikklkllljkkjiijjhiihihihjjkkllkkljkkjjijihiihhijikkllkllljkkkijjjiiiiiiikjlklklkkjjjiiihihggghghihjijjjijihiighhghghggggihiihhgihghgfgfeeedddeefhgihhiihfhgffeeeeeeeeeeefeffffffeefeeeeedcddcedffhggiihihhgfffefeeegefefgiihihiihggfefeeeededdefghiiiihgifhgfefdedeeddeffghgghhghhfggffffffffffhgghhghhgfgfeeefefddeedgfhhghghhhggfgffefeeeeeefgghhiiiiiihhhgggffffffgghhijhiijiiihghhhgggggggggggghhhghgfegffeeddddededeefdefeeeddcbaccbaaaaaebcdfefeeeedddcbcccbbbbbdcdeffefffeddecccbbaaabbcdfeggfgfgffeddeccccbbccdfgefghhghffgfeedddcdddgefeggggfgfgdeedfdcbccbdcdegfhghfehfgefeee";
  const DAYS = 61, HOURS = 24, LEVELS = 18;
  const v = Array.from(DATA, ch => ch.charCodeAt(0) - 97);

  // ---------- eighteen yarns: an ordered ramp built in OKLab ----------
  const anchors = ["#1d2547", "#2f4a7e", "#4f78a3", "#7aa0ab", "#a9b896",
                   "#d8c785", "#e0a95f", "#cf7a48", "#a9473a", "#6e2230"];
  const hex2lin = h => [1,3,5].map(i => { const c = parseInt(h.substr(i,2),16)/255;
    return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); });
  const lin2oklab = ([r,g,b]) => {
    const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
    const m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
    const s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
    return [0.2104542553*l + 0.7936177850*m - 0.0040720468*s,
            1.9779984951*l - 2.4285922050*m + 0.4505937099*s,
            0.0259040371*l + 0.7827717662*m - 0.8086757660*s];
  };
  const oklab2rgb = ([L,a,b]) => {
    const l = (L + 0.3963377774*a + 0.2158037573*b) ** 3;
    const m = (L - 0.1055613458*a - 0.0638541728*b) ** 3;
    const s = (L - 0.0894841775*a - 1.2914855480*b) ** 3;
    const lin = [ 4.0767416621*l - 3.3077115913*m + 0.2309699292*s,
                 -1.2684380046*l + 2.6097574011*m - 0.3413193965*s,
                 -0.0041960863*l - 0.7034186147*m + 1.7076147010*s];
    return lin.map(c => { c = Math.min(1, Math.max(0, c));
      return Math.round(255*(c <= 0.0031308 ? 12.92*c : 1.055*Math.pow(c, 1/2.4) - 0.055)); });
  };
  const labs = anchors.map(h => lin2oklab(hex2lin(h)));
  const yarn = [];
  for (let k = 0; k < LEVELS; k++) {
    const t = k / (LEVELS - 1) * (labs.length - 1);
    const i = Math.min(labs.length - 2, Math.floor(t)), f = t - i;
    yarn.push(labs[i].map((c, j) => c + (labs[i+1][j] - c) * f));
  }
  const shade = (k, dL) => { const [L,a,b] = yarn[k]; const [r,g,bb] = oklab2rgb([L + dL, a, b]); return `rgb(${r},${g},${bb})`; };

  // ---------- seeded randomness, so the still image is always the same ----------
  let seed = 61 * 24;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // ---------- canvas ----------
  const W = 1100, H = 800;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  function draw() {
    seed = 61 * 24;
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) || 1;
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + "px"; cv.style.height = H * scale + "px";
    cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

    // ground: a faint linen weave
    ctx.fillStyle = "#ebe5da"; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.05; ctx.strokeStyle = "#6b5b45"; ctx.lineWidth = 0.5;
    for (let y = 0.5; y < H; y += 3) { ctx.beginPath(); ctx.moveTo(0, y + rnd()); ctx.lineTo(W, y + rnd()); ctx.stroke(); }
    for (let x = 0.5; x < W; x += 3) { ctx.beginPath(); ctx.moveTo(x + rnd(), 0); ctx.lineTo(x + rnd(), H); ctx.stroke(); }
    ctx.globalAlpha = 1;

    // geometry: each day is one knitted row, turned on its side so time runs left to right
    const cw = 15, sh = 21;                 // row width, stitch height
    const bw = DAYS * cw, bh = HOURS * sh;  // 915 x 504
    const x0 = Math.round((W - bw) / 2), y0 = 118;

    // shadow under the piece
    ctx.save();
    ctx.shadowColor = "rgba(60,45,30,0.28)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
    ctx.fillStyle = "#3a3330"; ctx.fillRect(x0 - 2, y0 - 2, bw + 4, bh + 4);
    ctx.restore();

    // fringe: the loose ends at cast-on (left) and cast-off (right), in the colours of the edge stitches
    const fringe = (side) => {
      const d = side < 0 ? 0 : DAYS - 1, xe = side < 0 ? x0 - 1 : x0 + bw + 1;
      for (let h = 0; h < HOURS; h++) {
        const k = v[d * HOURS + h];
        for (let s = 0; s < 3; s++) {
          const yy = y0 + h * sh + 4 + s * 6.5 + rnd() * 1.5;
          const len = 34 + rnd() * 14;
          const sway = (rnd() - 0.5) * 9;
          ctx.strokeStyle = shade(k, -0.03 + rnd() * 0.04); ctx.lineWidth = 2.1; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(xe, yy);
          ctx.bezierCurveTo(xe + side * len * 0.4, yy + sway * 0.2, xe + side * len * 0.7, yy + sway, xe + side * len, yy + sway * 1.3);
          ctx.stroke();
        }
      }
    };
    fringe(-1); fringe(1);

    // the base of each stitch (what shows between the legs)
    for (let d = 0; d < DAYS; d++) for (let h = 0; h < HOURS; h++) {
      const k = v[d * HOURS + h];
      ctx.fillStyle = shade(k, -0.16);
      ctx.fillRect(x0 + d * cw, y0 + h * sh, cw + 0.6, sh + 0.6);
    }

    // a stitch: two legs meeting at a point, like a V turned on its side ("<")
    const leg = (cx, cy, ang, len, wid, k, dL) => {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
      const g = ctx.createLinearGradient(0, -wid, 0, wid);
      g.addColorStop(0, shade(k, dL + 0.07)); g.addColorStop(0.45, shade(k, dL + 0.015)); g.addColorStop(1, shade(k, dL - 0.09));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-len, 0);
      ctx.bezierCurveTo(-len * 0.55, -wid * 1.15, len * 0.55, -wid * 1.15, len, 0);
      ctx.bezierCurveTo(len * 0.55, wid * 1.15, -len * 0.55, wid * 1.15, -len, 0);
      ctx.fill();
      // a few fibres
      ctx.globalAlpha = 0.18; ctx.strokeStyle = shade(k, dL + 0.12); ctx.lineWidth = 0.5;
      for (let f = 0; f < 2; f++) { const o = (rnd() - 0.5) * wid; ctx.beginPath(); ctx.moveTo(-len * 0.6, o); ctx.lineTo(len * 0.6, o + (rnd() - 0.5)); ctx.stroke(); }
      ctx.restore();
    };
    // draw rows from the last day back to the first, so each new row's points tuck under the next
    for (let d = DAYS - 1; d >= 0; d--) for (let h = 0; h < HOURS; h++) {
      const k = v[d * HOURS + h];
      const jx = (rnd() - 0.5) * 0.9, jy = (rnd() - 0.5) * 0.9, dL = (rnd() - 0.5) * 0.035;
      const px = x0 + d * cw + jx, py = y0 + h * sh + jy;
      const tipX = px - 3.2, midY = py + sh / 2;      // the point dips into the previous row
      const endX = px + cw + 0.5;
      const spread = sh * 0.46;
      const len = Math.hypot(endX - tipX, spread) / 2 + 0.6;
      const a = Math.atan2(spread, endX - tipX);
      leg((tipX + endX) / 2, midY - spread / 2 - 0.3, -a, len, sh * 0.205, k, dL);
      leg((tipX + endX) / 2, midY + spread / 2 + 0.3, a, len, sh * 0.205, k, dL - 0.02);
    }

    // ---------- words, kept small ----------
    ctx.fillStyle = "#3b342c"; ctx.textBaseline = "alphabetic";
    ctx.font = "italic 30px Georgia, 'Times New Roman', serif";
    ctx.fillText("Sixty-One Rows", x0, 72);
    ctx.font = "13px Georgia, 'Times New Roman', serif"; ctx.fillStyle = "#6f6456";
    ctx.fillText("one stitch for every hour, one row for every day, cast on at the left", x0, 96);

    // the yarn basket: one ball per level the instrument could tell apart, sized by how much of it was used
    const counts = new Array(LEVELS).fill(0); v.forEach(k => counts[k]++);
    const max = Math.max(...counts);
    const by = y0 + bh + 92, step = bw / LEVELS;
    for (let k = 0; k < LEVELS; k++) {
      const cx = x0 + step * (k + 0.5), r = 3 + 15 * Math.sqrt(counts[k] / max);
      const g = ctx.createRadialGradient(cx - r * 0.35, by - r * 0.4, r * 0.1, cx, by, r);
      g.addColorStop(0, shade(k, 0.08)); g.addColorStop(1, shade(k, -0.1));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.arc(cx, by, r, 0, Math.PI * 2); ctx.clip();
      ctx.strokeStyle = shade(k, -0.14); ctx.globalAlpha = 0.35; ctx.lineWidth = 0.7;
      for (let s = -r; s < r; s += 2.6) { ctx.beginPath(); ctx.moveTo(cx - r, by + s); ctx.quadraticCurveTo(cx, by + s - r * 0.45, cx + r, by + s + 1); ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle = "#8a7f70"; ctx.font = "10px Georgia, serif"; ctx.textAlign = "center";
      ctx.fillText(counts[k], cx, by + 34);
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "#6f6456"; ctx.font = "italic 12px Georgia, serif";
    ctx.fillText("eighteen yarns, lowest to highest, with the number of stitches each one made", x0, by + 56);
  }
  draw();
  window.addEventListener("resize", draw);
})();
</script>
</body>
</html>
