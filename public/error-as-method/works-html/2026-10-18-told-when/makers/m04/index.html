<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty-One Turns</title>
<style>
  :root { --bg:#0d0e11; --ink:#d9d3c4; --mute:#7d7a72; --hair:#2a2b30; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; }
  svg { width:100vw; height:100vh; max-width:1100px; max-height:800px; display:block; }
  text { fill:var(--ink); }
  .m { fill:var(--mute); font-size:11px; letter-spacing:.08em; font-family: "Helvetica Neue", Arial, sans-serif; }
  .t { font-size:30px; font-style:italic; }
  .b { font-size:13px; fill:#b8b2a4; }
</style>
</head>
<body>
<svg id="w" viewBox="0 0 1100 800" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="61 concentric rings, one per day from 15 July (outer) to 13 September (centre), each divided into 24 hourly sectors coloured by one of 18 stepped levels."></svg>
<script>
const L = "mmmlmmlmlmlmnnnnooooopononnnmmmmmlmnmooopppqpqppooonnnmnmnmnnnooppopopooonnmnmmmmmmmmnnnnnnnnnnmmmmlmlmllllmmmmmnnnnnnnmmmmlllllklllmnnnnoopooooonnnmmmlmmlmnnooooppppoooonmnmmlmmmmnnoooppppppopnonnmmmmmnnnnonpopoopononnnmnmlmmmnmnonooopononnnmmmmmlmlmnmnonoooooonnnnmmmlmlmmlmnnnnonononnnnmmllllklllllnmonoooooonnmnmmlmlmlmmmnmonooooooonnnmmmmmlmmnmnonopopoopooonnnnmnmmnnnoooppppqppopoonnnnnmnnnnoonoooonnnnmmmmmllmlmlmmmnnnmnmmlmllklklkkklkklklllmlmlllllklkjkjijjijkjkkkllmllllklkkkjjjjijijijijjkjjjjjjijijiiiiiijijijjjkjkjkjjijiihhhhhhhiiijkjlkmllkkkjjjjiiiiiijjkklllmmmmlllkkkkjjjjjijjkkklllllllkkkjjjjiiiijijjjkkklkkkkkjjjiiiihihiijjjjkklklkkjkjijiiiiihjijjjkkllllllkkkkjjjjjjjjjkkllllmmmmllllkkkkkjkkjklkllmlllllklkkkjkkjjkkjklllmmmmmmlllkkjjjjijjjjjkkllmnnnmnnmmllllkkkkkklllmmmonononmnmmmllllllkmlmmnnnononnnmmmllllkllkllmmnmnnonnnmnmmllllklklllmmnnnnononnmnmmmlmlllmlllklkkjjjjiijiiiihiihiiiijikjkkkklkkjjjjijihiihjiijjjkkklkkkjkjjiiiiiihjijjkjklkklkkkjkjijijijiijjjkkjkkkkkjjjjiihhihghhhhihijiijiiiiihhhhghghhghhghihhhhhhhggfffefdeeeefffgghhhhghgfgffeefeeeeefefeffeffefefeeeededddedfefgfghhhhghfgffffefefeffgghhgihhhhggfgefeedeeeefffhghhhhhhggffffeedeeeeeefgggghghghggfgffgffffgfggghghggggffefefeeedeeffffgghgghggggfffffefefefgggghhihihihhhhgggffggfgghhihiiiiiiihihhhghggghggggghhgghgggfgefeeededededeeeeeeeeddddcbcbabababcbccddeedededcdcccccbccccdddeeeefeeddddcccbbcbbccddefefffffefddddccccdccdeefgggfgggfffeeeddddedeefeffgfgfffefededcdcccdddefefgggggfg";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("w");
function el(n, a, p){ const e=document.createElementNS(NS,n); for(const k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; }

// 18 stepped tones: lowest level (0) deep night blue -> highest (17) pale summer straw
const stops = [[0,[22,30,56]],[0.25,[38,66,112]],[0.5,[78,128,140]],[0.68,[150,170,128]],[0.84,[226,186,98]],[1,[250,236,196]]];
function tone(k){ const t=k/17; let i=0; while(i<stops.length-2 && t>stops[i+1][0]) i++;
  const [t0,c0]=stops[i],[t1,c1]=stops[i+1], f=(t-t0)/(t1-t0);
  return "rgb("+c0.map((c,j)=>Math.round(c+(c1[j]-c)*f)).join(",")+")"; }

const cx=392, cy=400, R=344, r0=54, D=61, rw=(R-r0)/D;
const g = el("g",{});
function pt(r,a){ return [cx+r*Math.sin(a), cy-r*Math.cos(a)]; }
for(let d=0; d<D; d++){
  const ro = R - d*rw, ri = ro - rw + 0.38;
  let h=0;
  while(h<24){
    const k = L.charCodeAt(d*24+h)-97; let h2=h+1;
    while(h2<24 && L.charCodeAt(d*24+h2)-97===k) h2++;   // merge equal neighbours into one arc
    const a0=h/24*2*Math.PI, a1=h2/24*2*Math.PI, lg=(a1-a0)>Math.PI?1:0;
    const [x0,y0]=pt(ro,a0),[x1,y1]=pt(ro,a1),[x2,y2]=pt(ri,a1),[x3,y3]=pt(ri,a0);
    el("path",{d:`M${x0} ${y0}A${ro} ${ro} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${lg} 0 ${x3} ${y3}Z`, fill:tone(k)}, g);
    h=h2;
  }
}
// hour ticks
[["00",0],["06",6],["12",12],["18",18]].forEach(([s,h])=>{
  const a=h/24*2*Math.PI, [x0,y0]=pt(R+5,a), [x1,y1]=pt(R+13,a), [tx,ty]=pt(R+25,a);
  el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:"#5a5852","stroke-width":1});
  el("text",{x:tx,y:ty+4,"text-anchor":"middle",class:"m"}).textContent=s;
});

// right column
const X=800;
el("text",{x:X,y:150,class:"t"}).textContent="Sixty-One Turns";
const lines=["One reading an hour, 15 July – 13 September 2025.","Each ring is a day, read clockwise from midnight;","the first day outermost, the last at the centre."];
lines.forEach((s,i)=>el("text",{x:X,y:184+i*19,class:"b"}).textContent=s);
// stepped legend
const ly=290, sh=15;
for(let k=17;k>=0;k--){ el("rect",{x:X,y:ly+(17-k)*sh,width:34,height:sh-1.5,fill:tone(k)}); }
el("text",{x:X+46,y:ly+11,class:"m"}).textContent="HIGHER";
el("text",{x:X+46,y:ly+18*sh-4,class:"m"}).textContent="LOWER";
el("text",{x:X+46,y:ly+9*sh+4,class:"m"}).textContent="18 STEPS";
const notes=["The record moves in fixed steps.","It rises each afternoon, peaks near 19:00,","sinks to its low near 08:00, and over the","weeks it slides about ten steps down."];
notes.forEach((s,i)=>el("text",{x:X,y:ly+18*sh+44+i*19,class:"b"}).textContent=s);
</script>
</body>
</html>
