<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Whole Heap</title>
<style>
  html, body { margin: 0; padding: 0; background: #ece6da; }
  body { width: 1100px; height: 800px; overflow: hidden; }
  svg { display: block; }
  text { font-family: Georgia, "Times New Roman", serif; fill: #2b2620; }
  .small { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; fill: #5d554a; letter-spacing: .02em; }
  .lab { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10px; fill: #3a332b; }
</style>
</head>
<body>
<svg id="s" width="1100" height="800" viewBox="0 0 1100 800" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="data.js"></script>
<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("s");
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }
  function txt(str, attrs, parent) { var t = el("text", attrs, parent); t.textContent = str; return t; }

  var items = window.FALLS.items.slice().sort(function (a, b) { return b.grams - a.grams; });
  var total = 0; items.forEach(function (f) { total += f.grams; });
  var sortedAsc = items.map(function (f) { return f.grams; }).sort(function (a, b) { return a - b; });
  var median = sortedAsc[Math.floor(sortedAsc.length / 2)];

  // One scale for every stone: diameter in px = K * cube root of grams
  // (each one a ball of the same density, so a 1 g stone and Hoba share the page honestly).
  var K = 0.68;
  var W = 1100, FLOOR = 728, LEFT = 24, RIGHT = 1076, CX = 560;

  var placed = [];
  items.forEach(function (f) {
    var r = Math.max(0.45, K * Math.cbrt(f.grams) / 2);
    var best = null, bestScore = -Infinity;
    for (var x = LEFT + r; x <= RIGHT - r; x += 1) {
      var y = FLOOR - r;
      for (var j = 0; j < placed.length; j++) {
        var p = placed[j], dx = x - p.x, rr = r + p.r;
        if (dx > -rr && dx < rr) {
          var yy = p.y - Math.sqrt(rr * rr - dx * dx);
          if (yy < y) y = yy;
        }
      }
      var score = y - 0.42 * Math.abs(x - CX);
      if (score > bestScore) { bestScore = score; best = { x: x, y: y }; }
    }
    placed.push({ x: best.x, y: best.y, r: r, f: f });
  });

  // ground
  el("line", { x1: 24, x2: 1076, y1: FLOOR + 0.5, y2: FLOOR + 0.5, stroke: "#2b2620", "stroke-width": 1 });

  // stones: tone by year of record (older darker); unknown year a pale grey
  var g = el("g", {});
  placed.forEach(function (p) {
    var y = p.f.year, fill;
    if (y == null) fill = "#b9b2a6";
    else {
      var t = Math.max(0, Math.min(1, (y - 1750) / (2024 - 1750)));
      var l = 18 + t * 40;               // lightness 18%..58%
      fill = "hsl(28, " + (14 + t * 10) + "%, " + l + "%)";
    }
    el("circle", { cx: p.x.toFixed(2), cy: p.y.toFixed(2), r: p.r.toFixed(2), fill: fill,
      stroke: "#ece6da", "stroke-width": p.r > 3 ? 0.8 : 0.25 }, g);
  });

  function fmt(gr) {
    if (gr >= 1e6) return (gr / 1e6).toLocaleString("en", { maximumFractionDigits: 1 }) + " t";
    if (gr >= 1e3) return (gr / 1e3).toLocaleString("en", { maximumFractionDigits: 1 }) + " kg";
    return gr.toLocaleString("en") + " g";
  }
  function clean(n) { return n.replace(/ meteorite$/i, "").replace(/ Meteorite$/, ""); }

  // labels for the five that carry most of the weight
  for (var i = 0; i < 5; i++) {
    var p = placed[i];
    var big = p.r > 60;
    txt(clean(p.f.name), { x: p.x, y: p.y - (big ? 6 : 3), "text-anchor": "middle",
      "font-size": big ? 15 : 11, style: "fill:#ece6da", "font-style": "italic" });
    txt(fmt(p.f.grams) + (p.f.year ? " · " + p.f.year : ""), { x: p.x, y: p.y + (big ? 12 : 10), "text-anchor": "middle",
      class: "lab", style: "fill:#ece6da;opacity:.8", "font-size": big ? 11 : 9 });
  }

  // the smallest one, pointed out
  var tiny = placed[placed.length - 1];
  el("line", { x1: tiny.x, y1: tiny.y - 3, x2: tiny.x, y2: tiny.y - 34, stroke: "#5d554a", "stroke-width": 0.6 });
  txt(clean(tiny.f.name) + ", " + fmt(tiny.f.grams), { x: tiny.x, y: tiny.y - 38, "text-anchor": "middle", class: "small" });

  // header
  txt("The Whole Heap", { x: 40, y: 64, "font-size": 34 });
  var top5 = 0; for (i = 0; i < 5; i++) top5 += items[i].grams;
  txt(items.length + " meteorites that Wikidata gives a mass, piled together at one scale: " +
      (total / 1e6).toFixed(0) + " tonnes in all.", { x: 41, y: 90, class: "small", "font-size": 12 });
  txt("Five stones hold " + Math.round(100 * top5 / total) + "% of it. Half of all of them weigh less than " +
      median + " g, a stone you could close a hand around.", { x: 41, y: 107, class: "small", "font-size": 12 });

  // footer
  txt("Each disc is a ball of equal density: its width follows the cube root of the mass, from 1 g to 60 t.",
      { x: 40, y: 754, class: "small" });
  txt("Shade: year on record, darker is older; pale grey, no year.  Source: " + window.FALLS.source + ".",
      { x: 40, y: 770, class: "small" });
})();
</script>
</body>
</html>
