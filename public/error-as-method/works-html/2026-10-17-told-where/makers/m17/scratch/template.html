<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sixty-One Exposures</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --wall:#e7e2d8; --ink:#5d5a54; }
  html,body { margin:0; height:100%; background:var(--wall); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { display:block; width:1100px; height:800px; max-width:100vw; max-height:100vh; object-fit:contain; }
</style>
</head>
<body>
<canvas id="c" width="2200" height="1600" aria-label="A cyanotype-like print of sixty-one days of sunlight, one horizontal strip per day, blue where the light fell."></canvas>
<script>
// Each day: [solar hour (0..24, noon = 12), value (0..1 of the record's highest), dots merged]
// Read back from the 300x90 plot; approximate to about one hour and a few percent.
const DAYS = __DATA__;

const cv = document.getElementById('c'), S = 2, W = 1100, H = 800;
const ctx = cv.getContext('2d');
ctx.scale(S, S);

// deterministic noise
let seed = 1464;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) >>> 0; h = (h ^ (h >>> 13)) * 1274126177 >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => 0.5 * vnoise(x, y) + 0.25 * vnoise(x * 2.1, y * 2.1) + 0.125 * vnoise(x * 4.3, y * 4.3) + 0.0625 * vnoise(x * 8.7, y * 8.7);

// wall
ctx.fillStyle = '#e7e2d8'; ctx.fillRect(0, 0, W, H);

// sheet
const SX = 120, SY = 46, SW = 860, SH = 668;
ctx.save();
ctx.shadowColor = 'rgba(60,50,35,0.18)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
ctx.fillStyle = '#f5f1e6'; ctx.fillRect(SX, SY, SW, SH);
ctx.restore();

// image field, in device pixels
const FX = SX + 70, FY = SY + 58, FW = SW - 140, FH = SH - 130;
const H0 = 4.5, H1 = 19.5;                  // solar hours shown
const px = FW * S, py = FH * S;
const E = new Float32Array(px * py);
const rowH = py / DAYS.length;
const sx = 0.42 / (H1 - H0) * px;           // horizontal spread: ~ one hour
const sy = rowH * 0.24;

DAYS.forEach((day, d) => {
  const cy = (d + 0.5) * rowH;
  day.forEach(([h, v, k]) => {
    for (let j = 0; j < k; j++) {
      const hh = h + (j - (k - 1) / 2) * 0.55;
      const cx = (hh - H0) / (H1 - H0) * px;
      const x0 = Math.max(0, Math.floor(cx - 3 * sx)), x1 = Math.min(px - 1, Math.ceil(cx + 3 * sx));
      const y0 = Math.max(0, Math.floor(cy - 3 * sy)), y1 = Math.min(py - 1, Math.ceil(cy + 3 * sy));
      for (let y = y0; y <= y1; y++) {
        const gy = Math.exp(-((y - cy) ** 2) / (2 * sy * sy));
        for (let x = x0; x <= x1; x++) {
          const gx = Math.exp(-((x - cx) ** 2) / (2 * sx * sx));
          E[y * px + x] += v * gx * gy;
        }
      }
    }
  });
});

// develop: paper -> prussian blue
const paper = [245, 241, 230], blue = [14, 38, 92], mid = [40, 92, 156];
function develop(t) {           // t 0..1 density
  if (t < 0.55) { const u = t / 0.55; return [paper[0] + (mid[0] - paper[0]) * u, paper[1] + (mid[1] - paper[1]) * u, paper[2] + (mid[2] - paper[2]) * u]; }
  const u = (t - 0.55) / 0.45; return [mid[0] + (blue[0] - mid[0]) * u, mid[1] + (blue[1] - mid[1]) * u, mid[2] + (blue[2] - mid[2]) * u];
}

// brushed coating: field plus a ragged margin that saw full sun
const M = 22 * S;
const bx = (FX * S) - M, by = (FY * S) - M, bw = px + 2 * M, bh = py + 2 * M;
const img = ctx.getImageData(bx, by, bw, bh);
const D = img.data;
for (let y = 0; y < bh; y++) {
  for (let x = 0; x < bw; x++) {
    // ragged edge distance
    const ex = Math.min(x, bw - 1 - x), ey = Math.min(y, bh - 1 - y);
    const edge = Math.min(ex + (fbm(y * 0.02, 3.1) - 0.5) * 22 * S + (vnoise(y * 0.35, 7) - 0.5) * 4 * S,
                          ey + (fbm(x * 0.02, 9.7) - 0.5) * 22 * S + (vnoise(x * 0.35, 1) - 0.5) * 4 * S);
    if (edge < 2 * S) continue;
    const coat = Math.min(1, (edge - 2 * S) / (3 * S));
    const fx = x - M, fy = y - M;
    let t;
    if (fx >= 0 && fy >= 0 && fx < px && fy < py) {
      t = 1 - Math.exp(-1.25 * E[fy * px + fx]);
    } else {
      const inner = Math.max(0, Math.max(-fx, -fy, fx - px + 1, fy - py + 1));
      t = 0.93 - 0.08 * Math.exp(-inner / (4 * S));      // the margin: full sun
    }
    // brush streaks and grain
    const streak = (fbm(x * 0.004, y * 0.09) - 0.47) * 0.16;
    const grain = (hash(x, y) - 0.5) * 0.07;
    t = Math.max(0, Math.min(1, t * (1 + streak) + grain * t + 0.015 * coat));
    t *= coat;
    const c = develop(t);
    const i = (y * bw + x) * 4;
    D[i] = c[0]; D[i + 1] = c[1]; D[i + 2] = c[2];
  }
}
ctx.putImageData(img, bx, by);

// pencil notes
ctx.fillStyle = '#7b766c';
ctx.font = 'italic 13px Georgia, "Times New Roman", serif';
ctx.textBaseline = 'alphabetic';
ctx.fillText('Sixty-One Exposures', SX + 70, SY + SH - 30);
ctx.textAlign = 'right';
ctx.font = '11px Georgia, "Times New Roman", serif';
ctx.fillText('one line a day, sixty-one days, top to bottom  ·  dawn at left, dusk at right', SX + SW - 70, SY + SH - 30);
// faint noon tick top and bottom
ctx.strokeStyle = 'rgba(110,104,94,0.55)'; ctx.lineWidth = 0.6;
const nx = FX + (12 - H0) / (H1 - H0) * FW;
ctx.beginPath(); ctx.moveTo(nx, FY - 36); ctx.lineTo(nx, FY - 30); ctx.moveTo(nx, FY + FH + 30); ctx.lineTo(nx, FY + FH + 36); ctx.stroke();
</script>
</body>
</html>
