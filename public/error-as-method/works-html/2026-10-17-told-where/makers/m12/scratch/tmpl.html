<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Rings, Fort Peck</title>
<style>
  :root { --bg:#050608; --ink:#8a8173; --ink2:#5b554c; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .frame { position:relative; width:1100px; height:800px; flex:none; }
  canvas { display:block; width:1100px; height:800px; }
  .cap { position:absolute; font:400 11px/1.5 Georgia, "Times New Roman", serif; color:var(--ink); letter-spacing:.06em; }
  .cap b { display:block; font-weight:400; font-size:19px; letter-spacing:.02em; color:#cdbfa6; margin-bottom:4px; font-style:italic; }
  .tl { left:40px; top:36px; max-width:230px; }
  .br { right:40px; bottom:34px; text-align:right; color:var(--ink2); max-width:260px; }
</style>
</head>
<body>
<div class="frame">
  <canvas id="c" width="1100" height="800"></canvas>
  <div class="cap tl"><b>Light Rings, Fort Peck</b>Montana, 634 m above sea level.<br>Sixty-one days of hourly values,<br>wound outward from the centre,<br>one turn for each day.</div>
  <div class="cap br">noon at the top, midnight below.<br>warmth of colour: the hourly value.<br>blue: the hours that read zero.<br>points: the values as found in the record.</div>
</div>
<script>
const RINGS = __DATA__;
(function(){
  const W=1100,H=800, dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  const cv=document.getElementById('c'); cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.fillStyle='#050608'; ctx.fillRect(0,0,W,H);
  const CX=600, CY=404, R0=46, DR=5.0;
  const rad=(d,h)=>R0+DR*(d+(h+12)/24);   // one turn per day: a continuous spiral of time
  const ang=h=>-Math.PI/2+h*Math.PI/12;       // hours from noon -> angle, noon up
  const stops=[[0,[18,7,6]],[0.2,[64,16,9]],[0.45,[150,46,16]],[0.68,[222,112,36]],[0.86,[252,196,112]],[1,[255,246,226]]];
  function col(v,a){ v=Math.max(0,Math.min(1,v)); let i=1; while(i<stops.length-1&&stops[i][0]<v)i++;
    const [p0,c0]=stops[i-1],[p1,c1]=stops[i], t=(v-p0)/(p1-p0);
    return `rgb(${c0.map((c,j)=>Math.round((c+(c1[j]-c)*t)*a)).join(',')})`; }   // opaque, pre-darkened on black

  // offscreen layer for the lit rings
  const lay=document.createElement('canvas'); lay.width=W*dpr; lay.height=H*dpr;
  const L=lay.getContext('2d'); L.scale(dpr,dpr); L.lineCap='butt';

  RINGS.forEach(R=>{
    const lw=DR*0.72;
    // observations: detected values plus the whole hours that read zero
    const obs=R.m.map(q=>[q[0],q[1],q[2]]);
    for(let h=Math.ceil(R.a);h<=R.b;h++){ if(h<R.rise-0.5||h>R.set+0.5) obs.push([h,0,1.5]); }
    const est=h=>{ let sw=0,sv=0; for(const o of obs){ const w=o[2]*Math.exp(-((h-o[0])**2)/(2*0.85*0.85)); sw+=w; sv+=w*o[1]; } return sw>1e-6?sv/sw:0; };
    const path=(h0,h1)=>{ L.beginPath(); const n=Math.max(2,Math.ceil((h1-h0)/0.04));
      for(let j=0;j<=n;j++){ const hh=h0+(h1-h0)*j/n, rr=rad(R.d,hh), a=ang(hh);
        j?L.lineTo(CX+rr*Math.cos(a),CY+rr*Math.sin(a)):L.moveTo(CX+rr*Math.cos(a),CY+rr*Math.sin(a)); } };
    const lo=Math.max(R.a,R.rise-0.5), hi=Math.min(R.b,R.set+0.5);
    // the zero hours: a thin cool thread
    L.strokeStyle='rgb(15,20,38)'; L.lineWidth=lw*0.5;
    if(R.a<lo){ path(R.a,lo); L.stroke(); }
    if(hi<R.b){ path(hi,R.b); L.stroke(); }
    // the lit hours: one continuous stroke coloured by angle
    if(hi>lo){
      const g = L.createConicGradient ? L.createConicGradient(Math.PI/2, CX, CY) : null;   // seam at midnight
      if(g){ for(let h=-12; h<=12.0001; h+=0.1){ const hc=Math.min(Math.max(h,lo),hi);
          const v=(h<lo-0.05||h>hi+0.05)?0:est(hc); g.addColorStop((h+12)/24, col(v,0.25+0.75*Math.min(1,v*1.6))); }
        L.strokeStyle=g; L.lineWidth=lw; path(lo,hi); L.stroke(); }
      else { for(let h=lo; h<hi; h+=0.1){ const v=est(h+0.05); L.strokeStyle=col(v,0.25+0.75*Math.min(1,v*1.6)); L.lineWidth=lw; path(h,Math.min(hi,h+0.12)); L.stroke(); } }
    }
  });

  // bloom then crisp layer
  ctx.save(); ctx.globalCompositeOperation='lighter';
  if('filter' in ctx){ ctx.filter='blur(16px)'; ctx.globalAlpha=0.32; ctx.drawImage(lay,0,0,W,H);
    ctx.filter='blur(4px)'; ctx.globalAlpha=0.30; ctx.drawImage(lay,0,0,W,H); ctx.filter='none'; }
  ctx.globalAlpha=1; ctx.drawImage(lay,0,0,W,H); ctx.restore();

  // the found values, as small points on their ring
  RINGS.forEach(R=>{
    R.m.forEach(q=>{ const a=ang(q[0]), r=rad(R.d,q[0]); const s=0.55+0.35*Math.min(q[2],3);
      ctx.fillStyle=`rgba(255,250,240,${0.18+0.5*q[1]})`;
      ctx.beginPath(); ctx.arc(CX+r*Math.cos(a),CY+r*Math.sin(a),s,0,Math.PI*2); ctx.fill(); });
  });

  // a hairline meridian marking noon / midnight
  ctx.strokeStyle='rgba(205,191,166,0.18)'; ctx.lineWidth=1;
  const rr=R0+62*DR+14;
  ctx.beginPath(); ctx.moveTo(CX,CY-rr); ctx.lineTo(CX,CY-rr-12); ctx.moveTo(CX,CY+rr); ctx.lineTo(CX,CY+rr+12); ctx.stroke();
  ctx.fillStyle='#050608'; ctx.beginPath(); ctx.arc(CX,CY,R0-DR*0.6,0,Math.PI*2); ctx.fill();
})();
</script>
</body>
</html>
