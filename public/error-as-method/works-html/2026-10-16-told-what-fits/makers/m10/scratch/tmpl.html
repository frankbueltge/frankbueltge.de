<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty-One Drawdowns</title>
<style>
  :root { --paper:#f2eee5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#f2eee5; } }
  :root[data-theme="dark"] { --paper:#f2eee5; }
  html,body { margin:0; height:100%; background:var(--paper); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  canvas { display:block; max-width:100vw; max-height:100vh; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="800" role="img" aria-label="Sixty-one days of hourly carbon dioxide values, one row per day, each day hanging over the next: every row dips into a deep midday valley and rises again through the night."></canvas>
<script>
// 1464 hourly values recovered from the supplied plot (heights in quarter pixels of the original; larger = more CO2).
const V=[__DATA__];
const W=1100,H=800,PAPER=[242,238,229],cv=document.getElementById('c'),dpr=Math.max(1,window.devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
const g=cv.getContext('2d');g.scale(dpr,dpr);
g.fillStyle=`rgb(${PAPER})`;g.fillRect(0,0,W,H);
const vmin=Math.min(...V),vmax=Math.max(...V),D=61;
const X0=64,X1=744,TOP=142,BOT=668,AMP=158,SP=(BOT-TOP)/(D-1);
const X=h=>X0+(X1-X0)*h/24;
const Y=(d,v)=>TOP+d*SP+AMP*0.5-(v-vmin)/(vmax-vmin)*AMP;
function rowPts(d){const p=[];for(let h=0;h<=24;h++){const i=Math.min(d*24+h,V.length-1);p.push([X(h),Y(d,V[i])]);}return p;}
function curve(p){g.moveTo(p[0][0],p[0][1]);for(let i=0;i<p.length-1;i++){const a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],e=p[Math.min(p.length-1,i+2)];
  g.bezierCurveTo(b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6,c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6,c[0],c[1]);}}
// faint hour guides behind everything
g.strokeStyle='rgba(60,52,40,0.07)';g.lineWidth=1;
for(let h=0;h<=24;h+=6){g.beginPath();g.moveTo(X(h)+.5,TOP-70);g.lineTo(X(h)+.5,BOT+AMP*0.5+18);g.stroke();}
// last day first, so every day hangs in front of the days that follow it
for(let d=D-1;d>=0;d--){
  const p=rowPts(d);
  g.beginPath();curve(p);g.lineTo(X1,TOP+d*SP-AMP);g.lineTo(X0,TOP+d*SP-AMP);g.closePath();
  g.fillStyle=`rgba(${PAPER},0.9)`;g.fill();
  g.beginPath();curve(p);g.strokeStyle='rgba(30,27,24,0.82)';g.lineWidth=0.9;g.stroke();
  g.fillStyle='rgba(30,27,24,0.95)';
  for(let h=0;h<24;h++){g.beginPath();g.arc(p[h][0],p[h][1],1.25,0,7);g.fill();}
}
// margin marks
g.fillStyle='#8a8275';g.font='italic 12px Georgia, "Times New Roman", serif';g.textAlign='right';
g.fillText('day 1',X0-10,Y(0,V[0])+4);g.fillText('day 61',X0-10,Y(60,V[1440])+4);
g.textAlign='center';
const yb=BOT+AMP*0.5+34;
[0,6,12,18,24].forEach(h=>g.fillText(h===0?'hour 0':(h===24?'24':String(h)),X(h),yb));
g.fillText('hours from the start of each day of the record',(X0+X1)/2,yb+18);
// text column
const L=800;g.textAlign='left';
g.fillStyle='#1e1b18';g.font='400 33px Georgia, "Times New Roman", serif';
g.fillText('Sixty-One',L,176);g.fillText('Drawdowns',L,214);
g.fillStyle='#57514a';g.font='400 15px Georgia, "Times New Roman", serif';
const T=['Carbon dioxide in the air at one','measuring station, read once an hour','for sixty-one days.','',
'Each line is one day, laid under the','one before. Higher on a line is more','CO₂. Each day hangs over the days','that follow it.','',
'Every day the air is drawn down, fast,','to a low a few hours after the line','begins, and then fills again, slowly,','over the rest of the day and the night.','',
'Four times the whole level leaps up','and the day’s valley goes shallow;','then over two or three weeks the level','sinks and the valleys deepen again.','',
'Place, dates and clock time are unknown.','Values are read back from a picture,','so heights are relative, not ppm.'];
T.forEach((t,k)=>g.fillText(t,L,262+k*21));
</script>
</body>
</html>
