function draw(){
const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;
c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
g.fillStyle='#f3eee4';g.fillRect(0,0,W,H);
const cx=W/2,cy=H/2-8,S=Math.min(W,H)/800;
const R0=118*S,A=232*S;
const rad=v=>R0+v*A, ang=i=>(i%24)/24*Math.PI*2-Math.PI/2;
// heartwood: the radius the trunk never shrank below
let mn=Math.min(...V);
const grd=g.createRadialGradient(cx,cy,0,cx,cy,rad(mn));
grd.addColorStop(0,'rgba(196,160,112,0.30)');grd.addColorStop(1,'rgba(176,134,86,0.16)');
g.fillStyle=grd;g.beginPath();g.arc(cx,cy,rad(mn),0,7);g.fill();

g.strokeStyle='rgba(42,29,20,0.18)';g.lineWidth=0.6;
[0,1].forEach(v=>{g.beginPath();g.arc(cx,cy,rad(v),0,7);g.stroke();});
// the record: one turn per day, continuous spiral of hours
g.lineJoin='round';g.lineCap='round';
for(let i=1;i<V.length;i++){
  const d=Math.floor(i/24), t=d/60;
  const a0=ang(i-1),a1=ang(i)+((i%24)==0?Math.PI*2:0);
  g.strokeStyle=`rgba(${Math.round(120-80*t)},${Math.round(74-50*t)},${Math.round(40-24*t)},${0.22+0.30*t})`;
  g.lineWidth=(0.7+0.5*t)*S;
  g.beginPath();
  const steps=6;
  for(let k=0;k<=steps;k++){const f=k/steps,a=a0+(a1-a0)*f,r=rad(V[i-1]+(V[i]-V[i-1])*f);
    const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);k?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();
}
// the hourly measurements themselves
for(let i=0;i<V.length;i++){const t=Math.floor(i/24)/60,r=rad(V[i]),a=ang(i);
  g.fillStyle=`rgba(42,29,20,${0.25+0.45*t})`;
  g.beginPath();g.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),1.15*S,0,7);g.fill();}
// first and last hour
const mark=(i,fill)=>{const r=rad(V[i]),a=ang(i);g.beginPath();g.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),3.2*S,0,7);
  g.lineWidth=1.1*S;g.strokeStyle='#2a1d14';if(fill){g.fillStyle='#2a1d14';g.fill();}else{g.fillStyle='#f3eee4';g.fill();}g.stroke();};
mark(0,false);mark(V.length-1,true);

g.fillStyle='rgba(42,29,20,0.82)';g.textAlign='center';
g.font=`italic ${15*S}px Georgia, 'Times New Roman', serif`;
g.fillText('Sixty-One Breaths',cx,H-40*S);
g.fillStyle='rgba(42,29,20,0.55)';g.font=`${11*S}px Georgia, 'Times New Roman', serif`;

}
