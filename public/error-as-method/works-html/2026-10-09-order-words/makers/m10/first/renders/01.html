<!doctype html>
<html><head><meta charset="utf-8"><title>Not assigned</title>
<style>
html,body{margin:0;width:1100px;height:800px;overflow:hidden;background:#f1eee6}
#wall{position:absolute;left:34px;top:30px;width:1032px;height:712px;
  font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;color:#2b2a27;
  text-align:justify;text-align-last:justify;hyphens:none;word-break:keep-all;letter-spacing:-0.02em}
#wall span{white-space:nowrap}
#wall .cc{color:#8a3b1e}
#wall .na{color:transparent;background:#dcd7ca;border-radius:1px;box-shadow:inset 0 -1px 0 #c9c2b2}
#wall .na.t{background:#e6e1d4}
#foot{position:absolute;left:34px;right:34px;bottom:22px;display:flex;justify-content:space-between;align-items:baseline;
  font-family:Georgia,"DejaVu Serif",serif;color:#2b2a27;font-size:13px}
#foot b{font-weight:normal;font-style:italic;font-size:18px;letter-spacing:.01em}
#foot .k{display:inline-block;width:26px;height:9px;background:#dcd7ca;vertical-align:-1px;margin-right:6px;box-shadow:inset 0 -1px 0 #c9c2b2}
#foot .c{color:#8a3b1e}
#foot span.s{color:#7a766c;font-size:11.5px}
</style></head><body>
<div id="wall"></div>
<div id="foot"><b>Not assigned</b><span id="legend"></span><span class="s" id="src"></span></div>
<script src="data.js"></script>
<script>
var R=window.ROOT, items=R.items, wall=document.getElementById('wall');
var na=0, cc=0;
var html=items.map(function(d){
  var name=d.tld.replace(/[‎‏]/g,'');
  var cls=[];
  if(d.manager==='Not assigned'){cls.push('na');na++; if(d.type==='test')cls.push('t');}
  else if(d.type==='country-code'){cls.push('cc');cc++;}
  return '<span'+(cls.length?' class="'+cls.join(' ')+'"':'')+' dir="auto">'+name+'</span>';
}).join(' ');
wall.innerHTML=html;
// fit font size to fill the wall exactly
var lo=4,hi=20;
for(var i=0;i<30;i++){var m=(lo+hi)/2;wall.style.fontSize=m+'px';wall.style.lineHeight='1.32';
  if(wall.scrollHeight>712)hi=m;else lo=m;}
wall.style.fontSize=lo+'px';
document.getElementById('legend').innerHTML=
  items.length+' names in the root zone &nbsp;·&nbsp; <span class="c">'+cc+' countries and territories</span> &nbsp;·&nbsp; <span class="k"></span>'+na+' held by no one';
document.getElementById('src').textContent='IANA Root Zone Database, '+(R.source.match(/\d{4}-\d\d-\d\d/)||[''])[0];
</script></body></html>
