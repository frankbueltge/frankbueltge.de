<!doctype html>
<html><head><meta charset="utf-8"><title>Not assigned</title>
<style>
html,body{margin:0;width:1100px;height:800px;overflow:hidden;background:#efebe3}
#wall{position:absolute;left:46px;top:40px;width:1008px;height:676px;overflow:hidden;
 font-family:Georgia,"Times New Roman",serif;text-align:justify;text-align-last:justify;hyphens:none;word-break:keep-all;color:#cdc6b9}
#wall span{white-space:nowrap}
#wall .v{color:#16130f}
#cap{position:absolute;left:46px;right:46px;top:736px;font-family:Georgia,serif;color:#16130f;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #16130f;padding-top:10px}
#cap .t{font-size:22px;font-style:italic;letter-spacing:.01em}
#cap .s{font-size:11px;color:#6d665b;letter-spacing:.04em}
</style></head><body>
<div id="wall"></div>
<div id="cap"><span class="t">Not assigned</span><span class="s" id="s"></span></div>
<script src="data.js"></script>
<script>
const items=window.ROOT.items, wall=document.getElementById('wall');
let n=0;
const frag=document.createDocumentFragment();
items.forEach((r,i)=>{
  const s=document.createElement('span');
  s.textContent=r.tld.replace(/[‎‏]/g,'');
  s.dir='ltr';
  if(r.manager==='Not assigned'){s.className='v';n++;}
  frag.appendChild(s); frag.appendChild(document.createTextNode(' '));
});
wall.appendChild(frag);
// largest size that fits
let lo=4,hi=20;
for(let k=0;k<18;k++){const m=(lo+hi)/2;wall.style.fontSize=m+'px';wall.style.lineHeight=(m*1.32)+'px';
  if(wall.scrollHeight<=wall.clientHeight)lo=m;else hi=m;}
wall.style.fontSize=lo+'px';wall.style.lineHeight=(lo*1.32)+'px';
document.getElementById('s').textContent=
  n+' of '+items.length.toLocaleString('en')+' top-level domains in the root zone have no manager — IANA Root Zone Database, '+window.ROOT.source.split('as of ')[1];
</script>
</body></html>
