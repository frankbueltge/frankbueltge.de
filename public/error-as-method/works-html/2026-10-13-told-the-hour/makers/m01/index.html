<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Thirty-Six and Three Fifths</title>
<meta name="viewport" content="width=1100">
<style>
html,body{margin:0;background:#f4f1ea;}
canvas{display:block;margin:0 auto;}
</style></head>
<body>
<canvas id="c" width="1100" height="800"></canvas>
<script>
// The whole of the material: the 40 x 12 grey levels of record.jpg (row 0 = top).
const PX = [[255, 234, 243, 235, 255, 255, 229, 255, 207, 249, 255, 244, 238, 255, 255, 255, 255, 244, 244, 255, 255, 251, 250, 255, 227, 255, 255, 255, 255, 235, 234, 255, 250, 255, 80, 53, 233, 171, 81, 255], [255, 161, 97, 91, 134, 147, 66, 37, 37, 69, 76, 56, 61, 106, 142, 148, 110, 132, 171, 206, 218, 222, 246, 255, 255, 255, 255, 242, 255, 253, 255, 238, 255, 178, 31, 6, 74, 32, 0, 71], [218, 39, 0, 14, 27, 60, 41, 30, 15, 36, 35, 10, 6, 36, 61, 64, 17, 26, 38, 39, 33, 57, 130, 202, 249, 215, 255, 234, 255, 244, 255, 213, 225, 85, 25, 40, 22, 16, 31, 18], [250, 57, 35, 43, 3, 23, 31, 27, 23, 43, 49, 31, 18, 18, 14, 1, 46, 38, 25, 2, 0, 0, 59, 128, 107, 125, 255, 212, 189, 133, 231, 140, 73, 0, 0, 47, 24, 27, 51, 26], [251, 50, 22, 41, 24, 50, 31, 0, 8, 24, 34, 31, 28, 29, 26, 17, 19, 26, 43, 57, 49, 34, 38, 55, 25, 52, 215, 124, 73, 0, 100, 18, 8, 12, 17, 31, 36, 15, 12, 38], [88, 0, 17, 30, 16, 49, 49, 52, 43, 40, 34, 29, 31, 40, 50, 56, 11, 5, 14, 33, 38, 25, 16, 18, 28, 16, 93, 31, 24, 0, 54, 0, 34, 77, 49, 21, 42, 20, 8, 68], [23, 27, 75, 39, 1, 10, 6, 48, 38, 28, 17, 14, 13, 14, 18, 22, 66, 42, 24, 24, 25, 24, 34, 49, 34, 15, 23, 11, 37, 35, 53, 39, 19, 35, 20, 3, 11, 16, 20, 37], [21, 25, 37, 4, 37, 71, 21, 27, 16, 16, 26, 42, 48, 39, 28, 24, 17, 14, 22, 37, 36, 23, 22, 32, 24, 35, 23, 36, 43, 28, 10, 40, 36, 11, 34, 47, 27, 51, 62, 8], [48, 16, 33, 30, 50, 5, 57, 17, 21, 37, 28, 8, 28, 67, 56, 12, 10, 55, 27, 2, 43, 41, 15, 42, 23, 21, 19, 20, 23, 24, 22, 20, 14, 57, 194, 224, 103, 84, 152, 146], [11, 0, 104, 206, 213, 94, 166, 238, 168, 45, 64, 220, 233, 68, 0, 47, 135, 129, 67, 53, 118, 111, 32, 0, 52, 38, 28, 35, 51, 57, 47, 33, 49, 87, 225, 255, 230, 233, 255, 253], [28, 72, 225, 255, 255, 211, 255, 255, 255, 180, 171, 255, 255, 167, 97, 121, 249, 230, 174, 167, 222, 210, 118, 53, 29, 18, 20, 54, 104, 138, 140, 129, 253, 228, 255, 255, 240, 249, 255, 244], [157, 159, 255, 235, 255, 255, 255, 228, 255, 255, 255, 228, 242, 255, 255, 212, 255, 255, 255, 255, 255, 255, 220, 190, 255, 249, 242, 251, 255, 255, 255, 255, 255, 246, 247, 250, 228, 249, 255, 253]];
const N = 1464, COLS = 40, ROWS = 12;
const c = document.getElementById('c');
const dpr = window.devicePixelRatio || 1;
c.width = 1100*dpr; c.height = 800*dpr; c.style.width='1100px'; c.style.height='800px';
const g = c.getContext('2d'); g.scale(dpr,dpr);
g.fillStyle = '#f4f1ea'; g.fillRect(0,0,1100,800);

const X0 = 60, W = 980, Y0 = 130, H = 480, rh = H/ROWS;
// darkness of a pixel, with the JPEG's pale ringing pushed back toward paper
const ink = v => { const d = (255 - v)/255; return d < 0.12 ? 0 : Math.pow((d-0.12)/0.88, 0.9); };

// Each value i occupies [i, i+1) of 1464; in picture columns that is [i*40/1464, (i+1)*40/1464).
// Where a value straddles a pixel boundary, its profile is the weighted mix of both columns.
const step = W / N;
for (let i = 0; i < N; i++) {
  const a = i*COLS/N, b = (i+1)*COLS/N;
  const ca = Math.floor(a), cb = Math.min(COLS-1, Math.floor(b - 1e-9));
  const x = X0 + (i + 0.5)*step;
  for (let r = 0; r < ROWS; r++) {
    let d;
    if (ca === cb) d = ink(PX[r][ca]);
    else { const w = (cb - a)/(b - a); d = w*ink(PX[r][ca]) + (1-w)*ink(PX[r][cb]); }
    if (d <= 0) continue;
    g.fillStyle = 'rgba(28,32,46,' + (0.92*d).toFixed(3) + ')';
    g.fillRect(x - step*0.32, Y0 + r*rh + 0.6, step*0.64, rh - 1.2);
  }
}

// Pixel boundaries: the 39 places where one column of the picture gives way to the next.
g.strokeStyle = 'rgba(176,74,46,0.55)'; g.lineWidth = 1;
for (let k = 1; k < COLS; k++) {
  const x = X0 + k*N/COLS*step;
  g.beginPath(); g.moveTo(x, Y0 + H + 14); g.lineTo(x, Y0 + H + 26); g.stroke();
}
// One tick per value along the base.
g.fillStyle = 'rgba(28,32,46,0.55)';
for (let i = 0; i < N; i++) g.fillRect(X0 + (i+0.5)*step - 0.25, Y0 + H + 34, 0.5, (i % 61 === 0) ? 9 : 5);

g.fillStyle = '#1c202e';
g.font = '500 15px Georgia, "Times New Roman", serif';
g.fillText('Thirty-Six and Three Fifths', X0, 78);
g.font = '12.5px Georgia, "Times New Roman", serif';
g.fillStyle = '#5b5a55';
g.fillText('1,464 values, one per hairline. The picture they came in had 40 columns and 12 levels, so each column held 36.6 of them, and every value in a column is drawn with the same twelve greys.', X0, 100);
g.fillText('Red marks: where one column of the picture ends and the next begins. A value that straddles a boundary is shaded as the mixture of both. Below: one tick for each value.', X0, Y0 + H + 80);
g.fillText('Height of any single value: unknown to within the dark of its column.', X0, Y0 + H + 100);
</script>
</body></html>
