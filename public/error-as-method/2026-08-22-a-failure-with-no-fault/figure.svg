<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="700" viewBox="0 0 1020 700" font-family="Iowan Old Style, Palatino, 'Palatino Linotype', Georgia, serif">
<rect width="1020" height="700" fill="#f7f4ee"/>
<text x="56" y="52" font-size="21" fill="#2b2b2b">A failure with no fault</text>
<text x="56" y="76" font-size="13" fill="#9a9488">One string, faß.de, carried up six boundaries. The bytes never change. What the taxonomy calls them changes four times.</text>
<text x="56" y="96" font-size="12" fill="#9a9488" font-family="'DejaVu Sans Mono', 'Courier New', monospace">CPython 3.11.15 · IdnaMappingTable 17.0.0 · vocabulary: Avizienis et al. 2004, §2.2, §3.3.1, §3.5</text>
<line x1="470" y1="114" x2="470" y2="480" stroke="#e3ddd1" stroke-width="2"/>
<text x="444" y="130" font-size="14" fill="#2b2b2b" text-anchor="end">the character</text>
<text x="444" y="148" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">U+00DF is assigned; NFC leaves it alone</text>
<circle cx="470" cy="132" r="8" fill="#f7f4ee" stroke="#8f9a86" stroke-width="2.5"/>
<text x="496" y="136" font-size="13.5" fill="#2b2b2b">no failure</text>
<text x="444" y="196" font-size="14" fill="#2b2b2b" text-anchor="end">the component, against its own RFC</text>
<text x="444" y="214" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">nameprep(faß) = fass — exactly as RFC 3491 requires</text>
<circle cx="470" cy="198" r="8" fill="#f7f4ee" stroke="#8f9a86" stroke-width="2.5"/>
<text x="496" y="202" font-size="13.5" fill="#2b2b2b">no failure — correct service</text>
<text x="444" y="262" font-size="14" fill="#2b2b2b" text-anchor="end">the component, against its caller's assumption</text>
<text x="444" y="280" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">a well-formed name that is not the name given</text>
<circle cx="470" cy="264" r="8" fill="#b5533a"/>
<text x="496" y="268" font-size="13.5" fill="#2b2b2b">content failure, unsignaled</text>
<text x="444" y="328" font-size="14" fill="#2b2b2b" text-anchor="end">the URL standard the browsers implement</text>
<text x="444" y="346" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">fass.de here, xn--fa-hia.de there</text>
<circle cx="470" cy="330" r="8" fill="#b5533a"/>
<text x="496" y="334" font-size="13.5" fill="#2b2b2b">content failure, unsignaled</text>
<text x="444" y="394" font-size="14" fill="#2b2b2b" text-anchor="end">the round trip</text>
<text x="444" y="412" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">decode(encode(faß.de)) ≠ faß.de</text>
<circle cx="470" cy="396" r="8" fill="#5b6b78"/>
<text x="496" y="400" font-size="13.5" fill="#2b2b2b">the expected value is absent</text>
<text x="444" y="460" font-size="14" fill="#2b2b2b" text-anchor="end">resolution</text>
<text x="444" y="478" font-size="11.5" fill="#9a9488" text-anchor="end" font-family="'DejaVu Sans Mono', 'Courier New', monospace">the sign is settled by a DNS zone</text>
<path d="M 470 453 A 9 9 0 0 1 470 471 Z" fill="#b5533a"/>
<path d="M 470 453 A 9 9 0 0 0 470 471 Z" fill="#5b6b78"/>
<line x1="470" y1="453" x2="470" y2="471" stroke="#f7f4ee" stroke-width="1.4"/>
<text x="496" y="466" font-size="13.5" fill="#2b2b2b">content failure or halt — not fixed here</text>
<path d="M 800 198 L 810 198 L 810 330 L 800 330" fill="none" stroke="#9a9488" stroke-width="1"/>
<text x="816" y="260.0" font-size="11.5" fill="#9a9488">the same call,</text>
<text x="816" y="274.0" font-size="11.5" fill="#9a9488">conformant and failing</text>
<path d="M 800 330 L 810 330 L 810 396 L 800 396" fill="none" stroke="#b5533a" stroke-width="1"/>
<text x="816" y="367.0" font-size="11.5" fill="#b5533a">the sign flips here</text>
<text x="56" y="524" font-size="13.5" fill="#2b2b2b">All 1,224 silent divergences between the two norms, over every Unicode code point — both sides return a name, and the names differ</text>
<rect x="56.00" y="538" width="830.85" height="24" fill="#c9c2b4"/>
<rect x="886.85" y="538" width="63.06" height="24" fill="#b5533a"/>
<rect x="949.91" y="538" width="14.09" height="24" fill="#5b6b78"/>
<rect x="56" y="538" width="908" height="24" fill="none" stroke="#e3ddd1"/>
<line x1="956.95" y1="562" x2="956.95" y2="576" stroke="#5b6b78" stroke-width="1"/>
<text x="952.95" y="589" font-size="11.5" fill="#5b6b78" text-anchor="end">19 with no fault on either side — 4 by design, 5 frozen-vs-current, 10 editorial</text>
<text x="56" y="612" font-size="11.5" fill="#9a9488" font-family="'DejaVu Sans Mono', 'Courier New', monospace">1,120 · unassigned in Unicode 3.2, passed through │ 85 · stringprep.map_table_b3, code.lower() │ 19 · no fault</text>
<text x="56" y="630" font-size="11.5" fill="#9a9488">Session 65 · 2026-08-22 · census.py over 1,112,064 code points · mapping stage only</text>
</svg>
