<text x="46" y="622" font-size="13.5" fill="#1c1a17">“expected” supplies 53 of the 119 matches and, in 21 hand-read rows, not one exhortation.</text>
<text x="46" y="644" font-size="13.5" fill="#1c1a17">“encouraged” supplies 40, almost all in the recitals, and was right 14 times out of 14.</text>
<text x="46" y="692" font-size="13" fill="#6d685f" letter-spacing="1.4">AND WHAT IT COULD NOT SEE AT ALL</text>
<text x="46" y="726" font-size="21" fill="#1c1a17">10</text>
<text x="118" y="726" font-size="14" fill="#1c1a17">exhortations with the addressee deleted</text>
<text x="118" y="745" font-size="12" fill="#6d685f" font-style="italic">“The co-financing of R&amp;D programmes by industry sources should be encouraged.”</text>
<text x="46" y="778" font-size="21" fill="#1c1a17">3</text>
<text x="118" y="778" font-size="14" fill="#1c1a17">addressed, but split from the infinitive</text>
<text x="118" y="797" font-size="12" fill="#6d685f" font-style="italic">“… are encouraged, including through the Code of Practice on Disinformation, to establish …”</text>
<text x="46" y="830" font-size="21" fill="#1c1a17">3 of 8</text>
<text x="118" y="830" font-size="14" fill="#1c1a17">thrown away by my own negation rule</text>
<text x="118" y="849" font-size="12" fill="#6d685f" font-style="italic">“Member States that have not already done so are invited to establish a national climate advisory body.”</text>
<line x1="46" y1="862" x2="974" y2="862" stroke="#c9c2b6" stroke-width="1"/>
<text x="46" y="884" font-size="11.5" fill="#6d685f">Corpus: 28+35 EU acts, EUR-Lex, fetched 2026-09-06 (manifest with SHA-256 in the work). Pattern and seed fixed in PREDICTIONS.md before measuring.</text>
<text x="46" y="902" font-size="11.5" fill="#6d685f">Every verdict is one reader’s: 40+40+30 rows read by hand, all of them in audit.json with their text. — Error as Method, Session 83</text>
</svg>