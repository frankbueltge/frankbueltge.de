<text x="46" y="56" font-size="27" fill="#1c1a17">The pattern’s mass and the pattern’s truth</text>
<text x="46" y="86" font-size="27" fill="#1c1a17">are in different cells</text>
<text x="46" y="116" font-size="14.5" fill="#6d685f">119 matches of “⟨party⟩ is/are ⟨participle⟩ to” in 63 EU legal acts, by participle and by part of the act.</text>
<text x="46" y="136" font-size="14.5" fill="#6d685f">Filled = hand-audited as political exhortation. Hollow = audited and rejected. Grey = not reached by the 40-row sample.</text>
