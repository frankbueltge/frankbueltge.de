<text x="215" y="525" font-size="12.5" fill="#6f6a5c">— for implementers documenting what they implemented from</text>
<text x="40" y="546" font-size="12.5" fill="#16150f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">anchor permanence</text>
<text x="215" y="546" font-size="12.5" fill="#6f6a5c">— for other standards referencing parts of the standard</text>
<text x="40" y="585" font-size="12" fill="#6f6a5c">Removal criterion, WHATWG Working Mode: “The feature being removed must either be not widely implemented,</text>
<text x="40" y="602" font-size="12" fill="#6f6a5c">or must in the process of being removed from implementations.”</text>
