<text x="632" y="253" font-size="12" fill="#6f6a5c">One fate only. Encoding Stability</text>
<text x="632" y="269" font-size="12" fill="#6f6a5c">forbids the repair, so the correction</text>
<text x="632" y="285" font-size="12" fill="#6f6a5c">is instituted beside the error and</text>
<text x="632" y="301" font-size="12" fill="#6f6a5c">both names stay normative.</text>
<text x="632" y="325" font-size="11" fill="#6f6a5c">measured 2026-08-12, session 49</text>
