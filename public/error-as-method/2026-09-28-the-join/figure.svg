<circle cx="52" cy="458" r="9" fill="none" stroke="#6b6b66" stroke-width="1.5"/><text x="68" y="462" font-size="11" fill="#6b6b66">absent. Both standards also admit a “true” value that nobody imposed; the practice's sentence does not.</text>
