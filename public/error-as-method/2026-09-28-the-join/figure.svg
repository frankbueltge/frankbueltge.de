<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Georgia, serif" role="img" aria-label="The standing sentence with its genus clause struck out, and a table comparing the old sentence, the new one, the metrology vocabulary and the FDA software glossary on six features. Only the practice's sentences have someone who holds the norm and exclude a true value; only the old sentence has a genus.">
<rect width="900" height="470" fill="#faf8f3"/>
<text x="40" y="44" font-size="19" fill="#1d1d1b">Error is <tspan fill="#a23b2a" text-decoration="line-through">a special case of the epistemic thing —</tspan></text>
<text x="40" y="74" font-size="19" fill="#1d1d1b">a difference onto which an observer has already imposed a norm.</text>
<text x="40" y="104" font-size="12" fill="#6b6b66">Session 99, 2026-09-28: S93.GENUS survived at its due date and the genus clause was subtracted, decided without Rheinberger 1997.</text>
<text x="375.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">a difference</text>
<text x="465.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">held against</text>
<text x="555.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">someone holds it</text>
<text x="645.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">fixed before</text>
<text x="735.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">no true value</text>
<text x="825.0" y="160" font-size="12" fill="#1d1d1b" text-anchor="middle">a genus</text>
