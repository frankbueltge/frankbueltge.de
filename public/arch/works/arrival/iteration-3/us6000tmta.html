<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival</title>
<style>
  :root{

    --machine:#e0a33e; --body:#6fb3c9; --hot:#f4f2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}

  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:0 0 9px}
  .says{font-size:14.5px;color:var(--ink);margin:0 0 9px;letter-spacing:.01em}
  .says em{font-style:normal;color:var(--machine)}
  .says i{font-style:normal;color:var(--body)}
  .ident{color:var(--dim);font-size:12.5px;word-spacing:.08em}
  .ident b{color:var(--ink);font-weight:600}
  figure{margin:0}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
  .grid{stroke:var(--line);stroke-width:1}
  .axis{stroke:#4a5058;stroke-width:1}
  .tick{fill:var(--dim);font-size:11px}
  .axlabel{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase}
  .axlabel.d{fill:var(--dim)} .axlabel.m{fill:var(--machine)} .axlabel.b{fill:var(--body)}
  .note{fill:var(--dim);font-size:11px}
  .sta{fill:var(--machine);fill-opacity:.72;stroke:none}
  .stair{fill:none;stroke:var(--body);stroke-width:1.6}
  .stairdrop{stroke:var(--body);stroke-width:1;stroke-opacity:.35}
  .cutm{fill:var(--machine);fill-opacity:.07}
  .cutb{fill:var(--body);fill-opacity:.07}
  .reach{stroke-width:1.5}
  .reachm{stroke:var(--machine)} .reachb{stroke:var(--body)}
  .ghost{stroke-width:1;stroke-dasharray:3 4;stroke-opacity:.55}
  .rlabel{font-size:11.5px}
  .rlm{fill:var(--machine)} .rlb{fill:var(--body)}
  .span{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3}
  .spanlabel{fill:var(--hot);font-size:12.5px;letter-spacing:.04em}
  .tip{fill:var(--hot);font-size:12px}
  .tipbg{fill:#000;fill-opacity:.85}
  .hit{fill:transparent;cursor:crosshair}
  footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;
         color:var(--dim);font-size:11.5px;line-height:1.7;word-break:break-all}
  .ctl{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;
       margin:13px 0 0;font-size:12.5px;color:var(--dim)}
  .ctl .who{min-width:11.5em;letter-spacing:.05em;text-transform:uppercase;font-size:11.5px}
  .ctl.m .who{color:var(--machine)} .ctl.b .who{color:var(--body)}
  button{font:inherit;background:#15171b;color:var(--ink);border:1px solid #2e3238;
         border-radius:3px;padding:2px 9px;cursor:pointer;line-height:1.4}
  button:hover{border-color:var(--hot)}
  button[disabled]{opacity:.32;cursor:default;border-color:#2e3238}
  .val{color:var(--ink);min-width:4.2em;display:inline-block;text-align:center}
  .caption{margin:14px 0 0;color:var(--dim);font-size:11.5px;line-height:1.75;max-width:96ch}
  table{border-collapse:collapse;margin-top:16px;font-size:12.5px;width:100%;max-width:860px}
  th,td{text-align:left;padding:7px 16px 7px 0;border-bottom:1px solid var(--line);
        white-space:nowrap}
  th{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.11em;
     text-transform:uppercase}
  td.who{font-weight:600}
  tr.m td.who{color:var(--machine)} tr.b td.who{color:var(--body)}
  td.big{color:var(--hot);font-size:15px}
</style>
</head>

// One axis is shared by the two networks, and it is the only thing they share:
// the instruments publish an instant, the felt reports publish no time at all.

const allDeg = S.map(s=>s.deg).concat(F.map(f=>f.km/KMD));
const dLo = Math.min(...allDeg)*0.75, dHi = Math.max(...allDeg)*1.12;
const L = Math.log10, span = L(dHi)-L(dLo);

const W=1200, H=700, M={l:96,r:150,t:30,b:66};

// threshold must shrink what is drawn; it must never renormalise the loss away.
const tMax = Math.ceil(S[S.length-1].t/100)*100;

// Rounding must never let a loss read as no loss, in either direction.
const pct = (a,b) => {
  if(!b) return '—';
  const r = a/b;
  if(r === 1) return '100%';
  if(r > 0.995) return '>99%';
  if(r > 0 && r < 0.005) return '<1%';
  return Math.round(r*100)+'%';
};

function beside(x, text, cls, y){
  const w = text.length*6.4;
  return x+8+w > W
    ? `<text class="rlabel ${cls}" x="${(x-8).toFixed(1)}" y="${y}" text-anchor="end">${text}</text>`

const cutsG = document.getElementById('cuts');

// ---- the two thresholds ----------------------------------------------------
// One ladder per network, each built from that network's own published values.
const RUNGS = [Infinity,3,2,1.5,1,0.75,0.5,0.35,0.25,0.15,0.1,0.05]
  .filter((v,i) => i===0 || S.filter(s=>Math.abs(s.res)<=v).length >= 2);
const maxN = Math.max(...F.map(x=>x.n), 1);
let ri = 0, minN = 1, kept = [];

function keptS(){ return S.filter(s => Math.abs(s.res) <= RUNGS[ri]); }
function keptF(){ return F.filter(x => x.n >= minN); }

// ---- the upper half: instruments -------------------------------------------
function drawMachine(){
  kept = keptS();
  const reach = kept.length ? kept[kept.length-1].deg : null;
  staG.innerHTML = kept.map((s,i) =>
    `<circle class="sta" data-i="${i}" cx="${px(s.deg).toFixed(1)}" cy="${py(s.t).toFixed(1)}" r="4"/>`
  ).join('');
  document.getElementById('noteM').textContent =
    `${kept.length} of ${S.length} picks — each one instant, published to 10 ms`;

  document.getElementById('mKept').textContent =
    `${kept.length} of ${S.length} picks (${pct(kept.length,S.length)})`;
  // each network is reported in the unit its own source publishes
  document.getElementById('mReach').textContent = reach===null ? '—' : `${fmtDeg(reach)}°`;
  document.getElementById('mHold').textContent = reach===null ? '—' : pct(reach, fullInstReach);
  document.getElementById('rVal').textContent = RUNGS[ri]===Infinity ? 'any' : '±'+RUNGS[ri].toFixed(2)+' s';
  return reach;
}

// ---- the lower half: people -------------------------------------------------
function drawBody(){
  const k = keptF();
  const total = k.reduce((a,x)=>a+x.n,0);
  const reach = k.length ? k[k.length-1].km/KMD : null;
  document.getElementById('nVal').textContent = minN + (minN===1?' person':' people');
  document.getElementById('bKept').textContent =
    `${total} of ${fullTotal} reports (${pct(total,fullTotal)}) in ${k.length} of ${F.length} blocks`;
  document.getElementById('bReach').textContent = reach===null ? '—' : `${Math.round(reach*KMD)} km = ${fmtDeg(reach)}°`;
  document.getElementById('bHold').textContent = reach===null ? '—' : pct(reach, fullFeltReach);

  if(!k.length){
    feltG.innerHTML = `<text class="rlabel rlb" x="${M.l+8}" y="${(AX+loBot)/2}">no block passes this threshold — the human network has no reach here</text>`;
    return null;
  }
  const yTop = AX+52, yBot = loBot-8;
  const cy = c => yBot - (c/fullTotal)*(yBot-yTop);

  let g = '', acc = 0, pts = [[px(k[0].km/KMD), cy(0)]];
  for(const x of k){
    const X = px(x.km/KMD);
    pts.push([X, cy(acc)]);
    acc += x.n;
    pts.push([X, cy(acc)]);
    g += `<line class="stairdrop" x1="${X.toFixed(1)}" y1="${cy(acc).toFixed(1)}" x2="${X.toFixed(1)}" y2="${yBot}"><title>${x.n} report${x.n>1?'s':''} at ${x.km} km = ${fmtDeg(x.km/KMD)}° — intensity ${x.cdi}</title></line>`;
  }
  pts.push([px(reach), cy(total)]);
  g += `<polyline class="stair" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  g += `<line class="grid" x1="${M.l}" y1="${cy(fullTotal).toFixed(1)}" x2="${W-M.r}" y2="${cy(fullTotal).toFixed(1)}"/>`;
  g += `<text class="tick" x="${M.l-11}" y="${(cy(fullTotal)+4).toFixed(1)}" text-anchor="end">${fullTotal}</text>`;
  g += `<text class="tick" x="${M.l-11}" y="${(cy(0)+4).toFixed(1)}" text-anchor="end">0</text>`;
  // the running total is labelled only where it will not collide with 0 or the
  // full-population tick; when it is too near either, the shrunk staircase and
  // the "of its full reach" figure below carry the loss instead
  if(total < fullTotal && Math.abs(cy(total)-cy(0)) > 13 && Math.abs(cy(total)-cy(fullTotal)) > 13){
    g += `<text class="rlabel rlb" x="${M.l-11}" y="${(cy(total)+4).toFixed(1)}" text-anchor="end">${total}</text>`;
  }
  feltG.innerHTML = g;
  return reach;
}

    if(mReach < fullInstReach){
      c += `<rect class="cutm" x="${px(mReach).toFixed(1)}" y="${upTop}" width="${(px(fullInstReach)-px(mReach)).toFixed(1)}" height="${AX-upTop}"/>`;

  }
  cutsG.innerHTML = c;
  reachG.innerHTML = r;
}

function redraw(){
  drawReaches(drawMachine(), drawBody());
  document.getElementById('rDn').disabled = ri <= 0;
  document.getElementById('rUp').disabled = ri >= RUNGS.length-1;
  document.getElementById('nDn').disabled = minN <= 1;
  document.getElementById('nUp').disabled = minN >= maxN;
  tipg.innerHTML = '';
}

// nearest kept station to the pointer — the far field is crowded on a log axis
function nearest(evt){
  const svg = document.querySelector('svg');
  const r = svg.getBoundingClientRect();
  const x = (evt.clientX-r.left)/r.width*W, y = (evt.clientY-r.top)/r.height*H;
  let best = -1, bd = 1e9;
  kept.forEach((s,i) => {
    const dx = px(s.deg)-x, dy = py(s.t)-y, d = dx*dx+dy*dy;
    if(d < bd){ bd = d; best = i; }
  });
  return bd <= 24*24 ? best : -1;
}

const hit = document.getElementById('hit');
hit.addEventListener('pointermove', e => {
  const i = nearest(e);
  if(i < 0){ tipg.innerHTML=''; return; }
  const s = kept[i];
  const t = `${s.sta}  ${fmtDeg(s.deg)}°  ${s.t}s  ${s.ph}  residual ${s.res>0?'+':''}${s.res.toFixed(2)}s`;
  let x = px(s.deg)+13, y = py(s.t)-13;
  const w = t.length*7.1+14;
  if(x+w > W-M.r) x = px(s.deg)-13-w;
  tipg.innerHTML =
    `<rect class="tipbg" x="${x.toFixed(1)}" y="${(y-14).toFixed(1)}" width="${w.toFixed(1)}" height="21" rx="2"/>
     <text class="tip" x="${(x+7).toFixed(1)}" y="${(y+1).toFixed(1)}">${esc(t)}</text>`;
});
hit.addEventListener('pointerleave', () => tipg.innerHTML='');

document.getElementById('rUp').onclick = () => { ri = Math.min(RUNGS.length-1, ri+1); redraw(); };
document.getElementById('rDn').onclick = () => { ri = Math.max(0, ri-1); redraw(); };
document.getElementById('nUp').onclick = () => { minN = Math.min(maxN, minN+1); redraw(); };
document.getElementById('nDn').onclick = () => { minN = Math.max(1, minN-1); redraw(); };
document.getElementById('rst').onclick = () => { ri = 0; minN = 1; redraw(); };

redraw();
</script>
</body>
