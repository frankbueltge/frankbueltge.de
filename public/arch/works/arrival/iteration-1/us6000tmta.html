<title>Arrival</title>
<style>
  :root{
    --bg:#0b0c0e; --ink:#e8e6e1; --dim:#7d8288; --line:#21242a;
    --machine:#e0a33e; --body:#6fb3c9; --hot:#f4f2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding:26px clamp(14px,3vw,40px) 40px;
  }
  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
  h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:0 0 8px}
  .ident{color:var(--dim);font-size:12.5px;word-spacing:.08em}
  .ident b{color:var(--ink);font-weight:600}
  figure{margin:0}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
  .grid{stroke:var(--line);stroke-width:1}
  .axis{stroke:#3a3f46;stroke-width:1}
  .tick{fill:var(--dim);font-size:11px}
  .axlabel{fill:var(--dim);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
  .sta{fill:var(--machine);fill-opacity:.72;stroke:none;cursor:pointer}
  .sta:hover{fill-opacity:1}
  .sta.on{fill:var(--hot);fill-opacity:1}
  .halo{fill:none;stroke:var(--hot);stroke-width:1.5}
  .chord{stroke:var(--hot);stroke-width:1.5;stroke-dasharray:5 4}
  .felt{fill:var(--body);fill-opacity:.75}
  .feltband{fill:var(--body);fill-opacity:.16}
  .leader{stroke:var(--body);stroke-width:1;stroke-opacity:.22}
  .wedge{fill:var(--body);fill-opacity:.05;stroke:none}
  .insetbox{fill:none;stroke:var(--body);stroke-opacity:.45;stroke-width:1}
  .inlabel{fill:var(--body);font-size:11px;letter-spacing:.1em}
  .tip{fill:var(--hot);font-size:12px}
  .tipbg{fill:#000;fill-opacity:.82}
  footer{margin-top:22px;border-top:1px solid var(--line);padding-top:12px;
         color:var(--dim);font-size:11.5px;line-height:1.7}
  footer a{color:var(--dim)}
  .bar{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:baseline;
       margin:14px 0 4px;font-size:12.5px}
  .key{display:flex;align-items:center;gap:7px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .prompt{color:var(--hot);margin-left:auto;letter-spacing:.06em}
  .out{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;
       display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(240px,1fr);
       gap:18px 34px}
  .now{font-size:13px;line-height:1.85}
  .now .big{font-size:26px;color:var(--hot);letter-spacing:.01em}
  .now .sub{color:var(--dim)}
  .log{font-size:12px;color:var(--dim);line-height:1.9}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log b{color:var(--ink);font-weight:600}
  .log .v{color:var(--machine)}
  @media (max-width:640px){ .out{grid-template-columns:1fr} }
</style>
</head>

<div class="bar">
  <span class="key"><i class="dot" style="background:var(--machine)"></i>${S.length} seismometers &mdash; first arrival</span>
  <span class="key"><i class="dot" style="background:var(--body)"></i>${F.reduce((a,f)=>a+f.n,0)} human reports in ${F.length} blocks &mdash; felt intensity</span>
  <span class="prompt" id="prompt">click any two seismometers</span>
</div>
<div class="out">
  <div class="now" id="now"><span class="sub">no pair selected</span></div>
  <div class="log" id="log"></div>
</div>
<footer>
  Built ${D.built} from public USGS data, unauthenticated, and pinned into this file &mdash; it makes no network request when you open it.<br>
  event &nbsp;${esc(D.sources.detail)}<br>
  arrivals &nbsp;${esc(D.sources.phase)}<br>
  ${D.sources.felt ? 'felt reports &nbsp;'+esc(D.sources.felt)+'<br>' : ''}
  1&thinsp;degree = ${KMD}&thinsp;km along the surface.
</footer>`;

// ---- selection ------------------------------------------------------------
const marks = document.getElementById('marks');
const tipg  = document.getElementById('tip');
const nowEl = document.getElementById('now');
const logEl = document.getElementById('log');
let sel = [], history = [];

function draw(){
  marks.innerHTML = '';
  document.querySelectorAll('.sta').forEach(c => c.classList.remove('on'));
  sel.forEach(i => {
    const s = S[i];
    document.querySelector(`.sta[data-i="${i}"]`).classList.add('on');
    marks.insertAdjacentHTML('beforeend',
      `<circle class="halo" cx="${px(s.deg)}" cy="${py(s.t)}" r="10"/>`);
  });
  if(sel.length === 2){
    const [a,b] = sel.map(i => S[i]);
    marks.insertAdjacentHTML('afterbegin',
      `<line class="chord" x1="${px(a.deg)}" y1="${py(a.t)}" x2="${px(b.deg)}" y2="${py(b.t)}"/>`);
  }
}

function report(){
  if(sel.length < 2){
    const s = sel.length ? S[sel[0]] : null;
    nowEl.innerHTML = s
      ? `<b>${esc(s.sta)}</b> &nbsp;<span class="sub">${s.deg}° &middot; ${s.t} s &middot; ${esc(s.ph)}</span><br><span class="sub">now pick a second one</span>`
      : `<span class="sub">no pair selected</span>`;
    return;
  }
  let [a,b] = sel.map(i => S[i]);
  if(a.deg > b.deg) [a,b] = [b,a];
  const dd = b.deg - a.deg, dkm = dd*KMD, dt = b.t - a.t;
  const v = dt !== 0 ? dkm/dt : NaN;
  nowEl.innerHTML =
    `<span class="big">${isFinite(v) ? v.toFixed(2) : '—'}&thinsp;km/s</span>
     <span class="sub">apparent speed across the surface, between these two</span><br>
     <b>${esc(a.sta)}</b> <span class="sub">${a.deg}° &middot; ${a.t} s</span>
     &nbsp;→&nbsp; <b>${esc(b.sta)}</b> <span class="sub">${b.deg}° &middot; ${b.t} s</span><br>
     <span class="sub">${dd.toFixed(3)}° = ${dkm.toFixed(0)} km further, ${dt.toFixed(2)} s later</span>`;
  if(isFinite(v)){
    history.unshift({mid:(a.deg+b.deg)/2, v, a:a.sta, b:b.sta});
    history = history.slice(0,9);
    logEl.innerHTML = history.map(h =>
      `<div><span class="v">${h.v.toFixed(2)}&thinsp;km/s</span> &nbsp;<b>${esc(h.a)}–${esc(h.b)}</b> &nbsp;around ${h.mid.toFixed(1)}°</div>`
    ).join('');
    document.getElementById('prompt').textContent =
      history.length > 1 ? 'now try a pair much further out' : 'click any two seismometers';
  }
}

document.getElementById('stations').addEventListener('click', e => {
  const c = e.target.closest('.sta');
  if(!c) return;
  const i = +c.dataset.i;
  if(sel.length >= 2) sel = [];
  if(!sel.includes(i)) sel.push(i);
  draw(); report();
});

document.getElementById('stations').addEventListener('pointermove', e => {
  const c = e.target.closest('.sta');
  if(!c){ tipg.innerHTML=''; return; }
  const s = S[+c.dataset.i];
  const t = `${s.sta}  ${s.deg}°  ${s.t}s  ${s.ph}`;
  let x = px(s.deg)+14, y = py(s.t)-14;
  const w = t.length*7.1+14;
  if(x+w > W-M.r) x = px(s.deg)-14-w;
  tipg.innerHTML =
    `<rect class="tipbg" x="${x}" y="${y-14}" width="${w}" height="21" rx="2"/>
     <text class="tip" x="${x+7}" y="${y+1}">${esc(t)}</text>`;
});
document.getElementById('stations').addEventListener('pointerleave', () => tipg.innerHTML='');
</script>
</body>
</html>
