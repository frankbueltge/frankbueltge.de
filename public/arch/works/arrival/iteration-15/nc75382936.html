<head>

<title>Arrival</title>
<style>
  :root{
    --bg:#0b0c0e; --ink:#e8e6e1; --dim:#7d8288; --line:#21242a;
    --machine:#e0a33e; --body:#6fb3c9; --hot:#f4f2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding:26px clamp(14px,3vw,40px) 40px;
  }
  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:0 0 9px}
  .says{font-size:14.5px;color:var(--ink);margin:0 0 9px;letter-spacing:.01em}
  .says em{font-style:normal;color:var(--machine)}
  .says i{font-style:normal;color:var(--body)}
  .ident{color:var(--dim);font-size:12.5px;word-spacing:.08em}
  .ident b{color:var(--ink);font-weight:600}
  figure{margin:0}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
  .grid{stroke:var(--line);stroke-width:1}
  .axis{stroke:#4a5058;stroke-width:1}
  .tick{fill:var(--dim);font-size:11px}
  .axlabel{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase}
  .axlabel.d{fill:var(--dim)} .axlabel.m{fill:var(--machine)} .axlabel.b{fill:var(--body)}
  .note{fill:var(--dim);font-size:11px}
  .sta{fill:var(--machine);fill-opacity:.72;stroke:none}
  .blk{fill:var(--body);fill-opacity:.62;stroke:none}
  /* from iteration 15: a block belonging to the other publisher's record, where
     the apparatus serves two records for one event id. It is not this record's
     block and it is not drawn as one; it is not a lesser block either, so it is
     marked and not dimmed. */
  .blkalt{fill:var(--body);fill-opacity:.2;stroke:var(--body);stroke-width:.9;
          stroke-opacity:.75}
  /* from iteration 14: a block the record has withdrawn — its outline without
     its substance, standing where the record last published it */
  .blkgone{fill:none;stroke:var(--body);stroke-width:1;stroke-opacity:.6;
           stroke-dasharray:2 2}
  .stares{stroke:var(--machine);stroke-width:1.4;stroke-opacity:.85}
  .apart{color:var(--hot)}
  .cutm{fill:var(--machine);fill-opacity:.07}
  .cutb{fill:var(--body);fill-opacity:.07}
  .reach{stroke-width:1.5}
  .reachm{stroke:var(--machine)} .reachb{stroke:var(--body)}
  .ghost{stroke-width:1;stroke-dasharray:3 4;stroke-opacity:.55}
  /* Where a mark has already been published. A trace is the same colour as the
     mark it belongs to, because it is not another quantity — it is the same
     quantity, published earlier. It is drawn thinner and fainter than the mark
     so that what stands now stands in front of what stood before, and the two
     are never confused for two marks. */
  .wasm{stroke:var(--machine);stroke-width:1;stroke-opacity:.34}
  .wasb{stroke:var(--body);stroke-width:1;stroke-opacity:.34}
  /* iteration 13: the same two colours the two strips carry, on the axis where
     the claim they were given for actually lived. */
  .wasb.gained{stroke:var(--body);stroke-opacity:.34}
  .wasb.around{stroke:var(--hot);stroke-opacity:.5}
  .wasbr{fill:var(--body);fill-opacity:.16;stroke:none}
  .wasdot{fill:none;stroke-width:1;stroke-opacity:.45}
  .wasdot.m{stroke:var(--machine)} .wasdot.b{stroke:var(--body)}
  .rlabel{font-size:11.5px}
  .rlm{fill:var(--machine)} .rlb{fill:var(--body)}
  /* The shared axis is where the two half-planes meet, so it is also where the
     question "who was present at this distance" is answered: the strip above
     the line belongs to the instruments, the strip below it to the people.
     Both filled means both were there; neither filled means the event stood at
     that distance in no record at all — at the instant being read. Nothing is
     coded that the figure's own top-and-bottom convention does not already
     say. */
  .ribm{fill:var(--machine);fill-opacity:.62}
  .ribb{fill:var(--body);fill-opacity:.62}
  /* a band in which the event stands in no record at all is the one thing here
     that is an absence, and an absence drawn faintly reads as nothing having
     been drawn: it keeps the outline and the name of the others. */
  .ribnone{fill:none;stroke:var(--hot);stroke-width:1;stroke-opacity:.75;stroke-dasharray:2 3}
  .riblab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .riblab.none{fill:var(--hot)}
  .depth{stroke:var(--dim);stroke-width:1;stroke-opacity:.7}
  .depthlab{fill:var(--dim);font-size:10.5px}
  .tip{fill:var(--hot);font-size:12px}
  .tipbg{fill:#000;fill-opacity:.85}
  .hit{fill:transparent;cursor:crosshair}
  footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;
         color:var(--dim);font-size:11.5px;line-height:1.7;word-break:break-all}
  /* Two acts now, and they are not peers: choosing the instant decides which
     record there is to question, so it stands first and alone, and the two
     thresholds cut whatever it hands them. Each control is still set on a
     drawing of the population it cuts, and never on a widget borrowed from
     another. */

       margin:22px 0 2px;padding-top:13px;border-top:1px solid var(--line)}
  .act h2{font-size:12px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;
          color:var(--hot);margin:0}
  .act .kept{color:var(--dim);font-size:12.5px}
  .act .kept em{font-style:normal;color:var(--machine)}
  .act .kept i{font-style:normal;color:var(--body)}
  .act .kept b{color:var(--hot);font-weight:400}
  .when{margin-top:4px}
  .when svg{cursor:ew-resize}
  .whennote{color:var(--dim);font-size:12.5px;margin:2px 0 0;min-height:1.5em}
  .whennote b{color:var(--hot);font-weight:400}
  .panels{display:grid;gap:6px 34px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
  .panel{min-width:0;padding-top:11px}
  .panel h3{margin:0 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.13em;
            text-transform:uppercase}
  .panel.m h3{color:var(--machine)} .panel.b h3{color:var(--body)}
  .set{display:flex;flex-wrap:wrap;gap:7px 9px;align-items:center;
       margin:4px 0 0;font-size:12.5px;color:var(--dim)}
  button{font:inherit;background:#15171b;color:var(--ink);border:1px solid #2e3238;
         border-radius:3px;padding:2px 9px;cursor:pointer;line-height:1.4}
  button:hover{border-color:var(--hot)}
  button[disabled]{opacity:.32;cursor:default;border-color:#2e3238}
  .val{color:var(--ink);min-width:4.9em;display:inline-block;text-align:center}
  .val.wide{min-width:9.5em}
  .swarm{fill:var(--machine);fill-opacity:.78;stroke:none}
  .swarm.out{fill:none;stroke:var(--machine);stroke-opacity:.38;stroke-width:1}
  /* A tail is one segment of the path a station has taken through this strip:
     it joins two consecutive published positions, not an earlier position to
     the present one. Two kinds, and the difference is what this strip has shown
     since iteration 9: a segment across which the station published a different
     arrival instant is a new observation, and one across which it published the
     same instant is not — the number moved because the solution it is measured
     against moved. The second kind is drawn in the colour this file uses for
     something that changed while nothing was observed. */
  .tail{stroke-width:1.1;stroke-opacity:.5}
  .tail.repick{stroke:var(--machine)}
  .tail.refit{stroke:var(--hot);stroke-opacity:.62}
  .tailend{stroke-width:1;stroke-opacity:.55;fill:none}
  .tailend.repick{stroke:var(--machine)}
  .tailend.refit{stroke:var(--hot)}
  /* From iteration 12 the lower strip draws the same device on the same rule,
     in its own network's colour: a segment joins two consecutive published
     positions of one block. The distinction it carries is the one this strip
     can make and the one above cannot — a segment across which the block's own
     published reporter count changed is a report arriving, and one across which
     only its company changed is the record filling in around a block nobody
     reported from. The second kind gets the colour this file uses for something
     that changed while nothing was observed, exactly as above. */
  .btail{stroke-width:1.1;stroke-opacity:.45}
  .btail.gained{stroke:var(--body)}
  .btail.around{stroke:var(--hot);stroke-opacity:.55}
  .btailend{stroke-width:1;stroke-opacity:.5;fill:none}
  .btailend.gained{stroke:var(--body)}
  .btailend.around{stroke:var(--hot)}
  .cell{fill:var(--body);fill-opacity:.8;stroke:none}
  .cell.out{fill:var(--body);fill-opacity:.3}
  .gate{fill:var(--machine);fill-opacity:.08}
  .gateEdge{stroke:var(--machine);stroke-width:1.2}
  .cut{stroke:var(--body);stroke-width:1.2}
  .zero{stroke:#4a5058;stroke-width:1}
  .ptick{fill:var(--dim);font-size:10.5px}
  .pnote{fill:var(--dim);font-size:10.5px}
  .pcount{font-size:10px}
  .pcount.on{fill:var(--body)} .pcount.off{fill:var(--dim);fill-opacity:.8}
  /* the publication history, drawn on the figure's own convention: a mark
     above the line is a version of the arrival record, a mark below it a
     version of the felt record. */
  .vm{stroke:var(--machine);stroke-width:1.4;stroke-opacity:.85}
  .vb{stroke:var(--body);stroke-width:1.4;stroke-opacity:.7}
  .vb.moved{stroke:var(--hot);stroke-width:1.6;stroke-opacity:.95}
  .vfuture{stroke-opacity:.22}
  .nowline{stroke:var(--hot);stroke-width:1.4}
  .nowgrip{fill:var(--hot)}
  /* The table's cells must not wrap — a distance and its unit belong on one
     line — so it is the table that scrolls when the viewport is narrow, never
     the page. */
  .tw{overflow-x:auto;max-width:100%}
  table{border-collapse:collapse;margin-top:16px;font-size:12.5px;width:100%;max-width:920px}
  th,td{text-align:left;padding:7px 16px 7px 0;border-bottom:1px solid var(--line);

  th{color:var(--dim);font-weight:400;font-size:11px;letter-spacing:.11em;

  tr.m td.who{color:var(--machine)} tr.b td.who{color:var(--body)}
  tr.both td.who{color:var(--hot)}
  tr.none td.who{color:var(--hot)}
  tr.none td{color:var(--hot)}
  td.num{color:var(--dim)}
</style>

// taken back rather than as nothing at all. A block that comes back stops being
// `gone` and is an ordinary block again, with the position it stood at while
// withdrawn still on its path, because it stood there.
// See `ledger/2026-09-07-session-25-what-a-name-holds.md`.
//
// **What iteration 15 changes here.** The list above is not always one record.
// Where the same earthquake was catalogued twice — once by a regional network,
// once by the national one — the apparatus serves both publishers' felt records
// under one event id, and iteration 14 counted that and went on replaying the
// list as though each version revised the one before it. It does not. A block
// now carries the record that published it (`D.blocks[i].s`), a version only
// touches the blocks of its own record, and a block stands against the
// epicentre **its own record** last published it under: one publisher revising
// the origin does not move the other's blocks, which were never published
// against that origin. Both records are drawn; neither is read as a revision of
// the other. See `ledger/2026-09-08-session-26-what-a-seam-costs.md`.
const FELT = (() => {
  const out = [];
  const state = new Map();      // block index -> {n, cdi, gone, e}
  for(const v of D.felt){
    for(const [i,n,cdi] of v.a) state.set(i, {n, cdi, gone:false, e:v.e});
    for(const [i,n,cdi] of v.c) state.set(i, {n, cdi, gone:false, e:v.e});
    for(const i of v.d){ const s = state.get(i); if(s) s.gone = true; }
    for(const [i, s] of state) if(!s.gone && D.blocks[i].s === v.s) s.e = v.e;
    const rows = [], gone = [];
    for(const [i, s] of state){
      const b = D.blocks[i];
      // A block stands at a range of distances, not at one: lo and hi are the
      // nearest and farthest vertex of the outline its own product publishes,
      // measured from the epicentre in force at this version. A withdrawn block
      // keeps the epicentre it was last published under: the record has stopped
      // publishing it, so there is no published position for it under a later
      // epicentre, and this file does not compute one.
      // From iteration 15 `s.e` is the epicentre of the last version of this
      // block's **own** record, whether the block is standing or withdrawn, so
      // this is the same expression for both.
      const e = s.e;
      if(b.lo[e] === null) continue;   // never published under this epicentre
      const row = {i, lo:b.lo[e], hi:b.hi[e], km:b.km[e],
                   n:s.n, cdi:s.cdi, gone:s.gone, s:b.s};
      (s.gone ? gone : rows).push(row);
    }
    rows.sort((a,b) => a.lo - b.lo || a.hi - b.hi);
    gone.sort((a,b) => a.lo - b.lo || a.hi - b.hi);
    out.push({rev:v.rev, min:v.min, e:v.e, rows, gone});
  }
  return out;
})();

const PH = D.phases;

// ---- what each mark has already been published at --------------------------
// Every iteration to the eighth drew each published version as though it had
// no predecessor. Both records carry a name that survives republication — a
// block by the centre of its published outline, a pick by its station and
// phase label — so both can be asked where they have already stood, and the
// answer is published data and not a reconstruction. These are lookups by that
// name, one per version; nothing is compared here.
const PHBY = PH.map(p => { const m = new Map(); for(const s of p.picks) m.set(s.k, s); return m; });
const FEBY = FELT.map(v => { const m = new Map(); for(const r of v.rows) m.set(r.i, r); return m; });

// The path a mark has taken, in publication order: every position it has been
// published at, at or before the instant being read, ending at where it stands
// now. Consecutive repeats are collapsed, because a version that republished a
// mark where it already stood moved it nowhere; a mark that left a position and
// later came back to it is listed at that position twice, because it went
// there twice.
//
// **What iteration 11 changes, and what it strikes.** Until this version each
// earlier position was joined straight to the present one and every position
// was listed at most once. Both were consequences of an arrival record that had
// published exactly twice, where a mark has at most one before and a fan of one
// line is a path. That is no longer the record: the Peruvian arrival record
// published a third version on 2026-09-02, twelve days after the second, and a
// mark revised at both revisions was being drawn as two independent moves out
// of the past — which is not what the record says happened. It says the mark
// went there, and then there. See
// `ledger/2026-09-03-session-21-what-a-second-revision-is.md`.
//
// **A sentence that stood here in iteration 11 is struck, and the strike is
// part of iteration 12.** It read: measured over three events, the first
// revision selects the picks the record already disagreed with and leaves them
// no nearer the fit, while the late one re-picks the far field and moves it
// nearer. Three events is what it was measured over. Run over every M >= 5
// event of a fixed ten-week window that published both an early and a late
// revision — 84 events, 139 revisions — neither half of that sentence survives:
// revisions of both ages move the picks they touch toward the fit by about the
// same amount, and the late one does not take the further field. What does
// separate them is size, not kind: the late revision re-picks a much smaller
// share of what is already there. The paths are unchanged, because they never
// asserted this; the sentence did.
// See `ledger/2026-09-04-session-22-what-the-company-was.md`.
//
// **What iteration 12 changes.** The lower strip draws the same path on the
// same rule, and for a reason that is a withdrawal rather than a discovery. Its
// vertical coordinate — a block's company within the chosen distance, at the
// instant on show — was put there because two sessions had measured that it
// separated the blocks this record revises from the blocks it leaves alone.
// Run against the control those sessions had named and not run, the separation
// is entirely accounted for by how crowded the block's place is in the last
// published version: hold that fixed, and the company standing there at the
// moment adds nothing. The coordinate is a fact about the place and not about
// the moment, and the strip now draws its motion rather than only its value.
// See `ledger/2026-09-04-session-22-what-the-company-was.md`.
// From iteration 13: the count the withdrawn absolute was about, computed from
// this file's own pinned history and not from any claim. For every consecutive
// pair of published felt versions and every block published in both, the record
// either moved that block's intensity or did not, and either published a
// different reporter count for it or did not. MOVEDQ[j] is how many blocks the
// record moved in intensity from version j-1 to version j **without** its
// reporter count moving — the case this practice published as impossible. It is
// a prefix sum, so a reader standing at any instant is given the count over the
// whole history up to it, and it is over every block the record published, not
// only the ones passing the thresholds beside the figure.
//
// **From iteration 15 this is a count within one record.** A block's name
// carries its publisher, so `FEBY[j-1].get(i)` can only find the same record's
// previous publication of the same block, and a version that crosses from one
// publisher to the other contributes nothing here. That is not a refinement: on
// the Hawaiian event this work is built on, every one of the four moves
// iteration 14 counted here stood at such a crossing, and this count reads 0
// where iteration 14's read 4. What the two publishers disagree about is
// counted too, separately, in the note under the figure — because it is a real
// thing the apparatus publishes, and it is not this.
const MOVEDQ = (() => {
  const out = [0];
  for(let j=1; j<FELT.length; j++){
    let c = 0;
    for(const [i, r] of FEBY[j]){
      const was = FEBY[j-1].get(i);
      if(was && was.cdi !== r.cdi && was.n === r.n) c++;
    }
    out.push(out[j-1] + c);
  }
  return out;
})();

const pkeyS = s => s.deg+'/'+s.t+'/'+s.res;
const pkeyB = r => r.lo+'/'+r.hi+'/'+r.cdi;
function pathOf(by, name, upTo, cur, key){
  const out = [];
  for(let j=0; j<upTo; j++){
    const r = by[j].get(name);
    if(!r) continue;
    if(out.length && key(out[out.length-1]) === key(r)) continue;
    out.push(r);
  }
  if(!out.length || key(out[out.length-1]) !== key(cur)) out.push(cur);
  return out;
}
const pickPath  = (s, upTo) => pathOf(PHBY, s.k, upTo, s, pkeyS);
const blockPath = (r, upTo) => pathOf(FEBY, r.i, upTo, r, pkeyB);

// Whether a mark has a before at all. A mark first published in the version in
// force has not stayed where it was — it has nowhere to have stayed — and
// counting it in the denominator of "how many have moved" would state a
// proportion of a population that could not have been in it.
function publishedBefore(by, name, upTo){
  for(let j=0; j<upTo; j++) if(by[j].has(name)) return true;
  return false;
}

// the instants at which anything was published, in order: these are the states
// the encounterer can stand in, and there are no others
const WHEN = (() => {
  const set = new Map();
  for(const p of PH) set.set(p.min, true);
  for(const v of FELT) set.set(v.min, true);
  return [...set.keys()].sort((a,b)=>a-b);
})();
const atOrBefore = (arr, t) => { let k = -1; for(let i=0;i<arr.length;i++) if(arr[i].min <= t) k = i; return k; };
const PHAT = WHEN.map(t => atOrBefore(PH, t));
const FEAT = WHEN.map(t => atOrBefore(FELT, t));

let wi = WHEN.length - 1;               // opens on the record as it now stands
const phase = () => PHAT[wi] < 0 ? null : PH[PHAT[wi]];
const felt  = () => FEAT[wi] < 0 ? null : FELT[FEAT[wi]];
const S = () => (phase() ? phase().picks : []);
const F = () => (felt() ? felt().rows : []);

// ---- scales, fixed once over the whole history -----------------------------
// Every scale in this file is fixed to the largest population any instant ever
// held. Moving the instant, or raising a threshold, must shrink what is drawn;
// it must never renormalise the loss away.
const loDeg = b => b.lo / KMD;         // the block's near edge, in degrees
const hiDeg = b => b.hi / KMD;         // its far edge
// The extremes of a list, taken by walking it. `Math.min(...xs)` passes every
// element as an argument and overflows the call stack somewhere in the hundreds
// of thousands; a record with a long publication history reaches that. It was
// never reached on the two events this work was built for — 80 and 38 published
// versions of the felt record — and it is reached on the first event tried with
// 354 of them, where every scale below is fixed over the whole history and the
// history is what makes the list long. The defect is iteration 5's and survived
// to iteration 10 unfired; this is the correction, and the iterations before it
// stay as they are, wrong where they are wrong in the open.
const lo_ = xs => { let m = Infinity; for(const x of xs) if(x < m) m = x; return m; };
const hi_ = xs => { let m = -Infinity; for(const x of xs) if(x > m) m = x; return m; };
const allDeg = [];
for(const p of PH) for(const s of p.picks) allDeg.push(s.deg);
for(const v of FELT) for(const r of v.rows){ allDeg.push(loDeg(r)); allDeg.push(hiDeg(r)); }
const dLo = lo_(allDeg)*0.75, dHi = hi_(allDeg)*1.12;
const L = Math.log10, span = L(dHi)-L(dLo);

const W=1200, H=720, M={l:96,r:150,t:30,b:70};
const AX = 452;                        // the shared axis, in figure coordinates
const upTop = M.t+34, loBot = H-M.b;   // the two half-planes
const RIB = 11;                        // half-height of the presence ribbon
const px = d => M.l + (L(Math.max(d,dLo))-L(dLo))/span*(W-M.l-M.r);

const tMax = Math.ceil(hi_(PH.map(p=>hi_(p.picks.map(s=>s.t))))/100)*100;
const py = t => AX-58 - (t/tMax)*(AX-58-upTop);
const allPicks = hi_(PH.map(p=>p.picks.length));
const maxN = Math.max(hi_(FELT.map(v => Math.max(hi_(v.rows.map(x=>x.n)), 1))), 1);

// The one quantity the felt record measures for itself. It has been carried in
// this file since the first iteration, shown under the pointer, and drawn
// nowhere: until now the height of the lower half was a running count of
// records, which is a census of the network and not a measurement of the
// earthquake. Above the axis every mark's height is something a seismometer
// published; below it, from here, every mark's height is something people
// published. Fixed over the whole history, like every other scale in this file.
const allCdi = [];
for(const v of FELT) for(const r of v.rows) allCdi.push(r.cdi);
const cLo = Math.floor(lo_(allCdi)*2)/2;
const cHi = Math.ceil(hi_(allCdi)*2)/2;
const bTop = AX+RIB+66, bBot = loBot-8;
const by = c => bBot - ((c-cLo)/(cHi-cLo))*(bBot-bTop);

// A mark narrower than this many of the figure's own units would not render at
// all, and a published block would leave the axis. It is drawn this wide
// instead — the one place in this file where a mark is wider than what it
// measures, and the footer says how often that happens.
const FLOOR = 0.6;
// A block's mark has no published height: the intensity is one number, not a
// range, and the record publishes no uncertainty for it. This is the thickness
// a horizontal bar needs to be seen at all, and it stands for nothing.
const BLKH = 2.4;
const flooredAtLast = (() => {
  const v = FELT[FELT.length-1];
  return v.rows.filter(r => px(hiDeg(r)) - px(loDeg(r)) < FLOOR).length;
})();

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtDeg = d => d<0.1 ? d.toFixed(3) : (d<10 ? d.toFixed(2) : d.toFixed(1));
const fmtKm  = k => k<10 ? k.toFixed(1) : String(Math.round(k));
// Each network is shown in the unit its own source publishes, and the second
// unit is added only where it is the one anybody uses: picks are published in
// degrees and run teleseismic, felt blocks are published in kilometres and stay
// near. Past ten degrees the kilometre figure would be an arc length nobody
// reports, and it is not shown.
const both   = d => d >= 10 ? `${fmtDeg(d)}°` : `${fmtKm(d*KMD)} km = ${fmtDeg(d)}°`;
// the same, for a mark that occupies a range rather than a place
const bothSpan = (a,b) => a >= 10
  ? `${fmtDeg(a)}–${fmtDeg(b)}°`
  : `${fmtKm(a*KMD)}–${fmtKm(b*KMD)} km = ${fmtDeg(a)}–${fmtDeg(b)}°`;

// elapsed time, in the unit a person would use for it
function since(mins){
  if(mins < 90) return `${Math.round(mins)} min`;
  if(mins < 2880) return `${(mins/60).toFixed(mins<600?1:0)} h`;
  return `${(mins/1440).toFixed(1)} days`;
}

// ---- static frame ---------------------------------------------------------
let f = '';
const decades = [];
for(let e=-3; e<=3; e++){
  for(const m of [1,2,5]){
    const v = m*Math.pow(10,e);
    if(v>=dLo && v<=dHi) decades.push(v);
  }
}
for(const v of decades){
  f += `<line class="grid" x1="${px(v).toFixed(1)}" y1="${upTop}" x2="${px(v).toFixed(1)}" y2="${loBot}"/>`;
  f += `<text class="tick" x="${px(v).toFixed(1)}" y="${loBot+19}" text-anchor="middle">${v}&deg;</text>`;
}
for(let t=0; t<=tMax; t+=100){
  f += `<line class="grid" x1="${M.l}" y1="${py(t).toFixed(1)}" x2="${W-M.r}" y2="${py(t).toFixed(1)}"/>`;
  f += `<text class="tick" x="${M.l-11}" y="${(py(t)+4).toFixed(1)}" text-anchor="end">${t}</text>`;
}
// The lower half now has a measured axis of its own, and it is fixed by the
// whole history rather than by the instant on show, so that moving the instant
// or raising a threshold can only take marks away and never rescale the loss.
for(let c=Math.ceil(cLo); c<=cHi; c+=1){
  f += `<line class="grid" x1="${M.l}" y1="${by(c).toFixed(1)}" x2="${W-M.r}" y2="${by(c).toFixed(1)}"/>`;
  f += `<text class="tick" x="${M.l-11}" y="${(by(c)+4).toFixed(1)}" text-anchor="end">${c}</text>`;
}
f += `<text class="axlabel d" x="${(M.l+W-M.r)/2}" y="${loBot+45}" text-anchor="middle">distance from the epicentre &mdash; logarithmic, one scale for both networks</text>`;
f += `<text class="axlabel m" transform="translate(${M.l-64},${(upTop+AX)/2}) rotate(-90)" text-anchor="middle">seconds after origin</text>`;
f += `<text class="axlabel b" transform="translate(${M.l-64},${(AX+loBot)/2}) rotate(-90)" text-anchor="middle">intensity they reported</text>`;
f += `<text class="axlabel m" x="${M.l}" y="${upTop-20}">machines that recorded it</text>`;
f += `<text class="axlabel b" x="${M.l}" y="${AX+RIB+34}">people who reported feeling it</text>`;
f += `<text class="note" x="${M.l}" y="${upTop-6}" id="noteM"></text>`;
f += `<text class="note" x="${M.l}" y="${AX+RIB+50}">no arrival time is published for any felt report, so this half has no clock &mdash; it carries what they reported instead</text>`;
// The felt half's own disclosure, on the convention the two strips already use:
// the count of what the new colour separates, right-anchored under the axis, so
// that the segments drawn as "nobody reported" are countable and not merely
// visible. It counts segments of the paths on show, which is what is drawn; the
// number the withdrawn claim was about is a count of version-to-version
// transitions over the whole record, and it is in the footer, where it can be
// stated in the words it needs.
// Placed on its own line beneath the axis label rather than beside it: at
// 1440 px the two overlap on the Peruvian record from its eleventh instant on.
// Found by this session's harness before the file was built, which is the first
// time this practice's own check has caught a layout defect it had not yet
// made — the two before it were found by eye and after the fact.
f += `<text class="note" x="${W-M.r}" y="${loBot+62}" text-anchor="end" id="noteB"></text>`;
f += `<text class="note" x="${M.l}" y="${AX-RIB-29}">who was present at each distance, in the records as they stood at the chosen instant</text>`;

f += `<g id="cuts"></g><g id="stations"></g><g id="felt"></g><g id="ribbon"></g><g id="reaches"></g>`;
f += `<rect class="hit" id="hit" x="${M.l}" y="${upTop-8}" width="${W-M.l-M.r}" height="${AX-RIB-upTop+8}"/>`;
f += `<g id="tip"></g>`;

// a label beside a marker near the right edge is placed on its left instead
function beside(x, text, cls, y){
  // 6.9 units a character, not 6.4: at this file's 11.5 px monospace the advance
  // is about 6.9, and the smaller figure let a 63-character label overrun the
  // figure's right edge by five units at some instants of the Colombian record.
  // Found by the sweep, at states this session's eyes had not opened.
  const w = text.length*6.9;
  return x+8+w > W
    ? `<text class="rlabel ${cls}" x="${(x-8).toFixed(1)}" y="${y}" text-anchor="end">${text}</text>`
    : `<text class="rlabel ${cls}" x="${(x+8).toFixed(1)}" y="${y}">${text}</text>`;
}

// ---- the two records, in a sentence, from the data -------------------------
const lastPh = PH[PH.length-1], lastFe = FELT[FELT.length-1];
const finalTotal = lastFe.rows.reduce((a,x)=>a+x.n,0);
const opening =
  `One earthquake, and two records of it that were not written at the same speed.
   <em>${allPicks} seismometers</em>: the arrival record was published
   ${PH.length === 1 ? 'once' : (PH.length === 2 ? 'twice' : PH.length+' times')},
   the last time ${since(lastPh.min)} after the origin.
   <i>${finalTotal} people</i> in ${lastFe.rows.length} blocks: their record was
   published ${FELT.length} times and was still filling ${since(lastFe.min)}
   after the origin. Each half of the figure is a measurement its own network
   made: seconds above the line, intensity below it. Choose an instant to read
   them at, then ask each network for more corroboration, and see what waiting
   buys.`;

// ---- page -----------------------------------------------------------------
document.getElementById('app').innerHTML = `
<header>
  <h1>Arrival</h1>
  <p class="says">${opening}</p>
  <div class="ident"><b>${esc(D.id)}</b> &nbsp;M&thinsp;${D.mag} &nbsp;${esc(D.place)}
   &nbsp;&middot;&nbsp; <span id="solution"></span></div>
</header>
<figure><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="One earthquake as two networks recorded it, each half of the figure showing a measurement its own network published: above a shared logarithmic axis of distance from the epicentre, seismometer picks at the second the wave reached them; below it, blocks of human felt reports at the intensity published for each, every block drawn across the range of distances its own published outline occupies rather than at a point. The arrival times lie close to a curve; the intensities scatter. A strip along the axis shows which of the two networks was present at each distance. Where a mark was published somewhere else in an earlier version, that earlier position is drawn faintly behind it and joined to it. Each of a block's joining lines is drawn in one colour where its published reporter count differs between the two positions it joins, and in another where it is the same &mdash; where the block moved and nobody reported from it, which on this axis is usually the instrument network moving the epicentre under the whole lower half at once. The figure says beneath itself how many of the moves on show are of that second kind and how many of those changed an intensity rather than only a distance. The instant at which the two records are read can be moved through their whole publication history, and each network can be asked for more corroboration."> ${f} </svg></figure>

<div class="act">
  <h2>read them at</h2>
  <span class="kept" id="whenval"></span>
  <button id="wDn">&larr;</button><button id="wUp">&rarr;</button>
  <button id="rst">reset</button>
</div>
<div class="when">
  <svg id="svgW" viewBox="0 0 1160 92" role="img" aria-label="Every instant at which either record was published, on a logarithmic time axis running from the first publication to the last: marks above the line are versions of the arrival record, marks below it versions of the felt record. A handle marks the instant currently being read."></svg>
  <p class="whennote" id="whennote"></p>
</div>

<div class="act">
  <h2>count what stands within</h2>
  <span class="kept" id="nearval"></span>
  <button id="gDn">&minus;</button><button id="gUp">+</button>
</div>

<div class="act">
  <h2>demand more corroboration</h2>
  <span class="kept" id="kept"></span>
  <button id="rstT">reset both</button>
</div>
<div class="panels">
  <div class="panel m">
    <h3>&hellip; of the seismometers</h3>
    <svg id="svgM" viewBox="0 0 560 170" role="img" aria-label="Every pick in the arrival record as it stood at the chosen instant: across, at its own published time residual in seconds, early to the left of zero and late to the right; up, at how many other picks of this record stood within the chosen distance of it on the ground. A band around zero marks the picks currently kept. A pick published elsewhere in earlier versions carries a path through the positions it has stood at, in publication order, each segment in one colour where the station published a different arrival instant between those two versions and in another where it published the same one. The heights do not rise with the residual: the company a pick keeps does not decide whether this record revises it. ${PH.length > 2 ? 'What does decide is not one thing, and the path is where that shows: this record has revised its arrivals more than once, and the segments of a path can be read against each other.' : 'This record has revised its arrivals once, so every path here is one segment long.'}"></svg>
    <div class="set">
      <span>keep a pick inside</span>
      <button id="rDn">&minus;</button><span class="val" id="rVal"></span><button id="rUp">+</button>
    </div>
  </div>
  <div class="panel b">
    <h3>&hellip; of the people</h3>
    <svg id="svgB" viewBox="0 0 560 170" role="img" aria-label="Every felt block in the record as it stood at the chosen instant, drawn as one cell: across, in the column for the number of people who reported from it; up, at how many other blocks of this record stood within the chosen distance of it. A line marks the columns currently kept. A block published in another column, or with other company, in an earlier version carries a path through the positions it has stood at, in publication order, each segment in one colour where the block's own published reporter count changed across those two versions and in another where only its company did — where, that is, nobody reported from it and the record filled in around it. The strip says beneath itself how many blocks have moved in each way, so that the two kinds of motion are counted rather than assumed."></svg>
    <div class="set">
      <span>keep a block reported by</span>
      <button id="nDn">&minus;</button><span class="val" id="nVal"></span><button id="nUp">+</button>
      <span>or more</span>
    </div>
  </div>
</div>

<div class="tw"><table><thead><tr>
  <th>at these distances</th><th>from</th><th>to</th>
  <th>seismometers</th><th>felt reports</th><th>intensity</th>
</tr></thead><tbody id="zones"></tbody></table></div>

<footer>
  Built ${D.built} from public USGS data, unauthenticated, and pinned into this file &mdash; it makes no network request when you open it. Not one version of either record: <b>every</b> version either record has ever had, ${PH.length} of the arrivals and ${FELT.length} of the felt reports, each with the instant the apparatus published it.<br>
  event &nbsp;${esc(D.sources.detail)}<br>
  arrivals &nbsp;${esc(D.sources.phase)}<br>
  felt reports &nbsp;${esc(D.sources.felt)}<br>

  <code>evaluationMode</code> &nbsp;<span id="modes"></span>.<span id="nores"></span><br>

  ${D.cellKm}&thinsp;km cell and it is drawn across the distances that cell

  <b>And what a mark is high is now, on both halves, a measurement rather than a

  pick's residual is computed by whoever fitted the solution, an intensity by

  to put them there, and how near is the length of each mark; no comparable

  &mdash; that is the whole of what this half now says on its own.<br>
  <b>And a mark that has stood somewhere else is drawn there too.</b> A faint mark joined
  to a solid one is a position that same block or that same station was
  published at in an earlier version &mdash; at or before the instant being
  read, never after it. Both records name their own parts, and this file uses
  those names rather than inventing one: a block is the centre of the outline
  its product publishes, a pick is the network and station code with the phase
  label its product publishes. <b>From this version both names are checked the
  same way, and until this version only one of them was.</b> The pick's name has
  been checked since iteration 9 for two arrivals in one version claiming it;
  the block's name, which is three iterations older and which everything below

  ${D.counts.blockKeyCollisions} block(s) do,
  ${D.counts.ringDisagree} block(s) were ever republished with a different

  ${(() => {
    // What each record did to its own measurement, over its whole published

    for(const v of D.felt){

    // first published in the last version cannot have moved, and counting it

    return `Across the whole published history, of the ${bElig} block(s) `
      + `standing now that some earlier version also published, `
      + `${everBlocks.size} were published at a different intensity at least `
      + `once over ${D.felt.length} versions; between them they account for `
      + `${bMoved} such change(s), of which ${bSilent} came without the `
      + `block's reporter count changing. Of the `
      + `${pElig} pick(s) standing now that an earlier of the arrival record's `
      + `${PH.length} version(s) also published, ${pMoved} were published at a `
      + `different residual, and ${pSilent} of those were published with the `
      + `same arrival instant throughout.`;
  })()}
  ${(() => {
    const c = lastFe.rows.map(r=>r.cdi);
    const u = new Set(c).size;
    const n = lastFe.rows.map(r=>r.n), un = new Set(n).size;
    return `At the last version the ${lastFe.rows.length} blocks take `
      + `${u} distinct published intensities and ${un} distinct reporter `
      + `counts; the threshold beside the figure cuts on the second of those.`;
  })()}
  ${D.noOutline ? D.noOutline+' block(s) published no outline, could not be placed on this coordinate, and are not in this file.' : ''}
  ${D.counts.ringDisagree ? '<b>'+D.counts.ringDisagree+' block(s) were republished with a different outline</b> from the one they were first published with; the file keeps the first, and this count says how often that mattered.' : 'No block was ever republished with a different outline, so a block\'s width here is its own throughout.'}
  Accretion is checked, not assumed: across the whole history
  ${D.counts.added} block(s) appeared, ${D.counts.removed} were withdrawn,
  ${D.counts.returned} of those the record published again, and
  ${D.counts.decreases} response count ever went down.
  ${D.counts.removed
    ? 'A withdrawn block is drawn where the record last published it, as an outline with nothing in it, and it is not counted in the interval the human network occupies.'
    : 'This record has never withdrawn a block, so nothing here is drawn that way; over the catalogue this work’s events were drawn from, and read as the records those lists contain, 294 blocks are withdrawn on 16 of 176 events and 51 of them come back.'}
  <b>And the versions above are not all one record&rsquo;s.</b> The apparatus
  serves every version ever published of this event&rsquo;s felt record, and
  where the same earthquake was catalogued twice &mdash; once by a regional
  network, once by the national one &mdash; and the two were associated
  afterwards, both publishers&rsquo; records are served in that one list. Which
  publisher a version came from is published, so it is counted here rather than
  assumed: ${D.counts.feltForeign} of these ${D.felt.length} version(s) were
  published under an event source other than <b>${D.counts.feltSrc}</b>, across
  ${D.counts.feltSrcChanges} change(s) of publisher.
  ${D.counts.feltForeign
    ? `<b>So this file draws ${D.streams.length} records and not one.</b> Each version revises the previous version of its own publisher and of nothing else; the other publisher&rsquo;s blocks stand where that publisher left them, against the epicentre that publisher published, and are drawn with a lighter edge. Read instead as one list &mdash; which is how every version of this work up to the fourteenth read it &mdash; the same data would say ${D.counts.naiveRemoved} block(s) withdrawn, ${D.counts.naiveReturned} of them republished and ${D.counts.naiveMoved} intensity move(s) at an unchanged reporter count, against ${D.counts.removed}, ${D.counts.returned} and ${MOVEDQ[MOVEDQ.length-1]} here. The difference is not a correction of the record; it is the two records being told apart. Where the two name the same ground on either side of a crossing &mdash; ${D.counts.seamNames} name(s) across ${D.counts.seamPairs} crossing(s) &mdash; they publish a different intensity for it ${D.counts.seamCdi} time(s), ${D.counts.seamCdiSameN} of those at the same reporter count. That is two publishers disagreeing about one piece of ground, and it is the thing the count above is not.`
    : 'None, so every version drawn here was published by one of them.'}<br>
  <b>And a mark that has moved twice is drawn as a path, not as a fan.</b>
  Until this version every earlier position a mark had been published at was
  joined straight to the position it holds now, and each position was listed at
  most once. Both were true statements about a record that had published its
  arrivals exactly twice, where a mark has at most one before and a fan of one
  line is a path. That is no longer everywhere true: the Peruvian record this
  work is also built on published a third version of its arrivals on
  2026-09-02, twelve days after the second, and drawing that as a fan says
  something the record does not &mdash; that a mark revised at two revisions
  made two independent moves out of the past. It made one move, and then
  another. Each segment now joins two <b>consecutive</b> published positions,
  and a mark that left a position and later came back to it is drawn at that
  position twice, because it went there twice.
  ${PH.length > 2
    ? 'This file&rsquo;s arrival record has '+PH.length+' versions, so the paths in the strip have more than one segment and can be read for whether the two revisions did the same thing.'
    : 'This file&rsquo;s arrival record has '+PH.length+' version'+(PH.length===1?'':'s')+', so every path here is at most one segment long and the change costs it nothing; what it buys is that the drawing no longer depends on that being so.'}
  The strip says how many of the marks that moved were taken nearer zero by the
  last move they made; nothing here says why any of them moved.<br>
  <b>And the lower strip draws the same path, because a measurement that put
  its vertical coordinate there did not survive its own control.</b>
  That coordinate &mdash; how many other blocks of this record stood within the
  chosen distance of a block &mdash; was placed on this axis because the practice
  that makes this work had twice measured that it separated the blocks the
  record goes on to revise from the blocks it leaves alone. Run against the
  control both of those measurements had named and neither had run &mdash; hold
  fixed how crowded each block&rsquo;s place is in the last version this file was
  built from, and ask what the company standing there at the moment adds &mdash;
  the separation is gone. It was the place all along, and the moment added
  nothing to it. The coordinate stays, because the record publishes it and the
  strip is a drawing of what the record publishes; what it may no longer do is
  stand there as a bare position with a claim behind it. So each block now
  carries its path through the positions it has been published at, on the same
  rule as above, and the two kinds of motion are told apart: a segment across
  which someone reported from the block, and a segment across which nobody did
  and the record filled in around it. The strip counts both beneath itself.<br>
  <b>And the blocks in the figure itself carry the same two colours, because an
  absolute this practice published is false and the exception to it is the other
  record.</b>
  A block in the figure above has been drawn joined to where it stood in earlier
  versions since the ninth version of this work, and the join was left one
  colour on purpose: the practice that makes this work had measured, on the
  three events it is built on, that a block&rsquo;s intensity never moves unless
  a person reports from it a second time &mdash; 0 of 360 published intensity
  changes at an unchanged reporter count. If that holds, a vertical move needs
  no colour, because there is only one thing it can be. On 2026-09-05 the claim
  was run over a catalogue instead of three events &mdash; every M&thinsp;&ge;&thinsp;5
  event of a fixed ten-week window that published a geocoded felt record more
  than once, 176 events and 3&thinsp;710 published versions &mdash; and it is
  false as an absolute: <b>8 of 2&thinsp;632 published intensity changes stand at
  an unchanged reporter count</b>, where the same transitions taken independently
  would put nearly all 2&thinsp;632 there.
  <b>[Corrected in this version, beside those two numbers and not in place of
  them: they are 4&thinsp;286 and 2&thinsp;890.</b> What iteration 13 printed here
  and in its three instances is the measurement from the pass in which one event
  of its own population was missing &mdash; a M&thinsp;7.5 off Venezuela that had
  returned an HTTP 503 and was read on its own afterwards, carrying 576 versions
  and 258 intensity changes, which is the whole of both differences. The finding
  is unchanged in direction and in size, and that is not why it is corrected.
  Iteration 13 keeps the incomplete figures, in the open.]
  The eight fall in four transitions on
  four events, and six of them sit across a version in which the instrument
  network moved the origin under the felt record &mdash; one of those by handing
  the event to another network outright. So the join is coloured on the same
  rule as the strips: one colour where the block&rsquo;s own published reporter
  count differs between the two positions it joins, the other where it does not,
  and the figure counts the second kind and how many of those moved an intensity
  rather than only a distance. In <b>this</b> record it happened
  ${MOVEDQ[MOVEDQ.length-1]} time${MOVEDQ[MOVEDQ.length-1]===1?'':'s'} across all
  ${FELT.length} published versions; the count under the figure is over the
  moves on show, and this one is over every version-to-version transition of
  every block the record ever published.<br>
  <b>And the two strips beneath the figure stop stacking what they hold.</b>
  Until this version a pick was packed into the first free row and a block into
  a column, and how high either stood was a tally of how many others were beside
  it &mdash; the habit struck above the axis one iteration ago and left standing
  here. Each mark now stands at how many marks of <b>its own record</b> were
  standing within a distance of it, in that version's own population and not in
  the record's eventual one; the distance is set beside the figure. That
  constant could not be justified from either record, so it is handed over, as
  the threshold was, and both thresholds after it, and the instant of reading
  after them; the ladder is this record's own ${D.cellKm}&thinsp;km cell by
  powers of ten and it is fixed, so no instant and no threshold can change what
  a rung means. The two records answer it at scales three orders apart. Marks
  are not moved aside to keep each other visible: two that agree on both
  coordinates are drawn on top of one another.<br>
  Six quantities are derived and no others: a pick's travel time (its
  published arrival instant minus the origin instant published in the same
  version); the same published arrival instant counted instead from the event's
  own origin instant, which belongs to no version and moves with none of them,
  and is what lets this file say whether a station published a new observation
  or only a new residual; a felt
  block's two distances from the epicentre (great-circle from the
  epicentre published in the version that carries it to the nearest and the
  farthest vertex of the outline published for it, on a sphere of
  ${D.rKm}&thinsp;km &mdash; a vertex, never a point interpolated between two);
  a pick's place on the ground &mdash; the fifth, added one iteration ago; this
  version derives nothing new and changes only what is drawn from them &mdash; which is
  the same great circle run forwards, from the epicentral distance and the
  azimuth its own version publishes about the epicentre that version published,
  and is looked up in no station inventory (${D.counts.noAz} pick(s) published
  no azimuth, have no place here and are counted rather than placed);
  the number of a record's own marks standing within a distance of one of
  them, which is the sixth and is a count of published positions;
  and the ${KMD}&thinsp;km per degree used to show one unit in the other. Nothing is smoothed, fitted or
  interpolated: in the residual strip a pick's horizontal position is its
  published residual, and in the figure above that same residual is the length
  of its mark; below the axis a block's height is its published intensity,
  unrounded and unbinned;
  in the columns one cell is one published block and the columns are the
  published counts themselves, unbinned; a mark's height in either strip is a
  count of published positions and nothing else; on the history above, one mark
