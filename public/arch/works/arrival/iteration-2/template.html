<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arrival</title>
<style>
  :root{
    --bg:#0b0c0e; --ink:#e8e6e1; --dim:#7d8288; --line:#21242a;
    --machine:#e0a33e; --body:#6fb3c9; --hot:#f4f2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    padding:26px clamp(14px,3vw,40px) 40px;
  }
  header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  h1{font-size:15px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin:0 0 8px}
  .ident{color:var(--dim);font-size:12.5px;word-spacing:.08em}
  .ident b{color:var(--ink);font-weight:600}
  figure{margin:0}
  svg{display:block;width:100%;height:auto;overflow:visible;touch-action:manipulation}
  .grid{stroke:var(--line);stroke-width:1}
  .axis{stroke:#4a5058;stroke-width:1}
  .tick{fill:var(--dim);font-size:11px}
  .axlabel{fill:var(--dim);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase}
  .note{fill:var(--dim);font-size:11px}
  .sta{fill:var(--machine);fill-opacity:.72;stroke:none}
  .sta.on{fill:var(--hot);fill-opacity:1}
  .halo{fill:none;stroke:var(--hot);stroke-width:1.5}
  .chord{stroke:var(--hot);stroke-width:1.5;stroke-dasharray:5 4}
  .stair{fill:none;stroke:var(--body);stroke-width:1.6}
  .stairdrop{stroke:var(--body);stroke-width:1;stroke-opacity:.35}
  .cut{fill:var(--body);fill-opacity:.06}
  .reach{stroke-width:1.5}
  .reachm{stroke:var(--machine)}
  .reachb{stroke:var(--body)}
  .rlabel{font-size:11.5px}
  .rlm{fill:var(--machine)} .rlb{fill:var(--body)}
  .span{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3}
  .spanlabel{fill:var(--hot);font-size:12.5px;letter-spacing:.04em}
  .tip{fill:var(--hot);font-size:12px}
  .tipbg{fill:#000;fill-opacity:.85}
  .hit{fill:transparent;cursor:crosshair}
  footer{margin-top:20px;border-top:1px solid var(--line);padding-top:12px;
         color:var(--dim);font-size:11.5px;line-height:1.7;word-break:break-all}
  .ctl{display:flex;flex-wrap:wrap;gap:12px 30px;align-items:center;
       margin:14px 0 2px;font-size:12.5px}
  .ctl .grp{display:flex;align-items:center;gap:8px;color:var(--dim)}
  .ctl .grp b{color:var(--ink);font-weight:600;letter-spacing:.04em}
  button{font:inherit;background:#15171b;color:var(--ink);border:1px solid #2e3238;
         border-radius:3px;padding:2px 9px;cursor:pointer;line-height:1.4}
  button:hover{border-color:var(--body)}
  button[disabled]{opacity:.32;cursor:default;border-color:#2e3238}
  .val{color:var(--body);min-width:2.4em;display:inline-block;text-align:center}
  .key{display:flex;align-items:center;gap:7px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .out{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;
       display:grid;grid-template-columns:minmax(260px,1.1fr) minmax(240px,1fr);
       gap:18px 34px}
  .now{font-size:13px;line-height:1.85}
  .now .big{font-size:26px;color:var(--hot);letter-spacing:.01em}
  .now .sub{color:var(--dim)}
  .log{font-size:12px;color:var(--dim);line-height:1.9}
  .log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log b{color:var(--ink);font-weight:600}
  .log .v{color:var(--machine)}
  @media (max-width:640px){ .out{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = /*DATA*/null/*DATA*/;

const S = D.stations, F = D.felt, KMD = D.kmPerDeg;
const instReach = S[S.length-1].deg;

// One axis is shared by the two networks, and it is the only thing they share:
// the instruments publish an instant, the felt reports publish no time at all.
// So distance is drawn once, logarithmically, identically for both halves.
const allDeg = S.map(s=>s.deg).concat(F.map(f=>f.km/KMD));
const dLo = Math.min(...allDeg)*0.75, dHi = Math.max(...allDeg)*1.12;
const L = Math.log10, span = L(dHi)-L(dLo);

const W=1200, H=700, M={l:96,r:150,t:30,b:66};
const AX = 452;                       // the shared axis, in figure coordinates
const upTop = M.t+26, loBot = H-M.b;  // the two half-planes
const px = d => M.l + (L(Math.max(d,dLo))-L(dLo))/span*(W-M.l-M.r);

const tMax = Math.ceil(S[S.length-1].t/100)*100;
const py = t => AX-24 - (t/tMax)*(AX-24-upTop);

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmtDeg = d => d<10 ? d.toFixed(2) : d.toFixed(1);

// ---- static frame ---------------------------------------------------------
let f = '';
const decades = [];
for(let e=-2; e<=3; e++){
  for(const m of [1,2,5]){
    const v = m*Math.pow(10,e);
    if(v>=dLo && v<=dHi) decades.push(v);
  }
}
for(const v of decades){
  f += `<line class="grid" x1="${px(v).toFixed(1)}" y1="${upTop}" x2="${px(v).toFixed(1)}" y2="${loBot}"/>`;
  f += `<text class="tick" x="${px(v).toFixed(1)}" y="${loBot+19}" text-anchor="middle">${v<1?v:v}°</text>`;
}
for(let t=0; t<=tMax; t+=100){
  f += `<line class="grid" x1="${M.l}" y1="${py(t).toFixed(1)}" x2="${W-M.r}" y2="${py(t).toFixed(1)}"/>`;
  f += `<text class="tick" x="${M.l-11}" y="${(py(t)+4).toFixed(1)}" text-anchor="end">${t}</text>`;
}
f += `<line class="axis" x1="${M.l}" y1="${AX}" x2="${W-M.r}" y2="${AX}"/>`;
f += `<text class="axlabel" x="${(M.l+W-M.r)/2}" y="${loBot+45}" text-anchor="middle">distance from hypocentre — logarithmic, one scale for both networks</text>`;
f += `<text class="axlabel" transform="translate(${M.l-64},${(upTop+AX)/2}) rotate(-90)" text-anchor="middle">seconds after origin</text>`;
f += `<text class="axlabel" transform="translate(${M.l-64},${(AX+loBot)/2}) rotate(-90)" text-anchor="middle">felt reports within</text>`;
f += `<text class="note" x="${M.l}" y="${upTop-10}">${S.length} seismometers — each one instant, published to 10 ms</text>`;
f += `<text class="note" x="${M.l}" y="${AX+18}">${F.reduce((a,x)=>a+x.n,0)} felt reports in ${F.length} blocks — no arrival time is published for any of them, so this half counts, it does not clock</text>`;

// a label beside a marker near the right edge is placed on its left instead
function beside(x, text, cls, y){
  const w = text.length*6.4;
  return x+8+w > W
    ? `<text class="rlabel ${cls}" x="${(x-8).toFixed(1)}" y="${y}" text-anchor="end">${text}</text>`
    : `<text class="rlabel ${cls}" x="${(x+8).toFixed(1)}" y="${y}">${text}</text>`;
}

// the instrument network's reach: no threshold applies to it
f += `<line class="reach reachm" x1="${px(instReach).toFixed(1)}" y1="${upTop-4}" x2="${px(instReach).toFixed(1)}" y2="${AX}"/>`;
f += beside(px(instReach), `${fmtDeg(instReach)}° — farthest seismometer`, 'rlm', upTop+8);

// stations
f += `<g id="stations">`;
S.forEach((s,i) => {
  f += `<circle class="sta" data-i="${i}" cx="${px(s.deg).toFixed(1)}" cy="${py(s.t).toFixed(1)}" r="4"/>`;
});
f += `</g><g id="felt"></g><g id="marks"></g>`;
f += `<rect class="hit" id="hit" x="${M.l}" y="${upTop-8}" width="${W-M.l-M.r}" height="${AX-upTop+8}"/>`;
f += `<g id="tip"></g>`;

// ---- page -----------------------------------------------------------------
document.getElementById('app').innerHTML = `
<header>
  <h1>Arrival</h1>
  <div class="ident"><b>${esc(D.id)}</b> &nbsp;M&thinsp;${D.mag} &nbsp;${esc(D.place)}
   &nbsp;&middot;&nbsp; origin ${esc(D.origin)} &nbsp;&middot;&nbsp; depth ${D.depth}&thinsp;km
   &nbsp;&middot;&nbsp; ${D.lat.toFixed(4)}, ${D.lon.toFixed(4)}</div>
</header>
<figure><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="One earthquake as two networks recorded it: ${S.length} seismometers with arrival times, and ${F.length} blocks of human felt reports, on a shared logarithmic distance axis."> ${f} </svg></figure>
<div class="ctl">
  <span class="grp"><b>what counts as a felt report</b></span>
  <span class="grp">at least <button id="nDn">&minus;</button><span class="val" id="nVal">1</span><button id="nUp">+</button> report${''} in the block</span>
  <span class="grp">intensity at least <button id="cDn">&minus;</button><span class="val" id="cVal">1</span><button id="cUp">+</button></span>
  <span class="grp"><button id="rst">reset</button></span>
</div>
<div class="ctl">
  <span class="key"><i class="dot" style="background:var(--machine)"></i>click any two seismometers</span>
  <span class="key"><i class="dot" style="background:var(--body)"></i>felt reports accepted: <span class="val" id="acc"></span></span>
</div>
<div class="out">
  <div class="now" id="now"><span class="sub">no pair selected</span></div>
  <div class="log" id="log"></div>
</div>
<footer>
  Built ${D.built} from public USGS data, unauthenticated, and pinned into this file &mdash; it makes no network request when you open it.<br>
  event &nbsp;${esc(D.sources.detail)}<br>
  arrivals &nbsp;${esc(D.sources.phase)}${D.rev && D.rev.phase ? ' &nbsp;(revision '+esc(D.rev.phase)+')' : ''}<br>
  ${D.sources.felt ? 'felt reports &nbsp;'+esc(D.sources.felt)+(D.rev&&D.rev.felt?' &nbsp;(revision '+esc(D.rev.felt)+')':'')+'<br>' : ''}
  1&thinsp;degree = ${KMD}&thinsp;km along the surface. Travel time is the only derived quantity: arrival instant minus origin instant. Nothing is smoothed, fitted or interpolated.
</footer>`;

const feltG = document.getElementById('felt');
const marks = document.getElementById('marks');
const tipg  = document.getElementById('tip');
const nowEl = document.getElementById('now');
const logEl = document.getElementById('log');

// ---- the lower half: it retracts under the threshold ----------------------
let minN = 1, minC = 1, sel = [], history = [];
const fullTotal = F.reduce((a,x)=>a+x.n, 0);

function drawFelt(){
  const kept = F.filter(x => x.n >= minN && x.cdi >= minC);
  const total = kept.reduce((a,x)=>a+x.n,0);
  document.getElementById('acc').textContent = total;
  document.getElementById('nVal').textContent = minN;
  document.getElementById('cVal').textContent = minC;

  let g = '';
  if(!kept.length){
    g = `<text class="rlabel rlb" x="${M.l+8}" y="${(AX+loBot)/2}">no block passes this threshold — the human network has no reach here</text>`;
    feltG.innerHTML = g;
    document.getElementById('now').dataset.reach = '';
    drawSpan(null);
    return;
  }
  // the vertical scale is fixed to the unfiltered population, so that raising
  // the threshold shrinks the staircase in both directions instead of
  // renormalising the loss away
  const reach = kept[kept.length-1].km/KMD;
  const yTop = AX+34, yBot = loBot-8;
  const cy = c => yBot - (c/fullTotal)*(yBot-yTop);

  // the shaded region is what the threshold cut away
  g += `<rect class="cut" x="${px(reach).toFixed(1)}" y="${yTop}" width="${(W-M.r-px(reach)).toFixed(1)}" height="${yBot-yTop}"/>`;

  // cumulative responses within distance — a count, not a clock
  let acc = 0, pts = [[px(kept[0].km/KMD), cy(0)]];
  for(const x of kept){
    const X = px(x.km/KMD);
    pts.push([X, cy(acc)]);
    acc += x.n;
    pts.push([X, cy(acc)]);
    g += `<line class="stairdrop" x1="${X.toFixed(1)}" y1="${cy(acc).toFixed(1)}" x2="${X.toFixed(1)}" y2="${yBot}"><title>${x.n} report${x.n>1?'s':''} at ${x.km} km = ${fmtDeg(x.km/KMD)}° — intensity ${x.cdi}</title></line>`;
  }
  pts.push([px(reach), cy(total)]);
  g += `<polyline class="stair" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
  g += `<line class="grid" x1="${M.l}" y1="${cy(fullTotal).toFixed(1)}" x2="${W-M.r}" y2="${cy(fullTotal).toFixed(1)}"/>`;
  g += `<text class="tick" x="${M.l-11}" y="${(cy(fullTotal)+4).toFixed(1)}" text-anchor="end">${fullTotal}</text>`;
  g += `<text class="tick" x="${M.l-11}" y="${(cy(0)+4).toFixed(1)}" text-anchor="end">0</text>`;
  if(total < fullTotal){
    g += `<text class="rlabel rlb" x="${M.l-11}" y="${(cy(total)+4).toFixed(1)}" text-anchor="end">${total}</text>`;
  }
  g += `<line class="reach reachb" x1="${px(reach).toFixed(1)}" y1="${AX}" x2="${px(reach).toFixed(1)}" y2="${loBot+4}"/>`;
  g += beside(px(reach), `${fmtDeg(reach)}° = ${Math.round(reach*KMD)} km — farthest accepted report`, 'rlb', loBot-2);
  feltG.innerHTML = g;
  drawSpan(reach);
}

// the gap between the two reaches, drawn on the shared axis and read as a ratio
function drawSpan(reach){
  const el = document.getElementById('spanG');
  if(el) el.remove();
  if(reach === null) return;
  const a = px(reach), b = px(instReach), y = AX-9;
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('id','spanG');
  g.innerHTML =
    `<line class="span" x1="${a.toFixed(1)}" y1="${y}" x2="${b.toFixed(1)}" y2="${y}"/>` +
    `<text class="spanlabel" x="${((a+b)/2).toFixed(1)}" y="${y-7}" text-anchor="middle">× ${(instReach/reach).toFixed(1)}</text>`;
  document.querySelector('svg').appendChild(g);
}

// ---- the upper half: the instruments' own operation ------------------------
function draw(){
  marks.innerHTML = '';
  document.querySelectorAll('.sta').forEach(c => c.classList.remove('on'));
  sel.forEach(i => {
    const s = S[i];
    document.querySelector(`.sta[data-i="${i}"]`).classList.add('on');
    marks.insertAdjacentHTML('beforeend',
      `<circle class="halo" cx="${px(s.deg).toFixed(1)}" cy="${py(s.t).toFixed(1)}" r="9.5"/>`);
  });
  if(sel.length === 2){
    const [a,b] = sel.map(i => S[i]);
    marks.insertAdjacentHTML('afterbegin',
      `<line class="chord" x1="${px(a.deg).toFixed(1)}" y1="${py(a.t).toFixed(1)}" x2="${px(b.deg).toFixed(1)}" y2="${py(b.t).toFixed(1)}"/>`);
  }
}

function report(){
  if(sel.length < 2){
    const s = sel.length ? S[sel[0]] : null;
    nowEl.innerHTML = s
      ? `<b>${esc(s.sta)}</b> &nbsp;<span class="sub">${fmtDeg(s.deg)}° &middot; ${s.t} s &middot; ${esc(s.ph)}</span><br><span class="sub">pick a second one</span>`
      : `<span class="sub">no pair selected</span>`;
    return;
  }
  let [a,b] = sel.map(i => S[i]);
  if(a.deg > b.deg) [a,b] = [b,a];
  const dd = b.deg-a.deg, dkm = dd*KMD, dt = b.t-a.t;
  const v = dt !== 0 ? dkm/dt : NaN;
  nowEl.innerHTML =
    `<span class="big">${isFinite(v) ? v.toFixed(2) : '—'}&thinsp;km/s</span>
     <span class="sub">apparent speed across the surface, between these two</span><br>
     <b>${esc(a.sta)}</b> <span class="sub">${fmtDeg(a.deg)}° &middot; ${a.t} s</span>
     &nbsp;→&nbsp; <b>${esc(b.sta)}</b> <span class="sub">${fmtDeg(b.deg)}° &middot; ${b.t} s</span><br>
     <span class="sub">${dd.toFixed(3)}° = ${dkm.toFixed(0)} km further, ${dt.toFixed(2)} s later</span>`;
  if(isFinite(v)){
    history.unshift({mid:(a.deg+b.deg)/2, v, a:a.sta, b:b.sta});
    history = history.slice(0,9);
    logEl.innerHTML = history.map(h =>
      `<div><span class="v">${h.v.toFixed(2)}&thinsp;km/s</span> &nbsp;<b>${esc(h.a)}–${esc(h.b)}</b> &nbsp;around ${fmtDeg(h.mid)}°</div>`
    ).join('');
  }
}

// nearest station to the pointer — the far field is crowded on a log axis,
// and a click there should still choose something rather than nothing
function nearest(evt){
  const svg = document.querySelector('svg');
  const r = svg.getBoundingClientRect();
  const x = (evt.clientX-r.left)/r.width*W, y = (evt.clientY-r.top)/r.height*H;
  let best = -1, bd = 1e9;
  S.forEach((s,i) => {
    const dx = px(s.deg)-x, dy = py(s.t)-y, d = dx*dx+dy*dy;
    if(d < bd){ bd = d; best = i; }
  });
  return bd <= 26*26 ? best : -1;
}

const hit = document.getElementById('hit');
hit.addEventListener('click', e => {
  const i = nearest(e);
  if(i < 0) return;
  if(sel.length >= 2) sel = [];
  if(!sel.includes(i)) sel.push(i);
  draw(); report();
});
hit.addEventListener('pointermove', e => {
  const i = nearest(e);
  if(i < 0){ tipg.innerHTML=''; return; }
  const s = S[i];
  const t = `${s.sta}  ${fmtDeg(s.deg)}°  ${s.t}s  ${s.ph}`;
  let x = px(s.deg)+13, y = py(s.t)-13;
  const w = t.length*7.1+14;
  if(x+w > W-M.r) x = px(s.deg)-13-w;
  tipg.innerHTML =
    `<rect class="tipbg" x="${x.toFixed(1)}" y="${(y-14).toFixed(1)}" width="${w.toFixed(1)}" height="21" rx="2"/>
     <text class="tip" x="${(x+7).toFixed(1)}" y="${(y+1).toFixed(1)}">${esc(t)}</text>`;
});
hit.addEventListener('pointerleave', () => tipg.innerHTML='');

// ---- the threshold ---------------------------------------------------------
const maxN = Math.max(...F.map(x=>x.n), 1);
const maxC = Math.max(...F.map(x=>Math.floor(x.cdi)), 1);
function limits(){
  document.getElementById('nDn').disabled = minN <= 1;
  document.getElementById('nUp').disabled = minN >= maxN;
  document.getElementById('cDn').disabled = minC <= 1;
  document.getElementById('cUp').disabled = minC >= maxC;
}
function step(dn, dc){
  minN = Math.min(maxN, Math.max(1, minN+dn));
  minC = Math.min(maxC, Math.max(1, minC+dc));
  drawFelt(); limits();
}
document.getElementById('nUp').onclick = () => step(+1,0);
document.getElementById('nDn').onclick = () => step(-1,0);
document.getElementById('cUp').onclick = () => step(0,+1);
document.getElementById('cDn').onclick = () => step(0,-1);
document.getElementById('rst').onclick = () => { minN=1; minC=1; step(0,0); };

drawFelt(); limits(); report();
</script>
</body>
</html>
